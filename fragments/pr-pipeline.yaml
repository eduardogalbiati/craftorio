# The pull-request half of a composed development workflow (#487, packages/engine/domains/workflow/workflow-compose.js), adapted
# from software-development's ci and ci_failed: the CI pusher pushes the run's branch and opens the
# PR/MR, the engine waits on its checks (`wait: pr_checks`) and calls the agent only when one failed;
# a fix goes to the developer (delegate). pr_review hands the green PR/MR to the team, who merge it on
# the platform. #630: pr_open instead of ci when the project's CI does not run on pull requests (the
# composed set's ci none or release): it opens the PR/MR with no wait. A step `{ id, fragment: pr-pipeline }`
# gets the body under its id; the step's own keys win (packages/engine/engine/run/load.js,
# expandFragments). Reads the inputs base_branch and issue and the steps develop, ci and pr_open.
# #738 Fork + PR (inputs.mode fork): the branch goes to `origin` (the owner's fork), the PR to the
# original (`upstream`), never a push to upstream; the PR follows CONTRIBUTING.md and the PR template,
# with `Depends on <inputs.depends_on>` for a dependent roadmap item. With inputs.parent_pr (wait and
# rebase) ci's wait.parent makes the engine wait for that PR to merge before the PR opens, rebased.

steps:
  ci:
    display: Pull request and CI
    goal:
      description: "CI green on the PR/MR for branch {{ steps.develop.output.branch }}"
      until: "output.ci_status == 'success'"
      on_exhausted: ci_failed
    loop:
      interval: 1m
      max_duration: 1h
    wait:
      probe: pr_checks
      target: "{{ steps.ci.output.pr_url }}"
      output: { ci_status: success, failure_log: "" }
      infra_output: { ci_status: failed, failure_class: infra, failure_log: "{{ probe.detail }}" }
      grace: 10m
      # #738 wait and rebase: a split implementation's part 2 waits for its parent's PR to merge upstream
      # (the engine checks it, transitions.js pollParent); empty: no wait
      parent: "{{ inputs.parent_pr }}"
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}The developer fixed a previous failure and pushed: {{ delegate_result.text }}
      Check CI for that new commit, not an older run.
      {% endif %}
      {% if inputs.mode == 'fork' %}Fork + PR: `origin` is the owner's fork, `upstream` the original repository (no push access to it).
      {% if inputs.parent_pr %}This branch builds on the earlier pull request {{ inputs.parent_pr }} (its parent branch: `{{ inputs.parent_branch }}`).
      0. Check whether it merged (`gh pr view {{ inputs.parent_pr }} --json state`, `glab mr view` on GitLab).
         Not merged yet: push the branch to `origin` only, open nothing, and answer ci_status: pending,
         pr_url: "" and pr_number: 0; the orchestrator waits for the merge and calls you again.
         Merged: the orchestrator rebases the branch onto upstream/{{ inputs.base_branch }} itself and says so
         above (worktree.js restackOnBase); when it says the rebase failed, `git fetch upstream`, then
         `git rebase --onto upstream/{{ inputs.base_branch }} origin/{{ inputs.parent_branch }}` (only this branch's
         own commits stay). Check it builds, `git push --force-with-lease origin {{ steps.develop.output.branch }}`,
         then go on with 2.
      {% endif %}1. Push the branch to `origin` (the fork): `git push -u origin {{ steps.develop.output.branch }}`.
         Never push anything to `upstream`: the maintainers merge the pull request.
      2. Make sure a pull request from the fork to the original is open (reuse it if it exists; else
         `gh pr create --repo <upstream owner/name> --head <fork owner>:{{ steps.develop.output.branch }} --base {{ inputs.base_branch }}`,
         on GitLab `glab mr create` with the original as the target project,
         with a short title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}{% if inputs.depends_on %}, and a
         line `Depends on {{ inputs.depends_on }}`{% endif %}. Follow the repository's CONTRIBUTING.md (or
         .github/CONTRIBUTING.md): its commit format and required checks; fill the sections of its pull
         request template (.github/pull_request_template.md or PULL_REQUEST_TEMPLATE) when it has one.
      {% else %}1. Push the branch to the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; else create one with a short
         title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}.
      {% endif %}3. Check its mergeability first: a conflict with the base never starts CI, answer ci_status:
         failed with a failure_log saying so.
      4. Check its CI: running or not started → pending; a failure → failed with failure_log (job,
         step, error, probable cause); everything passed → success; CI that cannot run for account
         reasons → failed with failure_class: infra.
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, ci_status]
      properties:
        pr_url:        { type: string }
        pr_number:     { type: integer }
        ci_status:     { type: string, enum: [pending, failed, success] }
        failure_log:   { type: string }
        failure_class: { type: string, enum: [code, infra, unknown] }
    transitions:
      - when: "output.ci_status == 'success'"
        goto: pr_review
      - when: "output.ci_status == 'pending'"
        goto: ci
      - when: "output.ci_status == 'failed' and output.failure_class == 'infra'"
        goto: ci_failed
      - when: "output.ci_status == 'failed'"
        delegate:
          agent: developer
          prompt: |
            CI on PR/MR #{{ output.pr_number }} failed:
            {{ output.failure_log }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test,
            commit, then `git push`, and report the commit hash.
        goto: ci
        max_visits: 5
        on_exhausted: ci_failed

  ci_failed:
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    display: CI failed
    message: |
      CI on {{ steps.ci.output.pr_url }} did not pass (status: {{ steps.ci.output.ci_status }}).
      Last error: {{ steps.ci.output.failure_log or '(none reported)' }}
      Approve to check CI again (after a re-run or a fix of yours); reject to stop the run as failed
      (the branch and the PR/MR keep the work).
    transitions:
      - when: "approved"
        goto: ci
      - when: "rejected"
        goto: end
        status: failed

  # #630: a project whose CI does not run on pull requests (ci none or release): the CI pusher pushes
  # the branch and opens the PR/MR, with no CI to wait for; a conflict with the base goes to the developer
  pr_open:
    display: Pull request
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}The developer resolved the conflict and pushed: {{ delegate_result.text }}
      {% endif %}
      {% if inputs.mode == 'fork' %}Fork + PR: `origin` is the owner's fork, `upstream` the original repository (no push access to it).
      {% if inputs.parent_pr %}This branch builds on the earlier pull request {{ inputs.parent_pr }} (its parent branch: `{{ inputs.parent_branch }}`).
      0. Check whether it merged (`gh pr view {{ inputs.parent_pr }} --json state`, `glab mr view` on GitLab). Merged:
         `git fetch upstream`, `git rebase --onto upstream/{{ inputs.base_branch }} origin/{{ inputs.parent_branch }}`, then
         `git push --force-with-lease origin {{ steps.develop.output.branch }}`. Not merged: this step cannot wait
         (the project's CI does not run on pull requests), so the pull request says `Depends on {{ inputs.parent_pr }}`.
      {% endif %}1. Push the branch to `origin` (the fork): `git push -u origin {{ steps.develop.output.branch }}`.
         Never push anything to `upstream`: the maintainers merge the pull request.
      2. Make sure a pull request from the fork to the original is open (reuse it if it exists; else
         `gh pr create --repo <upstream owner/name> --head <fork owner>:{{ steps.develop.output.branch }} --base {{ inputs.base_branch }}`,
         on GitLab `glab mr create` with the original as the target project,
         with a short title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}{% if inputs.depends_on %}, and a
         line `Depends on {{ inputs.depends_on }}`{% endif %}. Follow the repository's CONTRIBUTING.md (or
         .github/CONTRIBUTING.md): its commit format and required checks; fill the sections of its pull
         request template (.github/pull_request_template.md or PULL_REQUEST_TEMPLATE) when it has one.
      {% else %}1. Push the branch to the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; else create one with a short
         title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}.
      {% endif %}3. Check its mergeability: a conflict with the base → conflict: true with what conflicts in
         `detail`. The project's CI does not run on pull requests: do not wait for checks.
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, conflict]
      properties:
        pr_url:    { type: string }
        pr_number: { type: integer }
        conflict:  { type: boolean }
        detail:    { type: string }
    transitions:
      - when: "output.conflict"
        delegate:
          agent: developer
          prompt: |
            PR/MR #{{ output.pr_number }} conflicts with `{{ inputs.base_branch }}`: {{ output.detail }}
            Rebase branch `{{ steps.develop.output.branch }}` on the base, resolve it, check it with a
            focused test, commit, then `git push --force-with-lease`, and report the commit hash.
        goto: pr_open
        max_visits: 3
        on_exhausted: pr_review
      - when: "true"
        goto: pr_review

  # the team merges on the platform: the run ends once the PR/MR is green (or, with no CI on pull
  # requests, open) and handed over
  pr_review:
    type: human_approval
    display: Team review
    message: |
      {% set pr = steps.ci.output or steps.pr_open.output %}
      PR/MR #{{ pr.pr_number }} ({{ pr.pr_url }}) is {% if steps.ci.output %}green{% elif pr.conflict %}open, still conflicting with the base: {{ pr.detail }}{% else %}open (the project's CI does not run on pull requests){% endif %}.
      The team reviews and merges it on the platform. Approve to end the run; reject to stop it as failed.
    transitions:
      - when: "approved"
        goto: end
      - when: "rejected"
        goto: end
        status: failed
