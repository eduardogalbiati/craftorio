# The pull-request half of a composed development workflow (#487, packages/engine/domains/workflow/workflow-compose.js), adapted
# from software-development's ci and ci_failed: the CI pusher pushes the run's branch and opens the
# PR/MR, the engine waits on its checks (`wait: pr_checks`) and calls the agent only when one failed;
# a fix goes to the developer (delegate). pr_monitor (#809) hands the green PR/MR to the team, who merge it on
# the platform, and ends the run on that merge; #811 a fix the owner asks for from its card goes to the developer and
# comes back to it. #630: pr_open instead of ci when the project's CI does not run on pull requests (the
# composed set's ci none or release): it opens the PR/MR with no wait. A step `{ id, fragment: pr-pipeline }`
# gets the body under its id; the step's own keys win (packages/engine/engine/run/load.js,
# expandFragments). Reads the inputs base_branch and issue and the steps develop, ci and pr_open.
# #738 Fork + PR (inputs.mode fork): the branch goes to `origin` (the owner's fork), the PR to the
# original (`upstream`), never a push to upstream; the PR follows CONTRIBUTING.md and the PR template,
# with `Depends on <inputs.depends_on>` for a dependent roadmap item. With inputs.parent_pr (wait and
# rebase) ci's wait.parent makes the engine wait for that PR to merge before the PR opens, rebased.
# #807 Stack (Remote mode, inputs.parent_branch set by the roadmap): the PR opens at once against the previous
# stage's branch, naming its PR (inputs.parent_pr); wait.parent then follows it (transitions.js followStackParent)
# in ci, or in stack_follow after pr_open, until the parent merges: only then does the run reach pr_monitor.

steps:
  ci:
    display: Pull request and CI
    goal:
      description: "CI green on the PR/MR for branch {{ steps.develop.output.branch }}"
      until: "output.ci_status == 'success'"
      on_exhausted: ci_failed
    loop:
      interval: 1m
      max_duration: 1h
    wait:
      probe: pr_checks
      target: "{{ steps.ci.output.pr_url }}"
      output: { ci_status: success, failure_log: "" }
      infra_output: { ci_status: failed, failure_class: infra, failure_log: "{{ probe.detail }}" }
      grace: 10m
      # #738 wait and rebase: a split implementation's part 2 waits for its parent's PR to merge upstream
      # (the engine checks it, transitions.js pollParent); empty: no wait
      parent: "{{ inputs.parent_pr }}"
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}The developer fixed a previous failure and pushed: {{ delegate_result.text }}
      Check CI for that new commit, not an older run.
      {% endif %}
      {% if vars.tested == 'no tests' %}Nothing was tested in this run: the project has no tests (#71). Say so in the PR/MR body ("Not tested: the project has no tests"); never write that the tests failed or passed.
      {% elif vars.tested == 'no test command' %}Nothing was tested in this run: the project has no test runner (#81). Say so in the PR/MR body ("Not tested: no test command"); never write that the tests failed or passed.
      {% endif %}
      {% if inputs.mode == 'fork' %}Fork + PR: `origin` is the owner's fork, `upstream` the original repository (no push access to it).
      {% if inputs.parent_pr %}This branch builds on the earlier pull request {{ inputs.parent_pr }} (its parent branch: `{{ inputs.parent_branch }}`).
      0. Check whether it merged (`gh pr view {{ inputs.parent_pr }} --json state`, `glab mr view` on GitLab).
         Not merged yet: push the branch to `origin` only, open nothing, and answer ci_status: pending,
         pr_url: "" and pr_number: 0; the orchestrator waits for the merge and calls you again.
         Merged: the orchestrator rebases the branch onto upstream/{{ inputs.base_branch }} itself and says so
         above (worktree.js restackOnBase); when it says the rebase failed, `git fetch upstream`, then
         `git rebase --onto upstream/{{ inputs.base_branch }} origin/{{ inputs.parent_branch }}` (only this branch's
         own commits stay). Check it builds, `git push --force-with-lease origin {{ steps.develop.output.branch }}`,
         then go on with 2.
      {% endif %}1. Push the branch to `origin` (the fork): `git push -u origin {{ steps.develop.output.branch }}`.
         Never push anything to `upstream`: the maintainers merge the pull request.
      2. Make sure a pull request from the fork to the original is open (reuse it if it exists; else
         `gh pr create --repo <upstream owner/name> --head <fork owner>:{{ steps.develop.output.branch }} --base {{ inputs.base_branch }}`,
         on GitLab `glab mr create` with the original as the target project,
         with a short title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}{% if inputs.depends_on %}, and a
         line `Depends on {{ inputs.depends_on }}`{% endif %}. Follow the repository's CONTRIBUTING.md (or
         .github/CONTRIBUTING.md): its commit format and required checks; fill the sections of its pull
         request template (.github/pull_request_template.md or PULL_REQUEST_TEMPLATE) when it has one.
      {% else %}{% if inputs.parent_branch %}Stacked (#807): this branch builds on the pull request {{ inputs.parent_pr }} of the previous
      roadmap stage (its branch `{{ inputs.parent_branch }}`): its PR/MR targets that branch, not `{{ inputs.base_branch }}`.
      1. Push the branch to the remote.
      2. Make sure a PR/MR to the parent's branch is open (reuse it if it exists; else
         `gh pr create --base {{ inputs.parent_branch }} --head {{ steps.develop.output.branch }}`, on GitLab
         `glab mr create --target-branch {{ inputs.parent_branch }}`, with a short title and this summary:
         {{ steps.develop.output.summary }}), its body saying `Builds on {{ inputs.parent_pr }}`{% if inputs.issue %} and
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}. Once the parent merges, the
         orchestrator rebases the branch onto `{{ inputs.base_branch }}` and tells you to move the PR/MR's base there.
      {% else %}1. Push the branch to the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; else create one with a short
         title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}.
      {% endif %}{% endif %}3. Check its mergeability first: a conflict with the base never starts CI, answer ci_status:
         failed with a failure_log saying so.
      4. Check its CI: running or not started → pending; a failure → failed with failure_log (job,
         step, error, probable cause); everything passed → success; CI that cannot run for account
         reasons → failed with failure_class: infra.
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, ci_status]
      properties:
        pr_url:        { type: string }
        pr_number:     { type: integer }
        ci_status:     { type: string, enum: [pending, failed, success] }
        failure_log:   { type: string }
        failure_class: { type: string, enum: [code, infra, unknown] }
    transitions:
      # #807 a stacked run keeps following its parent until it merges (transitions.js holdForStackParent)
      - when: "output.ci_status == 'success' and inputs.parent_branch and inputs.mode != 'fork' and not steps.ci.parentMerged"
        goto: ci
      - when: "output.ci_status == 'success'"
        goto: pr_monitor
      - when: "output.ci_status == 'pending'"
        goto: ci
      - when: "output.ci_status == 'failed' and output.failure_class == 'infra'"
        goto: ci_failed
      - when: "output.ci_status == 'failed'"
        delegate:
          agent: developer
          prompt: |
            CI on PR/MR #{{ output.pr_number }} failed:
            {{ output.failure_log }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test,
            commit, then `git push`, and report the commit hash.
        goto: ci
        max_visits: 5
        on_exhausted: ci_failed

  ci_failed:
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    display: CI failed
    # #79: with no PR/MR opened (a push refused, no credentials) the message says so, never an empty link
    message: |
      {% if steps.ci.output.pr_url %}CI on {{ steps.ci.output.pr_url }} did not pass (status: {{ steps.ci.output.ci_status }}).
      Last error: {{ steps.ci.output.failure_log or '(none reported)' }}
      Approve to check CI again (after a re-run or a fix of yours); reject to stop the run as failed
      (the branch and the PR/MR keep the work).
      {% else %}CI failed: no PR was opened: {{ steps.ci.output.failure_log or '(no reason reported)' }}
      Approve to try again (after fixing what stopped it, e.g. git's credentials: `gh auth setup-git` on GitHub); reject to stop
      the run as failed (the run's branch keeps the work).
      {% endif %}
    transitions:
      - when: "approved"
        goto: ci
      - when: "rejected"
        goto: end
        status: failed

  # #630: a project whose CI does not run on pull requests (ci none or release): the CI pusher pushes
  # the branch and opens the PR/MR, with no CI to wait for; a conflict with the base goes to the developer
  pr_open:
    display: Pull request
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}The developer resolved the conflict and pushed: {{ delegate_result.text }}
      {% endif %}
      {% if vars.tested == 'no tests' %}Nothing was tested in this run: the project has no tests (#71). Say so in the PR/MR body ("Not tested: the project has no tests"); never write that the tests failed or passed.
      {% elif vars.tested == 'no test command' %}Nothing was tested in this run: the project has no test runner (#81). Say so in the PR/MR body ("Not tested: no test command"); never write that the tests failed or passed.
      {% endif %}
      {% if inputs.mode == 'fork' %}Fork + PR: `origin` is the owner's fork, `upstream` the original repository (no push access to it).
      {% if inputs.parent_pr %}This branch builds on the earlier pull request {{ inputs.parent_pr }} (its parent branch: `{{ inputs.parent_branch }}`).
      0. Check whether it merged (`gh pr view {{ inputs.parent_pr }} --json state`, `glab mr view` on GitLab). Merged:
         `git fetch upstream`, `git rebase --onto upstream/{{ inputs.base_branch }} origin/{{ inputs.parent_branch }}`, then
         `git push --force-with-lease origin {{ steps.develop.output.branch }}`. Not merged: this step cannot wait
         (the project's CI does not run on pull requests), so the pull request says `Depends on {{ inputs.parent_pr }}`.
      {% endif %}1. Push the branch to `origin` (the fork): `git push -u origin {{ steps.develop.output.branch }}`.
         Never push anything to `upstream`: the maintainers merge the pull request.
      2. Make sure a pull request from the fork to the original is open (reuse it if it exists; else
         `gh pr create --repo <upstream owner/name> --head <fork owner>:{{ steps.develop.output.branch }} --base {{ inputs.base_branch }}`,
         on GitLab `glab mr create` with the original as the target project,
         with a short title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}{% if inputs.depends_on %}, and a
         line `Depends on {{ inputs.depends_on }}`{% endif %}. Follow the repository's CONTRIBUTING.md (or
         .github/CONTRIBUTING.md): its commit format and required checks; fill the sections of its pull
         request template (.github/pull_request_template.md or PULL_REQUEST_TEMPLATE) when it has one.
      {% else %}{% if inputs.parent_branch %}Stacked (#807): this branch builds on the pull request {{ inputs.parent_pr }} of the previous
      roadmap stage (its branch `{{ inputs.parent_branch }}`): its PR/MR targets that branch, not `{{ inputs.base_branch }}`.
      1. Push the branch to the remote.
      2. Make sure a PR/MR to the parent's branch is open (reuse it if it exists; else
         `gh pr create --base {{ inputs.parent_branch }} --head {{ steps.develop.output.branch }}`, on GitLab
         `glab mr create --target-branch {{ inputs.parent_branch }}`, with a short title and this summary:
         {{ steps.develop.output.summary }}), its body saying `Builds on {{ inputs.parent_pr }}`{% if inputs.issue %} and
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}. Once the parent merges, the
         orchestrator rebases the branch onto `{{ inputs.base_branch }}` and tells you to move the PR/MR's base there.
      {% else %}1. Push the branch to the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; else create one with a short
         title and this summary: {{ steps.develop.output.summary }}){% if inputs.issue %}, its body
         closing {{ inputs.issue }} with a line `Closes #<number>`{% endif %}.
      {% endif %}{% endif %}3. Check its mergeability: a conflict with the base → conflict: true with what conflicts in
         `detail`. The project's CI does not run on pull requests: do not wait for checks.
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, conflict]
      properties:
        pr_url:    { type: string }
        pr_number: { type: integer }
        conflict:  { type: boolean }
        detail:    { type: string }
    transitions:
      - when: "output.conflict"
        delegate:
          agent: developer
          prompt: |
            PR/MR #{{ output.pr_number }} conflicts with `{{ inputs.base_branch }}`: {{ output.detail }}
            Rebase branch `{{ steps.develop.output.branch }}` on the base, resolve it, check it with a
            focused test, commit, then `git push --force-with-lease`, and report the commit hash.
        goto: pr_open
        max_visits: 3
        on_exhausted: pr_monitor
      - when: "inputs.parent_branch and inputs.mode != 'fork'"
        goto: stack_follow
      - when: "true"
        goto: pr_monitor

  # #807 a stacked run of a project whose CI does not run on pull requests (after pr_open): the engine
  # follows the parent PR/MR here (wait.parent, transitions.js followStackParent): it rebases the branch
  # onto the parent's new commits, onto the base once the parent merges (the agent then moves the PR/MR's
  # base), and a parent closed without merge opens a gate. The run reaches pr_monitor once the parent merged.
  stack_follow:
    display: Stacked pull request
    goal:
      description: "PR/MR {{ steps.pr_open.output.pr_url }} targets {{ inputs.base_branch }} once {{ inputs.parent_pr }} merged"
      until: "not output.conflict"
      on_exhausted: pr_monitor
    loop:
      interval: 1m
      max_duration: 1h
    wait:
      probe: pr_mergeable
      target: "{{ steps.pr_open.output.pr_url }}"
      output: { conflict: false, detail: "" }
      grace: 10m
      parent: "{{ inputs.parent_pr }}"
    prompt: |
      Branch: `{{ steps.develop.output.branch }}`, stacked on `{{ inputs.parent_branch }}` (the pull request {{ inputs.parent_pr }}); its PR/MR: {{ steps.pr_open.output.pr_url }}.
      The orchestrator follows the parent PR/MR itself and calls you only when there is something to do:
      - the engine rebased this branch onto the parent's new commits: push it (`git push --force-with-lease origin HEAD`);
      - the parent merged: the engine rebased this branch onto `{{ inputs.base_branch }}`: push it and move the
        PR/MR's base to `{{ inputs.base_branch }}` as the orchestrator says;
      - none of these (your first turn): only check that the PR/MR is open against `{{ inputs.parent_branch }}`.
      Then check its mergeability: a conflict → conflict: true with what conflicts in `detail`.
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, conflict]
      properties:
        pr_url:    { type: string }
        pr_number: { type: integer }
        conflict:  { type: boolean }
        detail:    { type: string }
    transitions:
      - when: "output.conflict"
        delegate:
          agent: developer
          prompt: |
            PR/MR #{{ output.pr_number }} conflicts with its base: {{ output.detail }}
            Rebase branch `{{ steps.develop.output.branch }}` on it, resolve it, check it with a focused test,
            commit, then `git push --force-with-lease`, and report the commit hash.
        goto: stack_follow
        max_visits: 3
        on_exhausted: pr_monitor
      - when: "not steps.stack_follow.parentMerged"
        goto: stack_follow
      - when: "true"
        goto: pr_monitor

  # #809 the team reviews and merges on the platform: the engine watches the PR/MR with no agent and no
  # Approve (transitions.js runPrMonitor, run-pr.js fetchPrMonitor) and shows its CI, review, conflicts,
  # comments and what blocks the merge. A merge ends the run well, a close without merge ends it failed.
  # It never touches the PR/MR by itself: stopping the run leaves it as it is. In Fork + PR it is upstream's PR.
  # #811: the card lists what the PR asks for; the owner's "Ask for a fix" (and only that click) makes the
  # monitor's output a fix (output.fix, output.fix_prompt: the trusted requests quoted, the owner's note): the
  # developer fixes it on the run's branch and the run comes back here (transitions.js runPrFix, prFixOutcome).
  pr_monitor:
    type: pr_monitor
    display: Waiting for the merge
    target: "{% if steps.ci.output %}{{ steps.ci.output.pr_url }}{% else %}{{ steps.pr_open.output.pr_url }}{% endif %}"
    transitions:
      - when: "output.fix"
        delegate:
          agent: developer
          prompt: |
            The pull/merge request {{ output.url }} is waiting for its merge, and the owner asks you for a fix.

            {{ output.fix_prompt }}

            Work on the run's branch `{{ steps.develop.output.branch }}` (if the worktree is not on it:
            `git fetch origin {{ steps.develop.output.branch }}` and check it out). Make the change asked for, check it
            with a focused test (only the tests that cover it, never the whole suite), commit, then push the branch
            {% if inputs.mode == 'fork' %}to `origin` (`git push origin HEAD:{{ steps.develop.output.branch }}`): Fork + PR, `origin` is the owner's fork that holds the branch; never push to `upstream`.{% else %}(`git push origin HEAD:{{ steps.develop.output.branch }}`).{% endif %}
            Do not reply on the pull request, nor resolve its threads: the run replies with your commit.
            Report the commit hash; if you could not fix it, say why and push nothing.
        goto: pr_monitor
      - when: "output.state == 'merged'"
        goto: end
      - when: "output.state == 'closed'"
        goto: end
        status: failed
