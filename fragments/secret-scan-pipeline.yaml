# The secret scan shared by feature, fix, release and the AI Development heroes (#49): secret_scan (no
# agent, gitleaks on the run's own commits, the last agent-less step before the owner's gate or the
# review; release: before the Ship gate) and its two gates, secret_found (a finding is still there after
# the developer's two returns) and secret_scan_error (gitleaks failed, which is never a pass). A step
# `{ id, fragment: secret-scan-pipeline }` gets the body under its id; the step's own keys win
# (packages/engine/engine/run/load.js, expandFragments). The workflow keeps secret_scan's transitions
# (its developer step, the step after a pass) and secret_found's. The bodies read the input
# secret_scan, `vars.secret_returns` and the step secret_scan.
# A finding is shown as its rule, file, line and commit, never its value.

steps:
  secret_scan:
    display: Secret scan
    display_key: engine.secret_scan_display
    type: secret_scan
    enabled: "{{ inputs.secret_scan }}"

  # a decision: neither the supervisor nor a retry answers it, and every way on goes through the scan again
  secret_found:
    type: human_approval
    display: Secret found
    display_key: engine.secret_found_display
    summary: |
      {% filter translated('engine.secret_found_summary', { rounds: vars.secret_returns or 0 }) %}The secret scan still finds something in the run's commits after {{ vars.secret_returns or 0 }} developer round(s). Nothing was merged or pushed.{% endfilter %}
      {% for f in steps.secret_scan.output.findings %}{% if loop.index <= 4 %}- ✖ {{ f.rule }} {{ f.file }}:{{ f.line }}
      {% endif %}{% else %}- ✖ {{ steps.secret_scan.output.message | one_line(200) }}
      {% endfor %}
    message: |
      {{ steps.secret_scan.output.message }}
      {% filter translated('engine.secret_found_message') %}Only the rule, the file, the line and the commit are shown, never the value. Treat a real secret as leaked: revoke it, removing it from the commit is not enough. A false positive is closed by an entry in .gitleaksignore with its reason, committed.{% endfilter %}
    choices:
      - { id: developer, label: "Back to the developer", label_key: engine.secret_found_developer, help: "The developer gets the findings again, with two more returns; the scan runs again after the fix.", help_key: engine.secret_found_developer_help }
      - { id: rescan, label: "Scan again", label_key: engine.secret_found_rescan, help: "You changed the run's commits or .gitleaksignore yourself: the scan runs again.", help_key: engine.secret_found_rescan_help }
      - { id: stop, label: "Stop the run as failed", label_key: engine.check_environment_stop, help: "Ends the run as failed; its branch keeps the work to resume it.", help_key: engine.check_environment_stop_help }

  secret_scan_error:
    type: human_approval
    display: Secret scan error
    display_key: engine.secret_scan_error_display
    summary: |
      {{ steps.secret_scan.output.message | one_line(240) }}
    message: |
      {{ steps.secret_scan.output.message }}
      {% filter translated('engine.secret_scan_error_message') %}This is not a pass, and no developer round was counted. Fix what failed, then try again: the scan runs again.{% endfilter %}
    choices:
      - { id: retry, label: "Try again", label_key: engine.check_environment_retry, help: "Runs the secret scan again.", help_key: engine.secret_scan_error_retry_help }
      - { id: stop, label: "Stop the run as failed", label_key: engine.check_environment_stop, help: "Ends the run as failed; its branch keeps the work to resume it.", help_key: engine.check_environment_stop_help }
    transitions:
      - when: "choice == 'stop'"
        goto: end
        status: failed
      # a gate answered by its first choice must not loop forever (as check_environment)
      - when: "true"
        goto: secret_scan
        max_visits: 3
        on_exhausted: end
        status: failed
