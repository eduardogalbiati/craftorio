# Saved pipeline (#135, src/pipelines.js): AI Arena writes an RFC, then the issue tracker splits the
# final document into issues (validated: the drafts wait for your review before anything is filed).
name: RFC → Issues
description: AI Arena writes an RFC with several models and merges the best of them, then the issue tracker files the issues of the final document (you review the drafts before anything is filed).
category: plan
stages:
  - workflow: ai-arena.yaml
    inputs:
      document_skill: rfc-writing
  - workflow: issue-tracker.yaml
    map:
      request: document
    inputs:
      mode: validated
