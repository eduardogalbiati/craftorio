# The workflows this repository is developed with (#485, docs/agents/engine.md "Repository workflows").
# A bundled workflow by name; the repository's own copy by file (under .craftorio/workflows/), which
# the owner accepts per commit on the Workflows screen. The owner's per-agent model choices stay in
# the workspace (workflows/<name>.yaml there), never here.
# #790 `default`: the project's default development workflow (a clone takes it). #791 `kinds`: the
# workflow of each kind of issue; `fix` in Remote mode because `main` is protected (a pull request).
# #46 `products`: what is released apart, each with its own version, changelog and tag (docs/features/release.md).
version: 1
requires: ">=1.0"
default: ai-development-remote-hero
kinds:
  feature: { name: ai-development-remote-hero }
  fix: { name: fix, mode: remote }
products:
  - id: app
    folder: apps/desktop
    tag_prefix: v
    version_command: node scripts/release-product-version.js app
    # the rest of its fixed group (.changeset/config.json)
    paths: [apps/web, fronts/ai, fronts/analyser, fronts/build, fronts/plan, packages/ui-kit]
  - id: engine
    folder: packages/engine
    tag_prefix: engine-v
    version_command: node scripts/release-product-version.js engine
workflows:
  - name: backlog-refresh
    category: intake
    description: Refresh the issues of the backlog
  - name: feature
    category: solo
    description: A feature, merged into the local main and pushed (Local mode) or through a pull request (Remote)
  - name: fix
    category: fix
    description: A bug fix, reproduced first; hotfix mode from the last tag
  - name: release
    category: release
    description: Tag and publish a release
  - name: ai-development-local-hero
    file: workflows/ai-development-local-hero.yaml
    category: solo
    description: This repository's own copy of the solo flow
  - name: ai-development-remote-hero
    file: workflows/ai-development-remote-hero.yaml
    category: solo
    description: The solo flow for contributors, ending in a pull request the maintainer merges
