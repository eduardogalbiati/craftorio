# =============================================================================
# Workflow: Refactor proposals (#378): the architecture analysis since a release, turned into ranked
# Refactor tab proposals and `refactor` issues, so a pipeline can suggest refactors after a release
# -----------------------------------------------------------------------------
#   facts ─► analyze ─► propose ─► prioritize ──────────────────────► file ─► end   (mode: auto)
#                                       └─mode validated─► gate ──approved──► file
#                                                               └─rejected─► end (nothing filed)
#
#   1. facts (no agent): the Architecture facts (#356) at the project's default branch, the files
#      changed since `since` (a tag or a commit; a pipeline maps it from the release's
#      previous_version) and the analyst's prompt: #356's analysis prompt, focused on the Danger Zone
#      and on the changed files.
#   2. analyze (the analyst, read-only, the one model call): answers #356's report (the
#      `architecture_report` schema, the Architecture tab's own).
#   3. propose (no agent): the findings become proposals of the Refactor tab (#357); a finding that
#      matches an open or dismissed proposal, or an open `refactor` issue, is dropped and named.
#   4. prioritize (no agent besides the Product Owner's turn): #357's ranking of the open proposals,
#      saved as the Refactor tab saves it; the run's new proposals in rank order, the top `limit` kept.
#   5. gate (human, only with inputs.mode validated): the ranked proposals; dismiss the ones to drop
#      on the Refactor tab, then approve to file the others.
#   6. file (no agent): #357's "File as issue" for each kept proposal: the `refactor` label, the
#      Refactor workflow named; a simulation previews (no gh/glab).
# Outputs: `issues` (the filed issues, for a pipeline's product_owner or queue target) and `report`.
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: refactor-proposals
  version: 0.1.0
  description: "Refactors suggested after a release: the architecture analysis of the project (one real model call, its estimate shown as the Architecture tab's), focused on the Danger Zone and the files changed since a tag; the findings become Refactor tab proposals (the known ones are dropped), the Product Owner ranks them and the top ones are filed as `refactor` issues for the Refactor workflow."
  tags: [architecture, refactor, read-only]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: monitor

# -----------------------------------------------------------------------------
inputs:
  project_path:
    label: "Project"
    type: string
    required: true
    description: "The project's local git repository (read-only: nothing in it changes)."
  project_id:
    label: "Project id"
    type: string
    default: ""
    description: "The project whose proposals are written; empty: the run's project."
  since:
    label: "Since"
    type: string
    default: ""
    description: "A tag or a commit: the analysis focuses on the files changed since then (after a release: its previous tag). Empty: the Danger Zone only."
  limit:
    label: "Issues to file"
    type: integer
    default: 5
    description: "At most this many of the new proposals, the best ranked, are filed as issues."
  mode:
    label: "Mode"
    type: string
    enum: [auto, validated]
    default: auto
    options: { auto: Automatic, validated: Validated }
    description: "Automatic: the top proposals are filed at once. Validated: the run shows them at a gate first; dismiss the ones to drop on the Refactor tab."

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    # #286: an agent's `effort` reaches the CLI only through effort_args
    effort_args: ["--effort", "{{ effort }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

defaults:
  working_dir: "{{ inputs.project_path }}"
  timeout: 20m
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5-5
  # no worktree: nothing is merged into the project
  supervisor:
    enabled: true
    max_interventions: 1
  limits:
    max_total_duration: 1h
    max_total_cost_usd: 5

# -----------------------------------------------------------------------------
agents:
  analyst:
    display: Architecture analyst
    color: "#3DB8FF"
    provider: claude
    # the workflow's defaults; a run can pick another model or effort per agent
    model: claude-sonnet-5-5
    effort: medium
    session: ephemeral
    # read-only on the project: its answer is the report, the orchestrator stores the proposals
    capabilities: { tools: [read], web: false }
    system_prompt: |
      You are the architecture analyst: you read a repository and report the refactors worth doing,
      in the Architecture tab's report format. You are read-only: never edit, create or delete a
      file of the project; your answer is the report, and the orchestrator stores it.

groups:
  - name: Facts
    steps: [facts]
  - name: Analysis
    steps: [analyze]
  - name: Proposals
    steps: [propose, prioritize]
  - name: Issues
    steps: [gate, file]

# -----------------------------------------------------------------------------
steps:

  - id: facts
    display: Facts
    type: refactor_proposals
    action: facts
    transitions:
      - when: "true"
        goto: analyze

  # #356's analysis, its prompt and its report schema (named: the Architecture tab's own)
  - id: analyze
    display: Analysis
    agent: analyst
    prompt: |
      {{ steps.facts.output.prompt }}
    output_schema: architecture_report
    transitions:
      - when: "true"
        goto: propose

  - id: propose
    display: Proposals
    type: refactor_proposals
    action: propose
    from: analyze
    transitions:
      - when: "true"
        goto: prioritize

  - id: prioritize
    display: Ranking
    type: refactor_proposals
    action: prioritize
    from: propose
    transitions:
      - when: "inputs.mode == 'validated'"
        goto: gate
      - when: "true"
        goto: file

  # validated mode only: the ranked proposals before anything is filed
  - id: gate
    display: Review the proposals
    type: human_approval
    summary: |
      {{ steps.prioritize.output.ranked | length }} new refactor proposal(s), the top {{ steps.prioritize.output.kept | length }} to file; {{ steps.propose.output.dropped | length }} finding(s) dropped as known.
    message: |
      New refactor proposals, best first (the first {{ steps.prioritize.output.limit }} are filed):
      {% for p in steps.prioritize.output.ranked %}- {{ p.rank }}. {{ p.title }} ({{ p.files | join(', ') }}): {{ p.reason }}
      {% endfor %}
      {% if steps.propose.output.dropped | length %}Dropped as known:
      {% for d in steps.propose.output.dropped %}- {{ d.title }}: {{ d.reason }}
      {% endfor %}{% endif %}
      To drop one, dismiss it on the project's Refactor tab before you approve: the file step skips
      dismissed proposals.
    approve_label: File the issues
    approve_help: "Files the kept proposals as `refactor` issues (the Refactor workflow named), skipping the ones dismissed since."
    reject_label: File nothing
    reject_help: "Ends the run; the proposals stay on the Refactor tab."
    transitions:
      - when: "approved"
        goto: file
      - when: "rejected"
        goto: end
        status: cancelled

  - id: file
    display: File issues
    type: refactor_proposals
    action: file
    from: prioritize
    transitions:
      - when: "true"
        goto: end

# -----------------------------------------------------------------------------
# What the run hands to the next one when it finishes (#134): a pipeline's product_owner or queue target.
outputs:
  issues:
    type: array
    description: "The refactor issues filed: number, url, title (a simulation: numbered previews)."
    value: "{{ (steps.file.output.issues or []) | to_json }}"
  report:
    type: object
    description: "The analysis: #356's architecture report (summary, areas, findings)."
    value: "{{ steps.analyze.output | to_json }}"

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
