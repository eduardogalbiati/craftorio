# =============================================================================
# Workflow: Software Development, local hero
# -----------------------------------------------------------------------------
#   develop ─► code_review ─► test ─► build ─► evidence ─► verify_change ──merge: local──► end
#     ▲            │            │        │                        │              │ conflict
#     └────────────┴────────────┴────────┴────────────────────────┘              ▼
#                  ▲                                                       resolve_merge (developer)
#                  └──────────── code_review ◄──────────────────────────────────┘
#   evidence: screenshots / HTTP request+response / CLI output / log lines that show the change
#   working (local, simulated), in the run folder; it never blocks and the verifier uses it.
#   UI changes (#111): it also captures the states the developer's evidence_plan lists and reviews
#   the screenshots (ui-conventions skill); blocking `ui_findings` go back to develop once.
#   Declared gaps (`left_out`: requirements of the task the developer did not implement): never
#   reviewed. The first time, develop ─► develop with the list (no reviewer call); still there
#   after that ─► requirements_left_out (human gate: continue without them / stop).
#
# The software-development pipeline without GitHub/GitLab and without a merge approval: no
# push, no PR/MR, no CI, no preview, no deploy. Each run works in its own git worktree, started
# from the LOCAL <base> branch (orchestrator.worktree.remote: false: nothing is fetched, so a run
# sees the local merges of earlier runs that were never pushed). Once verified, the engine merges
# the run's branch into the local <base> automatically (`merge: local`): rebased onto it first
# when it moved, fast-forward only (linear history), never pushed.
#   - A merge that fails (usually a conflict with another run merged meanwhile) goes to
#     resolve_merge: the developer rebases onto the local <base> and resolves the conflicts (test
#     files included). Then only what the resolution changed is checked again (`vars.recheck ==
#     'resolution'`): code_review reviews the rebase against the last approved commit (git
#     range-diff), test runs the tests related to the files the resolution touched plus a smoke
#     check (the full suite past 5 files), build runs, evidence is kept, verify_change re-checks only the claims
#     whose files were touched, and the merge is attempted right after. A resolution that changes
#     behaviour (`behaviour_changed`) goes through the full review, suite and verification. Merges of
#     concurrent runs go one at a time. At most 3 rounds; only what the developer can't fix (e.g.
#     uncommitted changes in the checkout where <base> is checked out: the user's) or running out
#     of rounds stops at merge_blocked.
#   - orchestrator.limits.max_total_context: past 40M tokens of context the run pauses before its
#     next agent turn; Continue allows another 40M, Stop ends it (worktree kept).
#   - Commits end with "Closes #<n>" for the run's issues: GitHub closes them when you push <base>.
# Push whenever you want: `git push origin <base>` from the repository.
#
# MODES (input `mode`)
#   auto (default): develop ─► code_review, as above; nothing waits for the owner.
#   validated: develop ─► developer_check (human gate) ─► code_review. The owner tries the worktree
#   (Run locally when a local_preview is set, see below), then approves, asks for changes (back to
#   develop with the text, then back to the gate) or stops. Only the first implementation and the
#   owner's own change requests stop there; review fix rounds too with validate_every_round: true.
#   Before the gate, developer_screenshots (no agent, #144) captures the UI states develop listed in
#   `screenshots`, original and modified, into evidence/developer/round-<n>/; the gate shows them.
# RUN LOCALLY (gates with `local_preview: true`: developer_check, human_review)
#   Offered when the project (Projects › Local preview) or `orchestrator.local_preview`
#   ({ install, command, url }) says how to run the worktree. It never answers the gate.
#
# Rules (as in software-development):
#   - Agents never talk to each other: the engine delegates fixes to the developer.
#   - Tests belong to the test writer (the only full suite run); the developer changes production
#     code only (`edits_tests: false`, enforced by the engine) and says what to test (`test_notes`).
#   - `language` picks unit-test-writer-<language> (test writer) and build-audit-<language> (builder).
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: software-development-local-hero
  version: 0.7.0
  description: Implements, reviews, tests, builds and verifies a change in its own worktree, then merges it into the local base branch automatically, resolving conflicts on the way. No push, no PR, no CI; push when you want.
  tags: [dev, review, test, build, local, worktree]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    type: string
    required: true
    description: Feature or bug to implement.
  issue:
    type: string
    default: ""
    description: "URL of the issue this run implements (set by the Backlog screen). Nothing is closed on GitHub/GitLab until you push."
  issues:
    type: array
    default: []
    description: "URLs of the issues this run implements together, in one branch (set by the Backlog screen; one per line)."
  repo_path:
    type: string
    required: true
    description: Local repository path (a git repository; no remote needed).
  # Picks the unit-test-writer-<language> and build-audit-<language> skills. The app prefills it
  # from the project's files (package.json, pyproject.toml, go.mod, pom.xml, *.csproj).
  language:
    type: string
    enum: [js, python, go, java, csharp]
    default: js
    options: { js: JavaScript, python: Python, go: Go, java: Java, csharp: "C#" }
    description: The project's main language, for its tests and build checks.
  base_branch:
    type: string
    default: main
    description: The local branch the work starts from and is merged into.
  # validated: the run stops at developer_check after the developer.
  mode:
    type: string
    enum: [auto, validated]
    default: auto
    options: { auto: Automatic, validated: Validated }
    description: "Automatic: the change goes straight from the developer to review and tests. Validated: the run stops after the developer so you can try the change before review and tests are paid for."
  # A boolean; saved inputs "true"/"false" (before #116) are accepted by the engine.
  validate_every_round:
    type: boolean
    default: false
    show_if: "mode == 'validated'"
    description: "Also stop for you after each round of review fixes, not only after the first change and your own change requests."

# -----------------------------------------------------------------------------
# Final command line = args + capability and isolation flags + agent.cli_args + (resume_args if
# the session already exists) + skill_args (once per skill) + stdin_arg. The prompt always goes via stdin.
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    # Lets the agent read the skill folder (outside working_dir). Codex in
    # read-only mode can already read any path.
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"

# Allowed commands, shared by the agents below (YAML anchors, used in capabilities.tools).
x-tools:
  # every supported language toolchain: the language skill says which one to use
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:uv, bash:poetry, bash:pip-audit, bash:osv-scanner, bash:go, bash:govulncheck, bash:mvn, bash:./mvnw, bash:mvnw.cmd, bash:gradle, bash:./gradlew, bash:gradlew.bat, bash:dotnet]
  # gh / glab: called bare, in the Bash tool, one command per call. That is the only form this
  # allowlist accepts: no PowerShell, no full or 8.3 paths, no PATH edits, no ;/&&/pipes, no body
  # files (use --body). The engine refreshes PATH, so bare gh works inside runs.
  vcs: &vcs [bash:git, bash:gh, bash:glab]

defaults:
  # the run's own git worktree (orchestrator.worktree), or repo_path when it is not a git repo
  working_dir: "{{ worktree_dir }}"
  # one agent turn: 30m, plus 10m per extra issue of a grouped run, at most 60m (#101)
  timeout: "{{ (30 + 10 * ((inputs.issues | length) - 1)) | clamp(30, 60) }}m"
  # persistent agents: once a turn ends above this context size, the next turn starts a fresh
  # session from the agent's handoff note (runs/<id>/handoffs/)
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

# v1: the graph is run by the app's deterministic engine (src/engine).
orchestrator:
  provider: claude
  model: claude-sonnet-5
  # One git worktree per run: <workspace>/worktrees/<run_id>, detached at the LOCAL <base>
  # (remote: false: no fetch). Removed when the run succeeds (its branch is deleted once merged
  # into the local <base>), kept otherwise so "resume from step" continues there.
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  # AI supervisor: called when a step fails; explains it and picks a recovery the engine
  # validates (fix the output, retry with an instruction, an allowed goto, or ask a human).
  # On call: gates with kind: escalation and stalls (the same answer 3 visits in a row, refused
  # tool calls, a slow step) call it before you are asked; decision gates never do.
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2   # per step
    max_cost_usd: 5        # what the supervisor may spend in one run
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 60
    # context the agents read (input + cache), summed over every turn: past it the run pauses
    # before the next agent turn until you choose Continue (another 40M) or Stop
    max_total_context: 40M

# -----------------------------------------------------------------------------
# Agents. `capabilities` is what each agent may use; the engine turns it into each CLI's flags
# and runs every agent isolated from the user's own CLI setup (MCP servers, plugins, memory).
# Sessions: `handoff` (a fresh session per turn, started from the agent's handoff note) for the
# agents that come back for fixes and checks; `persistent` (with defaults.max_context) elsewhere.
# Skill names can be templates: they are resolved from the inputs at run time.
# -----------------------------------------------------------------------------
agents:
  developer:
    provider: claude
    model: claude-opus-5-5
    session: handoff
    # subagents: exploration sub-agents map the code, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # tests belong to the test writer: a turn that changes a test file (tests_paths) is sent back
    edits_tests: false
    # bug-diagnosis: fixes delegated after failures; merge-conflict-resolver: resolve_merge;
    # long-commands: installs, builds and focused checks in the foreground; ui-conventions: changes
    # that touch a screen (shared components, controls, the states to capture)
    skills: [long-commands, bug-diagnosis, merge-conflict-resolver, context-economy, decision-log, ui-conventions]
    system_prompt: |
      You are a senior software engineer. Make small, cohesive changes to the production code
      that follow the architecture and conventions of the existing code.
      Merge-friendly (parallel runs): add new code next to related code, not before a shared
      section comment; write shared name lists (module.exports, destructured requires) one item
      per line, sorted; document a file in its header comment or a topic doc, not in an index.
      Tests belong to the test writer, who runs after the code review: never create, edit or
      delete test files (the orchestrator refuses a turn that changes one) and do not run the
      full test suite. To check your change, run a focused existing test or the build. Describe
      what should be tested (behaviours, edge cases, files) in `test_notes` when asked.
      Keep your context small (context-economy): on a task that touches more than about three
      files, start one exploration sub-agent before your first edit and have it report the
      files, functions and line numbers to change; then read only the files you will edit, and
      group several changes to a file in one edit. On a fix turn, read only what the findings name.
      Sub-agents are the default for code research: a search across files you will not edit,
      a long output (a failing check, a log, a long diff) or a finding in code you have not
      mapped goes to a sub-agent that returns a summary; edits and the checks that decide your
      step stay in your own turn.
      Work on your own branch and commit your changes there. This run has its own git
      worktree (the current folder), which starts detached at the LOCAL {{ inputs.base_branch }}:
      this workflow works locally, and the local {{ inputs.base_branch }} holds earlier local
      merges that were never pushed. Start your branch right where the worktree is:
      `git switch -c <branch>`. Never fetch, pull or branch from origin, and never push: the
      orchestrator merges your branch into the local {{ inputs.base_branch }} after approval.
      A fresh worktree has no installed dependencies: install them
      when they are missing or the lockfile changed (e.g. `npm ci` when node_modules is missing
      or package-lock.json differs from the previous HEAD).
      {% if inputs.issue or (inputs.issues | length) %}End every commit message with one line per issue this run implements,
      `Closes #<number>` (the numbers from: {{ inputs.issue }}{% for u in inputs.issues %} {{ u }}{% endfor %}):
      GitHub closes them when the local {{ inputs.base_branch }} is pushed.
      {% endif %}When you finish a requested fix, report the commit hash.

  reviewer:
    provider: codex
    model: gpt-6-luna
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    # Criteria, severities and per-language rules live in the skill
    # (<workspace>/skills/code-review, editable in the Skills screen).
    skills: [code-review]
    system_prompt: |
      You are the code reviewer of this workflow. Follow the code-review skill:
      detect the languages in the diff and read the rules for each one before the verdict.

  test_writer:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    # edits test files only (a convention of its role: the tools can't tell tests from code)
    # subagents: exploration sub-agents map the behaviours and tests, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    skills: ["unit-test-writer-{{ inputs.language }}", context-economy]
    system_prompt: |
      You are the test writer, the only agent of this workflow that writes tests. You write
      and update them (including tests an intended behaviour change makes obsolete) and run
      the full suite, following the test skill for this language. You do NOT fix production
      code: when a test fails because of a bug in the code, describe the failure precisely
      (test, file, error, probable cause) so the orchestrator can hand it to the developer.
      Commit test files only.
      Keep your context small (context-economy): before writing tests, start one exploration
      sub-agent that maps, from the developer's test_notes and the branch diff, the changed
      behaviours, the existing tests that cover them and the test helpers and conventions,
      with file and line numbers; then read only the test files you edit and the production
      lines under test. A long suite output goes to a sub-agent that returns the failures;
      the suite run that decides your step stays in your own turn.

  builder:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: ["build-audit-{{ inputs.language }}"]
    system_prompt: |
      You are the builder. You build the application and check its dependencies for
      vulnerabilities, following the build skill for this language. You do not change
      code and you do not run the test suite (the test writer ran it). Vulnerability policy:
      - blocks: any critical; high in production dependencies
      - report only: moderate/low, and anything in development-only dependencies

  verifier:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: [claim-verification]
    system_prompt: |
      You are the verifier. You prove or disprove that the change does what the task
      asked, by running the same command before and after it. You do not change code and
      you do not run the full test suite (the test writer ran it).

  evidence:
    provider: claude
    model: claude-sonnet-5
    session: ephemeral
    capabilities: { tools: [read, *toolchains], web: false }
    # ui-conventions: the visual review of the UI screenshots (ui_findings)
    skills: [implementation-evidence, ui-conventions]
    system_prompt: |
      You collect evidence that the change works: UI screenshots, HTTP requests and their
      responses, CLI output or log lines, local and simulated only. You do not change code, do not
      commit and do not run the test suite; a capture that fails is reported, never fixed.

groups:
  - name: Develop
    steps: [develop, requirements_left_out, issue_not_done, developer_screenshots, developer_check]
  - name: Review
    steps: [code_review, human_review]
  - name: Validate
    steps: [test, test_failed, build, build_failed, evidence, verify_change, verify_failed]
  - name: Merge
    steps: [resolve_merge, merge_blocked]

# -----------------------------------------------------------------------------
steps:

  # ============================ BUILD & TEST =================================

  - id: develop
    agent: developer
    prompt: |
      Task: {{ inputs.task }}

      {% if inputs.issues | length > 1 %}
      This run implements {{ inputs.issues | length }} issues together, in one branch:
      {{ inputs.issues | join(', ') }}.
      In `issues`, answer one entry per issue (its URL in `issue`): `done` and a `summary` of what
      you did for it, or `done: false` and why it cannot be done in this run. Never drop an issue
      silently: the owner decides whether the run goes on without it. Your `summary` lists what
      was done per issue.
      {% if steps.issue_not_done.output %}
      The owner chose to continue without the issues you could not do; leave them out.
      {% endif %}
      {% endif %}
      {% if steps.code_review.output and steps.code_review.output.verdict == 'changes_requested' %}
      The reviewer requested these changes (iteration {{ loop.iteration }}):
      {{ steps.code_review.output.findings | to_yaml }}
      Fix the blocking items, make a new commit and answer each one.
      A finding that needs no production change (it asks for tests or screenshots, which the
      test writer owns, or you disagree with it): answer it in `summary` with the reason, make no
      empty commit, and set `no_change: true` when no finding of this round needed a code change.
      {% endif %}
      {% if previous_step == 'developer_check' %}
      The owner tried your change and asks for these changes (change request {{ steps.developer_check.visits }}):
      {{ steps.developer_check.output.feedback }}
      Fix them on the same branch with a new commit, and answer each point in `summary`.
      {% endif %}
      {% if previous_step == 'evidence' %}
      The visual review of the screenshots found these UI problems (ui-conventions skill; one round):
      {{ steps.evidence.output.ui_findings | selectattr('blocking') | list | to_yaml }}
      Fix them on the same branch with a new commit and answer each one in `summary` (one you
      disagree with: say why). Keep `evidence_plan` listing the states to capture.
      {% endif %}
      {% if not steps.develop.output %}
      Before changing code: create your branch where the worktree starts (the local
      {{ inputs.base_branch }}): `git switch -c <branch>`, then make sure dependencies are
      installed for that base.
      {% endif %}
      Change production code only: the test writer writes and runs the tests after the review.
      In `test_notes`, tell it what should be tested: the behaviours you changed, the edge cases
      and the files (and the existing tests your change makes obsolete, if any).
      In `evidence_plan`, say per issue how to show the change working, for the evidence step (it
      does not read the code): the screen and the screenshot options (view, tab, clicks), or the
      request, command or mock run whose output shows it; `none` and why when nothing is observable.
      For a UI change, list the interaction states to capture (the default view, then each edit
      form, empty state and error state the change adds, with the clicks that open them) and make
      the screenshot demo data cover the fields the change introduces (ui-conventions skill).
      In `screenshots`, list the same UI states as exact options of the project's screenshot command
      (`npm run screenshot -- …`), one entry each: `name` a plain file name
      `<issue>-<screen>-<state>`, `caption` one sentence, `args` the options as a list (e.g.
      ["--view", "backlog", "--mode", "roadmap", "--click", "[data-rm-edit]"]), never --out, --name,
      --side, --ref or --caption (the capture sets them). The engine captures each one, original and
      modified, before the owner tries the change. An empty list when the change has no UI.
      In `left_out`, list each requirement of the task (its acceptance criteria, each task of the
      issue) that you did not implement, with the reason: never leave one only in prose; an empty
      list when everything was done. A list that is not empty sends you back here, not to the review.
      Tasks that are not yours never go in `left_out`: tests (the test writer writes and runs them
      after the review; describe them in `test_notes`) and measurements that need real runs or the
      owner (say in `summary` what to measure and how).{% if inputs.issues | length > 1 %}
      A whole issue you could not do goes in `issues` (`done: false`), not in `left_out`.{% endif %}
      {% if vars.accepted_gaps %}
      The owner chose to continue without these requirements; do not list them again: {{ vars.accepted_gaps }}
      {% elif previous_step == 'develop' and vars.gaps_returned == 'yes' and steps.develop.output.left_out %}
      Your previous answer left these requirements out, so the review was not called:
      {{ steps.develop.output.left_out | to_yaml }}
      Finish them on the same branch with a new commit. Keep in `left_out` only those that are
      impossible in this run, each with the reason: the owner then decides whether the run goes on
      without them.
      {% endif %}
    # a fix round with a new commit, summary or set of files is progress, not "the same answer" (#121)
    stall:
      same_output_fields: [commit_sha, summary, files_changed]
    output_schema:
      type: object
      required: [branch, summary, files_changed, test_notes, committed, left_out]
      properties:
        branch:        { type: string }
        summary:       { type: string }
        files_changed: { type: array, items: { type: string } }
        # for the test writer: behaviours, edge cases and files to test
        test_notes:    { type: string }
        # for the evidence step: per issue, the screen/command/request that shows the change
        evidence_plan: { type: string }
        # for developer_screenshots (#144): each UI state as the screenshot command's options;
        # an empty list for a change without UI
        screenshots:
          type: array
          items:
            type: object
            required: [name, caption, args]
            properties:
              name:    { type: string }
              caption: { type: string }
              args:    { type: array, items: { type: string } }
        committed:     { type: boolean }
        # a review round answered without a production change: back to the reviewer with the answer
        no_change:     { type: boolean }
        commit_sha:    { type: string }
        notes:         { type: string }
        # a run for several issues (inputs.issues): what was done for each one
        issues:
          type: array
          items:
            type: object
            required: [issue, done, summary]
            properties:
              issue:   { type: string }
              done:    { type: boolean }
              summary: { type: string }
        # requirements of the task the developer did not implement (#98), single issue or group;
        # required, so an answer cannot skip it (an empty list when nothing is missing)
        left_out:
          type: array
          items:
            type: object
            required: [requirement, reason]
            properties:
              requirement: { type: string }
              reason:      { type: string }
    transitions:
      # declared gaps (#98): no review is spent on work the developer says is missing. The first
      # time, back to the developer with the list (no reviewer call); any gap after that (also a new
      # one after the owner continued, or on a review round) goes to the owner at requirements_left_out
      - when: "(output.left_out or []) | length and vars.gaps_returned != 'yes'"
        goto: develop
        set: { gaps_returned: "yes" }
      - when: "(output.left_out or []) | length"
        goto: requirements_left_out
      # an issue of the group could not be done: the owner decides (once) whether the run goes on without it
      - when: "output.committed and inputs.issues | length > 1 and not steps.issue_not_done.output and (output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      # validated mode: the owner tries the first implementation and every round they asked for
      # (vars.owner_validated is "yes" once they approved; a review fix round goes on without them,
      # unless validate_every_round)
      - when: "inputs.mode == 'validated' and output.committed and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: developer_screenshots
      # the review findings needed no production change (e.g. they ask for tests, which the test
      # writer owns): the reviewer gets the answer; a disagreement ends at human_review, never in a loop
      - when: "output.no_change and steps.code_review.output"
        goto: code_review
      - when: "output.committed"
        goto: code_review
      - when: "true"
        goto: develop
        max_visits: 3
        on_exhausted: fail

  # Screenshots of the developer's UI states before the owner's check (#144): no agent, no model
  # cost. The project's screenshot command runs once per entry of develop's `screenshots`, modified
  # (the worktree) and original (--ref the base), into evidence/developer/round-<n>/ (one round per
  # visit). Never blocks: an empty list, a simulated run or a failed capture is in its output's
  # message, which developer_check shows.
  - id: developer_screenshots
    type: screenshots
    from: develop
    folder: developer
    base: "{{ inputs.base_branch }}"
    transitions:
      - when: "true"
        goto: developer_check

  # Validated mode (inputs.mode): the owner tries the developer's work before any review or test
  # token is spent. Ask for changes goes back to the developer with the text, and the run comes
  # back here; no automatic limit, the owner decides when to stop. A human gate: no timeout, and
  # neither the supervisor nor a retry ever answers it.
  - id: developer_check
    type: human_approval
    local_preview: true
    diff_base: "{{ inputs.base_branch }}"
    message: |
      The developer finished {% if previous_step == 'developer_screenshots' and steps.developer_check.output and steps.developer_check.output.choice == 'changes' %}your change request {{ steps.developer_check.visits - 1 }}{% else %}the implementation{% endif %}. Try it before the review and the tests run.
      Branch `{{ steps.develop.output.branch }}`{% if worktree_dir %} in the worktree {{ worktree_dir }}{% endif %}.
      {% if local_preview %}Run App starts `{{ local_preview.command }}` there.{% else %}To try it: Run App proposes a command from the worktree (package.json, the README) and saves it as the project's Local preview.{% endif %} Try it with Run App, not by starting it by hand in the worktree.

      Summary: {{ steps.develop.output.summary }}
      {% if steps.develop.output.issues %}
      Issues:
      {% for i in steps.develop.output.issues %}- {{ i.issue }}: {% if i.done %}done{% else %}NOT done{% endif %}, {{ i.summary }}
      {% endfor %}{% endif %}
      Files changed: {{ steps.develop.output.files_changed | join(', ') }}
      {% set commits = worktree_dir | git_commits(inputs.base_branch) %}{% if commits %}Commits on the branch:
      {{ commits }}
      {% endif %}
      {% if worktree_dir %}Diff: Show the diff opens the branch's changes since `{{ inputs.base_branch }}` here.{% endif %}
      Test notes: {{ steps.develop.output.test_notes }}
      {% if steps.developer_screenshots.output %}Screenshots: {{ steps.developer_screenshots.output.message }}{% endif %}
      {% if steps.develop.output.evidence_plan %}Evidence plan: {{ steps.develop.output.evidence_plan }}{% endif %}
    feedback: { label: "Your change request for the developer (required with \"Ask for changes\")", placeholder: "What to change, point by point" }
    choices:
      - { id: approve, label: "Approve: go on to the code review" }
      - { id: changes, label: "Ask for changes: back to the developer", feedback_required: true }
      - { id: stop,    label: "Stop the run (worktree kept to resume)" }
    transitions:
      - when: "choice == 'approve'"
        goto: code_review
        set: { owner_validated: "yes" }
      - when: "choice == 'changes'"
        goto: develop
        set: { owner_validated: "no" }
      - when: "choice == 'stop'"
        goto: end
        status: cancelled

  # Requirements of the task the developer still leaves out after being sent back once to finish
  # them (#98): never dropped silently. A human gate: neither the supervisor nor a retry answers it.
  - id: requirements_left_out
    type: human_approval
    message: |
      The developer left these requirements of the task out, even after being sent back once to finish them:
      {% for g in steps.develop.output.left_out %}
      - {{ g.requirement }}: {{ g.reason }}{% endfor %}
      The rest is on branch `{{ steps.develop.output.branch }}`; the code review has not run yet.
    choices:
      - { id: continue, label: "Continue without them" }
      - { id: stop,     label: "Stop the run as failed (worktree kept to resume)" }
    transitions:
      # nothing committed yet: the developer commits the rest first
      - when: "choice == 'continue' and not (steps.develop.output.committed or steps.develop.output.no_change)"
        goto: develop
        # the separator goes before each entry: the engine trims a set: value, so a trailing one is lost
        set: &accepted_gaps { accepted_gaps: "{{ vars.accepted_gaps }}{% for g in steps.develop.output.left_out %}{% if vars.accepted_gaps or not loop.first %} {% endif %}{{ g.requirement }};{% endfor %}" }
      - when: "choice == 'continue' and inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
        set: *accepted_gaps
      - when: "choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes'"
        goto: developer_screenshots
        set: *accepted_gaps
      - when: "choice == 'continue'"
        goto: code_review
        set: *accepted_gaps
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # A run for several issues where the developer could not do one of them: never dropped silently.
  - id: issue_not_done
    type: human_approval
    message: |
      The developer could not do every issue of this run:
      {% for i in steps.develop.output.issues %}{% if not i.done %}
      - {{ i.issue }}: {{ i.summary }}{% endif %}{% endfor %}
      The other issues are done on branch `{{ steps.develop.output.branch }}`.
    choices:
      - { id: continue, label: "Continue without them" }
      - { id: stop,     label: "Stop the run as failed (worktree kept to resume)" }
    transitions:
      - when: "choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes'"
        goto: developer_screenshots
      - when: "choice == 'continue'"
        goto: code_review
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # After a merge conflict (vars.recheck == 'resolution', set by resolve_merge) the review covers
  # the resolution only: the rebase compared with the commit that was last approved.
  - id: code_review
    agent: reviewer
    prompt: |
      {% if vars.recheck == 'resolution' %}
      {% set approved = (action_error.head if action_error and action_error.head else '') or steps.resolve_merge.output.previous_head %}
      Review the RESOLUTION of a merge conflict on branch `{{ steps.develop.output.branch }}`, not the
      whole change: the change was already reviewed, tested and verified at commit `{{ approved }}`,
      then the local `{{ inputs.base_branch }}` moved and the developer rebased the branch onto it
      (now `{{ steps.resolve_merge.output.head }}`).
      `git range-diff {{ inputs.base_branch }} {{ approved }} {{ steps.develop.output.branch }}` compares the
      approved commits with the rebased ones, leaving out what came from `{{ inputs.base_branch }}`:
      review only what differs (the conflict hunks, what the resolution kept or dropped from each
      side, and any commit after the rebase). Findings on code the resolution did not change are not
      blocking: report them as minor or nit at most.
      Task (for context): {{ inputs.task }}
      Developer: {{ steps.resolve_merge.output.summary }}
      {% else %}
      Review the changes on branch `{{ steps.develop.output.branch }}` against
      `{{ inputs.base_branch }}` (`git diff {{ inputs.base_branch }}...{{ steps.develop.output.branch }}`).
      Task (the spec for the spec axis): {{ inputs.task }}
      Developer summary: {{ steps.develop.output.summary }}
      {% if vars.accepted_gaps %}The owner accepted that the run goes on without these requirements (not blocking): {{ vars.accepted_gaps }}{% endif %}
      {% endif %}
      {% if inputs.issues | length > 1 and vars.recheck != 'resolution' %}
      This run implements several issues: check the spec axis per issue, and set `issue` (its URL)
      on the findings about one of them. An issue the change misses or only half does is a blocker,
      unless the developer reported it as not done:
      {{ steps.develop.output.issues | to_yaml }}
      {% endif %}
      Tests are not part of this review: the test writer writes and runs them in the next step,
      after your approval, and the developer never edits test files. A missing test, coverage or
      screenshot, even when the task asks for it, is never a finding here: list it in
      `for_test_writer` instead; it does not change the verdict.
    output_schema:
      type: object
      required: [verdict, findings]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        # what the test writer should cover (tests the task asks for); never a finding
        for_test_writer: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, description]
            properties:
              axis:        { type: string, enum: [correctness, spec, standards] }
              severity:    { type: string, enum: [blocker, major, minor, nit] }
              file:        { type: string }
              line:        { type: integer }
              description: { type: string }
              issue:       { type: string }
    transitions:
      - when: "output.verdict == 'approved'"
        goto: test
      - when: "output.verdict == 'changes_requested'"
        goto: develop
        loop:
          name: review_cycle
          max_iterations: 3
          on_exhausted: human_review

  - id: human_review
    type: human_approval
    local_preview: true
    message: |
      The review loop did not converge in 3 iterations.
      Approve: move on to testing anyway. Reject: stop the run (cancelled).
    transitions:
      - when: "approved"
        goto: test
      - when: "rejected"
        goto: end
        status: cancelled

  # Test writer: owns the tests (writes/updates them) and runs the full suite, the only full run
  # of this workflow. On a production-code failure the orchestrator hands it to the developer and
  # tells the test writer when it is fixed.
  - id: test
    agent: test_writer
    prompt: |
      Branch `{{ steps.develop.output.branch }}` (already reviewed).
      Original task: {{ inputs.task }}
      Change made: {{ steps.develop.output.summary }}
      Files: {{ steps.develop.output.files_changed | join(', ') }}
      {% if steps.develop.output.test_notes %}
      What the developer says should be tested:
      {{ steps.develop.output.test_notes }}
      {% endif %}
      {% if steps.code_review.output and steps.code_review.output.for_test_writer %}
      What the reviewer says should be tested:
      {{ steps.code_review.output.for_test_writer }}
      {% endif %}

      {% if delegate_result %}
      The developer fixed the production code you reported (it does not touch the tests):
      {{ delegate_result.text }}
      Run the full suite again and confirm.
      {% elif vars.recheck == 'resolution' and (steps.resolve_merge.output.files_changed or []) | length <= 5 %}
      Your tests already passed on this change. Since then the developer rebased the branch onto
      the local `{{ inputs.base_branch }}` and resolved a conflict, touching only:
      {{ (steps.resolve_merge.output.files_changed or []) | join(', ') or '(no file listed: see the summary)' }}
      ({{ steps.resolve_merge.output.summary }})
      Run only the tests related to those files (their own tests and the tests of what uses them),
      plus a fast smoke check of the whole project (the quickest command that loads it: a build,
      a type check, or the test runner on one small file), NOT the full suite. Update a test only
      when the base's change made it obsolete (not a bug); no new tests. Say
      which tests you ran in `summary`.
      {% elif vars.recheck == 'resolution' %}
      Your tests already passed on this change. Since then the developer rebased the branch onto
      the local `{{ inputs.base_branch }}` and resolved a conflict that touched many files:
      {{ steps.resolve_merge.output.summary }}
      Run the full suite once. Update a test only when the base's change made it obsolete (not a
      bug); no new tests.
      {% else %}
      1. Check out the branch. You own the tests: the developer did not write or run any.
         Write the tests the change needs, starting from the developer's notes (they are a
         starting point, not a limit), following the test skill (the framework and folder the
         project already uses). Update the tests the change makes obsolete because of an
         intended behaviour change (not a bug). Commit only test files. Purely visual changes
         may not need a new test — justify it.
      2. While writing, run only the test files you touch, each slow one (over a minute) at most
         once per round, filtered to the tests you are writing (e.g. `--test-name-pattern`). Then
         run the full suite once, at the end, with the project's test command. Never start a full
         mock run of a workflow (`scripts/run.js`): the suite already includes one.
      {% endif %}
      Screenshots and other evidence of the change are collected after the build (evidence
      step): capture none.
      If the suite fails, first check whether the same tests fail on the local
      `{{ inputs.base_branch }}`, following the test skill (pre-existing failures): run only the
      failing files on a temporary worktree of the base. A test that also fails there is not this
      run's: list it in `preexisting_failures` (test, file, reason), do not investigate or fix it
      (unless it is trivial and in files this change touches), and it does not make
      `tests_status` fail. The owner gets the list as a follow-up.
      If a test fails because of production code, do NOT fix it:
      fill failure_report with test, file, error and probable cause.
    output_schema:
      type: object
      required: [tests_status, tests_added, committed]
      properties:
        tests_status:   { type: string, enum: [pass, fail] }
        tests_added:    { type: array, items: { type: string } }
        committed:      { type: boolean }
        failure_report: { type: string }
        summary:        { type: string }
        # tests that also fail on the base: reported, not chased (the engine logs them for the owner)
        preexisting_failures:
          type: array
          items:
            type: object
            required: [test, file]
            properties:
              test:   { type: string }
              file:   { type: string }
              reason: { type: string }
    transitions:
      - when: "output.tests_status == 'pass'"
        goto: build
      - when: "output.tests_status == 'fail'"
        delegate:
          agent: developer
          prompt: |
            The test writer found failures caused by the production code on branch `{{ steps.develop.output.branch }}`:
            {{ output.failure_report }}
            Fix the production code only: never change the tests (if you think a test is wrong,
            say why in your answer; the test writer owns it). Run only the failing tests, not the
            full suite (the test writer runs it next), commit and report the commit hash.
        goto: test
        max_visits: 3
        on_exhausted: test_failed

  - id: test_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      Tests are still failing after 3 rounds of fixes:
      {{ steps.test.output.failure_report }}
      Approve: continue to the build anyway. Reject: stop the run as failed (the worktree is kept to resume it).
    transitions:
      - when: "approved"
        goto: build
      - when: "rejected"
        goto: end
        status: failed

  # Builder: application build + dependency vulnerabilities.
  - id: build
    agent: builder
    prompt: |
      On branch `{{ steps.develop.output.branch }}`:
      {% if delegate_result %}
      The developer applied a fix: {{ delegate_result.text }}
      {% endif %}
      1. Build the project following the build skill.
      2. Audit the dependencies following the build skill, separating production from development.
      Apply your role's vulnerability policy. In `vulnerabilities`, report the PRODUCTION
      counts; summarize the development ones in `dev_vulnerabilities`.
      When the build fails, set failure_class (see the build skill):
        code = a commit on the branch can fix it (code, tests, lockfile, build scripts);
        infra = no commit can (a file locked by a running process, e.g. EBUSY/EPERM under
        node_modules, missing permissions, network, disk): say what holds it in the report
        and do not retry the install in a loop;
        unknown = you could not tell.
    output_schema:
      type: object
      required: [build_status, vulnerabilities, report]
      properties:
        build_status: { type: string, enum: [success, failed] }
        failure_class: { type: string, enum: [code, infra, unknown] }
        vulnerabilities:
          type: object
          required: [critical, high, moderate, low]
          properties:
            critical: { type: integer }
            high:     { type: integer }
            moderate: { type: integer }
            low:      { type: integer }
        dev_vulnerabilities: { type: string }
        report:              { type: string }
    transitions:
      # after a merge-conflict resolution the evidence is kept: verify_change re-checks the claims
      - when: "output.build_status == 'success' and output.vulnerabilities.critical == 0 and output.vulnerabilities.high == 0 and vars.recheck == 'resolution'"
        goto: verify_change
      - when: "output.build_status == 'success' and output.vulnerabilities.critical == 0 and output.vulnerabilities.high == 0"
        goto: evidence
      # the environment, not the code: a developer round can't change it, a human can
      - when: "output.build_status == 'failed' and output.failure_class == 'infra'"
        goto: build_failed
      - when: "true"
        delegate:
          agent: developer
          prompt: |
            The builder blocked branch `{{ steps.develop.output.branch }}`:
            {{ output.report }}
            Fix it (build failure or vulnerable dependency), check it with a focused test or the build (not the full suite),
            commit and report the commit hash.
        goto: build
        max_visits: 3
        on_exhausted: build_failed

  # Reached by an infra failure (at once) or a build still blocked after 3 fix rounds.
  - id: build_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      {% if steps.build.output.build_status == 'failed' and steps.build.output.failure_class == 'infra' %}The build failed because of the environment, not the code (no fix round was spent):{% else %}The build is still blocked after 3 rounds of fixes:{% endif %}
      {{ steps.build.output.report }}
      Building again only helps once the environment is fixed (e.g. the process holding a file
      of the worktree is stopped: the orchestrator stops the ones started from the worktree).
    choices:
      - { id: continue, label: "Continue to verification anyway" }
      - { id: retry,    label: "Build again (I fixed the environment)" }
      - { id: stop,     label: "Stop the run as failed (worktree kept to resume)" }
    transitions:
      - when: "choice == 'continue'"
        goto: evidence
      - when: "choice == 'retry'"
        goto: build
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # Evidence: shows the change working (UI screenshots, HTTP request/response, CLI output, log
  # lines), after the tests passed and the build succeeded. It never blocks: the verifier uses it.
  - id: evidence
    agent: evidence
    prompt: |
      Task: {{ inputs.task }}
      Change: {{ steps.develop.output.summary }}
      Files: {{ steps.develop.output.files_changed | join(', ') }}
      Branch `{{ steps.develop.output.branch }}`, base `{{ inputs.base_branch }}`, run folder `{{ run_dir }}`.
      {% if inputs.issues | length > 1 %}
      This run implements several issues ({{ inputs.issues | join(', ') }}): collect evidence per
      issue and set `issue` (its URL) on each entry.
      {% endif %}
      {% if steps.develop.output.evidence_plan %}
      The developer's evidence plan (follow it; don't explore the code to find another):
      {{ steps.develop.output.evidence_plan }}
      {% endif %}
      Stay within the skill's budget: no reading code beyond `git diff --stat` and the plan, no
      tests, no checking docs (the verifier does that), at most 2 captures per issue (plus the
      interaction states the plan lists for a UI change, at most 4 more).
      Collect the evidence that the change does what the task asked, following the
      implementation-evidence skill: pick the kind per issue (UI screenshots original/modified into
      `{{ evidence_dir }}` as `<issue>-<screen>-<state>.original.png` / `.modified.png`, HTTP
      request and response, CLI output, log lines of a simulated run), local and simulated only,
      and stay read-only on the working tree. Nothing observable, or no way to capture it: say why in `note`.
      UI screenshots: review them against the ui-conventions skill and list each problem in
      `ui_findings` (`blocking` when it makes the screen hard to read or use); an empty list when
      there is none or the change has no UI.{% if vars.ui_review_returned == 'yes' %} This is the
      check after the developer's UI fix round: report what is still wrong, it is recorded for the owner.{% endif %}
    output_schema:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          items:
            type: object
            required: [kind, title]
            properties:
              issue:   { type: string }
              kind:    { type: string, enum: [screenshot, http, cli, log] }
              title:   { type: string }
              command: { type: string }
              original: { type: string }
              modified: { type: string }
        # UI changes: the captions of the images of this round (<run_dir>/evidence/<step>/round-<n>/);
        # the engine indexes them in <run_dir>/evidence/manifest.json, whose final set the gate, the
        # verifier and a PR/MR workflow use
        screenshots:
          type: array
          items:
            type: object
            required: [path, caption]
            properties:
              path:    { type: string }
              caption: { type: string }
        note: { type: string }
        # the visual review of the UI screenshots (ui-conventions skill; #111)
        ui_findings:
          type: array
          items:
            type: object
            required: [element, problem, convention, blocking]
            properties:
              issue:      { type: string }
              element:    { type: string }
              problem:    { type: string }
              convention: { type: string }
              screenshot: { type: string }
              blocking:   { type: boolean }
    transitions:
      # blocking UI findings go back to the developer once, like review findings (one UI fix round:
      # develop ─► code_review ─► test ─► build ─► evidence again); after it they are only recorded
      - when: "(output.ui_findings or []) | selectattr('blocking') | list | length and vars.ui_review_returned != 'yes'"
        goto: develop
        set: { ui_review_returned: "yes" }
      - when: "true"
        goto: verify_change

  # Verifier: does the change do what the task asked? Same command on the base and on
  # the branch. inconclusive (nothing observable, e.g. a refactor) does not block.
  - id: verify_change
    agent: verifier
    prompt: |
      Task: {{ inputs.task }}
      Change: {{ steps.develop.output.summary }}
      Branch `{{ steps.develop.output.branch }}`, base `{{ inputs.base_branch }}`.
      {% if delegate_result %}
      The developer changed the code after your last verdict:
      {{ delegate_result.text }}
      Run the treatment side again (the baseline did not change).
      {% endif %}
      {% if vars.recheck == 'resolution' and not delegate_result and steps.verify_change.output %}
      You already verified this change: {{ steps.verify_change.output | to_json }}
      Since then the developer rebased the branch onto the local `{{ inputs.base_branch }}` and
      resolved a conflict, touching only: {{ (steps.resolve_merge.output.files_changed or []) | join(', ') or '(no file listed)' }}
      ({{ steps.resolve_merge.output.summary }}).
      Re-check only the claims (issues) whose evidence depends on those files, on the rebased
      branch; keep your other verdicts and evidence as they were, and say which you kept.
      {% endif %}
      {% if steps.evidence.output and steps.evidence.output.evidence %}
      Evidence already collected (use it; run your own command only for a claim it does not
      cover or to compare original and modified): {{ steps.evidence.output.evidence | to_json }}
      {% endif %}
      The run's screenshots are indexed in `{{ run_dir }}/evidence/manifest.json`: use its final set
      (images with `final: true`; a `modified` image's `pair` is its original), not older rounds.
      Verify the change following the claim-verification skill. Stay read-only: the
      working tree must not change (no files, stash, worktree or checkout).
      {% if inputs.issues | length > 1 %}
      This run implements several issues: verify each one the developer did (their report:
      {{ steps.develop.output.issues | to_json }}). In `issues`, one entry per issue with its own
      verdict and evidence; `claim` lists each issue with its verdict. The overall `verdict` is
      not_verified when any issue the run still implements is not_verified.
      {% endif %}
    output_schema:
      type: object
      required: [verdict, claim, evidence]
      properties:
        verdict:  { type: string, enum: [verified, not_verified, inconclusive] }
        claim:    { type: string }
        command:  { type: string }
        evidence: { type: string }
        # a run for several issues: the verdict per issue
        issues:
          type: array
          items:
            type: object
            required: [issue, verdict]
            properties:
              issue:    { type: string }
              verdict:  { type: string, enum: [verified, not_verified, inconclusive] }
              evidence: { type: string }
    transitions:
      - when: "output.verdict != 'not_verified'"
        merge: local
        goto: end
        on_error: resolve_merge
      - when: "output.verdict == 'not_verified'"
        delegate:
          agent: developer
          prompt: |
            The verifier could not confirm the change on branch `{{ steps.develop.output.branch }}`.
            Claim: {{ output.claim }}
            Command: {{ output.command }}
            Observed: {{ output.evidence }}
            Fix it, check it with a focused test or the build (not the full suite), commit and report the commit hash.
        goto: verify_change
        max_visits: 2
        on_exhausted: verify_failed

  - id: verify_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The change still does not do what the task asked after 2 rounds of fixes.
      Claim: {{ steps.verify_change.output.claim }}
      Observed: {{ steps.verify_change.output.evidence }}
      Approve: merge it into the local {{ inputs.base_branch }} anyway. Reject: stop the run as failed (the worktree is kept to resume it).
    transitions:
      - when: "approved"
        merge: local
        goto: end
        on_error: resolve_merge
      - when: "rejected"
        goto: end
        status: failed

  # ============================ LOCAL MERGE ==================================

  # The merge itself is automatic (merge: local on verify_change). When it fails, the error is
  # in `action_error` (with `head`: the branch's commit that was last checked, which a failed merge
  # leaves as it was) and the developer resolves it on the run's branch; then only what the
  # resolution changed is reviewed, tested and verified (the build runs) before the next attempt.
  - id: resolve_merge
    agent: developer
    # a rebase replays the test writer's commits: resolving their conflicts is part of the job
    edits_tests: true
    prompt: |
      Merging branch `{{ steps.develop.output.branch }}` into the local `{{ inputs.base_branch }}` failed:
      {{ action_error.message if action_error else 'unknown error' }}

      If it is a conflict with the local {{ inputs.base_branch }} (another run merged into it meanwhile):
      first note the branch's current commit (`git rev-parse HEAD`{% if action_error and action_error.head %}, should be `{{ action_error.head }}`{% endif %}):
      it is the one that was reviewed, tested and verified; answer it as `previous_head`. Then on your
      branch run `git rebase {{ inputs.base_branch }}`, resolve every conflict following the
      merge-conflict-resolver skill (keep the intent of both sides; never drop the other change),
      `git rebase --continue` and make sure everything is committed; answer the new commit as `head`.
      Resolve conflicts in test files too, but write no new tests and do not run the full suite: only
      what the resolution changed is reviewed and tested again. Never fetch, pull or push.
      In `files_changed`, list only the files where you resolved a conflict (not every file of the
      change). Answer `behaviour_changed: true` when the resolution does more than combine both
      sides (e.g. you had to adapt the change's logic to what the base now does): the change is
      then reviewed, tested and verified in full again.
      If it is anything you can't fix on your branch (for example uncommitted changes in the
      checkout where {{ inputs.base_branch }} is checked out: that is the user's work, don't touch it),
      change nothing and answer blocked: true with the reason.
    output_schema:
      type: object
      required: [resolved, blocked, summary]
      properties:
        resolved:          { type: boolean }
        blocked:           { type: boolean }
        summary:           { type: string }
        # the files the resolution touched: what the scoped checks cover
        files_changed:     { type: array, items: { type: string } }
        previous_head:     { type: string }
        head:              { type: string }
        behaviour_changed: { type: boolean }
    transitions:
      - when: "output.blocked"
        goto: merge_blocked
      # `recheck: resolution`: code_review, test and verify_change cover only what the resolution changed
      - when: "output.resolved"
        set: { recheck: "{{ '' if output.behaviour_changed else 'resolution' }}" }
        goto: code_review
        max_visits: 3
        on_exhausted: merge_blocked
      - when: "true"
        goto: merge_blocked

  # Only when the automation can't go on: the developer is blocked, or 3 resolution rounds ran out.
  - id: merge_blocked
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      Branch `{{ steps.develop.output.branch }}` could not be merged into the local `{{ inputs.base_branch }}`:
      {{ action_error.message if action_error else '' }}
      {% if steps.resolve_merge.output %}Developer: {{ steps.resolve_merge.output.summary }}{% endif %}
      Fix what is in the way (e.g. commit or stash the changes where {{ inputs.base_branch }} is checked out), then retry.
    choices:
      - { id: retry, label: "Retry the merge" }
      - { id: stop,  label: "Stop the run as failed (worktree kept to resume)" }
    transitions:
      - when: "choice == 'retry'"
        merge: local
        goto: end
        on_error: resolve_merge
      - when: "choice == 'stop'"
        goto: end
        status: failed

# -----------------------------------------------------------------------------
# What the run hands to the next one when it finishes (#134): `then` at start, or a gate choice's.
outputs:
  branch:
    type: string
    description: The branch the developer worked on.
    value: "{{ steps.develop.output.branch }}"
  merged_commit:
    type: string
    description: The commit the run merged into the local base branch (merge local). Empty when nothing was merged.
    value: "{{ run.local_merge.commit if run.local_merge else '' }}"
  issues:
    type: array
    description: "The issues the run implemented (number, url, title)."
    value: "{{ run.issues | to_json }}"
  pr_url:
    type: string
    description: Always empty here (the work is merged locally, no PR/MR); declared like software-development's.
    value: "{{ '' }}"

observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
