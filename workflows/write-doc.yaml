# =============================================================================
# Workflow: Write doc (#647, docs/work/write-doc/spec.md R5, R6, R10)
# -----------------------------------------------------------------------------
#   scope ──► evidence ──► draft ──► edit (you + the writer) ──► review ──► approval (you)
#                                      ▲                                     │ revise   │ accept a plan
#                                      └─────────────────────────────────────┘          ▼
#                                                                                   file_issues
#
# One run per stage document of a work item (docs/work/<item>/intent.md, spec.md or plan.md, with
# its pt-BR translation next to it). The `document` input picks the stage; the writer loads the
# intent-writing, spec-writing or plan-writing skill accordingly. #633 (spec R9, the AI-native SDLC):
# this is the pre-flow; the plan replaces the developer's brief, the Code & Build run only takes the
# issues filed from it and never writes docs/work/ (the post-flow sdlc-record / sdlc-test /
# sdlc-release records what the runs produced).
# 1. scope:    the writer reads the item and lists the screens of the app worth showing.
# 2. evidence: the project's screenshot command captures them (never blocks: a simulated run or
#              a failed capture is in the step's message).
# 3. draft:    the writer writes the first draft and its translation.
# 4. edit:     a human_edit gate. Each request of the Documents screen (a selection, its text and
#              pasted images) is a writer turn that answers with the replaced lines; the service
#              swaps them in both files and makes one commit per request. Only the person ends it
#              with Send to review.
# 5. review:   the reviewer anchors its notes to the sections (`anchor`), scored on the skill's rubric.
# 6. approval: the person accepts (Accept intent / Sign off spec / Accept plan on the Documents screen) or sends
#              the document back to the edit.
# 7. file_issues (#651, spec R16, a plan only): once the accepted plan is merged, the issue filer
#              files one issue per step of its Order of work (gh / glab, input git_platform); the
#              Build workflows take those issues, the `issues` output hands them to a chain.
# The writer keeps one persistent session across the whole run (the requests build on each other)
# and goes fresh from its handoff note after 55m idle.
# #648 Arena mode ("Several writers", `writers` 2-5; writer-reviewer.yaml and ai-arena.yaml are
# aliases of this workflow): after the evidence, the writer and up to four other writers each draft
# the document on their own (`compete`, a fan-out, at least one must answer); the draft step then
# merges the best of the drafts into one. One writer (the default) skips straight to the draft.
# An old run started by those names gives only a prompt (ai-arena's `task`, `was:`): no project and
# no item, the writer drafts from the prompt in the run folder and the Documents service skips it.
# Outputs (pipelines, chains): `document` (the first draft's text), `issue` (the issue the run
# was started from, when there is one) and `issues` (the issues filed from an accepted plan).
# The run works in its own worktree, detached at the LOCAL <base_branch> (remote: false): the
# Documents service puts it on the branch write-doc/<item>-<document>-<run id> at the first step
# (the new document's skeleton, one commit), writes the draft and each request there, and the
# accept merges the branch into the local base (merge: local, never pushed). A simulated run has no
# worktree: the service writes in the project's folder.
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: write-doc
  version: 0.2.0
  description: A writer drafts the intent, the spec or the plan of a work item, you edit it with the writer by selection, a reviewer anchors notes to its sections and you sign it off.
  tags: [writing, review, documents, sdlc]
  category: plan

# -----------------------------------------------------------------------------
inputs:
  project_path:
    label: "Project folder"
    type: string
    required: false
    default: ""
    description: The project whose docs/work/ holds the item. Empty (an old writer-reviewer or ai-arena run, a saved pipeline), the writer drafts from the prompt in the run folder, without a worktree or a document.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the run starts from and merges into at the accept (the Documents screen passes the project's default branch).
  item:
    label: "Work item"
    type: string
    required_unless: prompt
    default: ""
    description: The item's folder name under docs/work/ (e.g. write-doc). Without one, the prompt says what to write.
  document:
    label: "Document"
    type: string
    enum: [intent, spec, plan]
    default: intent
    options: { "intent": "Intent (the problem and the outcome)", "spec": "Spec (the requirements and the design)", "plan": "Plan (the files, the order of work and the proof)" }
    description: The stage document to write.
  title:
    label: "Title"
    type: string
    required: false
    default: ""
    description: The item's title, for a new document's skeleton (default the item's name).
  prompt:
    label: "Prompt"
    type: string
    required: false
    default: ""
    was: task
    description: Optional notes for the first draft (what the item is about); without an item, what to write.
  writers:
    label: "Writers"
    type: string
    enum: ["1", "2", "3", "4", "5"]
    default: "1"
    options: { "1": "One writer", "2": "Two writers", "3": "Three writers", "4": "Four writers", "5": "Five writers" }
    description: "Several writers (Arena mode): each writer drafts the document on its own, then the writer merges the best of the drafts into the first draft. One writer: a single draft."
  writer_provider:
    label: "Writer CLI"
    options: { "claude": "Claude", "codex": "Codex", "grok": "Grok" }
    type: string
    enum: [claude, codex, grok]
    default: claude
    description: CLI of the writer.
  writer_model:
    label: "Writer model"
    type: string
    default: claude-opus-5-5
  reviewer_provider:
    label: "Reviewer CLI"
    options: { "claude": "Claude", "codex": "Codex", "grok": "Grok" }
    type: string
    enum: [claude, codex, grok]
    default: codex
    description: CLI of the reviewer.
  reviewer_model:
    label: "Reviewer model"
    type: string
    default: gpt-6-luna
  # #651: where an accepted plan's steps are filed as issues
  git_platform:
    type: string
    enum: [gh, gl]
    default: gh
    label: Platform
    options: { gh: GitHub, gl: GitLab }
    description: Where an accepted plan's steps are filed as issues (gh = GitHub, gl = GitLab).

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"
  grok:
    type: grok-cli
    command: grok
    args: ["--output-format", "streaming-json", "-m", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    prompt_file_arg: ["--prompt-file", "{{ prompt_file }}"]

x-tools:
  # the agents only read: the Documents service writes the files and the commits (one per request)
  read_only: &read_only { tools: [read], web: false }
  # #651: the issue filer reads the accepted plan and files its steps (gh / glab, one command per call)
  read_vcs: &read_vcs { tools: [read, bash:gh, bash:glab], web: false }

defaults:
  # #320: a persistent agent idle past its prompt cache's lifetime continues fresh from its handoff note
  fresh_after_idle: 55m
  timeout: 20m
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-opus-5-5
  worktree:
    repo: "{{ inputs.project_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  supervisor:
    enabled: true
    provider: claude
    model: claude-opus-5-5
    max_interventions: 2   # per step; it never answers the edit or the approval
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 20

# -----------------------------------------------------------------------------
agents:
  writer:
    provider: "{{ inputs.writer_provider }}"
    model: "{{ inputs.writer_model }}"
    session: persistent   # every request builds on the previous ones
    fresh_after_idle: 55m
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: |
      You are the writer of the {{ inputs.document }} of the work item `{{ inputs.item }}`
      (docs/work/{{ inputs.item }}/{{ inputs.document }}.md, English, and its translation
      {{ inputs.document }}.pt-BR.md). The current folder is the project, read-only for you: the
      Documents service writes your answers into the files and commits them. Follow your skill's
      sections and rubric. Nobody answers questions during a turn: state an assumption, and give
      every open decision its **Recommended:** line.

  # #648 Arena mode: the other writers of "Several writers", one per extra writer (ephemeral: each
  # drafts once, on its own); the writer above merges the best of their drafts.
  writer_2:
    enabled: "{{ inputs.writers | int >= 2 }}"
    provider: claude
    model: claude-sonnet-5-5
    session: ephemeral
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: &arena_writer |
      You are one of several writers of the {{ inputs.document }} of the work item
      `{{ inputs.item }}`: each writes a draft on its own, the best of them is merged into one.
      Work independently and make distinct, specific choices: state assumptions instead of
      inventing facts. The current folder is the project, read-only for you.

  writer_3:
    enabled: "{{ inputs.writers | int >= 3 }}"
    provider: codex
    model: gpt-6-luna
    session: ephemeral
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: *arena_writer

  writer_4:
    enabled: "{{ inputs.writers | int >= 4 }}"
    provider: grok
    model: grok-4.7
    session: ephemeral
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: *arena_writer

  writer_5:
    enabled: "{{ inputs.writers | int >= 5 }}"
    provider: claude
    model: claude-opus-5-5
    session: ephemeral
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: *arena_writer

  reviewer:
    provider: "{{ inputs.reviewer_provider }}"
    model: "{{ inputs.reviewer_model }}"
    session: persistent   # checks whether its previous notes were addressed
    skills: ["{% if inputs.document == 'spec' %}spec-writing{% elif inputs.document == 'plan' %}plan-writing{% else %}intent-writing{% endif %}"]
    capabilities: *read_only
    working_dir: "{{ worktree_dir }}"
    system_prompt: |
      You review the {{ inputs.document }} of the work item `{{ inputs.item }}` against your
      skill's rubric. Anchor every note to the section it is about; never rewrite the document.

  # #651: an accepted plan's steps become the issues the Code & Build workflows take
  issue_filer:
    provider: claude
    model: claude-sonnet-5
    effort: low
    session: ephemeral
    capabilities: *read_vcs
    skills: ["issue-creator-{{ inputs.git_platform }}"]
    working_dir: "{{ worktree_dir }}"
    system_prompt: |
      You are the issue filer of the accepted plan of the work item `{{ inputs.item }}`. You file
      one issue per step of its Order of work with {% if inputs.git_platform == 'gl' %}glab{% else %}gh{% endif %}, and report the URLs.
      The current folder is the project, read-only for you: you change no file.

groups:
  - name: Draft
    steps: [scope, evidence, compete, draft]
  - name: Edit
    steps: [edit]
  - name: Review
    steps: [review, approval, merge_blocked]
  - name: Issues
    steps: [file_issues]

# -----------------------------------------------------------------------------
steps:

  - id: scope
    agent: writer
    prompt: |
      Read docs/work/{{ inputs.item }}/ (what exists of it) and the app's screens it is about.
      {% if inputs.prompt %}The owner's notes: {{ inputs.prompt }}{% endif %}
      List the screens worth showing in the {{ inputs.document }} as `screenshots` (each with
      `name`, `caption` and `args`, the options of the project's screenshot command), at most 4;
      an empty list when no screen matters. `summary`: one sentence on what the item is about.
    output_schema:
      type: object
      required: [summary, screenshots]
      properties:
        summary: { type: string }
        screenshots:
          type: array
          items:
            type: object
            required: [name, caption, args]
            properties:
              name:    { type: string }
              caption: { type: string }
              args:    { type: array, items: { type: string } }

  - id: evidence
    display: Screenshots
    type: screenshots
    from: scope
    folder: write-doc
    # #648: several writers draft on their own first (Arena mode); one writer drafts at once
    transitions:
      - when: "inputs.writers | int > 1"
        goto: compete
      - when: "true"
        goto: draft

  # #648 Arena mode: each writer drafts the English document on its own (a fan-out)
  - id: compete
    display: Several writers
    agents: [writer, writer_2, writer_3, writer_4, writer_5]
    min_success: 1
    save_as: "write-doc/drafts/{{ agent }}.md"
    prompt: |
      Write your own draft of the {{ inputs.document }} of `{{ inputs.item }}`: {{ steps.scope.output.summary }}
      {% if inputs.prompt %}The owner's notes: {{ inputs.prompt }}{% endif %}
      {% if steps.evidence.output %}Screenshots: {{ steps.evidence.output.message }}{% endif %}
      Follow your skill's sections. Answer ONLY with the Markdown document (English, with its
      front matter: item, stage, status: draft, date), no comments before it.

  - id: draft
    agent: writer
    # #648: the run's document.md, what the backlog's "Save to issue" sends (like writer-reviewer's)
    save_as:
      - { path: document.md, content: "{{ output.source_text }}" }
    prompt: |
      {% if steps.compete.output.succeeded | length %}Several writers drafted the {{ inputs.document }} of `{{ inputs.item }}` on their own:
      {% for name in steps.compete.output.succeeded | shuffle(run_id) %}
      ----- Draft {{ loop.index }} -----
      {{ steps.compete.output.results[name].text }}
      {% endfor %}
      Merge the best of them into the first draft: keep the strongest choice of each section, never
      a safe middle ground, and resolve what they disagree on (an assumption or a **Recommended:** line).
      {% else %}Write the first draft of the {{ inputs.document }} of `{{ inputs.item }}`: {{ steps.scope.output.summary }}
      {% if steps.evidence.output %}Screenshots: {{ steps.evidence.output.message }}{% endif %}{% endif %}
      Answer with `source_text` (the whole English document, with its front matter: item, stage,
      status: draft, date), `translation_text` (the same document in Português (Brasil), the same
      headings order and the same **R1.** / **D1.** labels) and `reply` (one sentence to the owner).
    output_schema:
      type: object
      required: [source_text, translation_text, reply]
      properties:
        source_text:      { type: string }
        translation_text: { type: string }
        reply:            { type: string }

  # Each request of the Documents screen is a writer turn of this gate (requestEdit): the selection
  # payload (file, anchor, lines, passage, context, version) and the person's text. The answer's
  # lines replace the selected section in the source and in its translation, one commit per request.
  - id: edit
    type: human_edit
    agent: writer
    message: |
      Edit the {{ inputs.document }} of `{{ inputs.item }}` with the writer: select a passage, ask
      for a change, undo what you do not want. Send it to review when it reads right.
    output_schema:
      type: object
      required: [source_text, translation_text, reply]
      properties:
        source_text:      { type: string }
        translation_text: { type: string }
        reply:            { type: string }
    choices:
      - { id: send_to_review, label: "Send to review", help: "The reviewer reads the changes you have not reviewed yet and anchors its notes to the sections." }
      - { id: stop, label: "Stop without review", help: "Ends the run; its commits stay on the run's branch write-doc/<item>-<document>-<run>, not merged." }
    transitions:
      - when: "choice == 'send_to_review'"
        goto: review
      - when: "choice == 'stop'"
        goto: end
        status: cancelled

  - id: review
    agent: reviewer
    prompt: |
      Review docs/work/{{ inputs.item }}/{{ inputs.document }}.md as it is now in the project
      (and its translation). Score it from 0 to 10 on your skill's rubric; each note names the
      `anchor` of its section (e.g. {{ inputs.document }}-r2, {{ inputs.document }}-problem) and
      what must change, "major" blocks the sign-off, "minor" does not.
      {% if steps.review.visits > 1 %}Check whether your previous notes were addressed.{% endif %}
    output_schema:
      type: object
      required: [score, summary, notes]
      properties:
        score:   { type: number }
        summary: { type: string }
        notes:
          type: array
          items:
            type: object
            required: [anchor, severity, text]
            properties:
              anchor:   { type: string }
              severity: { type: string, enum: [major, minor] }
              text:     { type: string }

  # The SDLC gate: Accept intent / Sign off spec / Accept plan on the Documents screen change the front
  # matter and commit (the service, docs:accept), then answer accept here.
  - id: approval
    type: human_approval
    message: |
      The reviewer scored the {{ inputs.document }} {{ steps.review.output.score }}/10: {{ steps.review.output.summary }}
      {% if inputs.document == 'spec' %}Sign off the spec{% elif inputs.document == 'plan' %}Accept the plan{% else %}Accept the intent{% endif %}, or send it back to the edit with the notes.
    choices:
      - { id: accept, label: "{% if inputs.document == 'spec' %}Sign off spec{% elif inputs.document == 'plan' %}Accept plan{% else %}Accept intent{% endif %}" }
      - { id: revise, label: "Back to the edit" }
      - { id: stop,   label: "Stop without accepting", help: "Ends the run; its commits stay on the run's branch, not merged." }
    transitions:
      # #651: an accepted plan goes on to file its steps as issues
      - when: "choice == 'accept' and inputs.document == 'plan'"
        merge: local
        goto: file_issues
        on_error: merge_blocked
      - when: "choice == 'accept'"
        merge: local
        goto: end
        on_error: merge_blocked
      - when: "choice == 'revise'"
        goto: edit
      - when: "choice == 'stop'"
        goto: end
        status: cancelled

  - id: merge_blocked
    type: human_approval
    message: |
      The local merge into {{ inputs.base_branch }} failed: {{ action_error.message if action_error else 'unknown error' }}
      Approve: try the merge again (after you resolved it, e.g. committed the changes in your checkout of {{ inputs.base_branch }}). Reject: stop the run as failed (the worktree and the branch are kept).
    transitions:
      - when: "approved and inputs.document == 'plan'"
        merge: local
        goto: file_issues
        on_error: merge_blocked
      - when: "approved"
        merge: local
        goto: end
        on_error: merge_blocked
      - when: "rejected"
        goto: end
        status: failed

  # #651 (spec R16): the pre-flow's last step, the accepted plan's steps as issues; the Build
  # workflows (feature, fix) only take these issues
  - id: file_issues
    agent: issue_filer
    prompt: |
      The plan docs/work/{{ inputs.item }}/plan.md was accepted and merged into {{ inputs.base_branch }}.
      Read its `## Order of work` and file one issue per step, in order, in the project's
      repository: the title "{{ inputs.title or inputs.item }}: <the step's short name>", a body
      with the step's text, the files the plan lists for it, the part of the Proof that shows it
      and a link to the plan (docs/work/{{ inputs.item }}/plan.md); add the plan's issue (its
      front matter's `issue`) as the parent or in a "Part of" line when it has one. Skip a step
      the plan's Progress already marks done or that already names its issue, and list it in your
      `summary`. Create no label.
      Answer with `filed` (each issue created: action, number, url, title) and `summary` (one
      sentence for the owner).
    output_schema:
      type: object
      required: [filed, summary]
      properties:
        filed:
          type: array
          items:
            type: object
            required: [action, number, url, title]
            properties:
              action: { type: string, enum: [created, commented, edited] }
              number: { type: integer }
              url:    { type: string }
              title:  { type: string }
        summary: { type: string }
    transitions:
      - when: "true"
        goto: end

# -----------------------------------------------------------------------------
# #648: what a pipeline or a chain maps from this run (spec-to-issues gives `document` to issue's
# `spec`, enrich-issue gives `document` and `issue` to feature), like writer-reviewer's outputs.
outputs:
  document:
    type: string
    description: The accepted document's path in the project (docs/work/<item>/<document>.md), merged into the base branch; the issue and feature workflows read it.
    value: "docs/work/{{ inputs.item }}/{{ inputs.document }}.md"
  issue:
    type: object
    description: "The issue the document was written for (number, url, title), when started from one."
    value: "{{ (run.issues[0] if run.issues | length else none) | to_json }}"
  # #651: the issues filed from an accepted plan's steps (the feature/fix runs take them); empty otherwise
  issues:
    type: array
    description: "The issues filed from the accepted plan's steps (number, url, title); empty for an intent or a spec."
    value: "{{ ((steps.file_issues.output.filed if steps.file_issues.output else []) or []) | to_json }}"
