# =============================================================================
# Workflow: Software Development (Feature Workflow Agents)
# -----------------------------------------------------------------------------
# BUILD & TEST
#   develop ─► code_review ─► test ─► build ─► verify_change
#     ▲            │            │        │           │
#     └────────────┴────────────┴────────┴───────────┘   (failures go back to the developer via the orchestrator)
#
# DEPLOY · CI/CD
#   ci (CI Pusher: /goal CI green + /loop)
#   ─► pr_babysitter (/goal PR/MR mergeable + /loop)
#   ─► deploy_test (PR/MR preview = test environment)
#   ─► approve_merge (human gate) ─► merge ─► deploy_prod (automatic release)
#
# Rules:
#   - Agents never talk to each other: everything goes through the orchestrator
#     (engine), which delegates fixes to the developer and hands results to the next step.
#   - The AI acts up to a human gate and never crosses it.
#   - /goal and /loop: the engine repeats the step (loop.interval) until `goal.until`
#     is true or `loop.max_duration` runs out (→ goal.on_exhausted).
#
# Language and platform:
#   - `language` picks unit-test-writer-<language> and build-audit-<language>.
#   - `git_platform` picks ci-pipeline-<platform>, pr-babysitter-<platform> and
#     deploy-<platform> (gh = GitHub/gh CLI, gl = GitLab/glab CLI).
#   The YAML keeps the contract (who, when, output schema, transitions); the skills
#   keep the know-how (commands, conventions, how to triage).
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: software-development
  version: 0.7.0
  description: Implements, reviews, tests, builds, watches CI and the PR/MR, publishes a preview and, once approved, merges and tracks the production deploy. Works with several languages on GitHub or GitLab.
  tags: [dev, review, test, build, ci, pr, deploy, github, gitlab]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    type: string
    required: true
    description: Feature or bug to implement.
  repo_path:
    type: string
    required: true
    description: Local repository path or git URL (cloned into <workspace>/repos). Needs a GitHub or GitLab remote.
  language:
    type: string
    enum: [js, python, go, java, csharp]
    default: js
    description: Main language of the repository. Picks the unit-test-writer-<language> and build-audit-<language> skills.
  git_platform:
    type: string
    enum: [gh, gl]
    default: gh
    description: "gh = GitHub (gh CLI), gl = GitLab (glab CLI). Picks the ci-pipeline, pr-babysitter and deploy skills."
  base_branch:
    type: string
    default: main
  preview_workflow:
    type: string
    default: preview.yml
    description: "GitHub only: Actions workflow that publishes the PR preview (pre-release). GitLab uses DEPLOY_TARGET=preview (see deploy-gl)."
  deploy_workflow:
    type: string
    default: deploy.yml
    description: "GitHub only: Actions workflow triggered by the merge into base_branch."

# -----------------------------------------------------------------------------
# Final command line = args + agent.cli_args + (resume_args if the session already
# exists) + skill_args (once per skill) + stdin_arg. The prompt always goes via stdin.
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    # Lets the agent read the skill folder (outside working_dir). Codex in
    # read-only mode can already read any path.
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"

# Allowed shell tools, shared by the agents below (YAML anchors).
x-tools:
  # every supported language toolchain: the language skill says which one to use
  toolchains: &toolchains "Bash(git:*) Bash(npm:*) Bash(npx:*) Bash(node:*) Bash(pnpm:*) Bash(yarn:*) Bash(python:*) Bash(python3:*) Bash(py:*) Bash(pip:*) Bash(pytest:*) Bash(uv:*) Bash(poetry:*) Bash(pip-audit:*) Bash(osv-scanner:*) Bash(go:*) Bash(govulncheck:*) Bash(mvn:*) Bash(./mvnw:*) Bash(mvnw.cmd:*) Bash(gradle:*) Bash(./gradlew:*) Bash(gradlew.bat:*) Bash(dotnet:*)"
  vcs: &vcs "Bash(git:*) Bash(gh:*) Bash(glab:*)"

defaults:
  working_dir: "{{ inputs.repo_path }}"
  timeout: 30m
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

# v1: the graph is run by the app's deterministic engine (src/engine).
orchestrator:
  provider: claude
  model: claude-sonnet-5
  # AI supervisor: called only when a step fails; explains it and picks a recovery the engine
  # validates (fix the output, retry with an instruction, an allowed goto, or ask a human).
  supervisor:
    enabled: true
    max_interventions: 2   # per step
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 60

# -----------------------------------------------------------------------------
# Agents. `permissions` is documentation only; cli_args are what is enforced.
# Skill names can be templates: they are resolved from the inputs at run time.
# -----------------------------------------------------------------------------
agents:
  developer:
    provider: claude
    model: claude-opus-5-5
    session: persistent
    cli_args: ["--permission-mode", "acceptEdits", "--allowedTools", *toolchains]
    # bug-diagnosis: fixes delegated after failures; merge-conflict-resolver: "update the branch with the base"
    skills: ["unit-test-writer-{{ inputs.language }}", bug-diagnosis, merge-conflict-resolver, decision-log]
    permissions:
      allow: [read, edit, write, bash:git, bash:toolchain]
      deny: [bash:"git push --force", bash:gh, bash:glab]
    system_prompt: |
      You are a senior software engineer. Make small, tested, cohesive changes that
      follow the architecture and conventions of the existing code.
      Work on your own branch created from {{ inputs.base_branch }} and commit your
      changes there. Run the project's tests the way the test skill describes.
      Only `git push` when the orchestrator explicitly asks. When you finish a
      requested fix, report the commit hash.

  reviewer:
    provider: codex
    model: gpt-6-luna
    session: persistent
    cli_args: ["-s", "read-only"]
    # Criteria, severities and per-language rules live in the skill
    # (<workspace>/skills/code-review, editable in the Skills screen).
    skills: [code-review]
    permissions:
      allow: [read, bash:git-diff]
      deny: [edit, write]
    system_prompt: |
      You are the code reviewer of this workflow. Follow the code-review skill:
      detect the languages in the diff and read the rules for each one before the verdict.

  test_writer:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    cli_args: ["--permission-mode", "acceptEdits", "--allowedTools", *toolchains]
    skills: ["unit-test-writer-{{ inputs.language }}"]
    permissions:
      allow: [read, write:tests, bash:git, bash:toolchain]
      deny: [edit:production-code]
    system_prompt: |
      You are the test writer. You write and update tests and run the suite, following
      the test skill for this language. You do NOT fix production code: when a test
      fails because of a bug in the code, describe the failure precisely (test, file,
      error, probable cause) so the orchestrator can hand it to the developer.
      Commit test files only.

  builder:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    cli_args: ["--allowedTools", *toolchains]
    skills: ["build-audit-{{ inputs.language }}"]
    permissions:
      allow: [read, bash:toolchain]
      deny: [edit, write]
    system_prompt: |
      You are the builder. You build the application and check its dependencies for
      vulnerabilities, following the build skill for this language. You do not change
      code. Vulnerability policy:
      - blocks: any critical; high in production dependencies
      - report only: moderate/low, and anything in development-only dependencies

  verifier:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    cli_args: ["--allowedTools", *toolchains]
    skills: [claim-verification]
    permissions:
      allow: [read, bash:git, bash:toolchain]
      deny: [edit, write]
    system_prompt: |
      You are the verifier. You prove or disprove that the change does what the task
      asked, by running the same command before and after it. You do not change code.

  ci_pusher:
    provider: claude
    model: claude-opus-4-8
    session: persistent
    cli_args: ["--allowedTools", *vcs]
    skills: ["ci-pipeline-{{ inputs.git_platform }}"]
    permissions:
      allow: [read, bash:git, bash:gh, bash:glab]
      deny: [edit, merge]
    system_prompt: |
      You are the CI Pusher. You push the branch, make sure a PR/MR is open and watch
      CI until it passes. When CI fails, you fetch the failure log and summarize the
      root cause so the orchestrator can hand it to the developer. You do not fix
      code and you do not merge.

  pr_babysitter:
    provider: claude
    model: claude-opus-4-8
    session: persistent
    cli_args: ["--allowedTools", *vcs]
    skills: ["pr-babysitter-{{ inputs.git_platform }}", decision-log]
    permissions:
      allow: [read, bash:git, bash:gh, bash:glab]
      deny: [edit, merge]
    system_prompt: |
      You are the PR Babysitter. With CI green, you watch the PR/MR until it is
      mergeable: conflicts, reviews and comments. Actionable comments become fix
      requests; doubtful ones go to the human (fix, justify or ignore). After a fix
      you reply to the comment citing the commit hash. You do not fix code and you do not merge.

  deployer:
    provider: claude
    model: claude-opus-4-8
    session: persistent
    cli_args: ["--allowedTools", *vcs]
    skills: ["deploy-{{ inputs.git_platform }}"]
    permissions:
      allow: [read, bash:git, bash:gh, bash:glab]
      deny: [edit]
    system_prompt: |
      You are the Deployer. Before the merge, you publish the PR/MR preview. After the
      merge, which a human approves, you track the production deploy triggered by the
      push to {{ inputs.base_branch }}. On failures, you diagnose from the failed job log.

# -----------------------------------------------------------------------------
steps:

  # ============================ BUILD & TEST =================================

  - id: develop
    agent: developer
    prompt: |
      Task: {{ inputs.task }}

      {% if steps.code_review.output and steps.code_review.output.verdict == 'changes_requested' %}
      The reviewer requested these changes (iteration {{ loop.iteration }}):
      {{ steps.code_review.output.findings | to_yaml }}
      Fix the blocking items, make a new commit and answer each one.
      {% endif %}
      {% if steps.deploy_prod.output and steps.deploy_prod.output.deploy_status == 'failed' %}
      The previous production deploy failed: {{ steps.deploy_prod.output.error_summary }}
      Create a new branch from an up-to-date {{ inputs.base_branch }} (`git pull`) and fix it.
      {% endif %}
    output_schema:
      type: object
      required: [branch, summary, files_changed, tests_passed, committed]
      properties:
        branch:        { type: string }
        summary:       { type: string }
        files_changed: { type: array, items: { type: string } }
        tests_passed:  { type: boolean }
        committed:     { type: boolean }
        commit_sha:    { type: string }
        notes:         { type: string }
    transitions:
      - when: "output.tests_passed and output.committed"
        goto: code_review
      - when: "true"
        goto: develop
        max_visits: 3
        on_exhausted: fail

  - id: code_review
    agent: reviewer
    prompt: |
      Review the changes on branch `{{ steps.develop.output.branch }}` against
      `{{ inputs.base_branch }}` (`git diff {{ inputs.base_branch }}...{{ steps.develop.output.branch }}`).
      Task (the spec for the spec axis): {{ inputs.task }}
      Developer summary: {{ steps.develop.output.summary }}
    output_schema:
      type: object
      required: [verdict, findings]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, description]
            properties:
              axis:        { type: string, enum: [correctness, spec, standards] }
              severity:    { type: string, enum: [blocker, major, minor, nit] }
              file:        { type: string }
              line:        { type: integer }
              description: { type: string }
    transitions:
      - when: "output.verdict == 'approved'"
        goto: test
      - when: "output.verdict == 'changes_requested'"
        goto: develop
        loop:
          name: review_cycle
          max_iterations: 3
          on_exhausted: human_review

  - id: human_review
    type: human_approval
    message: "The review loop did not converge in 3 iterations. Move on to testing anyway?"
    transitions:
      - when: "approved"
        goto: test
      - when: "rejected"
        goto: end

  # Test writer: writes/updates tests and runs the suite. On failure the
  # orchestrator hands it to the developer and tells the test writer when it is fixed.
  - id: test
    agent: test_writer
    prompt: |
      Branch `{{ steps.develop.output.branch }}` (already reviewed).
      Original task: {{ inputs.task }}
      Change made: {{ steps.develop.output.summary }}
      Files: {{ steps.develop.output.files_changed | join(', ') }}

      {% if delegate_result %}
      The developer applied the fix you asked for:
      {{ delegate_result.text }}
      Run the full suite again and confirm.
      {% else %}
      1. Check out the branch. Decide whether the change needs new or updated tests.
         If so, write them following the test skill (the framework and folder the
         project already uses) and commit only them. Purely visual changes may not
         need a new test — justify it.
      2. Run the full suite with the project's test command.
      {% endif %}
      If a test fails because of production code, do NOT fix it:
      fill failure_report with test, file, error and probable cause.
    output_schema:
      type: object
      required: [tests_status, tests_added, committed]
      properties:
        tests_status:   { type: string, enum: [pass, fail] }
        tests_added:    { type: array, items: { type: string } }
        committed:      { type: boolean }
        failure_report: { type: string }
        summary:        { type: string }
    transitions:
      - when: "output.tests_status == 'pass'"
        goto: build
      - when: "output.tests_status == 'fail'"
        delegate:
          agent: developer
          prompt: |
            The test writer found failures on branch `{{ steps.develop.output.branch }}`:
            {{ output.failure_report }}
            Fix the production code (do not change the tests without justifying it), run
            the test suite, commit and report the commit hash.
        goto: test
        max_visits: 3
        on_exhausted: test_failed

  - id: test_failed
    type: human_approval
    message: |
      Tests are still failing after 3 rounds of fixes:
      {{ steps.test.output.failure_report }}
      Continue anyway?
    transitions:
      - when: "approved"
        goto: build
      - when: "rejected"
        goto: end

  # Builder: application build + dependency vulnerabilities.
  - id: build
    agent: builder
    prompt: |
      On branch `{{ steps.develop.output.branch }}`:
      {% if delegate_result %}
      The developer applied a fix: {{ delegate_result.text }}
      {% endif %}
      1. Build the project following the build skill.
      2. Audit the dependencies following the build skill, separating production from development.
      Apply your role's vulnerability policy. In `vulnerabilities`, report the PRODUCTION
      counts; summarize the development ones in `dev_vulnerabilities`.
    output_schema:
      type: object
      required: [build_status, vulnerabilities, report]
      properties:
        build_status: { type: string, enum: [success, failed] }
        vulnerabilities:
          type: object
          required: [critical, high, moderate, low]
          properties:
            critical: { type: integer }
            high:     { type: integer }
            moderate: { type: integer }
            low:      { type: integer }
        dev_vulnerabilities: { type: string }
        report:              { type: string }
    transitions:
      - when: "output.build_status == 'success' and output.vulnerabilities.critical == 0 and output.vulnerabilities.high == 0"
        goto: verify_change
      - when: "true"
        delegate:
          agent: developer
          prompt: |
            The builder blocked branch `{{ steps.develop.output.branch }}`:
            {{ output.report }}
            Fix it (build failure or vulnerable dependency), run the test suite,
            commit and report the commit hash.
        goto: build
        max_visits: 3
        on_exhausted: build_failed

  - id: build_failed
    type: human_approval
    message: |
      The build is still blocked after 3 rounds of fixes:
      {{ steps.build.output.report }}
      Continue anyway?
    transitions:
      - when: "approved"
        goto: verify_change
      - when: "rejected"
        goto: end

  # Verifier: does the change do what the task asked? Same command on the base and on
  # the branch. inconclusive (nothing observable, e.g. a refactor) does not block.
  - id: verify_change
    agent: verifier
    prompt: |
      Task: {{ inputs.task }}
      Change: {{ steps.develop.output.summary }}
      Branch `{{ steps.develop.output.branch }}`, base `{{ inputs.base_branch }}`.
      {% if delegate_result %}
      The developer changed the code after your last verdict:
      {{ delegate_result.text }}
      Run the treatment side again (the baseline did not change).
      {% endif %}
      Verify the change following the claim-verification skill. Do not leave any
      worktree, scratch file or stash behind.
    output_schema:
      type: object
      required: [verdict, claim, evidence]
      properties:
        verdict:  { type: string, enum: [verified, not_verified, inconclusive] }
        claim:    { type: string }
        command:  { type: string }
        evidence: { type: string }
    transitions:
      - when: "output.verdict != 'not_verified'"
        goto: ci
      - when: "output.verdict == 'not_verified'"
        delegate:
          agent: developer
          prompt: |
            The verifier could not confirm the change on branch `{{ steps.develop.output.branch }}`.
            Claim: {{ output.claim }}
            Command: {{ output.command }}
            Observed: {{ output.evidence }}
            Fix it, run the test suite, commit and report the commit hash.
        goto: verify_change
        max_visits: 2
        on_exhausted: verify_failed

  - id: verify_failed
    type: human_approval
    message: |
      The change still does not do what the task asked after 2 rounds of fixes.
      Claim: {{ steps.verify_change.output.claim }}
      Observed: {{ steps.verify_change.output.evidence }}
      Continue to CI anyway?
    transitions:
      - when: "approved"
        goto: ci
      - when: "rejected"
        goto: end

  # ============================ DEPLOY · CI/CD ===============================

  # CI Pusher: /goal CI green + /loop watching CI.
  - id: ci
    agent: ci_pusher
    goal:
      description: "CI green on the PR/MR for branch {{ steps.develop.output.branch }}"
      until: "output.ci_status == 'success'"
      on_exhausted: ci_failed
    loop:
      interval: 1m
      max_duration: 1h
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}
      The developer fixed the previous CI failure and already pushed:
      {{ delegate_result.text }}
      {% endif %}
      Following the CI skill for this platform:
      1. Make sure the branch is up to date on the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; otherwise create
         one with a short title and this summary: {{ steps.develop.output.summary }}).
      3. Check its CI:
         - anything running or not started yet → ci_status: pending
         - something failed → ci_status: failed, with failure_log = job, step, error and
           probable root cause (file/line). For infrastructure/flaky failures, follow the
           skill (retry once) and answer pending.
         - everything passed → ci_status: success
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    output_schema:
      type: object
      required: [pr_url, pr_number, ci_status]
      properties:
        pr_url:      { type: string }
        pr_number:   { type: integer }
        ci_status:   { type: string, enum: [pending, failed, success] }
        failure_log: { type: string }
    transitions:
      - when: "output.ci_status == 'success'"
        goto: pr_babysitter
      - when: "output.ci_status == 'pending'"
        goto: ci
      - when: "output.ci_status == 'failed'"
        delegate:
          agent: developer
          prompt: |
            CI on PR/MR #{{ output.pr_number }} failed:
            {{ output.failure_log }}
            Fix it on branch `{{ steps.develop.output.branch }}`, run the test suite,
            commit, then `git push`, and report the commit hash.
        goto: ci
        max_visits: 5
        on_exhausted: ci_failed

  - id: ci_failed
    type: human_approval
    message: |
      CI on {{ steps.ci.output.pr_url }} did not pass within the limit.
      Last error: {{ steps.ci.output.failure_log }}
      Try another CI Pusher round?
    transitions:
      - when: "approved"
        goto: ci
      - when: "rejected"
        goto: end

  # PR Babysitter: /goal PR/MR mergeable + /loop on the PR/MR.
  - id: pr_babysitter
    agent: pr_babysitter
    goal:
      description: "PR/MR #{{ steps.ci.output.pr_number }} mergeable: CI green, no conflicts and no pending comments"
      until: "output.state == 'ready_to_merge'"
      on_exhausted: fail
    loop:
      interval: 1m
      max_duration: 12h
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }} ({{ steps.ci.output.pr_url }}).
      {% if delegate_result %}
      Since the last check, the orchestrator called the `{{ delegate_result.agent }}` agent:
      {{ delegate_result.text }}
      If a fix was committed, reply on the PR/MR to each handled comment citing the
      commit hash (see the skill).
      {% endif %}
      Check the PR/MR following the skill for this platform and answer with one state:
      - checks/pipeline failing → ci_failed
      - conflict with (or behind) the base → needs_fix (fix_request: update the branch with the base and resolve)
      - actionable comment/review not handled yet → needs_fix (fix_request with the request and the comment id)
      - doubtful comment (debatable, out of scope, contradictory) → needs_human (question: the comment and your doubt)
      - waiting on something external (checks running, required review/approval pending) → waiting
      - all good and mergeable → ready_to_merge
      - already merged → merged; closed without merge → closed
    output_schema:
      type: object
      required: [state, summary]
      properties:
        state:
          type: string
          enum: [waiting, needs_fix, needs_human, ci_failed, ready_to_merge, merged, closed]
        fix_request: { type: string }
        question:    { type: string }
        summary:     { type: string }
    transitions:
      - when: "output.state == 'waiting'"
        goto: pr_babysitter
      - when: "output.state == 'needs_fix'"
        delegate:
          agent: developer
          prompt: |
            Fix request on PR/MR #{{ steps.ci.output.pr_number }}:
            {{ output.fix_request }}
            Fix it on branch `{{ steps.develop.output.branch }}`, run the test suite,
            commit, then `git push`, and report the commit hash.
        goto: pr_babysitter
        max_visits: 5
        on_exhausted: fail
      - when: "output.state == 'needs_human'"
        goto: comment_decision
      - when: "output.state == 'ci_failed'"
        goto: ci
      - when: "output.state == 'ready_to_merge'"
        goto: deploy_test
      - when: "output.state == 'merged'"
        goto: deploy_prod
      - when: "output.state == 'closed'"
        goto: end

  # Human gate for doubtful comments
  - id: comment_decision
    type: human_approval
    message: |
      Doubtful comment on {{ steps.ci.output.pr_url }}:
      {{ steps.pr_babysitter.output.question }}
    choices:
      - { id: fix,     label: "Fix it (developer applies)" }
      - { id: justify, label: "Justify on the PR/MR without changing code" }
      - { id: ignore,  label: "Ignore" }
    transitions:
      - when: "choice == 'fix'"
        delegate:
          agent: developer
          prompt: |
            The human decided to address this comment on PR/MR #{{ steps.ci.output.pr_number }}:
            {{ steps.pr_babysitter.output.question }}
            Fix it on branch `{{ steps.develop.output.branch }}`, run the test suite,
            commit, then `git push`, and report the commit hash.
        goto: pr_babysitter
      - when: "choice == 'justify'"
        delegate:
          agent: pr_babysitter
          prompt: |
            The human decided NOT to change the code for this comment:
            {{ steps.pr_babysitter.output.question }}
            Reply to the comment on the PR/MR with a short, polite technical justification.
        goto: pr_babysitter
      - when: "choice == 'ignore'"
        delegate:
          agent: pr_babysitter
          prompt: |
            The human decided to ignore this comment:
            {{ steps.pr_babysitter.output.question }}
            Do not reply on the PR/MR and no longer treat it as pending.
        goto: pr_babysitter

  # Deployer (before the merge): preview of the PR/MR.
  - id: deploy_test
    agent: deployer
    goal:
      description: "Preview of PR/MR #{{ steps.ci.output.pr_number }} published"
      until: "output.preview_status == 'success'"
      on_exhausted: preview_failed
    loop:
      interval: 1m
      max_duration: 45m
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }}, branch `{{ steps.develop.output.branch }}`.
      {% if not steps.deploy_test.output or steps.deploy_test.output.preview_status == 'failed' %}
      Trigger the preview publication following the "Preview" section of the deploy skill
      (GitHub preview workflow: `{{ inputs.preview_workflow }}`).
      {% else %}
      The preview was already triggered ({{ steps.deploy_test.output.run_url }}); only check it.
      {% endif %}
      - not started yet, queued or running → pending
      - finished successfully → success, with release_url (preview URL)
      - failed → failed, with error_summary
    output_schema:
      type: object
      required: [preview_status]
      properties:
        preview_status: { type: string, enum: [pending, success, failed] }
        run_url:        { type: string }
        release_url:    { type: string }
        error_summary:  { type: string }
    transitions:
      - when: "output.preview_status == 'success'"
        goto: approve_merge
      - when: "output.preview_status == 'pending'"
        goto: deploy_test
      - when: "output.preview_status == 'failed'"
        goto: preview_failed

  - id: preview_failed
    type: human_approval
    message: |
      The preview of {{ steps.ci.output.pr_url }} failed:
      {{ steps.deploy_test.output.error_summary }}
      Try publishing again?
    transitions:
      - when: "approved"
        goto: deploy_test
      - when: "rejected"
        goto: end

  # Human gate: test the preview and approve the merge (= production)
  - id: approve_merge
    type: human_approval
    message: |
      Preview published: {{ steps.deploy_test.output.release_url }}
      {{ steps.ci.output.pr_url }}: CI green and mergeable.
      Approve the merge into {{ inputs.base_branch }}? This produces the production release.
    transitions:
      - when: "approved"
        action: "{% if inputs.git_platform == 'gl' %}glab mr merge {{ steps.ci.output.pr_number }} --squash --remove-source-branch --yes{% else %}gh pr merge {{ steps.ci.output.pr_number }} --squash --delete-branch{% endif %}"
        goto: deploy_prod
      - when: "rejected"
        goto: end

  # Deployer (after the merge): tracks the automatic production deploy.
  - id: deploy_prod
    agent: deployer
    goal:
      description: "Production deploy of PR/MR #{{ steps.ci.output.pr_number }} finished"
      until: "output.deploy_status == 'success'"
      on_exhausted: deploy_failed
    loop:
      interval: 1m
      max_duration: 1h
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }} was merged into {{ inputs.base_branch }}.
      Track the production deploy of the merge commit following the "Production" section
      of the deploy skill (GitHub deploy workflow: `{{ inputs.deploy_workflow }}`).
      - not started yet, queued or running → pending
      - success → success, with release_url; then clean up the preview as the skill says
      - failed → failed, with error_summary
    output_schema:
      type: object
      required: [deploy_status]
      properties:
        deploy_status: { type: string, enum: [pending, success, failed] }
        run_url:       { type: string }
        release_url:   { type: string }
        error_summary: { type: string }
    transitions:
      - when: "output.deploy_status == 'success'"
        goto: end
      - when: "output.deploy_status == 'pending'"
        goto: deploy_prod
      - when: "output.deploy_status == 'failed'"
        goto: deploy_failed

  - id: deploy_failed
    type: human_approval
    message: |
      The production deploy failed: {{ steps.deploy_prod.output.error_summary }}
      Run: {{ steps.deploy_prod.output.run_url }}
      Ask the developer for a fix (new cycle)?
    transitions:
      - when: "approved"
        goto: develop
      - when: "rejected"
        goto: end

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
