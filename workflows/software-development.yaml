# =============================================================================
# Workflow: Software Development (Feature Workflow Agents)
# -----------------------------------------------------------------------------
# BUILD & TEST
#   develop ─► code_review ─► test ─► suite ─► build ─► evidence ─► verify_change
#     ▲            │            │        │        │                        │
#     └────────────┴────────────┴────────┴────────┴────────────────────────┘   (failures go back to the developer via the orchestrator)
#   suite (no agent, #177): the orchestrator runs the project's whole test suite once per round
#   (`test_command`, else found from the project's files), log in logs/suite-<round>.log; failing
#   tests go back to the test writer with the failures and the log (2 rounds, then test_failed).
#   Tests that also fail on the base (the test writer's preexisting_failures) never count.
#
# TESTS (inputs `unit_tests` and `e2e_tests`, #203; the workflow's default, changeable per run)
#   unit_tests: write_and_run (default) = test (the test writer writes and runs focused tests) ─►
#     suite; run_existing = no unit tests written, suite only (failures go to the developer);
#     off = no suite at all. e2e_tests: write (default) = the test writer writes the issue's
#     scenarios and checks that they parse; write_and_run = it also runs them; off = none.
#   Both off: code_review ─► build (no test step). Only run_existing: code_review ─► suite.
#   Nothing is reported as tested when it was off: the gates and the verifier get `tests_plan`
#   ("Unit tests: Off (workflow default)"), and the run summary records it.
#   evidence: screenshots / HTTP request+response / CLI output / log lines that show the change
#   working (local, simulated); it never blocks, the verifier uses it, the CI pusher posts the screenshots.
#   UI changes (#111): it also captures the states the developer's evidence_plan lists and reviews
#   the screenshots (ui-conventions skill); blocking `ui_findings` go back to develop once.
#   Declared gaps (`left_out`: requirements of the task the developer did not implement): never
#   reviewed. The first time, develop ─► develop with the list (no reviewer call); still there
#   after that ─► requirements_left_out (human gate: continue without them / stop). An entry led
#   by "Tests" or "Measure" (the test writer's and the owner's tasks, #173) triggers neither.
#
# MODES (input `mode`)
#   auto (default): develop ─► code_review, as above.
#   validated: develop ─► developer_check (human gate) ─► code_review. The owner tries the worktree
#   (Run locally when a local_preview is set, see below), then approves, asks for changes (back to
#   develop with the text, then back to the gate) or stops. Only the first implementation and the
#   owner's own change requests stop there; review fix rounds too with validate_every_round: true.
#   Before the gate, developer_screenshots (no agent, #144) captures the UI states develop listed in
#   `screenshots`, original and modified, into evidence/developer/round-<n>/; the gate shows them.
#
# RUN LOCALLY (gates with `local_preview: true`: developer_check, human_review, approve_merge)
#   Offered when the project (Projects › Local preview) or `orchestrator.local_preview`
#   ({ install, command, url }) says how to run the worktree. It never answers the gate.
#
# DEPLOY · CI/CD
#   ci (CI Pusher: /goal CI green + /loop)
#   ─► pr_babysitter (/goal PR/MR mergeable + /loop)
#   ─► deploy_test (PR/MR preview = test environment)
#   ─► approve_merge (human gate) ─► merge ─► deploy_prod (automatic release)
#   A preview that fails because of the code goes back to the developer and then
#   through ci ─► pr_babysitter ─► deploy_test again (new commit, new CI, new preview).
#
# MERGE CONFLICT (another change merged into the base after the PR/MR was checked)
#   The engine checks the PR/MR itself (pr_mergeable, no model call) right before approve_merge
#   opens, again whenever another run merges into the same repository while it is open, and again
#   right before the merge; merges of concurrent runs go one at a time. Not mergeable → the run
#   supervisor decides first: a conflict goes to
#   resolve_conflict (developer merges origin/<base>, resolves, pushes) ─► code_review (of the
#   resolution only) ─► test (full suite) ─► ci ─► pr_babysitter ─► deploy_test ─► approve_merge
#   (the owner approves again: the code changed). 2 rounds; anything else → merge_failed gate.
#
# Failure gates (human): they only offer what can change the outcome. Retrying
# something that cannot change (the same commit, the same failed run) is not offered as
# the way out of a code failure; stopping ends the run as `failed` (its branch keeps the work, so
# it can be resumed), rejecting the merge or the review loop ends it as `cancelled`.
#
# Rules:
#   - Agents never talk to each other: everything goes through the orchestrator
#     (engine), which delegates fixes to the developer and hands results to the next step.
#   - The AI acts up to a human gate and never crosses it.
#   - /goal and /loop: the engine repeats the step (loop.interval) until `goal.until`
#     is true or `loop.max_duration` runs out (→ goal.on_exhausted). It also stops after
#     `loop.max_blocked` (default 3) blocked iterations in a row: the agent checked nothing
#     (every tool call refused by its allowlist, or none made), or it had calls refused and
#     gave the same answer again.
#   - `wait:` on a /loop step: between the agent's turns the engine checks the PR/MR or the CI
#     run itself with gh/glab (no model call) and calls the agent only on news: a failure, a
#     conflict, a change on the PR/MR, an unknown state. CI all green finishes `ci` directly.
#   - Tests belong to the test writer: it writes and updates them and runs the focused tests of the
#     change; the orchestrator runs the full suite once per round (step suite, #177; a full-suite
#     command the test writer starts is noted as a warn, `full_suite: warn`). The developer changes production code only and says what to test (`test_notes`);
#     `edits_tests: false` makes the engine refuse any of its turns that changes a test file
#     (`tests_paths`, default: the usual test folders and file names of every language). The
#     builder and the verifier do not run the full suite; CI runs it on every platform.
#   - End-to-end BDD scenarios (#143): the test writer also derives Given/When/Then scenarios from
#     the task and the issue's acceptance criteria, writes the feature files and step definitions
#     (under `tests_paths`), checks that they parse and reports each one (`scenarios`: pending,
#     or skipped with the reason). They never run here (#199): the E2E release workflow
#     (e2e-release.yaml) runs the whole suite at release time. The engine saves them in
#     <run_dir>/e2e/scenarios.feature; developer_check and approve_merge show them to the Dev/QA
#     as "written, run at release".
#   - Dependencies (#198): the engine links the worktree's node_modules from the shared cache
#     (installed once per lockfile) and prepares the test step's base checkout (base_worktree).
#
# Language and platform:
#   - `language` picks unit-test-writer-<language> and e2e-test-writer-<language> (test writer)
#     and build-audit-<language> (builder).
#     Several languages ("js,rust", #340): the skills of each language whose files the run changed.
#   - `git_platform` picks ci-pipeline-<platform>, pr-babysitter-<platform> and
#     deploy-<platform> (gh = GitHub/gh CLI, gl = GitLab/glab CLI).
#   The YAML keeps the contract (who, when, output schema, transitions); the skills
#   keep the know-how (commands, conventions, how to triage).
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: software-development
  version: 0.22.0
  description: Implements, reviews, tests, builds, watches CI and the PR/MR, publishes a preview and, once approved, merges and tracks the production deploy. Works with several languages on GitHub or GitLab.
  tags: [dev, review, test, build, ci, pr, deploy, github, gitlab]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    label: "Task"
    type: string
    required: true
    description: Feature or bug to implement.
  issue:
    label: "Issue"
    type: string
    default: ""
    description: "URL of the issue this run implements (set by the Backlog screen). The PR/MR closes it."
  issues:
    label: "Issues"
    type: array
    default: []
    description: "URLs of the issues this run implements together, one branch and one PR/MR (set by the Backlog screen; one per line). The PR/MR closes each one."
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path or git URL (cloned into <workspace>/repos). Needs a GitHub or GitLab remote.
  # Picks the unit-test-writer-<language>, e2e-test-writer-<language> and build-audit-<language> skills. The app prefills it
  # from the project's files (package.json, pyproject.toml, go.mod, pom.xml, *.csproj, Cargo.toml; every one found, main first).
  language:
    label: "Language"
    type: string
    enum: [js, python, go, java, csharp, rust]
    default: js
    multiple: true
    options: { js: JavaScript, python: Python, go: Go, java: Java, csharp: "C#", rust: Rust }
    description: The project's languages, main one first, for its tests and build checks. A repository that mixes several (e.g. JavaScript and Rust) takes them all; a run loads the skills of the languages whose files it changed.
  # gh = GitHub (gh CLI), gl = GitLab (glab CLI): picks the ci-pipeline, pr-babysitter and deploy skills.
  git_platform:
    type: string
    enum: [gh, gl]
    default: gh
    label: Platform
    options: { gh: GitHub, gl: GitLab }
    description: Where the pull request (GitHub) or merge request (GitLab) is opened.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The branch the work starts from and is merged into.
  # GitHub only: Actions workflow that publishes the PR preview (pre-release). GitLab uses
  # DEPLOY_TARGET=preview (see deploy-gl).
  preview_workflow:
    type: string
    default: preview.yml
    label: Preview workflow
    description: "GitHub only: the Actions workflow that publishes a preview of the pull request."
  deploy_workflow:
    type: string
    default: deploy.yml
    label: Deploy workflow
    description: "GitHub only: the Actions workflow that runs after the merge."
  # validated: the run stops at developer_check after the developer.
  mode:
    label: "Mode"
    type: string
    enum: [auto, validated]
    default: auto
    options: { auto: Automatic, validated: Validated }
    description: "Automatic: the change goes straight from the developer to review and tests. Validated: the run stops after the developer so you can try the change before review and tests are paid for."
  # A boolean; saved inputs "true"/"false" (before #116) are accepted by the engine.
  validate_every_round:
    label: "Validate every round"
    type: boolean
    default: false
    show_if: "mode == 'validated'"
    description: "Also stop for you after each round of review fixes, not only after the first change and your own change requests."
  # #203: the test step is the largest cost of a run (about half of it): turn its parts on or off.
  unit_tests:
    type: string
    enum: [write_and_run, run_existing, "off"]
    default: write_and_run
    label: Unit tests
    options: { write_and_run: Write and run, run_existing: Run existing, "off": "Off" }
    description: "Write and run: the test writer writes the change's tests, then the orchestrator runs the whole suite (about half of a run's cost). Run existing: no new tests, the suite runs once without an agent and failures go to the developer (cheap, the change stays untested). Off: no suite at all (cheapest; test later with the test-batch workflow)."
  e2e_tests:
    type: string
    enum: ["off", write, write_and_run]
    default: write
    label: E2E tests
    options: { "off": "Off", write: Write, write_and_run: Write and run }
    description: "Write: the test writer writes the issue's end-to-end scenarios and checks that they parse; the E2E release workflow runs them. Write and run: it also runs them here (slow: starts the app, about 25 more minutes). Off: none."
  # #205: the evidence screenshots (the Product Owner's Cost step sets it on a roadmap item:
  # Economy off, Balanced changed, Generous all)
  screenshots:
    type: string
    enum: ["off", changed, all]
    default: all
    label: Screenshots
    options: { "off": "Off", changed: Changed screens, all: All }
    description: "All: the developer's UI states before your check and the evidence's captures. Changed: only the screens the issue changes, original and modified. Off: no screenshot step and no npm run screenshot by any agent; the evidence is the diff, the logs and the test results (cheapest: the evidence step costs about $0.3-1.5 and 5-10 min of a run)."
  test_command:
    type: string
    default: ""
    label: Test command
    description: "The project's whole-suite command the orchestrator runs once per test round (e.g. npm test). Empty: found from the project's files (package.json, go.mod, pom.xml, build.gradle, *.csproj, pyproject.toml)."

# -----------------------------------------------------------------------------
# Final command line = args + capability and isolation flags + agent.cli_args + (resume_args if
# the session already exists) + skill_args (once per skill) + stdin_arg. The prompt always goes via stdin.
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    # #286: an agent's `effort` reaches the CLI only through effort_args
    effort_args: ["--effort", "{{ effort }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    # Lets the agent read the skill folder (outside working_dir). Codex in
    # read-only mode can already read any path.
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    effort_args: ["-c", "model_reasoning_effort={{ effort }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"

# Allowed commands, shared by the agents below (YAML anchors, used in capabilities.tools).
x-tools:
  # every supported language toolchain: the language skill says which one to use
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:uv, bash:poetry, bash:pip-audit, bash:osv-scanner, bash:go, bash:govulncheck, bash:mvn, bash:./mvnw, bash:mvnw.cmd, bash:gradle, bash:./gradlew, bash:gradlew.bat, bash:dotnet, bash:cargo]
  # gh / glab: called bare, in the Bash tool, one command per call. That is the only form this
  # allowlist accepts: no PowerShell, no full or 8.3 paths, no PATH edits, no ;/&&/pipes, no body
  # files (use --body). The engine refreshes PATH, so bare gh works inside runs.
  vcs: &vcs [bash:git, bash:gh, bash:glab]

defaults:
  # #320: a persistent agent idle past its prompt cache's lifetime (Claude on a subscription: 1 h,
  # minus a margin) continues in a fresh session from its handoff note; an agent's own value wins
  fresh_after_idle: 55m
  # the run's own git worktree (orchestrator.worktree), or repo_path when it is not a git repo
  working_dir: "{{ worktree_dir }}"
  # one agent turn: 30m, plus 10m per extra issue of a grouped run, at most 60m (#101)
  timeout: "{{ (30 + 10 * ((inputs.issues | length) - 1)) | clamp(30, 60) }}m"
  # persistent agents: once a turn ends above this context size, the next turn starts a fresh
  # session from the agent's handoff note (runs/<id>/handoffs/)
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

# v1: the graph is run by the app's deterministic engine (src/engine).
orchestrator:
  provider: claude
  model: claude-sonnet-5
  # One git worktree per run: <workspace>/worktrees/<run_id>, detached at the freshly fetched
  # origin/<base>. Runs never share a checkout; removed when the run succeeds, kept otherwise
  # so "resume from step" continues there.
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
  # AI supervisor: called when a step fails; explains it and picks a recovery the engine
  # validates (fix the output, retry with an instruction, an allowed goto, or ask a human).
  # On call: gates with kind: escalation and stalls (the same answer 3 visits in a row, refused
  # tool calls, a slow step) call it before you are asked; decision gates never do.
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2   # per step
    max_cost_usd: 5        # what the supervisor may spend in one run
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 60

# -----------------------------------------------------------------------------
# Agents. `capabilities` is what each agent may use; the engine turns it into each CLI's flags
# and runs every agent isolated from the user's own CLI setup (MCP servers, plugins, memory).
# Sessions: `handoff` (a fresh session per turn, started from the agent's handoff note) for the
# agents that come back for fixes and checks; `persistent` (with defaults.max_context) elsewhere.
# Skill names can be templates: they are resolved from the inputs at run time.
# -----------------------------------------------------------------------------
agents:
  developer:
    color: "#4C7DFF" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-opus-5-5
    session: handoff
    # subagents: exploration sub-agents map the code, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # tests belong to the test writer: a turn that changes a test file (tests_paths) is sent back
    edits_tests: false
    # bug-diagnosis: fixes delegated after failures; merge-conflict-resolver: "update the branch with the base";
    # long-commands: installs, builds and focused checks in the foreground
    # ui-conventions: changes that touch a screen (shared components, controls, the states to capture)
    skills: [long-commands, bug-diagnosis, merge-conflict-resolver, context-economy, decision-log, ui-conventions]
    system_prompt: |
      You are a senior software engineer. Make small, cohesive changes to the production code
      that follow the architecture and conventions of the existing code.
      Merge-friendly (parallel runs): add new code next to related code, not before a shared
      section comment; write shared name lists (module.exports, destructured requires) one item
      per line, sorted; document a file in its header comment or a topic doc, not in an index.
      Tests belong to the test writer, who runs after the code review: never create, edit or
      delete test files (the orchestrator refuses a turn that changes one) and do not run the
      full test suite. To check your change, run a focused existing test or the build: the tests
      of the files you change come from the project's code → tests map when it has one
      (docs/agents/test-map.md: search it, don't read it whole), and a test run in agent mode
      prints one failures-only JSON line (read it, not the log). Describe
      what should be tested (behaviours, edge cases, files) in `test_notes` when asked.
      Keep your context small (context-economy): on a task that touches more than about three
      files, start one exploration sub-agent before your first edit and have it report the
      files, functions and line numbers to change; then read only the files you will edit, and
      group several changes to a file in one edit. On a fix turn, read only what the findings name.
      Sub-agents are the default for code research: a search across files you will not edit,
      a long output (a failing check, a log, a long diff) or a finding in code you have not
      mapped goes to a sub-agent that returns a summary; edits and the checks that decide your
      step stay in your own turn.
      Work on your own branch and commit your changes there. This run has its own git
      worktree (the current folder), which starts detached at origin/{{ inputs.base_branch }};
      the local {{ inputs.base_branch }} of the repository may be stale, so always start a new
      branch from the remote base: `git fetch origin`, then
      `git switch --no-track -c <branch> origin/{{ inputs.base_branch }}` (never from the local
      {{ inputs.base_branch }}). The engine gives the worktree its dependencies (linked from a shared cache, installed
      once per lockfile): never run `npm ci` and never delete `node_modules`. Adding a package
      with the package manager is fine: the engine installs the new lockfile after your turn.
      Only `git push` when the orchestrator explicitly asks. When you finish a
      requested fix, report the commit hash.

  reviewer:
    color: "#A06BFF" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5-5
    effort: high
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    # Criteria, severities and per-language rules live in the skill
    # (<workspace>/skills/code-review, editable in the Skills screen).
    skills: [code-review]
    system_prompt: |
      You are the code reviewer of this workflow. Follow the code-review skill:
      detect the languages in the diff and read the rules for each one before the verdict.

  test_writer:
    color: "#FF8A3D" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5
    session: persistent
    # #176: its re-read context is the largest controllable cost; past this, the next turn starts a
    # fresh session from its handoff note (never mid-turn)
    max_context: 120k
    # edits test files only (a convention of its role: the tools can't tell tests from code)
    # subagents: exploration sub-agents map the behaviours and tests, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # only the parts the run's unit_tests / e2e_tests turn on (#203)
    skills:
      - "{% if inputs.unit_tests == 'write_and_run' %}unit-test-writer-{{ inputs.language }}{% endif %}"
      - "{% if inputs.e2e_tests != 'off' %}e2e-test-writer-{{ inputs.language }}{% endif %}"
      - context-economy
    system_prompt: |
      You are the test writer, the only agent of this workflow that writes tests. You write
      and update them (including tests an intended behaviour change makes obsolete) and run
      the focused tests of the change, following the test skill for this language; the
      orchestrator runs the whole suite once after your step and gives you its failures
      (never start the whole suite yourself). You also write the
      end-to-end acceptance scenarios (Given/When/Then feature files and their step
      definitions) and check that they parse, following the E2E test skill, when the run's
      E2E tests are on. Your step's prompt says which parts are on. You do NOT fix production
      code: when a test fails because of a bug in the code, describe the failure precisely
      (test, file, error, probable cause) so the orchestrator can hand it to the developer.
      Commit test files only.
      Keep your context small (context-economy): before writing tests, start one exploration
      sub-agent that maps, from the developer's test_notes and the branch diff, the changed
      behaviours, the existing tests that cover them and the test helpers and conventions,
      with file and line numbers; then read only the test files you edit and the production
      lines under test. A long test output or the suite's log goes to a sub-agent that returns
      the failures; the focused runs that decide your step stay in your own turn.
      Your session may continue in a fresh one from your handoff note: in it, keep the
      behaviours to test (from test_notes) and which are covered, the test files you wrote or
      edited, the last test command with its result (pass/fail counts, failing tests), and what
      is left, so the next session continues without mapping the change again.

  builder:
    color: "#E6C229" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: ["build-audit-{{ inputs.language }}"]
    system_prompt: |
      You are the builder. You build the application and check its dependencies for
      vulnerabilities, following the build skill for this language. You do not change
      code and you do not run the test suite (the test writer ran it; CI runs it on every
      platform). Vulnerability policy:
      - blocks: any critical; high in production dependencies
      - report only: moderate/low, and anything in development-only dependencies

  verifier:
    color: "#2FBF71" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: [claim-verification]
    system_prompt: |
      You are the verifier. You prove or disprove that the change does what the task
      asked, by running the same command before and after it. You do not change code and
      you do not run the full test suite (the test writer ran it).

  evidence:
    color: "#1FC2D6" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5
    session: ephemeral
    capabilities: { tools: [read, *toolchains], web: false }
    # ui-conventions: the visual review of the UI screenshots (ui_findings)
    skills: [implementation-evidence, ui-conventions]
    system_prompt: |
      You collect evidence that the change works: UI screenshots, HTTP requests and their
      responses, CLI output or log lines, local and simulated only. You do not change code, do not
      commit and do not run the test suite; a capture that fails is reported, never fixed.

  # Push, PR/MR and failure triage need no frontier model, and the engine does the polling (wait:).
  ci_pusher:
    provider: claude
    model: claude-sonnet-5
    session: handoff
    capabilities: { tools: [read, *vcs], web: false }
    skills: ["ci-pipeline-{{ inputs.git_platform }}", "pr-screenshots-{{ inputs.git_platform }}"]
    system_prompt: |
      You are the CI Pusher. You push the branch, make sure a PR/MR is open (with the
      evidence step's UI screenshots, when there are any) and watch CI until it passes. When CI fails, you fetch the failure log and summarize the
      root cause so the orchestrator can hand it to the developer. You do not fix
      code and you do not merge.

  pr_babysitter:
    provider: claude
    model: claude-opus-4-8
    session: handoff
    capabilities: { tools: [read, *vcs], web: false }
    skills: ["pr-babysitter-{{ inputs.git_platform }}", decision-log]
    system_prompt: |
      You are the PR Babysitter. With CI green, you watch the PR/MR until it is
      mergeable: conflicts, reviews and comments. Actionable comments become fix
      requests; doubtful ones go to the human (fix, justify or ignore). After a fix
      you reply to the comment citing the commit hash. You do not fix code and you do not merge.

  # Triggers workflows and reads their logs; the engine watches the runs between its turns (wait:).
  deployer:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, *vcs], web: false }
    skills: ["deploy-{{ inputs.git_platform }}"]
    system_prompt: |
      You are the Deployer. Before the merge, you publish the PR/MR preview. After the
      merge, which a human approves, you track the production deploy triggered by the
      push to {{ inputs.base_branch }}. On failures, you diagnose from the failed job log.

# Progress shown in the runs list and the Run screen (does not change the graph).
groups:
  - name: Develop
    steps: [develop, requirements_left_out, issue_not_done, developer_screenshots, developer_check]
  - name: Review
    steps: [code_review, human_review]
  - name: Validate
    steps: [test, suite, test_failed, build, build_failed, evidence, verify_change, verify_failed]
  - name: PR & CI
    steps: [ci, ci_failed, pr_babysitter, comment_decision]
  - name: Deploy
    steps: [deploy_test, preview_failed, approve_merge, resolve_conflict, merge_failed, deploy_prod, deploy_failed]

# -----------------------------------------------------------------------------
steps:

  # ============================ BUILD & TEST =================================

  - id: develop
    agent: developer
    prompt: |
      Task: {{ inputs.task }}

      {% if inputs.issues | length > 1 %}
      This run implements {{ inputs.issues | length }} issues together, in one branch and one PR/MR:
      {{ inputs.issues | join(', ') }}.
      In `issues`, answer one entry per issue (its URL in `issue`): `done` and a `summary` of what
      you did for it, or `done: false` and why it cannot be done in this run. Never drop an issue
      silently: the owner decides whether the run goes on without it. Your `summary` lists what
      was done per issue.
      {% if steps.issue_not_done.output %}
      The owner chose to continue without the issues you could not do; leave them out.
      {% endif %}
      {% endif %}
      {% if steps.code_review.output and steps.code_review.output.verdict == 'changes_requested' %}
      The reviewer requested these changes (iteration {{ loop.iteration }}):
      {{ steps.code_review.output.findings | to_yaml }}
      Fix the blocking items, make a new commit and answer each one.
      A finding that needs no production change (it asks for tests or screenshots, which the
      test writer owns, or you disagree with it): answer it in `summary` with the reason, make no
      empty commit, and set `no_change: true` when no finding of this round needed a code change.
      {% endif %}
      {% if previous_step == 'developer_check' %}
      The owner tried your change and asks for these changes (change request {{ steps.developer_check.visits }}):
      {{ steps.developer_check.output.feedback }}
      Fix them on the same branch with a new commit, and answer each point in `summary`.
      {% endif %}
      {% if previous_step == 'evidence' %}
      The visual review of the screenshots found these UI problems (ui-conventions skill; one round):
      {{ steps.evidence.output.ui_findings | selectattr('blocking') | list | to_yaml }}
      Fix them on the same branch with a new commit and answer each one in `summary` (one you
      disagree with: say why). Keep `evidence_plan` listing the states to capture.
      {% endif %}
      {% if steps.deploy_prod.output and steps.deploy_prod.output.deploy_status == 'failed' %}
      The previous production deploy failed: {{ steps.deploy_prod.output.error_summary }}
      Create a new branch from the remote base (`git fetch origin`, then
      `git switch --no-track -c <branch> origin/{{ inputs.base_branch }}`) and fix it.
      {% endif %}
      {% if not steps.develop.output %}
      Before changing code: `git fetch origin` and create your branch from
      `origin/{{ inputs.base_branch }}` (not the local {{ inputs.base_branch }}, which may be
      behind); the engine already linked the dependencies of that base.
      {% endif %}
      {% if inputs.unit_tests == 'write_and_run' %}
      Change production code only: the test writer writes and runs the tests after the review.
      {% else %}
      Change production code only. No test writer runs in this run (unit_tests is {{ inputs.unit_tests }}):
      nobody writes new tests, {% if inputs.unit_tests == 'run_existing' %}and the suite step runs the existing tests your change affects after you{% else %}and no suite step runs: the tests you ask for below are the only ones of this run{% endif %}.
      {% endif %}
      To check your change, ask the orchestrator instead of running tests yourself: end your turn
      with a ```run-tests block, one test file per line (the existing tests of the files you changed)
      or the word `affected` (the test files that import what you changed). The orchestrator runs them
      in the background and resumes you with a summary: passed / failed, each failure's first lines and
      the log's path. Never run the whole suite, nor slow test files that simulate whole runs unless
      you changed what they cover. One focused test file in your turn stays allowed: with a timeout of
      about 2 minutes, its output to a log, reading only the summary.
      In `test_notes`, tell {{ 'the test writer' if inputs.unit_tests == 'write_and_run' else 'the owner' }} what should be tested: the behaviours you changed, the edge cases
      and the files (and the existing tests your change makes obsolete, if any).
      In `evidence_plan`, say per issue how to show the change working, for the evidence step (it
      does not read the code): the screen and the screenshot options (view, tab, clicks), or the
      request, command or mock run whose output shows it; `none` and why when nothing is observable.
      For a UI change, list the interaction states to capture (the default view, then each edit
      form, empty state and error state the change adds, with the clicks that open them) and make
      the screenshot demo data cover the fields the change introduces (ui-conventions skill).
      {% if inputs.screenshots == 'off' %}
      Screenshots are off in this run (input `screenshots`): `screenshots` is an empty list, and
      the evidence plan shows the change with the diff, commands, logs or test results, never with
      `npm run screenshot`.
      {% else %}
      {% if inputs.screenshots == 'changed' %}Screenshots: only the screens this issue changes (input `screenshots`), at most the
      default view and one state per changed screen.
      {% endif %}
      In `screenshots`, list the same UI states as exact options of the project's screenshot command
      (`npm run screenshot -- …`), one entry each: `name` a plain file name
      `<issue>-<screen>-<state>`, `caption` one sentence, `args` the options as a list (e.g.
      ["--view", "backlog", "--mode", "roadmap", "--click", "[data-rm-edit]"]), never --out, --name,
      --side, --ref or --caption (the capture sets them). The engine captures each one, original and
      modified, before the owner tries the change. An empty list when the change has no UI.
      {% endif %}
      In `left_out`, list each requirement of the task (its acceptance criteria, each task of the
      issue) that you did not implement, with the reason: never leave one only in prose; an empty
      list when everything was done. A list that is not empty sends you back here, not to the review.
      Tasks that are not yours never go in `left_out`: tests (the test writer writes and runs them
      after the review; describe them in `test_notes`) and measurements that need real runs or the
      owner (say in `summary` what to measure and how).{% if inputs.issues | length > 1 %}
      A whole issue you could not do goes in `issues` (`done: false`), not in `left_out`.{% endif %}
      {% if vars.accepted_gaps %}
      The owner chose to continue without these requirements; do not list them again: {{ vars.accepted_gaps }}
      {% elif previous_step == 'develop' and vars.gaps_returned == 'yes' and steps.develop.output.left_out | developer_gaps | length %}
      Your previous answer left these requirements out, so the review was not called:
      {{ steps.develop.output.left_out | developer_gaps | to_yaml }}
      Finish them on the same branch with a new commit. Keep in `left_out` only those that are
      impossible in this run, each with the reason: the owner then decides whether the run goes on
      without them.
      {% endif %}
    # a fix round with a new commit, summary or set of files is progress, not "the same answer" (#121)
    stall:
      same_output_fields: [commit_sha, summary, files_changed]
    output_schema:
      type: object
      required: [branch, summary, files_changed, test_notes, committed, left_out]
      properties:
        branch:        { type: string }
        summary:       { type: string }
        files_changed: { type: array, items: { type: string } }
        # for the test writer: behaviours, edge cases and files to test
        test_notes:    { type: string }
        # for the evidence step: per issue, the screen/command/request that shows the change
        evidence_plan: { type: string }
        # for developer_screenshots (#144): each UI state as the screenshot command's options;
        # an empty list for a change without UI
        screenshots:
          type: array
          items:
            type: object
            required: [name, caption, args]
            properties:
              name:    { type: string }
              caption: { type: string }
              args:    { type: array, items: { type: string } }
        committed:     { type: boolean }
        # a review round answered without a production change: back to the reviewer with the answer
        no_change:     { type: boolean }
        commit_sha:    { type: string }
        notes:         { type: string }
        # a run for several issues (inputs.issues): what was done for each one
        issues:
          type: array
          items:
            type: object
            required: [issue, done, summary]
            properties:
              issue:   { type: string }
              done:    { type: boolean }
              summary: { type: string }
        # requirements of the task the developer did not implement (#98), single issue or group;
        # required, so an answer cannot skip it (an empty list when nothing is missing)
        left_out:
          type: array
          items:
            type: object
            required: [requirement, reason]
            properties:
              requirement: { type: string }
              reason:      { type: string }
    transitions:
      # declared gaps (#98): no review is spent on work the developer says is missing. The first
      # time, back to the developer with the list (no reviewer call); any gap after that (also a new
      # one after the owner continued, or on a review round) goes to the owner at requirements_left_out.
      # Tests and Measure tasks are never the developer's (#173): developer_gaps drops them
      - when: "output.left_out | developer_gaps | length and vars.gaps_returned != 'yes'"
        goto: develop
        set: { gaps_returned: "yes" }
      - when: "output.left_out | developer_gaps | length"
        goto: requirements_left_out
      # an issue of the group could not be done: the owner decides (once) whether the run goes on without it
      - when: "output.committed and inputs.issues | length > 1 and not steps.issue_not_done.output and (output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      # validated mode: the owner tries the first implementation and every round they asked for
      # (vars.owner_validated is "yes" once they approved; a review fix round goes on without them,
      # unless validate_every_round)
      - when: "(inputs.mode == 'validated' and output.committed and (vars.owner_validated != 'yes' or inputs.validate_every_round)) and inputs.screenshots == 'off'"
        goto: developer_check
      - when: "inputs.mode == 'validated' and output.committed and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: developer_screenshots
      # the review findings needed no production change (e.g. they ask for tests, which the test
      # writer owns): the reviewer gets the answer; a disagreement ends at human_review, never in a loop
      - when: "output.no_change and steps.code_review.output"
        goto: code_review
      - when: "output.committed"
        goto: code_review
      - when: "true"
        goto: develop
        max_visits: 3
        on_exhausted: fail

  # Screenshots of the developer's UI states before the owner's check (#144): no agent, no model
  # cost. The project's screenshot command runs once per entry of develop's `screenshots`, modified
  # (the worktree) and original (--ref the base), into evidence/developer/round-<n>/ (one round per
  # visit). Never blocks: an empty list, a simulated run or a failed capture is in its output's
  # message, which developer_check shows.
  - id: developer_screenshots
    type: screenshots
    from: develop
    folder: developer
    base: "origin/{{ inputs.base_branch }}"
    transitions:
      - when: "true"
        goto: developer_check

  # Validated mode (inputs.mode): the owner tries the developer's work before any review or test
  # token is spent. Ask for changes goes back to the developer with the text, and the run comes
  # back here; no automatic limit, the owner decides when to stop. A human gate: no timeout, and
  # neither the supervisor nor a retry ever answers it.
  - id: developer_check
    type: human_approval
    local_preview: true
    diff_base: "origin/{{ inputs.base_branch }}"
    message: |
      The developer finished {% if previous_step == 'developer_screenshots' and steps.developer_check.output and steps.developer_check.output.choice == 'changes' %}your change request {{ steps.developer_check.visits - 1 }}{% else %}the implementation{% endif %}. Try it before the review and the tests run.
      Dev/QA: read the E2E scenarios and the screenshots; run the app and test by hand only what they do not cover.
      Branch `{{ steps.develop.output.branch }}`{% if worktree_dir %} in the worktree {{ worktree_dir }}{% endif %}.
      {% if local_preview %}Run App starts `{{ local_preview.command }}` there.{% else %}To try it: Run App proposes a command from the worktree (package.json, the README) and saves it as the project's Local preview.{% endif %} Try it with Run App, not by starting it by hand in the worktree.

      Summary: {{ steps.develop.output.summary }}
      {% if steps.develop.output.issues %}
      Issues:
      {% for i in steps.develop.output.issues %}- {{ i.issue }}: {% if i.done %}done{% else %}NOT done{% endif %}, {{ i.summary }}
      {% endfor %}{% endif %}
      Files changed: {{ steps.develop.output.files_changed | join(', ') }}
      {% set commits = worktree_dir | git_commits('origin/' ~ inputs.base_branch) %}{% if commits %}Commits on the branch:
      {{ commits }}
      {% endif %}
      {% if worktree_dir %}Diff: Show the diff opens the branch's changes since `origin/{{ inputs.base_branch }}` here.{% endif %}
      Test notes: {{ steps.develop.output.test_notes }}
      {% if tests_plan %}{{ tests_plan }}{% endif %}
      {% if inputs.screenshots == 'off' %}Screenshots: off in this run (the evidence is the diff, the logs and the test results).{% elif steps.developer_screenshots.output %}Screenshots: {{ steps.developer_screenshots.output.message }}{% endif %}
      {% if steps.develop.output.evidence_plan %}Evidence plan: {{ steps.develop.output.evidence_plan }}{% endif %}
      {% set e2e = steps.test.output | e2e_scenarios %}{% if e2e %}{{ e2e }}{% elif inputs.e2e_tests == 'off' %}E2E scenarios: off in this run.{% else %}E2E scenarios: none yet. The test writer writes them after the code review; they show at the merge approval.{% endif %}
    feedback: { label: "Your change request for the developer (required with \"Ask for changes\")", placeholder: "What to change, point by point" }
    choices:
      - { id: approve, label: "Approve: go on to the code review" }
      - { id: changes, label: "Ask for changes: back to the developer", feedback_required: true }
      - { id: stop,    label: "Stop the run (branch kept to resume)" }
    transitions:
      - when: "choice == 'approve'"
        goto: code_review
        set: { owner_validated: "yes" }
      - when: "choice == 'changes'"
        goto: develop
        set: { owner_validated: "no" }
      - when: "choice == 'stop'"
        goto: end
        status: cancelled

  # Requirements of the task the developer still leaves out after being sent back once to finish
  # them (#98): never dropped silently. A human gate: neither the supervisor nor a retry answers it.
  - id: requirements_left_out
    type: human_approval
    message: |
      The developer left these requirements of the task out, even after being sent back once to finish them:
      {% for g in steps.develop.output.left_out | developer_gaps %}
      - {{ g.requirement }}: {{ g.reason }}{% endfor %}
      The rest is on branch `{{ steps.develop.output.branch }}`; the code review has not run yet.
    choices:
      - { id: continue, label: "Continue without them" }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)" }
    transitions:
      # nothing committed yet: the developer commits the rest first
      - when: "choice == 'continue' and not (steps.develop.output.committed or steps.develop.output.no_change)"
        goto: develop
        # the separator goes before each entry: the engine trims a set: value, so a trailing one is lost
        set: &accepted_gaps { accepted_gaps: "{{ vars.accepted_gaps }}{% for g in steps.develop.output.left_out | developer_gaps %}{% if vars.accepted_gaps or not loop.first %} {% endif %}{{ g.requirement }};{% endfor %}" }
      - when: "choice == 'continue' and inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
        set: *accepted_gaps
      - when: "(choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes') and inputs.screenshots == 'off'"
        goto: developer_check
        set: *accepted_gaps
      - when: "choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes'"
        goto: developer_screenshots
        set: *accepted_gaps
      - when: "choice == 'continue'"
        goto: code_review
        set: *accepted_gaps
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # A run for several issues where the developer could not do one of them: never dropped silently.
  - id: issue_not_done
    type: human_approval
    message: |
      The developer could not do every issue of this run:
      {% for i in steps.develop.output.issues %}{% if not i.done %}
      - {{ i.issue }}: {{ i.summary }}{% endif %}{% endfor %}
      The other issues are done on branch `{{ steps.develop.output.branch }}`.
    choices:
      - { id: continue, label: "Continue without them (the PR/MR will not close them)" }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)" }
    transitions:
      - when: "(choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes') and inputs.screenshots == 'off'"
        goto: developer_check
      - when: "choice == 'continue' and inputs.mode == 'validated' and vars.owner_validated != 'yes'"
        goto: developer_screenshots
      - when: "choice == 'continue'"
        goto: code_review
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # After a merge conflict (vars.recheck == 'resolution', set by resolve_conflict) the review covers
  # the resolution only: the change itself was already reviewed and approved.
  - id: code_review
    agent: reviewer
    prompt: |
      {% if vars.recheck == 'resolution' %}
      Review the RESOLUTION of a merge conflict on branch `{{ steps.develop.output.branch }}`, not the
      whole change: the change was already reviewed and approved, then `origin/{{ inputs.base_branch }}`
      moved and the developer merged it into the branch in commit `{{ steps.resolve_conflict.output.merge_commit }}`.
      - `git show --remerge-diff {{ steps.resolve_conflict.output.merge_commit }}`: the conflict hunks and
        what the resolution kept or dropped from each side;
      - `git log --oneline {{ steps.resolve_conflict.output.merge_commit }}..{{ steps.develop.output.branch }}`:
        any commit made after it (review those too).
      Check that the intent of both sides survived, that nothing was dropped or invented, and that
      the result still builds on what the base now has. Findings on code the resolution did not
      touch are not blocking: report them as minor or nit at most.
      Task (for context): {{ inputs.task }}
      Developer: {{ steps.resolve_conflict.output.summary }}
      {% else %}
      Review the changes on branch `{{ steps.develop.output.branch }}` against
      `{{ inputs.base_branch }}` (`git diff {{ inputs.base_branch }}...{{ steps.develop.output.branch }}`).
      Task (the spec for the spec axis): {{ inputs.task }}
      Developer summary: {{ steps.develop.output.summary }}
      {% if vars.accepted_gaps %}The owner accepted that the run goes on without these requirements (not blocking): {{ vars.accepted_gaps }}{% endif %}
      {% endif %}
      {% if inputs.issues | length > 1 and vars.recheck != 'resolution' %}
      This run implements several issues: check the spec axis per issue, and set `issue` (its URL)
      on the findings about one of them. An issue the change misses or only half does is a blocker,
      unless the developer reported it as not done:
      {{ steps.develop.output.issues | to_yaml }}
      {% endif %}
      Tests are not part of this review: the test writer writes and runs them in the next step,
      after your approval, and the developer never edits test files. A missing test, coverage or
      screenshot, even when the task asks for it, is never a finding here: list it in
      `for_test_writer` instead; it does not change the verdict. A measurement that needs real runs
      or the owner (an issue's Measure task) is the owner's, never a finding either.
    output_schema:
      type: object
      required: [verdict, findings]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        # what the test writer should cover (tests the task asks for); never a finding
        for_test_writer: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, description]
            properties:
              axis:        { type: string, enum: [correctness, spec, standards] }
              severity:    { type: string, enum: [blocker, major, minor, nit] }
              file:        { type: string }
              line:        { type: integer }
              description: { type: string }
              issue:       { type: string }
    transitions:
      # #203: unit and E2E tests both off → no test step; only the existing suite → no test writer
      - when: "output.verdict == 'approved' and inputs.unit_tests == 'off' and inputs.e2e_tests == 'off' and vars.recheck == 'resolution'"
        goto: ci
      - when: "output.verdict == 'approved' and inputs.unit_tests == 'off' and inputs.e2e_tests == 'off'"
        goto: build
      - when: "output.verdict == 'approved' and inputs.unit_tests == 'run_existing' and inputs.e2e_tests == 'off'"
        goto: suite
      - when: "output.verdict == 'approved'"
        goto: test
      - when: "output.verdict == 'changes_requested'"
        goto: develop
        loop:
          name: review_cycle
          max_iterations: 3
          on_exhausted: human_review

  - id: human_review
    type: human_approval
    local_preview: true
    message: |
      The review loop did not converge in 3 iterations.
      Approve: move on to testing anyway. Reject: stop the run (cancelled).
      {% if tests_plan %}{{ tests_plan }}{% endif %}
    transitions:
      # #203: the same test routing as code_review's
      - when: "approved and inputs.unit_tests == 'off' and inputs.e2e_tests == 'off' and vars.recheck == 'resolution'"
        goto: ci
      - when: "approved and inputs.unit_tests == 'off' and inputs.e2e_tests == 'off'"
        goto: build
      - when: "approved and inputs.unit_tests == 'run_existing' and inputs.e2e_tests == 'off'"
        goto: suite
      - when: "approved"
        goto: test
      - when: "rejected"
        goto: end
        status: cancelled

  # Test writer: owns the tests (writes/updates them) and runs the focused ones; the suite step
  # after it runs the whole suite (#177). On a production-code failure the orchestrator hands it
  # to the developer and tells the test writer when it is fixed. Its parts follow unit_tests /
  # e2e_tests (#203): it only runs when one of them makes it write something.
  # The bodies of these steps are in fragments/test-pipeline.yaml (#434), shared with the other development workflows.
  - id: test
    fragment: test-pipeline
    agent: test_writer
  - id: suite
    fragment: test-pipeline
    type: suite
    # also in the fragment's body; kept here (in the body's key order) so the raw workflow file says
    # it records coverage (#225)
    command: "{{ inputs.test_command }}"
    scope: affected
    coverage: true
  - id: test_failed
    fragment: test-pipeline
    type: human_approval
  - id: build
    fragment: test-pipeline
    agent: builder
  - id: build_failed
    fragment: test-pipeline
    type: human_approval
  - id: evidence
    fragment: test-pipeline
    agent: evidence
  - id: verify_change
    fragment: test-pipeline
    display: Final verification
    agent: verifier

  - id: verify_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The change still does not do what the task asked after 2 rounds of fixes.
      Claim: {{ steps.verify_change.output.claim }}
      Observed: {{ steps.verify_change.output.evidence }}
      Approve: continue to CI anyway. Reject: stop the run as failed (its branch keeps the work to resume it).
    transitions:
      - when: "approved"
        goto: ci
      - when: "rejected"
        goto: end
        status: failed

  # ============================ DEPLOY · CI/CD ===============================

  # CI Pusher: /goal CI green + /loop watching CI. The agent pushes and opens the PR/MR; after
  # that the engine polls the checks itself (wait:) and calls the agent only when a check failed,
  # the PR/MR conflicts with the base, or no check registered within `grace` after its last turn.
  # All checks green finishes the step with `output`, without an agent turn.
  - id: ci
    agent: ci_pusher
    goal:
      description: "CI green on the PR/MR for branch {{ steps.develop.output.branch }}"
      until: "output.ci_status == 'success'"
      on_exhausted: ci_failed
    loop:
      interval: 1m
      max_duration: 1h
    wait:
      probe: pr_checks
      target: "{{ steps.ci.output.pr_url }}"
      # over the agent's last answer (pr_url, pr_number); an older failure_log no longer applies
      output: { ci_status: success, failure_log: "" }
      # GitHub Actions quota exhausted (Usage › GitHub Actions): no check starts before the month
      # resets and no fix round helps, so the step goes straight to the ci_failed gate
      infra_output: { ci_status: failed, failure_class: infra, failure_log: "{{ probe.detail }}" }
      grace: 10m
    prompt: |
      Branch: `{{ steps.develop.output.branch }}` → base `{{ inputs.base_branch }}`.
      {% if delegate_result %}
      The developer fixed a previous failure (CI or the PR/MR preview) and already pushed:
      {{ delegate_result.text }}
      Check CI for that new commit (the head of the branch), not an older run.
      {% endif %}
      Following the CI skill for this platform:
      1. Make sure the branch is up to date on the remote.
      2. Make sure a PR/MR to the base is open (reuse it if it exists; otherwise create
         one with a short title and this summary: {{ steps.develop.output.summary }}).
         {% if inputs.issues | length > 1 %}This run implements several issues. The PR/MR body lists
         what was done for each one ({{ steps.develop.output.issues | to_json }}) and closes each
         issue that was done: one line `Closes #<number>` per issue, with the number from its URL
         (if the PR/MR already exists without them, edit its body to add them). An issue reported
         as not done (`done: false`) is named in the body as not done, with why, and not closed.
         {% elif inputs.issue %}The PR/MR body must also close the issue this run implements,
         {{ inputs.issue }}: add a line `Closes #<number>` with the issue number from that URL
         (if the PR/MR already exists without it, edit its body to add it).{% endif %}
      3. On EVERY visit, before anything else, check the PR/MR mergeability (see the
         skill). If it conflicts with the base (GitHub `mergeable: CONFLICTING` /
         `mergeStateStatus: DIRTY`; GitLab `has_conflicts` / `detailed_merge_status:
         conflict`), CI will never start: answer ci_status: failed right away, with a
         failure_log saying the branch conflicts with `{{ inputs.base_branch }}` (list the
         conflicting files if you can) and that the developer must merge
         `origin/{{ inputs.base_branch }}` into the branch, resolve, test and push.
      4. Check its CI:
         - anything running or not started yet → ci_status: pending (but if no check or
           pipeline has registered well after the push, follow the skill instead of
           answering pending forever)
         - something failed → ci_status: failed, with failure_log = job, step, error and
           probable root cause (file/line). For infrastructure/flaky failures, follow the
           skill (retry once) and answer pending.
         - everything passed → ci_status: success
         - CI cannot run at all for account reasons (GitHub Actions quota or spending limit
           exhausted, billing problem) → ci_status: failed with failure_class: infra and the
           platform's message in failure_log: no code change can fix it
      {% if steps.evidence.output and steps.evidence.output.screenshots and not steps.ci.output.screenshots_posted %}
      5. Once the PR/MR exists, publish the evidence step's UI screenshots on it following the
         screenshots skill (`--dir {{ run_dir }}/evidence`, its manifest's final set), then answer
         screenshots_posted: true. If publishing fails, put the error in screenshots_error and go on: it never
         changes ci_status.
      {% endif %}
      pr_number is the PR number (GitHub) or the MR iid (GitLab).
    # node: the screenshots skill's publish script
    capabilities: { tools: [read, *vcs, bash:node] }
    output_schema:
      type: object
      required: [pr_url, pr_number, ci_status]
      properties:
        pr_url:      { type: string }
        pr_number:   { type: integer }
        ci_status:   { type: string, enum: [pending, failed, success] }
        failure_log: { type: string }
        failure_class: { type: string, enum: [code, infra, unknown] }
        screenshots_posted: { type: boolean }
        screenshots_error:  { type: string }
    transitions:
      - when: "output.ci_status == 'success'"
        goto: pr_babysitter
      - when: "output.ci_status == 'pending'"
        goto: ci
      - when: "output.ci_status == 'failed' and output.failure_class == 'infra'"
        goto: ci_failed
      - when: "output.ci_status == 'failed'"
        delegate:
          agent: developer
          prompt: |
            CI on PR/MR #{{ output.pr_number }} failed:
            {{ output.failure_log }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test or the build (not the full suite),
            commit, then `git push`, and report the commit hash.
        goto: ci
        max_visits: 5
        on_exhausted: ci_failed

  # Reached when CI stays red after 5 rounds of fixes, no result within the /loop limit, or right
  # away when CI cannot run at all (infra: the Actions quota ran out).
  # Re-checking the same commit only helps when something outside the code changed (a stuck or
  # flaky pipeline re-run, a runner back online), so the gate also offers a fix round.
  - id: ci_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      {% if steps.ci.output.failure_class == 'infra' %}CI on {{ steps.ci.output.pr_url }} cannot run (class: infra, no fix round was spent):
      {{ steps.ci.output.failure_log }}
      Raise the spending limit or wait for the reset, then check CI again.{% else %}CI on {{ steps.ci.output.pr_url }} did not pass within the limit (status: {{ steps.ci.output.ci_status }}).
      Last error: {{ steps.ci.output.failure_log or '(none reported)' }}{% endif %}
    choices:
      - { id: fix,     label: "Send the failure to the developer (one more fix round, then CI again)" }
      - { id: recheck, label: "Check CI again without code changes (stuck or flaky pipeline, re-run by you)" }
      - { id: stop,    label: "Stop the run as failed (branch kept to resume)" }
    transitions:
      - when: "choice == 'fix'"
        delegate:
          agent: developer
          prompt: |
            CI on PR/MR #{{ steps.ci.output.pr_number }} is still failing. A human asked for one more fix round:
            {{ steps.ci.output.failure_log }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test or the build (not the full suite),
            commit, then `git push`, and report the commit hash.
        goto: ci
      - when: "choice == 'recheck'"
        goto: ci
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # PR Babysitter: /goal PR/MR mergeable + /loop on the PR/MR.
  - id: pr_babysitter
    agent: pr_babysitter
    goal:
      description: "PR/MR #{{ steps.ci.output.pr_number }} mergeable: CI green, no conflicts and no pending comments"
      until: "output.state == 'ready_to_merge'"
      on_exhausted: fail
    # Between its turns the engine polls the PR/MR (wait:) and calls the agent only when something
    # changed since its last turn (commits, comments, reviews, checks, mergeability).
    # Waiting longer than 4h for a reviewer is a resume.
    loop:
      interval: 2m
      max_duration: 4h
    wait:
      probe: pr_changes
      target: "{{ steps.ci.output.pr_url }}"
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }} ({{ steps.ci.output.pr_url }}).
      {% if delegate_result %}
      Since the last check, the orchestrator called the `{{ delegate_result.agent }}` agent:
      {{ delegate_result.text }}
      If a fix was committed, reply on the PR/MR to each handled comment citing the
      commit hash (see the skill).
      {% endif %}
      Check the PR/MR following the skill for this platform and answer with one state:
      - checks/pipeline failing → ci_failed
      - conflict with (or behind) the base → needs_fix (fix_request: update the branch with the base and resolve)
      - actionable comment/review not handled yet → needs_fix (fix_request with the request and the comment id)
      - doubtful comment (debatable, out of scope, contradictory) → needs_human (question: the comment and your doubt)
      - waiting on something external (checks running, required review/approval pending) → waiting
      - all good and mergeable → ready_to_merge
      - already merged → merged; closed without merge → closed
    output_schema:
      type: object
      required: [state, summary]
      properties:
        state:
          type: string
          enum: [waiting, needs_fix, needs_human, ci_failed, ready_to_merge, merged, closed]
        fix_request: { type: string }
        question:    { type: string }
        summary:     { type: string }
    transitions:
      - when: "output.state == 'waiting'"
        goto: pr_babysitter
      - when: "output.state == 'needs_fix'"
        delegate:
          agent: developer
          prompt: |
            Fix request on PR/MR #{{ steps.ci.output.pr_number }}:
            {{ output.fix_request }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test or the build (not the full suite),
            commit, then `git push`, and report the commit hash.
        goto: pr_babysitter
        max_visits: 5
        on_exhausted: fail
      - when: "output.state == 'needs_human'"
        goto: comment_decision
      - when: "output.state == 'ci_failed'"
        goto: ci
      - when: "output.state == 'ready_to_merge'"
        goto: deploy_test
      # merged or closed by someone else: its screenshots leave the pr-screenshots branch
      # (best effort, exits 0; an empty action is skipped)
      - when: "output.state == 'merged'"
        action: "{% if steps.ci.output.screenshots_posted %}node \"{{ skill_dir('pr-screenshots') }}/publish.js\" --cleanup --platform {{ inputs.git_platform }} --pr-url {{ steps.ci.output.pr_url | pr_url }}{% endif %}"
        goto: deploy_prod
      # closed without merge: nothing was delivered
      - when: "output.state == 'closed'"
        action: "{% if steps.ci.output.screenshots_posted %}node \"{{ skill_dir('pr-screenshots') }}/publish.js\" --cleanup --platform {{ inputs.git_platform }} --pr-url {{ steps.ci.output.pr_url | pr_url }}{% endif %}"
        goto: end
        status: cancelled

  # Human gate for doubtful comments
  - id: comment_decision
    type: human_approval
    message: |
      Doubtful comment on {{ steps.ci.output.pr_url }}:
      {{ steps.pr_babysitter.output.question }}
    choices:
      - { id: fix,     label: "Fix it (developer applies)" }
      - { id: justify, label: "Justify on the PR/MR without changing code" }
      - { id: ignore,  label: "Ignore" }
    transitions:
      - when: "choice == 'fix'"
        delegate:
          agent: developer
          prompt: |
            The human decided to address this comment on PR/MR #{{ steps.ci.output.pr_number }}:
            {{ steps.pr_babysitter.output.question }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test or the build (not the full suite),
            commit, then `git push`, and report the commit hash.
        goto: pr_babysitter
      - when: "choice == 'justify'"
        delegate:
          agent: pr_babysitter
          prompt: |
            The human decided NOT to change the code for this comment:
            {{ steps.pr_babysitter.output.question }}
            Reply to the comment on the PR/MR with a short, polite technical justification.
        goto: pr_babysitter
      - when: "choice == 'ignore'"
        delegate:
          agent: pr_babysitter
          prompt: |
            The human decided to ignore this comment:
            {{ steps.pr_babysitter.output.question }}
            Do not reply on the PR/MR and no longer treat it as pending.
        goto: pr_babysitter

  # Deployer (before the merge): preview of the PR/MR.
  # A `code` failure (the preview build runs the tests on another platform, for example) goes to
  # the developer; the new commit then needs CI and the PR check again before a new preview
  # (at most 2 automatic fix rounds). `infra`/`unknown` failures go to the human gate: publishing
  # the same commit again cannot fix a code failure.
  - id: deploy_test
    agent: deployer
    goal:
      description: "Preview of PR/MR #{{ steps.ci.output.pr_number }} published"
      until: "output.preview_status == 'success'"
      on_exhausted: preview_failed
    loop:
      interval: 1m
      max_duration: 45m
    # once the agent reports run_url, the engine watches that run and calls the agent when it ends
    wait:
      probe: workflow_run
      target: "{{ steps.deploy_test.output.run_url }}"
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }}, branch `{{ steps.develop.output.branch }}`.
      {% if previous_step != 'deploy_test' or not steps.deploy_test.output or steps.deploy_test.output.preview_status == 'failed' %}
      Trigger the preview publication following the "Preview" section of the deploy skill
      (GitHub preview workflow: `{{ inputs.preview_workflow }}`), from the current head of the branch.
      {% else %}
      The preview was already triggered ({{ steps.deploy_test.output.run_url }}); only check it.
      {% endif %}
      - not started yet, queued or running → pending, with run_url as soon as the run exists
        (the orchestrator then watches that run itself and calls you when it ends)
      - finished successfully → success, with release_url (preview URL)
      - failed → failed, with error_summary and failure_class (see the skill):
        code = a commit on the branch can fix it (code, tests, lockfile, build scripts);
        infra = no commit can (runner, network, quota, secrets, permissions, approvals);
        unknown = you cannot tell from the log.
    output_schema:
      type: object
      required: [preview_status]
      properties:
        preview_status: { type: string, enum: [pending, success, failed] }
        failure_class:  { type: string, enum: [code, infra, unknown] }
        run_url:        { type: string }
        release_url:    { type: string }
        error_summary:  { type: string }
    transitions:
      - when: "output.preview_status == 'success'"
        goto: approve_merge
      - when: "output.preview_status == 'pending'"
        goto: deploy_test
      - when: "output.preview_status == 'failed' and output.failure_class == 'code'"
        delegate:
          agent: developer
          prompt: |
            The preview build of PR/MR #{{ steps.ci.output.pr_number }} failed because of the code:
            {{ output.error_summary }}
            Run: {{ output.run_url }}
            Fix it on branch `{{ steps.develop.output.branch }}` (it may be platform specific: the
            preview can build on another OS than CI), check it with a focused test or the build (not the full suite), commit, then `git push`,
            and report the commit hash.
        goto: ci
        max_visits: 2
        on_exhausted: preview_failed
      - when: "output.preview_status == 'failed'"
        goto: preview_failed

  # Reached by an infra/unknown failure, a code failure after 2 fix rounds, or no result in 45m.
  - id: preview_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The preview of {{ steps.ci.output.pr_url }} did not publish (status: {{ steps.deploy_test.output.preview_status }}, class: {{ steps.deploy_test.output.failure_class or 'unknown' }}).
      {{ steps.deploy_test.output.error_summary or '(no error summary)' }}
      Run: {{ steps.deploy_test.output.run_url or '(none)' }}
      Publishing the same commit again only helps for infrastructure failures (runner, network,
      quota, a secret or permission you have since fixed). A code failure needs a fix.
    choices:
      - { id: retry, label: "Publish the same commit again (infrastructure failure)" }
      - { id: fix,   label: "Send the failure to the developer (fix, then CI, PR check and preview again)" }
      - { id: stop,  label: "Stop the run as failed (branch kept to resume)" }
    transitions:
      - when: "choice == 'retry'"
        goto: deploy_test
      - when: "choice == 'fix'"
        delegate:
          agent: developer
          prompt: |
            The preview build of PR/MR #{{ steps.ci.output.pr_number }} failed and a human asked you to fix it:
            {{ steps.deploy_test.output.error_summary }}
            Run: {{ steps.deploy_test.output.run_url }}
            Fix it on branch `{{ steps.develop.output.branch }}`, check it with a focused test or the build (not the full suite), commit,
            then `git push`, and report the commit hash.
        goto: ci
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # Human gate: test the preview and approve the merge (= production)
  # `check:` the engine checks the PR/MR itself (no model call) right before the gate opens, and
  # again whenever another run merges into the same repository while it is open; `precheck: true`
  # checks it once more right before the merge, and merges of concurrent runs go one at a time. A
  # PR/MR that is not mergeable is never merged nor offered for approval: the supervisor decides
  # first (a conflict → resolve_conflict, with its record in the run chat, decisions.tsv and the
  # Backlog card); anything else, or no interventions left → merge_failed.
  - id: approve_merge
    type: human_approval
    local_preview: true
    check:
      probe: pr_mergeable
      target: "{{ steps.ci.output.pr_url }}"
      on_fail: merge_failed
      recover: [resolve_conflict]
    message: |
      Preview published: {{ steps.deploy_test.output.release_url }}
      {{ steps.ci.output.pr_url }}: {% if check.state == 'passed' %}CI green and mergeable ({{ check.detail }}){% else %}the state could not be checked ({{ check.detail }}){% endif %}, checked at {{ check.checked_at }}, right before this approval. It is checked again when you approve.
      {% if steps.resolve_conflict.output and steps.resolve_conflict.output.resolved %}The branch changed after your last approval: a merge conflict with {{ inputs.base_branch }} was resolved ({{ steps.resolve_conflict.output.summary }}), reviewed and tested again.
      {% endif %}
      {% if steps.test.output.preexisting_failures %}Tests that also fail on {{ inputs.base_branch }} (not caused by this change, worth a follow-up issue): {% for f in steps.test.output.preexisting_failures %}{{ f.test }} ({{ f.file }}){% if not loop.last %} · {% endif %}{% endfor %}
      {% endif %}
      {{ tests_plan }}{% if steps.suite.output %} {{ steps.suite.output.message }}{% elif inputs.unit_tests == 'off' %} The test suite did not run in this run: nothing was tested here.{% endif %}
      Dev/QA: read the E2E scenarios and the screenshots; run the app and test by hand only what they do not cover.
      {% set e2e = steps.test.output | e2e_scenarios %}{% if e2e %}{{ e2e }}{% elif inputs.e2e_tests == 'off' %}E2E scenarios: off in this run (none written).{% else %}E2E scenarios: none reported by the test writer.{% endif %}
      Approve the merge into {{ inputs.base_branch }}? This produces the production release.
    # The action runs in the run's worktree, where the PR branch is checked out. `--repo` makes gh
    # merge and delete the remote branch server side only: without it gh would also check out the
    # base and delete the local branch, which fails in a worktree (the base is checked out in the
    # main checkout). The engine deletes the local branch when it removes the worktree.
    # `github_repo` validates pr_url (agent output) and reduces it to HOST/OWNER/REPO: the
    # action runs in a shell, so an unexpected value fails the render instead of running.
    # Once merged, the PR/MR's screenshots leave the pr-screenshots branch (best effort, exits 0).
    transitions:
      - when: "approved"
        precheck: true
        on_error: merge_failed
        recover: [resolve_conflict]
        action: &merge_action "{% if inputs.git_platform == 'gl' %}glab mr merge {{ steps.ci.output.pr_number }} --squash --remove-source-branch --yes{% else %}gh pr merge {{ steps.ci.output.pr_number }} --repo {{ steps.ci.output.pr_url | github_repo }} --squash --delete-branch{% endif %}{% if steps.ci.output.screenshots_posted %} && node \"{{ skill_dir('pr-screenshots') }}/publish.js\" --cleanup --platform {{ inputs.git_platform }} --pr-url {{ steps.ci.output.pr_url | pr_url }}{% endif %}"
        goto: deploy_prod
      - when: "rejected"
        goto: end
        status: cancelled

  # Reached from approve_merge when the supervisor recognizes a merge conflict (`action_error`: the
  # error, the PR/MR state the engine checked, the supervisor's record and instruction) or from the
  # merge_failed gate. The resolution then goes through its own review, the full suite, CI, the PR
  # check, a new preview and the owner's approval again (never merged automatically). 2 rounds.
  - id: resolve_conflict
    agent: developer
    # a merge brings the base's test files: resolving their conflicts is part of the job
    edits_tests: true
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }} ({{ steps.ci.output.pr_url }}) was not merged into `{{ inputs.base_branch }}`:
      {{ action_error.message if action_error else 'the owner sent it to you from the merge_failed gate' }}
      {% if action_error and action_error.check %}State checked by the orchestrator at {{ action_error.check.checked_at }}: {{ action_error.check.state }} ({{ action_error.check.detail }}).{% endif %}
      {% if action_error and action_error.supervisor %}The run supervisor sent it back to you: {{ action_error.supervisor.explanation }}
      {{ action_error.supervisor.instruction }}{% endif %}
      {% if steps.merge_failed.output and steps.merge_failed.output.feedback %}The owner says: {{ steps.merge_failed.output.feedback }}{% endif %}

      On branch `{{ steps.develop.output.branch }}`: `git fetch origin`, then `git merge origin/{{ inputs.base_branch }}`
      (a merge commit, never a rebase: the branch is already pushed), and resolve every conflict
      following the merge-conflict-resolver skill (keep the intent of both sides; never drop the
      other change). Run only the tests related to the files you resolved (not the full suite: the
      test writer runs it next), commit the merge and `git push` (never force-push).
      Answer `merge_commit` (the hash of the merge commit), `files_changed` (the files the resolution
      touched) and `behaviour_changed`: true when the resolution does more than combine both sides
      (e.g. you had to adapt the change's logic to what the base now does), so the change is
      reviewed in full again.
      If the PR/MR does not conflict (e.g. a required review or check is missing) or it is anything
      you can't fix on the branch, change nothing and answer blocked: true with the reason.
    output_schema:
      type: object
      required: [resolved, blocked, summary]
      properties:
        resolved:          { type: boolean }
        blocked:           { type: boolean }
        summary:           { type: string }
        merge_commit:      { type: string }
        files_changed:     { type: array, items: { type: string } }
        behaviour_changed: { type: boolean }
    transitions:
      - when: "output.blocked"
        goto: merge_failed
      # `recheck: resolution`: code_review covers the merge commit only and test goes on to ci; a
      # resolution that changes behaviour goes through the whole pipeline again
      - when: "output.resolved"
        set: { recheck: "{{ '' if output.behaviour_changed else 'resolution' }}" }
        goto: code_review
        max_visits: 2
        on_exhausted: merge_failed
      - when: "true"
        goto: merge_failed

  # Only a person gets the run past a merge that failed for another reason (permissions, a required
  # review, the platform), a blocked developer, or 2 resolution rounds.
  - id: merge_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      {{ steps.ci.output.pr_url }} was not merged into {{ inputs.base_branch }}:
      {{ action_error.message if action_error else '(no error recorded)' }}
      {% if action_error and action_error.check %}State checked at {{ action_error.check.checked_at }}: {{ action_error.check.state }} ({{ action_error.check.detail }}).
      {% endif %}{% if action_error and action_error.diagnosis %}Supervisor: {{ action_error.diagnosis }}
      {% endif %}{% if steps.resolve_conflict.output %}Developer (last resolution): {{ steps.resolve_conflict.output.summary }}
      {% endif %}
    feedback: { label: "Instruction for the developer (optional, with \"Resolve\")" }
    choices:
      - { id: retry,   label: "Merge now (checked right before; you approve the PR/MR's current head)" }
      - { id: resolve, label: "Send it to the developer to resolve (then review, tests, CI, preview and your approval again)" }
      - { id: stop,    label: "Stop the run as failed (branch kept to resume)" }
    transitions:
      - when: "choice == 'retry'"
        precheck:
          probe: pr_mergeable
          target: "{{ steps.ci.output.pr_url }}"
        on_error: merge_failed
        action: *merge_action
        goto: deploy_prod
      - when: "choice == 'resolve'"
        goto: resolve_conflict
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # Deployer (after the merge): tracks the automatic production deploy.
  - id: deploy_prod
    agent: deployer
    goal:
      description: "Production deploy of PR/MR #{{ steps.ci.output.pr_number }} finished"
      until: "output.deploy_status == 'success'"
      on_exhausted: deploy_failed
    loop:
      interval: 1m
      max_duration: 1h
    wait:
      probe: workflow_run
      target: "{{ steps.deploy_prod.output.run_url }}"
    prompt: |
      PR/MR #{{ steps.ci.output.pr_number }} was merged into {{ inputs.base_branch }}.
      Track the production deploy of the merge commit following the "Production" section
      of the deploy skill (GitHub deploy workflow: `{{ inputs.deploy_workflow }}`).
      - not started yet, queued or running → pending, with run_url as soon as the run exists
        (the orchestrator then watches that run itself and calls you when it ends)
      - success → success, with release_url; then clean up the preview as the skill says
      - failed → failed, with error_summary and failure_class (code | infra | unknown, see the skill)
      In every answer, report `merge_commit`: the full SHA of the commit the merge created on
      {{ inputs.base_branch }}, read from the platform ({% if inputs.git_platform == 'gl' %}`glab mr view {{ steps.ci.output.pr_number }} --output json`, field `merge_commit_sha` or, for a squash, `squash_commit_sha`{% else %}`gh pr view {{ steps.ci.output.pr_number }} --repo {{ steps.ci.output.pr_url | github_repo }} --json mergeCommit`, field `mergeCommit.oid`{% endif %}).
      It is the run's `merged_commit` output, handed to a chained run: never the branch's commit.
    output_schema:
      type: object
      required: [deploy_status, merge_commit]
      properties:
        deploy_status: { type: string, enum: [pending, success, failed] }
        merge_commit:  { type: string }
        failure_class: { type: string, enum: [code, infra, unknown] }
        run_url:       { type: string }
        release_url:   { type: string }
        error_summary: { type: string }
    transitions:
      - when: "output.deploy_status == 'success'"
        goto: end
      - when: "output.deploy_status == 'pending'"
        goto: deploy_prod
      - when: "output.deploy_status == 'failed'"
        goto: deploy_failed

  # Production is already merged: every way forward goes through a human. The deployer never
  # re-runs a production deploy, so checking again only helps after a person re-ran it.
  - id: deploy_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The production deploy did not succeed (status: {{ steps.deploy_prod.output.deploy_status }}, class: {{ steps.deploy_prod.output.failure_class or 'unknown' }}).
      {{ steps.deploy_prod.output.error_summary or '(no error summary)' }}
      Run: {{ steps.deploy_prod.output.run_url or '(none)' }}
      A code fix starts a new development cycle from the base; it will not help an infrastructure failure.
    choices:
      - { id: fix,     label: "Ask the developer for a fix (new cycle from the base)" }
      - { id: recheck, label: "Track the deploy again (after you re-ran it yourself)" }
      - { id: stop,    label: "Stop the run as failed" }
    transitions:
      # a new change from the base: reviewed and checked in full
      - when: "choice == 'fix'"
        set: { recheck: "" }
        goto: develop
      - when: "choice == 'recheck'"
        goto: deploy_prod
      - when: "choice == 'stop'"
        goto: end
        status: failed

# -----------------------------------------------------------------------------
# What the run hands to the next one when it finishes (#134): `then` at start, or a gate choice's.
outputs:
  branch:
    type: string
    description: The branch the developer worked on.
    value: "{{ steps.develop.output.branch }}"
  merged_commit:
    type: string
    description: "The commit the squash merge created on the base branch, read from the platform by the deployer. Empty when nothing was merged."
    value: "{{ steps.deploy_prod.output.merge_commit if steps.deploy_prod.output else '' }}"
  issues:
    type: array
    description: "The issues the run implemented (number, url, title)."
    value: "{{ run.issues | to_json }}"
  pr_url:
    type: string
    description: The pull/merge request the run opened.
    value: "{{ steps.ci.output.pr_url }}"

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
