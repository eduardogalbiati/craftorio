# =============================================================================
# Workflow: Fix (#630, spec R8)
# Orchestrator AI (#97): written for Claude; the AI chosen in the Setup or Settings › Agents & CLIs
# (settings.orchestratorProvider) runs it: on Codex, the orchestrator and every agent move to Codex, each Claude
# model replaced by its counterpart (packages/shared/orchestrator-models.js, the one mapping table).
#   reproduce ─► develop ─► rule_check ─► secret_scan ─► code_review ─► suite ─► verify_change ─┬─ Local:  merge: local ─► push_main ─► end
#                                                                                └─ Remote: ci (PR + CI) ─► pr_monitor ─► end
#   - reproduce (the developer): one command that shows the bug for the reported reason, a failing
#     regression test when it can; no production code yet (fragments/fix-pipeline.yaml).
#   - develop: the fix of the root cause, with the regression test that failed before it.
#   - rule_check (no agent, #50): the project's rule checks after each fix commit, as feature's: the
#     check_command, the `check` script, else its own linter and type checker, only for what the change
#     added. Back to develop at most twice, then check_failed; an environment failure (#30) stops at
#     check_environment (fragments/check-pipeline.yaml).
#   - secret_scan (no agent, #49): gitleaks on the run's own commits; a finding goes back to develop at
#     most twice, then secret_found (fragments/secret-scan-pipeline.yaml).
#   - code_review, suite, verify_change, verify_failed: fragments/dev-pipeline.yaml.
#   - Local mode: the run's branch is merged into the local base (resolve_merge / merge_blocked on a
#     conflict, fragments/local-merge-pipeline.yaml), then push_main pushes it (the project auto-push
#     is gone, #617; the engine pushes, no agent, #861). Remote mode: fragments/pr-pipeline.yaml, the team merges the PR/MR.
#   - Fork + PR mode (#738, no push access to the original): the same pr-pipeline, the branch pushed
#     to the owner's fork (origin) and the PR opened against the original (upstream).
#   - Hotfix mode (input `hotfix`): the urgent lane; the fix starts from the last release tag and ships
#     as a patch (spec R7: with tags, a hotfix branches from the last tag).
#   - Approval before merge (input `approve_before_merge`, #634: the Monitor's "Propose fix" sets it):
#     verify_change ─► validate (your approval) ─► the Local or Remote lane; a rejection goes back to
#     develop with your note.
# =============================================================================
apiVersion: craftorio/v1
kind: Workflow

metadata:
  name: fix
  version: 0.1.0
  description: "Reproduces a bug, fixes it with its regression test, reviews, tests and verifies it. Local mode: merged into the local base branch, then pushed (push main). Remote mode: a pull request and its CI. Hotfix mode: from the last release tag, shipped as a patch."
  tags: [fix, review, test, local, remote, worktree]
  category: build

inputs:
  task:
    label: "Task"
    type: string
    required: true
    description: The bug to fix.
  issue:
    label: "Issue"
    type: string
    default: ""
    description: "URL of the issue this run fixes (set by the Backlog screen)."
  issues:
    label: "Issues"
    type: array
    default: []
    description: "URLs of the issues this run fixes together, in one branch (set by the Backlog screen; one per line)."
  # #836: a frozen mockup version (the mockups editor's "Start a development run" fills it); optional.
  mockup:
    label: "Mockup"
    type: string
    default: ""
    description: "Folder of a frozen mockup version (index.html and kit/) the fixed screen follows. Empty: no mockup."
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path (a git repository).
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The branch the work starts from and lands on.
  mode:
    label: "Mode"
    type: string
    enum: [local, remote, fork]
    default: local
    options: { local: "Local", remote: "Remote (pull request)", fork: "Fork + PR" }
    description: "Local: merged into the local base branch, then the run pushes it (push main). Remote: the run pushes its branch, opens a pull request and waits for its CI; the team merges it on the platform. Fork + PR (no push access to the original): the run pushes its branch to your fork (origin) and opens the pull request against the original (upstream); the maintainers merge it."
  # #738 Fork + PR: a dependent roadmap item starts from its parent's branch on the fork (set by the roadmap)
  parent_branch:
    label: "Parent branch"
    type: string
    default: ""
    show_if: "mode != 'local'"
    description: "Fork + PR: the branch on your fork this run starts from (the earlier item of a split implementation). Remote (#807, a stacked roadmap stage): the previous stage's branch, also the pull request's base. Empty: the default branch."
  depends_on:
    label: "Depends on"
    type: string
    default: ""
    show_if: "mode == 'fork'"
    description: "Fork + PR: the earlier pull request this one depends on (e.g. #12), written in the pull request's body."
  parent_pr:
    label: "Parent pull request"
    type: string
    default: ""
    show_if: "mode != 'local'"
    description: "Fork + PR: the URL of the earlier pull request to wait for. The pull request opens once it merged upstream, rebased onto the synced default branch. Remote (#807, stacked): the pull request this one builds on; it opens at once and moves to the default branch when that one merges."
  hotfix:
    label: "Hotfix"
    type: boolean
    default: false
    description: "An urgent fix: the smallest change, meant for a patch release from the last tag. For now it guides the agents only: the run still starts from the base branch, and the patch is released with the release workflow."
  # #634: a fix proposed by the Monitor waits for the owner before it lands
  approve_before_merge:
    label: "Approve before merge"
    type: boolean
    default: false
    description: "Wait for your approval after the verification, before the change is merged or a pull request is opened (set by the Monitor's Propose fix)."
  git_platform:
    label: "Git platform"
    type: string
    enum: [gh, gl]
    default: gh
    options: { gh: GitHub, gl: GitLab }
    show_if: "mode != 'local'"
    description: "Where Remote and Fork + PR modes open the pull request (merge request on GitLab)."
  test_command:
    type: string
    default: ""
    label: Test command
    description: "The project's whole-suite command (e.g. npm test, cargo test). Empty: found from the project's files (package.json, go.mod, Cargo.toml, pom.xml, build.gradle, *.csproj, pyproject.toml)."
  # #50: the project's fast rule checks, run after each developer commit (rule_check)
  check_command:
    type: string
    default: ""
    label: Check command
    description: "The project's fast rule checks (lint, types...) the orchestrator runs after each developer commit; failures go back to the developer. Empty: the project's `check` script (npm run check), else the linter and the type checker the project itself configures and has installed (only what the change added goes back); a project with none skips the step. off: no checks."
  # #49: gitleaks on the run's own commits (secret_scan); off for a project that has its own scan
  secret_scan:
    type: string
    enum: ["on", "off"]
    default: "on"
    label: Secret scan
    label_key: workflow_texts.feature_secret_scan_label
    help_key: workflow_texts.feature_secret_scan_desc
    options_key: workflow_texts.feature_secret_scan_opt
    options: { "on": "On", "off": "Off" }
    description: "Before the code review, gitleaks looks for secrets in the commits of the run (no agent). On: a finding goes back to the developer, at most twice, then to you; nothing is merged or pushed while it is open. Without gitleaks installed the run goes on and says that secrets were not scanned. Off: for a project that has its own scan."
  # #71: the owner's policy for a project with no test command and no test file
  no_tests:
    type: string
    enum: [continue, ask]
    default: continue
    label: A project with no tests
    options: { continue: Continue, ask: Ask }
    description: "When the project has no test command and no test file. Continue: the run goes on, reported as not tested because the project has no tests. Ask: the verify_failed gate waits for you. A project with test files and no known command goes on to the verification, reported as not tested: no test command."

providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    effort_args: ["--effort", "{{ effort }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

x-tools:
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:go, bash:mvn, bash:gradle, bash:dotnet, bash:cargo]
  vcs: &vcs [bash:git, bash:gh, bash:glab]

defaults:
  fresh_after_idle: 55m
  working_dir: "{{ worktree_dir }}"
  timeout: 30m
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5-5
  # #630: the local <base> in Local mode (no fetch), the fetched origin/<base> in Remote mode
  # #738: Fork + PR syncs the fork's <base> with upstream's first (or starts at origin/<parent_branch>)
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
    remote: "{{ inputs.mode != 'local' }}"
    fork: "{{ inputs.mode == 'fork' }}"
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2
    max_cost_usd: 5
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 60

agents:
  developer:
    provider: claude
    model: claude-opus-5-5
    effort: high
    session: persistent
    capabilities: { tools: [*toolchains, edit, read, write], web: false }
    # #633: the SDLC documents are the pre-flow's (write-doc) and the post-flow's (sdlc-*), never the run's
    protect_files:
      - "docs/work/**"
    # #49: the secret scan's findings
    skills: [secret-triage]
    system_prompt: |
      You are the developer. You reproduce the bug, then fix its root cause on the run's branch with a
      small change that follows the project's conventions and a regression test that failed before
      the fix. Never write under docs/work/. Never push.
      {% if inputs.mockup %}
      {# #836: a frozen mockup version #}
      The fixed screen follows the frozen mockup version in `{{ inputs.mockup }}`: its `index.html`
      is the screen and `kit/` the kit it uses; open both before you touch the markup.
      {% endif %}
  reviewer:
    provider: claude
    model: claude-opus-5-5
    effort: medium
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    skills: [code-review]
    system_prompt: |
      You are the code reviewer. Follow the code-review skill; you change nothing. Read the project's
      REVIEW.md (repository root) when it exists and apply its rules (#633).
  verifier:
    provider: claude
    model: claude-sonnet-5-5
    effort: medium
    session: persistent
    capabilities: { tools: [*toolchains, read], web: false }
    system_prompt: |
      You are the verifier. You check, with one command and its observed result, that the bug is gone.
  ci_pusher:
    provider: claude
    model: claude-sonnet-5-5
    session: handoff
    capabilities: { tools: [read, *vcs], web: false }
    skills: ["ci-pipeline-{{ inputs.git_platform }}"]
    system_prompt: |
      You are the CI Pusher. You push the branch, make sure a PR/MR is open and watch CI until it
      passes. You do not fix code and you do not merge.

steps:
  - id: reproduce
    fragment: fix-pipeline
    agent: developer
    transitions:
      - when: "true"
        goto: develop
  - id: develop
    fragment: fix-pipeline
    agent: developer
    transitions:
      - when: "true"
        goto: rule_check
  # #50: the project's rule checks after each commit (no agent), as feature.yaml's rule_check (#404): the
  # check_command, the `check` script, else the project's own linter and type checker; none: skipped.
  # Findings go back at most twice (a pass resets the count), then to you at check_failed.
  - id: rule_check
    fragment: check-pipeline
    transitions:
      # #30: the environment, not the code: no round counted
      - when: "output.status == 'fail' and output.failure_kind == 'environment'"
        goto: check_environment
      - when: "output.status == 'fail' and (vars.check_returns or 0) | int < 2"
        goto: develop
        set: { check_returns: "{{ (vars.check_returns or 0) | int + 1 }}" }
      - when: "output.status == 'fail'"
        goto: check_failed
      - when: "true"
        goto: secret_scan
        set: { check_returns: "0" }
  # #49: gitleaks on the run's own commits (base to HEAD), no agent, no model call. The last agent-less step before the review.
  # A finding goes back to the developer at most twice (a pass resets the count), then to you at
  # secret_found; not installed or turned off: skipped, said as "secrets not scanned", never as passed.
  - id: secret_scan
    fragment: secret-scan-pipeline
    transitions:
      # gitleaks failed, or its range could not be read: you, never a pass nor the developer's round
      - when: "output.status == 'error'"
        goto: secret_scan_error
      - when: "output.status == 'fail' and (vars.secret_returns or 0) | int < 2"
        goto: develop
        set: { secret_returns: "{{ (vars.secret_returns or 0) | int + 1 }}" }
      # returns used up: the owner decides (a goto, not on_exhausted: no supervisor wake-up first)
      - when: "output.status == 'fail'"
        goto: secret_found
      - when: "true"
        goto: code_review
        set: { secret_returns: "0" }

  # #49: a finding that stays. Every way on goes through the scan again
  - id: secret_found
    fragment: secret-scan-pipeline
    transitions:
      - when: "choice == 'stop'"
        goto: end
        status: failed
      - when: "choice == 'rescan'"
        goto: secret_scan
      # a gate answered by its first choice must not loop forever (as check_environment)
      - when: "true"
        goto: develop
        set: { secret_returns: "0" }
        max_visits: 3
        on_exhausted: end
        status: failed

  - id: secret_scan_error
    fragment: secret-scan-pipeline
  - id: code_review
    fragment: dev-pipeline
    agent: reviewer
    transitions:
      # #81: decided when the run started (no test command given or found: `no_test_command`), so the
      # suite step is skipped and the verification runs; no_tests: ask still goes through the suite
      - when: "output.approved and no_test_command and inputs.no_tests != 'ask'"
        goto: verify_change
        set: { tested: "no test command" }
      - when: "output.approved"
        goto: suite
      - when: "true"
        goto: develop
        max_visits: 2
        on_exhausted: verify_failed
  - id: suite
    fragment: dev-pipeline
    command: "{{ inputs.test_command }}"
    transitions:
      - when: "output.status == 'pass'"
        goto: verify_change
        set: { tested: "" }
      # #81: test files but no test runner (a plain HTML site, a Markdown-only repository): a known gap,
      # not a gate; the verification runs, the change reported as not tested: no test command
      - when: "output.status == 'not_run' and output.no_command"
        goto: verify_change
        set: { tested: "no test command" }
      # #71: a project with no tests is not a failure (no_tests: ask keeps the gate)
      - when: "output.status == 'not_run' and inputs.no_tests != 'ask'"
        goto: verify_change
        set: { tested: "no tests" }
      - when: "output.status == 'not_run'"
        goto: verify_failed
      - when: "output.status == 'blocked'"
        goto: verify_failed
      - when: "true"
        goto: develop
        max_visits: 2
        on_exhausted: verify_failed
  - id: verify_change
    fragment: dev-pipeline
    agent: verifier
    transitions:
      - when: "output.verdict != 'not_verified' and inputs.approve_before_merge"
        goto: validate
      - when: "output.verdict != 'not_verified' and inputs.mode != 'local'"
        goto: ci
      - when: "output.verdict != 'not_verified'"
        merge: local
        goto: push_main
        on_error: resolve_merge
      - when: "true"
        goto: develop
        max_visits: 2
        on_exhausted: verify_failed
  # #634: the owner's approval before the change lands (input approve_before_merge)
  - id: validate
    fragment: dev-pipeline
    transitions:
      - when: "approved and inputs.mode != 'local'"
        goto: ci
      - when: "approved"
        merge: local
        goto: push_main
        on_error: resolve_merge
      - when: "rejected"
        goto: develop
  - id: verify_failed
    fragment: dev-pipeline
    transitions:
      # #71: no_tests: ask and an Approve right after the suite: on to the verification, as Continue does
      # (verify_change and code_review open this gate after their own rounds: their Approve lands the change)
      - when: "approved and steps.suite.output and steps.suite.output.status == 'not_run' and not steps.suite.output.no_command and previous_step not in ['code_review', 'verify_change']"
        goto: verify_change
        set: { tested: "no tests" }
      - when: "approved and inputs.mode != 'local'"
        goto: ci
        set: { tested: "{{ ('no test command' if steps.suite.output.no_command else 'no tests') if steps.suite.output and steps.suite.output.status == 'not_run' else vars.tested or '' }}" }
      - when: "approved"
        merge: local
        goto: push_main
        on_error: resolve_merge
        set: { tested: "{{ ('no test command' if steps.suite.output.no_command else 'no tests') if steps.suite.output and steps.suite.output.status == 'not_run' else vars.tested or '' }}" }
      - when: "rejected"
        goto: end
        status: failed

  # #404: still failing after the developer's rounds. A decision: neither the supervisor nor a retry answers it
  - id: check_failed
    fragment: check-pipeline
    choices:
      - { id: continue, label: "Continue to the review anyway", help: "The review and the suite run; the change is reported as not passing the rule checks." }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'stop'"
        goto: end
        status: failed
      - when: "true"
        goto: secret_scan
        set: { check_returns: "0" }

  # #30: the checks cannot run here (dependencies not installed, a command missing): you fix the environment
  # and try again; no round counted. A decision, like check_failed
  - id: check_environment
    fragment: check-pipeline

  # ============================ LOCAL MODE ===================================
  - id: resolve_merge
    fragment: local-merge-pipeline
    agent: developer
  - id: merge_blocked
    fragment: local-merge-pipeline
  - id: push_main
    fragment: local-merge-pipeline

  # ============================ REMOTE MODE ==================================
  - id: ci
    fragment: pr-pipeline
    agent: ci_pusher
  - id: ci_failed
    fragment: pr-pipeline
  - id: pr_monitor
    fragment: pr-pipeline

groups:
  - name: Develop
    steps: [reproduce, develop, rule_check, secret_scan, secret_found, secret_scan_error]
  - name: Review
    steps: [code_review]
  - name: Validate
    steps: [suite, check_failed, check_environment, verify_change, validate, verify_failed]
  - name: Merge
    steps: [resolve_merge, merge_blocked, push_main, ci, ci_failed, pr_monitor]

outputs:
  branch:
    type: string
    description: The branch the developer worked on.
    value: "{{ steps.develop.output.branch }}"
  # #651: the result the post-flow (sdlc-record, chained with `then`) records in docs/work/<item>/
  merged_commit:
    type: string
    description: The commit the run merged into the local base branch (merge local). Empty when nothing was merged.
    value: "{{ run.local_merge.commit if run.local_merge else '' }}"
  issues:
    type: array
    description: "The issues the run implemented (number, url, title)."
    value: "{{ run.issues | to_json }}"
  pr_url:
    type: string
    description: The PR/MR the remote mode opened; empty in local mode.
    value: "{{ steps.ci.output.pr_url if steps.ci.output and steps.ci.output.pr_url else '' }}"
  evidence:
    type: object
    description: "The run's evidence (suite, e2e, screenshots, axe) for the post-flow's test.md row; a fix runs no E2E, screenshots or axe."
    value: "{% set so = steps.suite.output or {} %}{% set ev = { 'suite': { 'status': ('not run' if so.status == 'not_run' else so.status) or 'not run', 'passed': so.passed, 'failed': so.failed }, 'e2e': 'not run', 'screenshots': [], 'screenshots_reason': 'the fix workflow takes no screenshots', 'axe': [] } %}{{ ev | to_json }}"
