# =============================================================================
# Workflow: Release (#260)
# -----------------------------------------------------------------------------
#   version ──► unit (suite, no agent) ──(green)──► e2e (suite, no agent) ──(green)──► [review] ──► ship (you)
#                 ▲   │                               │                                            ├─ Ship ─► push the local base + tag ─► end
#                 │   └──────────(red)──► fix ◄─(red)─┘                                            └─ Hold ─► end (nothing pushed)
#                 └──────────────────── (developer)
#        at most max_rounds fixes per suite, then regression_failed (you)
#        review: only after a fix or a second round (nothing to review otherwise)
#
# What it is for: the work of many runs merges into the LOCAL base one after another, and nothing
# checks their sum. A release run checks it (regressions across runs) and asks you, and only you,
# whether it goes out. It starts when a roadmap reaches a cut line ("Release here", the stages
# after the line wait for it) or from Code & Build › Releases.
#
# 0. version: no agent (#325): a Node project (a package.json in the worktree) gets the release's
#           version (a semver, a leading `v` dropped) in package.json and the root of its
#           package-lock.json / npm-shrinkwrap.json, committed on the run's branch
#           `release-fix-<run id>` BEFORE the suites, so the commit Ship tags is one they passed on.
#           Nothing is written for a name that is not a semver (`release-<run id>`, `v1.4`), a project
#           without package.json, the same version or a lower one (never a downgrade): the run log
#           says why and the run goes on. A simulation writes nothing and says what it would set.
#           Products (#46): a repository that declares `products` in its .craftorio/project.yaml
#           ({ id, folder, tag_prefix, version_command }) releases one of them, the `product` input
#           (not needed with only one): its own version_command writes the version and the changelog,
#           the run commits them, and Ship tags <tag_prefix><version>. The run stops before the suites
#           when the product is unknown or not chosen, the version is not a semver, is lower, or is not
#           the one the command wrote (both are said). A product already at the version is released as
#           it is (a first release): no command, no commit. The last release is the product's own last
#           tag. Its merged issues with no changeset (a repository with a .changeset folder) are in the
#           log and in the Ship gate; you can ship anyway.
# 1. unit:  a suite step (#177: no agent, no tokens): the project's WHOLE unit suite in the run's own
#           worktree of the local base, every round.
# 2. e2e:   a suite step: the project's end-to-end suite (`e2e_command`; skipped with `e2e_suite:
#           skip`, for a project without an E2E suite). `scope: failed` (#324): the first round runs
#           the WHOLE suite; after a fix, a round runs only the feature files that failed in the
#           previous round (plus the .feature files the fixes changed), then, once they pass, the
#           whole suite in the same visit: only a green whole run leads to review / ship, and a red
#           focused run goes back to fix (it counts as a round). A command that cannot be filtered
#           (not npm/pnpm/yarn test or run <script>) runs the whole suite and its output says so.
#           A fix round that changed nothing (#364: no commit since the round that last ran the whole
#           suite and a clean worktree) skips the whole rerun: the green focused files complete the
#           round and that whole run's result stands for the rest; any commit or uncommitted change
#           keeps the whole rerun. Each round's output records its commit (`suite_scope` shows it).
#           Both suites run with `base_check: false`: the worktree is the base, so nothing that
#           fails there is "pre-existing".
# 3. fix:   only for a red suite: the developer gets the history since the last release (the runs,
#           their issues, decisions and handoff notes, the commits), finds the change that broke it
#           and fixes the production code on the run's branch; then both suites run again.
# 3b. review: after the last green suite of a run that needed a fix (or a second round), a cheap
#           read-only agent writes the release summary (#290: verdict, timeline, the fixes, what to
#           check before you ship, follow-ups) from the trail, every fix round's output and the fix
#           branch's log; it leads the Ship gate and is saved as release-summary.md. It never
#           blocks: a review that fails goes on to ship, whose message says the summary is missing.
# 4. ship: your gate, never answered by automation (a decision gate: not the supervisor, no
#           timeout, not --auto-approve). Ship: the run's branch (the version commit, a fix made
#           here) is merged into the local base (merge: local), the local base is pushed to origin (never forced) and tagged with the
#           release's name, then the optional build command runs (`ship:`). A
#           local base that moved since the suites ran (another run merged) is refused: it would
#           ship commits nobody checked. Hold:
#           the run ends, nothing is pushed or tagged; its branch keeps the version commit and a fix
#           (the local base and origin are untouched), resume the run from this gate to ship later.
# The release notes are edited in Code & Build › Releases until you ship; shipping records the
# release there and marks its issues Released.
# =============================================================================

apiVersion: craftorio/v1
kind: Workflow

metadata:
  name: Release
  version: 0.1.0
  description: Checks what merged locally since the last release with the project's whole unit suite and whole E2E suite (no agent while they are green; a regression goes to the developer with the history since the last release), then you Ship (push the local base, tag, optional build) or Hold. Nothing is pushed without your Ship.
  tags: [release, test, e2e, regression, local, worktree]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    label: "Task"
    type: string
    required: true
    default: "Check the release: the whole unit suite and the whole E2E suite, then Ship or Hold."
    description: What this release run is for (e.g. the release it checks). A roadmap's cut line fills it.
  version:
    label: "Version"
    type: string
    default: ""
    description: "The release's name or version (e.g. v1.4.0): the tag Ship pushes. A semver (a leading v dropped) is also written into a Node project's package.json before the suites. Empty: release-<run id>. A roadmap's cut line fills it with its name. With a product: its version, written by the product's own command; the tag is the product's prefix and the version."
  product:
    label: "Product"
    type: string
    default: ""
    description: "The product this release is of, when the repository declares more than one (products in .craftorio/project.yaml: the id of one of them). Empty: its only product. Ignored by a repository that declares none."
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path (a git repository; Ship pushes its base branch to origin).
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the suites run on and Ship pushes.
  unit_command:
    label: "Unit test command"
    type: string
    default: ""
    description: "The command that runs the project's whole unit suite, run by the orchestrator (e.g. npm test). Empty: found from the project's files."
  e2e_suite:
    label: "E2E suite"
    type: string
    enum: [run, skip]
    default: run
    options: { run: Run, skip: "Skip (the project has none)" }
    description: "Skip only for a project without an end-to-end suite: the unit suite alone then decides. A roadmap's cut line skips it when the project has no test:e2e script."
  e2e_command:
    label: "E2E command"
    type: string
    # #735: no Node assumption; empty runs npm run test:e2e (the projects whose package.json has it)
    default: ""
    show_if: "e2e_suite == 'run'"
    description: "The command that runs the whole E2E suite, run by the orchestrator (no agent). Empty: the project's own (its run defaults), else npm run test:e2e. After a fix, its failed feature files are passed to it first (npm/pnpm/yarn run <script>), then the whole suite."
  build_command:
    label: "Build command"
    type: string
    default: ""
    description: "Optional: a command Ship runs after the push and the tag (e.g. npm run package). Empty: no build."
  release_ci:
    label: "Release CI"
    type: string
    enum: [none, wait]
    default: none
    options: { none: "None (the project has no release CI)", wait: "Wait for the release CI after Ship" }
    description: "#630: with a release CI (ways of working ci: release or pr+release), the run waits after Ship until the CI the tag starts is green."
  history:
    label: "History since the last release"
    type: string
    default: ""
    description: The runs, issues and commits since the last release, for the developer when a suite is red (filled by the app).
  time_budget_minutes:
    label: "E2E time budget (minutes)"
    type: integer
    default: 60
    description: The time the whole E2E suite may take in one pass; the suite step stops it after that.
  max_rounds:
    label: "Max rounds"
    type: integer
    default: 2
    description: Fix rounds per suite (the developer, then both suites again) before you are asked.

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    effort_args: ["--effort", "{{ effort }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

x-tools:
  # every supported language toolchain: the project's files say which one is used
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:uv, bash:poetry, bash:go, bash:mvn, bash:./mvnw, bash:mvnw.cmd, bash:gradle, bash:./gradlew, bash:gradlew.bat, bash:dotnet, bash:cargo]

defaults:
  # the run's own git worktree of the local base
  working_dir: "{{ worktree_dir }}"
  timeout: 30m
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5-5
  # <workspace>/worktrees/<run_id>, detached at the LOCAL <base> (remote: false: origin/<base> is fetched only to compare);
  # dependencies linked from the shared cache (#198)
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2
    max_cost_usd: 5
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 40
    max_total_context: 30M

# -----------------------------------------------------------------------------
agents:
  developer:
    provider: claude
    model: claude-opus-5-5
    session: handoff
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # the tests and scenarios are the specification the release is checked against
    edits_tests: false
    # developer-self-review (#756): the shared reuse pass and the issue's tasks before handing over
    skills: [long-commands, bug-diagnosis, context-economy, decision-log, developer-self-review]
    system_prompt: |
      You are a senior software engineer fixing a regression a release check found: a test that
      passed when its change merged and fails now, on the sum of the runs merged since the last
      release. Find the change that broke it from that history, then make the smallest
      production-code fix that addresses the root cause, following the existing architecture.
      Never create, edit or delete tests or scenarios (the orchestrator refuses a turn that
      changes one): when one is wrong, say why in your answer. Run a focused check, not the whole
      suite (the orchestrator runs both suites again after your step).
      Work on your own branch in this worktree (it starts at the LOCAL {{ inputs.base_branch }};
      the run's version commit may already be on `release-fix-{{ run_id }}`): stay on
      `release-fix-{{ run_id }}` when it is checked out, else `git switch -c release-fix-{{ run_id }}`
      once (or `git switch release-fix-{{ run_id }}` when it exists), then commit there. Never fetch, pull, push or
      tag: only the owner ships. The dependencies are linked from a shared cache: never run
      `npm ci` and never delete `node_modules`.

  # #290: the release summary for the Ship gate. Cheap by construction: the workflow's cheap model,
  # one turn (no retry, no supervisor), a fresh session, everything it needs in its prompt.
  reviewer:
    provider: claude
    model: claude-sonnet-5-5
    session: ephemeral
    timeout: 5m
    retry: { max_attempts: 1 }
    capabilities: { tools: [read], web: false, subagents: false }
    system_prompt: |
      You review what a release run did and write its summary for the owner, who reads it at the
      Ship gate before deciding whether to push and tag. You only read: never edit, write, commit,
      push or tag, and never answer a gate. Work from the facts in your prompt; write in the
      language the Language line names, short, and say "unknown" rather than guess.

  # #630: watches the release CI after Ship (release_ci); reads only
  ci_pusher:
    provider: claude
    model: claude-sonnet-5-5
    session: handoff
    capabilities: { tools: [read, bash:git, bash:gh, bash:glab], web: false, subagents: false }
    system_prompt: |
      You watch the release CI after the owner shipped: you read the CI runs of the pushed tag on
      the platform (gh or glab) and report their status. You never push, tag, edit or merge.

groups:
  - name: Regression
    steps: [version, unit, e2e, suite_blocked]
  - name: Fix
    steps: [fix, regression_failed]
  - name: Ship
    steps: [review, ship, ship_failed, release_ci, release_ci_failed]

# -----------------------------------------------------------------------------
steps:

  # #325: the release's version into a Node project's package.json (and its lockfile's root), one
  # commit on the run's branch before the suites: what they pass on is what Ship tags. Never fails the
  # run: a name that is not a semver, no package.json or nothing to change is said in the run log.
  # With a product (#46) its own command writes the version, and what cannot be released stops the run.
  - id: version
    display: Release version
    type: release_version
    version: "{{ inputs.version or ('release-' ~ run_id) }}"
    product: "{{ inputs.product }}"
    branch: "release-fix-{{ run_id }}"
    transitions:
      - when: "true"
        goto: unit

  # the whole unit suite, run by the orchestrator: no agent, no tokens while it is green
  - id: unit
    display: Unit tests
    type: suite
    command: "{{ inputs.unit_command }}"
    # the worktree IS the local base: a test that fails here is the regression, not a failure
    # "that fails on the base too" to wave through (#211)
    base_check: false
    transitions:
      # a project without an E2E suite (e2e_suite: skip): the unit suite alone decides; after a fix
      # or a second round, the release summary first (#290)
      - when: "output.status == 'pass' and inputs.e2e_suite == 'skip' and (steps.fix.visits or steps.unit.visits > 1)"
        goto: review
      - when: "output.status == 'pass' and inputs.e2e_suite == 'skip'"
        goto: ship
      - when: "output.status == 'pass'"
        goto: e2e
      - when: "output.status == 'blocked'"
        goto: suite_blocked
        set: { red_suite: unit }
      # a red suite: the only way to an agent
      - when: "output.status == 'fail'"
        goto: fix
        set: { red_suite: unit }
        max_visits: "{{ inputs.max_rounds }}"
        on_exhausted: regression_failed

  # the E2E suite, once the unit suite is green: whole in round 1; after a fix, the feature files that
  # failed first, then the whole suite in the same visit when they pass (#324), unless nothing changed
  # since the last whole run (#364)
  - id: e2e
    display: E2E scenarios
    type: suite
    command: '{{ inputs.e2e_command or "npm run test:e2e" }}'
    scope: failed
    timeout: "{{ inputs.time_budget_minutes }}m"
    base_check: false
    transitions:
      # after a fix or a second round of a suite, the release summary first (#290); one green round
      # of each suite: nothing to review
      - when: "output.status == 'pass' and (steps.fix.visits or steps.unit.visits > 1 or steps.e2e.visits > 1)"
        goto: review
      - when: "output.status == 'pass'"
        goto: ship
      - when: "output.status == 'blocked'"
        goto: suite_blocked
        set: { red_suite: e2e }
      - when: "output.status == 'fail'"
        goto: fix
        set: { red_suite: e2e }
        max_visits: "{{ inputs.max_rounds }}"
        on_exhausted: regression_failed

  - id: fix
    display: Fix the regression
    agent: developer
    prompt: |
      {{ inputs.task }}
      The release check of the local `{{ inputs.base_branch }}` is red.
      {% if vars.red_suite == 'e2e' %}The {{ 'E2E feature files that failed in the previous round' if steps.e2e.output.scope == 'files' else 'whole E2E suite' }} (`{{ steps.e2e.output.command }}`, round {{ steps.e2e.visits }}) fail: {{ steps.e2e.output.message }}
      {{ steps.e2e.output | suite_failures }}
      Its whole output: {{ run_dir }}/{{ steps.e2e.output.log }} (read the failures from it, not the whole file); the
      failed scenarios' traces and screenshots are where the project's E2E config writes them.
      {% else %}The whole unit suite (`{{ steps.unit.output.command }}`, round {{ steps.unit.visits }}) fails: {{ steps.unit.output.message }}
      {{ steps.unit.output | suite_failures }}
      Its whole output: {{ run_dir }}/{{ steps.unit.output.log }} (read the failures from it, not the whole file).
      {% endif %}
      These tests passed when each change merged: one of the changes merged since the last release
      broke them, alone or together with another one. The history since the last release:
      {% if inputs.history %}{{ inputs.history }}
      {% endif %}
      - Commits: `git log --oneline origin/{{ inputs.base_branch }}..HEAD` (what origin does not have; {% if steps.version.output.product %}{% if steps.version.output.previous_version %}since the last release of {{ steps.version.output.product }}, `git log --oneline {{ steps.version.output.previous_version }}..HEAD`{% else %}{{ steps.version.output.product }} has no release yet{% endif %}{% else %}with a
        release tag, `git log --oneline <last tag>..HEAD`{% endif %}). Each message names the issues it closes (`Closes #n`).
      - Runs and issues: the `summary.json` files under {{ runs_dir }} whose local merge commit is in
        that range (run id, workflow, issues, title).
      - Decisions: each of those runs' `decisions.tsv` (why its agents chose what they did).
      - Handoff notes: each of those runs' `handoffs/` folder (what its agents left for the next turn).
      Start from the change that touches the failing behaviour; read a run's decisions and handoff
      notes only when its commits are suspects.
      {% if steps.fix.visits > 1 %}
      Your previous fix (round {{ steps.fix.visits - 1 }}, branch `{{ steps.fix.output.branch }}`) did not turn the suites green: {{ steps.fix.output.summary }}
      {% endif %}
      Diagnose following bug-diagnosis, fix the production code on your branch, run a focused
      check, commit and report the commit hash. In `regression`, name the change that broke it
      (commit, run, issue). A test you think is wrong goes in `test_notes` with why; do not change it.
    output_schema:
      type: object
      required: [branch, summary, committed]
      properties:
        branch:     { type: string }
        summary:    { type: string }
        committed:  { type: boolean }
        commit_sha: { type: string }
        # the change that broke the suite: commit, run, issue
        regression: { type: string }
        test_notes: { type: string }
    transitions:
      # a fix changes the code: both suites run again, the unit suite first
      - when: "true"
        goto: unit

  # #290: what the run did, for the owner at the Ship gate. Everything is in the prompt (the trail,
  # every round's output, the fix branch's log, the versions), so it reads no events.jsonl. It never
  # blocks the release: a failure or a timeout goes on to ship (no supervisor: on_error), whose
  # message then says the summary is missing.
  - id: review
    display: Release summary
    agent: reviewer
    supervise: false
    on_error: ship
    prompt: |
      Write the summary of this release run for its owner, who reads it at the Ship gate before
      deciding whether to push and tag. Everything you need is below: do not read the run's
      events.jsonl or logs (read a file of the repository only when a fix's diff is unclear).

      Release `{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}` of the local `{{ inputs.base_branch }}` ({{ inputs.task }}).
      {% if steps.version.output.product %}Product: {{ steps.version.output.product }}. {% endif %}Project version: {{ (worktree_dir or inputs.repo_path) | project_version(steps.version.output.folder) or 'no version file found' }}
      {% if steps.version.output.change %}The run's version commit ({{ steps.version.output.commit or 'simulation: not written' }}) ships with the release: {{ steps.version.output.change }}. It already matches the release: do not report the version as a mismatch.
      {% else %}The run wrote no version: {{ steps.version.output.message | one_line(200) }}
      {% endif %}The {{ "product's" if steps.version.output.product else "repository's" }} last tags (newest first):
      {{ (worktree_dir or inputs.repo_path) | git_tags(5, steps.version.output.tag_prefix) or '(none)' }}
      {% if steps.version.output.product %}The commits {% if steps.version.output.previous_version %}since its last release, {{ steps.version.output.previous_version }}{% else %}of the repository (the product has no release yet){% endif %}, newest first, at most 30:
      {{ steps.version.output.history or '(none)' }}
      {% endif %}
      Round by round (step #visit: result, time, cost), {{ ((trail | sum('durationMs')) / 60000) | round(1) }} minutes and US$ {{ (trail | sum('cost')) | round(2) }} so far:
      {% for t in trail %}{% if t.step != 'review' %}- {{ t.step }} #{{ t.visit }}: {{ t.status }}, {{ (t.durationMs / 1000) | round | int }} s{% if t.cost %}, US$ {{ t.cost | round(2) }}{% endif %}
      {% endif %}{% endfor %}
      The unit suite (`{{ steps.unit.output.command }}`), each round:
      {% for o in steps.unit.outputs %}- unit round {{ loop.index }}: {{ o.status }}, {{ o | suite_scope }}: {{ o.message | one_line(300) }}
      {% endfor %}
      {% if inputs.e2e_suite == 'skip' %}The E2E suite was skipped (the project has none).{% else %}The E2E suite (`{{ inputs.e2e_command or "npm run test:e2e" }}`), each round (focused: only the files that failed before, then whole):
      {% for o in steps.e2e.outputs %}- e2e round {{ loop.index }}: {{ o.status }}, {{ o | suite_scope('scenario') }}: {{ o.message | one_line(300) }}
      {% endfor %}{% endif %}

      The fixes ({{ steps.fix.visits }}), oldest first, as the developer reported them:
      {% for f in steps.fix.outputs %}
      Fix {{ loop.index }}: commit {{ f.commit_sha or '(none)' }} on `{{ f.branch }}`{% if not f.committed %} (not committed){% endif %}
      - summary: {{ f.summary }}
      - regression (what broke it): {{ f.regression or '(not named)' }}
      - test_notes: {{ f.test_notes or '(none)' }}
      {% else %}
      (none)
      {% endfor %}

      The fix branch `release-fix-{{ run_id }}` against the local base (`git log --stat {{ inputs.base_branch }}..HEAD`):
      {{ (worktree_dir or inputs.repo_path) | git_log_stat(inputs.base_branch) or '(no commit)' }}

      Answer with `release_summary`, Markdown, short, in this order:
      1. One verdict line, no heading: both suites green or not, the rounds of each suite, the fixes, the time and the cost.
      2. `## Timeline`: a table (# | Step | Result | Time | Cost) with each suite round and each fix; an
         E2E round says whether it was focused or whole, with its scenarios and minutes.
      3. `## The fixes`: one bullet per fix: what changed (files, lines), why, and its kind: a regression
         of issue A by issue B, a defect that was already there, or a failure of the machine or of a
         flaky test. Say when a later fix makes an earlier one unnecessary.
      4. `## Before you ship`: the size of the diff to read, what Ship will merge, push and tag (the
         run's version commit, e.g. "package.json 0.3.0 → 1.2.0", when there is one), and anything
         that does not match: the release's version against the project's version (after the run's
         version commit) and its tags, a fix with no focused check, a fix that could not reproduce
         its failure.
      5. `## Follow-ups`: one line per thing worth an issue (the tests the fixes asked for in test_notes
         first), each a line the owner can turn into an issue; "None." when there is nothing.
      End with one line: "Nothing found against shipping." or "Read before shipping: <what>.". It is a
      recommendation: the owner alone answers the gate.
    output_schema:
      type: object
      required: [release_summary]
      properties:
        release_summary: { type: string }
    save_as: { path: release-summary.md, content: "{{ output.release_summary }}" }
    transitions:
      - when: "true"
        goto: ship

  # The owner's gate: a decision gate, so the supervisor never answers it, with no timeout; the
  # engine ships only on the owner's own answer (`ship:`).
  - id: ship
    display: Ship
    type: human_approval
    # #290: the release summary leads the message (rendered apart on the screens)
    report: "{{ steps.review.output.release_summary }}"
    summary: |
      {{ steps.version.output.tag or inputs.version or 'The release' }}: {{ 'the unit suite is' if inputs.e2e_suite == 'skip' else 'both suites are' }} green on the local {{ inputs.base_branch }}{% if steps.fix.visits %} after {{ steps.fix.visits }} fix round(s){% endif %}.
      Unit: {{ steps.unit.output.message | one_line(160) }}
      E2E: {{ 'skipped (the project has no E2E suite)' if inputs.e2e_suite == 'skip' else (steps.e2e.output.message | one_line(160)) }}
    message: |
      {% if steps.review.output and not steps.review.output.release_summary %}The release summary is missing: its step failed ({{ steps.review.output.error | one_line(200) }}); the run's chat has the rounds.
      {% endif %}Release {{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}: the whole unit suite {{ 'passes (the E2E suite was skipped: the project has none)' if inputs.e2e_suite == 'skip' else 'and the whole E2E suite pass' }} on the local {{ inputs.base_branch }}.
      Unit: {{ steps.unit.output.message }}
      {% if inputs.e2e_suite != 'skip' %}E2E: {{ steps.e2e.output.message }}{% endif %}
      {% if steps.version.output.change %}Version: {{ steps.version.output.change }}{% if steps.version.output.commit %} (commit {{ steps.version.output.commit | truncate(8, true, '') }} on `release-fix-{{ run_id }}`, checked by both suites){% else %} (a simulation: not written){% endif %}.
      {% elif steps.version.output.message %}Version: unchanged: {{ steps.version.output.message | one_line(200) }}
      {% endif %}{% if steps.version.output.missing_changesets | length %}Merged issues of {{ steps.version.output.product }} with no changeset (not in its changelog): #{{ steps.version.output.missing_changesets | join(', #') }}. You can ship anyway.
      {% endif %}
      {% if steps.fix.visits %}
      A regression was fixed on branch `release-fix-{{ run_id }}` ({{ steps.fix.visits }} round(s)): {{ steps.fix.output.summary }}
      {% if steps.fix.output.regression %}What broke it: {{ steps.fix.output.regression }}{% endif %}
      Show the diff to read the fix before you ship.
      {% endif %}
      Not on origin yet:
      {{ worktree_dir | git_commits('origin/' ~ inputs.base_branch) }}
      The release notes are in Code & Build › Releases: edit them there before you ship.
      {% set branch_has = (['the version commit'] if steps.version.output.written else []).concat(['the fix'] if steps.fix.visits else []) | join(' and ') %}Ship: {% if branch_has %}merge {{ branch_has }} into the local {{ inputs.base_branch }}, {% endif %}push the local {{ inputs.base_branch }} to origin and tag it `{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}`{% if inputs.build_command %}, then run `{{ inputs.build_command }}`{% endif %}.
      Hold: end the run; nothing is pushed or tagged{% if branch_has %} (the branch keeps {{ branch_has }}: resume the run from this gate to ship it later){% endif %}.
    diff_base: "{{ inputs.base_branch }}"
    choices:
      - { id: ship, label: Ship, help: "Pushes the local {{ inputs.base_branch }} to origin and tags it; the release's issues become Released." }
      - { id: hold, label: Hold, help: "Ends the run: nothing is pushed or tagged. Stages after the roadmap's cut line keep waiting." }
    transitions:
      # the worktree has commits the local base has not (a fix of any round): they are what the
      # suites passed on, so they merge before the push
      # #630: with release_ci wait, the run then waits for the release CI the tag starts (release_ci)
      - when: "choice == 'ship' and inputs.release_ci == 'wait' and (worktree_dir | git_commits(inputs.base_branch))"
        merge: local
        ship: &ship { tag: "{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}", build: "{{ inputs.build_command }}" }
        goto: release_ci
        on_error: ship_failed
      - when: "choice == 'ship' and inputs.release_ci == 'wait'"
        ship: *ship
        goto: release_ci
        on_error: ship_failed
      - when: "choice == 'ship' and (worktree_dir | git_commits(inputs.base_branch))"
        merge: local
        ship: *ship
        goto: end
        on_error: ship_failed
      - when: "choice == 'ship'"
        ship: *ship
        goto: end
        on_error: ship_failed
      - when: "choice == 'hold'"
        goto: end
        status: cancelled

  # Also a decision gate: Try again ships, so only the owner answers it.
  - id: ship_failed
    display: Ship failed
    type: human_approval
    message: |
      The release was not shipped completely: {{ action_error.message if action_error else 'unknown error' }}
      Try again: {% if worktree_dir | git_commits(inputs.base_branch) %}merge the run's branch ({{ (['the version commit, ' ~ steps.version.output.change] if steps.version.output.written else []).concat(['the fix'] if steps.fix.visits else []) | join(' and ') or 'its commits' }}) into the local {{ inputs.base_branch }}, {% endif %}push the local {{ inputs.base_branch }} and the tag again (what already went out is kept){% if inputs.build_command %}, then the build{% endif %}.
      Stop: end the run as failed; what was not pushed stays local.
    choices:
      - { id: retry, label: "Try again", help: "Runs Ship again; safe to repeat: a push or a tag already on origin is left as it is." }
      - { id: stop,  label: "Stop the run as failed", help: "Ends the run as failed; nothing more is pushed." }
    transitions:
      # the fix is not merged yet (the merge itself failed)
      - when: "choice == 'retry' and inputs.release_ci == 'wait' and (worktree_dir | git_commits(inputs.base_branch))"
        merge: local
        ship: *ship
        goto: release_ci
        on_error: ship_failed
      - when: "choice == 'retry' and inputs.release_ci == 'wait'"
        ship: *ship
        goto: release_ci
        on_error: ship_failed
      - when: "choice == 'retry' and (worktree_dir | git_commits(inputs.base_branch))"
        merge: local
        ship: *ship
        goto: end
        on_error: ship_failed
      - when: "choice == 'retry'"
        ship: *ship
        goto: end
        on_error: ship_failed
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # #630 (spec R7): the release CI the pushed tag starts (ci: release or pr+release), watched by the
  # CI pusher; nothing is pushed here. Red: the owner decides (release_ci_failed), the tag stays.
  - id: release_ci
    display: Release CI
    agent: ci_pusher
    goal:
      description: "The release CI green for the tag {{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}"
      until: "output.ci_status == 'success'"
      on_exhausted: release_ci_failed
    loop:
      interval: 1m
      max_duration: 1h
    prompt: |
      Ship pushed the local {{ inputs.base_branch }} and the tag `{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}`.
      Check the CI runs that tag (or that push) started on the remote: running or not started → pending;
      a failure → failed with failure_log (job, step, error, probable cause); every run passed → success;
      no CI at all for the tag → success with a failure_log saying so. Never push, tag or edit files.
    output_schema:
      type: object
      required: [ci_status]
      properties:
        ci_status:   { type: string, enum: [pending, failed, success] }
        run_url:     { type: string }
        failure_log: { type: string }
    transitions:
      - when: "output.ci_status == 'success'"
        goto: end
      - when: "output.ci_status == 'pending'"
        goto: release_ci
      - when: "true"
        goto: release_ci_failed

  - id: release_ci_failed
    display: Release CI failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The release CI for `{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}` did not pass (status: {{ steps.release_ci.output.ci_status }}).
      {% if steps.release_ci.output.run_url %}Run: {{ steps.release_ci.output.run_url }}
      {% endif %}Last error: {{ steps.release_ci.output.failure_log or '(none reported)' }}
      Approve: check the release CI again (after a re-run). Reject: end the run as failed (the tag stays on the remote).
    transitions:
      - when: "approved"
        goto: release_ci
      - when: "rejected"
        goto: end
        status: failed

  - id: regression_failed
    display: Regression not fixed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The {{ 'E2E' if vars.red_suite == 'e2e' else 'unit' }} suite still fails after {{ inputs.max_rounds }} fix round(s): {{ steps.e2e.output.message if vars.red_suite == 'e2e' else steps.unit.output.message }}
      Log: {{ run_dir }}/{{ steps.e2e.output.log if vars.red_suite == 'e2e' else steps.unit.output.log }}
      {% if steps.fix.output %}The developer's last fix: {{ steps.fix.output.summary }}{% endif %}
      Approve: one more fix round. Reject: stop the run as failed (nothing is pushed; its branch keeps the work to resume it).
    transitions:
      - when: "approved"
        goto: fix
      - when: "rejected"
        goto: end
        status: failed

  - id: suite_blocked
    display: Suite could not run
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The {{ 'E2E' if vars.red_suite == 'e2e' else 'unit' }} suite could not run: {{ (steps.e2e.output.reason or steps.e2e.output.message) if vars.red_suite == 'e2e' else (steps.unit.output.reason or steps.unit.output.message) }}
      Log: {{ run_dir }}/{{ steps.e2e.output.log if vars.red_suite == 'e2e' else steps.unit.output.log }}
      Approve: run both suites again (after you fixed the environment). Reject: stop the run as failed (nothing is pushed).
    transitions:
      - when: "approved"
        goto: unit
      - when: "rejected"
        goto: end
        status: failed

# -----------------------------------------------------------------------------
outputs:
  version:
    type: string
    description: The release's name (the tag Ship pushes).
    value: "{{ steps.version.output.tag or inputs.version or ('release-' ~ run_id) }}"
  previous_version:
    type: string
    description: "The tag before this release (empty when the project has none): the `since` of a refactor-proposals stage (#378)."
    value: "{{ steps.version.output.previous_version or '' }}"
    default: ""
  commit:
    type: string
    description: "The shipped commit (empty when the run did not ship, or in a simulation)."
    value: "{{ release.commit if release and release.commit else '' }}"
  unit_status:
    type: string
    description: "pass, fail or blocked: the last pass of the unit suite."
    value: "{{ steps.unit.output.status }}"
  e2e_status:
    type: string
    description: "pass, fail or blocked: the last pass of the E2E suite (empty when it never ran)."
    value: "{{ steps.e2e.output.status }}"

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
