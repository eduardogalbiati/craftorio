# =============================================================================
# Workflow: AI Development, local hero (tests first)
# The local-hero pipeline with the tests written BEFORE the code (owner, 2026-10-03; option C of
# reports/piramide-de-testes-com-agentes-2026-10-03.md, #220):
#   acceptance_tests ─► red_check ─► warm_up ─► develop ─► rule_check ─► docs_check ─► code_review ─► suite ─► build ─► evidence ─► verify_change ─► local merge
#   #29, test order "code first" (inputs.test_order.starts): the run starts at warm_up and the test
#   writer comes after the developer's first commit:
#   warm_up ─► develop ─► acceptance_tests ─► red_check ─► rule_check ─► … (the same chain from there)
#   - acceptance_tests (the test writer, Opus 5.5): the acceptance tests of the task, from the issue
#     and its criteria, not from the implementation, committed on the run's branch. It gets the
#     project's code → tests map (`test_map: true`, #219) to put the tests where they belong and
#     name the affected existing tests. Nothing testable (docs, refactor) ─► develop directly.
#   - red_check (no agent): the orchestrator runs exactly those test files once (`type: suite`,
#     `files`, `expect: red`). A test that already passes is reported to develop ("already green:
#     guards existing behaviour or is wrong"); a file that cannot run (a syntax error) goes back to
#     the test writer once. Its `affected_tests` are the existing tests that reach the sources the
#     new tests import (the same code → tests graph): given to develop, not guessed.
#   - warm_up, "Warm Up" (the mapper, read-only, on the developer's model and effort, #301): before
#     the first develop turn only, it maps per issue the files and line numbers to change, how they
#     connect, the conventions and the tests to run for each file (#304: direct, then transitive,
#     from the code → tests map, as a run-tests block); develop and the test step start from that
#     map. A Warm Up that fails or times out goes on to develop without a map (on_error).
#   - develop implements until they pass. The engine locks exactly the acceptance files
#     (`protect_files` on the developer: a turn that changes one is refused, as edits_tests: false
#     does for all tests), while the developer may add its own internal tests (`edits_tests: true`).
#     code_review still checks the acceptance files are unchanged (`git diff`), as a second line.
#   - rule_check (no agent, #404): after each develop commit (after the test-id check and the
#     screenshots, before the owner's gate or the review) the orchestrator runs the project's
#     rule checks (`check_command`, or the `check` script of its package.json, else the linter and
#     type checker it configures and has installed, #50, only for what the change added; none or
#     `check_command: off`: skipped). A failure goes back to develop with the findings, at most twice per review round, then to the
#     owner at check_failed; never to the test writer. The suite still runs every test after it.
#     An environment failure (#30: no dependencies installed, a command not found) never goes back
#     to develop nor counts as a round: the run stops once at check_environment (Try again reruns it).
#   - docs_check (no agent, #757): right after rule_check (or in its place without a check command),
#     when the issues list docs under `## Expected files`: none of them touched by the run's diff
#     (and not in left_out with a reason) goes back to develop once per review round.
#   - secret_scan (no agent, #49): gitleaks on the run's own commits, last before the owner's gate or the
#     review. A finding goes back to develop at most twice, then to secret_found; gitleaks not installed
#     or `secret_scan: off`: skipped, said as "secrets not scanned" (fragments/secret-scan-pipeline.yaml).
#   - unit_tests defaults to write_and_run and so does e2e_tests (off when the project has no E2E suite).
# The rule "the developer never writes tests" (#47) becomes, here only: the developer never edits
# the acceptance tests written before it, and may add internal tests.
# Everything below is inherited from Software Development, local hero:
# -----------------------------------------------------------------------------
#   develop ─► code_review ─► test ─► suite ─► build ─► evidence ─► verify_change ──merge: local──► end
#     ▲            │            │        │        │                        │              │ conflict
#     └────────────┴────────────┴────────┴────────┴────────────────────────┘              ▼
#                  ▲                                                       resolve_merge (developer)
#                  └──────────── code_review ◄──────────────────────────────────┘
#   evidence: screenshots / HTTP request+response / CLI output / log lines that show the change
#   working (local, simulated), in the run folder; it never blocks and the verifier uses it. It
#   no longer judges the UI (#151).
#   UI changes (#151): develop ─► developer_screenshots (machine, every mode) ─► code_review, a
#   fan-out of the reviewer and the ui_reviewer (ui-conventions + design-system skills) in parallel.
#   Code findings and blocking `ui_findings` go back to develop together; the UI once. The fix round
#   is captured and reviewed again before test/suite/E2E/build. No UI change: the reviewer alone.
#   Declared gaps (`left_out`: requirements of the task the developer did not implement): never
#   reviewed. The first time, develop ─► develop with the list (no reviewer call); still there
#   after that ─► requirements_left_out (human gate: continue without them / stop). An entry led
#   by "Tests" or "Measure" (the test writer's and the owner's tasks, #173) triggers neither.
#
# The software-development pipeline without GitHub/GitLab and without a merge approval: no
# push, no PR/MR, no CI, no preview, no deploy. Each run works in its own git worktree, started
# from the LOCAL <base> branch (orchestrator.worktree.remote: false: origin/<base> is fetched only to compare, so a run
# sees the local merges of earlier runs that were never pushed). Once verified, the engine merges
# the run's branch into the local <base> automatically (`merge: local`): rebased onto it first
# when it moved, fast-forward only (linear history), never pushed.
#   - A merge that fails (usually a conflict with another run merged meanwhile) goes to
#     resolve_merge: the developer rebases onto the local <base> and resolves the conflicts (test
#     files included: protect_files accepts a protected test file that only combines both sides,
#     #380). A test conflict that needs new or changed test lines is left in the rebase and handed
#     to the test writer (`test_conflict`), then the developer finishes the rebase. Then only what the resolution changed is checked again (`vars.recheck ==
#     'resolution'`): code_review reviews the rebase against the last approved commit (git
#     range-diff), test runs the tests related to the files the resolution touched plus a smoke
#     check (the full suite past 5 files), build runs, evidence is kept, verify_change re-checks only the claims
#     whose files were touched, and the merge is attempted right after. A resolution that changes
#     behaviour (`behaviour_changed`) goes through the full review, suite and verification. Merges of
#     concurrent runs go one at a time. At most 3 rounds; only what the developer can't fix (e.g.
#     uncommitted changes in the checkout where <base> is checked out: the user's) or running out
#     of rounds stops at merge_blocked.
#   - orchestrator.limits.max_total_context: past 40M tokens of context the run pauses before its
#     next agent turn; Continue allows another 40M, Stop ends it (branch kept).
#   - Commits end with "Closes #<n>" for the run's issues: GitHub closes them when you push <base>.
# Push whenever you want: `git push origin <base>` from the repository.
#
# MODES (input `mode`)
#   auto (default): develop ─► code_review, as above; nothing waits for the owner.
#   validated: develop ─► developer_check (human gate) ─► code_review. The owner tries the worktree
#   (Run locally when a local_preview is set, see below), then approves, asks for changes (back to
#   develop with the text, then back to the gate) or stops. Only the first implementation and the
#   owner's own change requests stop there; review fix rounds too with validate_every_round: true.
#   Before the gate, developer_screenshots (no agent, #144) captures the UI states develop listed in
#   `screenshots`, original and modified, into evidence/developer/round-<n>/; the gate shows them
#   (in auto mode it runs too for a UI change, then goes straight to code_review, #151).
# RUN LOCALLY (gates with `local_preview: true`: developer_check, human_review)
#   Offered when the project (Projects › Local preview) or `orchestrator.local_preview`
#   ({ install, command, url }) says how to run the worktree. It never answers the gate.
#
# TESTS (inputs `unit_tests` and `e2e_tests`, #203; the workflow's default, changeable per run)
#   unit_tests: write_and_run (default) = test (the test writer writes and runs focused tests) ─►
#     suite; run_existing = no unit tests written, suite only (failures go to the developer);
#     off = no suite at all. e2e_tests: write = the test writer writes the issue's scenarios
#     first (acceptance_tests) and checks that they parse; write_and_run = the e2e step also runs
#     them here; off (default) = none.
#   unit_tests off: code_review ─► build (or e2e). Only run_existing: code_review ─► suite.
#   e2e (no agent, #223): with write_and_run and scenarios, the orchestrator runs the issue's
#   scenarios (@issue-<n>) plus the @smoke journeys after the suite (`e2e_command`, log in
#   logs/e2e-<round>.log). Green: no agent. Red: the healer (trace + accessibility snapshot; fixes
#   locators and waits only, never an assertion) heals it, or sends a product bug to the developer;
#   2 rounds, then test_failed. An engine, docs or refactor issue gets no scenario: no e2e step.
#   build, evidence, verify_change and the local merge always run. Nothing is reported as tested
#   when it was off: verify_failed and the verifier get `tests_plan` ("Unit tests: Off (workflow
#   default)"), and the run summary records it. Test later, all together: test-backfill.yaml.
#   suite (no agent, #177), `scope: affected` (#304, as #212): each round runs the test files the
#   change reaches (import graph since the base, plus the files that failed before), log in
#   logs/suite-<round>.log; when they pass and the whole suite has not run yet in the run, the
#   whole suite (`test_command`, else found from the project's files) runs once right after
#   (logs/suite-<round>-full.log), at most once per run (#553: after it, the files affected since it
#   plus those that failed); a shared root or a project without a JS/TS graph runs it all. Failing
#   tests go back to the test writer with the failures and the log (2 rounds, then test_failed).
#   Tests that also fail on the base (the test writer's preexisting_failures) never count.
#
# Rules (as in software-development):
#   - Agents never talk to each other: the engine delegates fixes to the developer.
#   - Tests belong to the test writer (focused runs; the suite step runs the whole suite, and a
#     whole-suite command of the test writer is noted, `full_suite: warn`); the developer changes production
#     code only (`edits_tests: false`, enforced by the engine) and says what to test (`test_notes`).
#   - `language` picks unit-test-writer-<language> and e2e-test-writer-<language> (test writer)
#     and build-audit-<language> (builder).
#     Several languages ("js,rust", #340): the skills of each language whose files the run changed.
#   - End-to-end BDD scenarios (#143), kept cheap: only for user-visible behaviour, at most 3 per
#     issue, tagged `@issue-<n>`, written first with the acceptance tests (#223; locked for the
#     developer, who adds the data-testids), run here only with e2e_tests write_and_run; the
#     E2E release workflow (e2e-release.yaml) runs the whole suite at release time. The acceptance
#     tests step reports them as `pending` (`scenarios`, `e2e_note`); the engine saves them in
#     <run_dir>/e2e/scenarios.feature. developer_check and verify_failed (the gate before the local
#     merge on its failure path) list them for the Dev/QA; the run's summary shows them otherwise
#     (no merge approval here).
#   - Dependencies (#198): the engine links the worktree's node_modules from the shared cache
#     (installed once per lockfile) and prepares the test step's base checkout (base_worktree).
# =============================================================================

apiVersion: craftorio/v1
kind: Workflow

metadata:
  name: feature
  version: 0.3.0
  description: "Tests first: the test writer writes the acceptance tests from the issue before any code, the developer implements until they pass (never editing them), then review, the suite run by the orchestrator, build and verification. Code first (the test order input): the developer writes the code and its unit tests first, the test writer writes the acceptance tests after it. Local mode: the local merge, then push main. Remote mode: a pull request and its CI; the team merges it. Fork + PR mode: the branch on your fork, a pull request to the original and its CI; the maintainers merge it."
  tags: [dev, review, test, tests-first, tdd, build, local, remote, worktree]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    label: "Task"
    type: string
    required: true
    description: Feature or bug to implement.
  issue:
    label: "Issue"
    type: string
    default: ""
    description: "URL of the issue this run implements (set by the Backlog screen). Nothing is closed on GitHub/GitLab until you push."
  issues:
    label: "Issues"
    type: array
    default: []
    description: "URLs of the issues this run implements together, in one branch (set by the Backlog screen; one per line)."
  # #836: a frozen mockup version (the mockups editor's "Start a development run" fills it); optional,
  # a run without it behaves as before.
  mockup:
    label: "Mockup"
    group: Project
    type: string
    default: ""
    description: "Folder of a frozen mockup version (index.html and kit/) the screens of this run follow. Empty: no mockup."
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path (a git repository; no remote needed).
  # Picks the unit-test-writer-<language>, e2e-test-writer-<language> and build-audit-<language> skills. The app prefills it
  # from the project's files (package.json, pyproject.toml, go.mod, pom.xml, *.csproj, Cargo.toml; every one found, main first).
  language:
    label: "Language"
    # #431: the Product Owner drawer draws its options under these group labels, `main: true` first
    group: Project
    type: string
    enum: [js, python, go, java, csharp, rust]
    default: js
    multiple: true
    options: { js: JavaScript, python: Python, go: Go, java: Java, csharp: "C#", rust: Rust }
    description: The project's languages, main one first, for its tests and build checks. A repository that mixes several (e.g. JavaScript and Rust) takes them all; a run loads the skills of the languages whose files it changed.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the work starts from and is merged into.
  # #630 (spec R7): how the change lands. A run saved with the old `mode: auto | validated` (the
  # Product Owner, a roadmap) still runs: setup moves that value to `validation`.
  mode:
    label: "Mode"
    group: How it runs
    type: string
    enum: [local, remote, fork]
    default: local
    options: { local: "Local", remote: "Remote (pull request)", fork: "Fork + PR" }
    description: "Local: merged into the local base branch, then the run pushes it (push main). Remote: the run pushes its branch, opens a pull request and waits for its CI; the team merges it on the platform. Fork + PR (no push access to the original): the run pushes its branch to your fork (origin) and opens the pull request against the original (upstream); the maintainers merge it."
  # #738 Fork + PR: a dependent roadmap item (part 2 of a split) starts from its parent's branch on the
  # fork (set by the roadmap); depends_on names the parent's pull request for the PR's body
  parent_branch:
    label: "Parent branch"
    group: How it runs
    type: string
    default: ""
    show_if: "mode != 'local'"
    description: "Fork + PR: the branch on your fork this run starts from (the earlier item of a split implementation). Remote (#807, a stacked roadmap stage): the previous stage's branch, also the pull request's base. Empty: the default branch."
  depends_on:
    label: "Depends on"
    group: How it runs
    type: string
    default: ""
    show_if: "mode == 'fork'"
    description: "Fork + PR: the earlier pull request this one depends on (e.g. #12), written in the pull request's body."
  # parent_pr (wait and rebase, set by the roadmap): the ci step waits for it to merge (wait.parent)
  parent_pr:
    label: "Parent pull request"
    group: How it runs
    type: string
    default: ""
    show_if: "mode != 'local'"
    description: "Fork + PR: the URL of the earlier pull request to wait for. The pull request opens once it merged upstream, rebased onto the synced default branch. Remote (#807, stacked): the pull request this one builds on; it opens at once and moves to the default branch when that one merges."
  # validated: the run stops at developer_check after the developer (the old input `mode`, #630).
  validation:
    label: "Validation"
    # #431: the owner's "Mode" (Automatic or Validated), one of the drawer's main options
    group: How it runs
    main: true
    type: string
    enum: [auto, validated]
    default: auto
    options: { auto: Automatic, validated: Validated }
    description: "Automatic: the change goes straight from the developer to review and tests. Validated: the run stops after the developer so you can try the change before review and tests are paid for."
  # #630 (spec D14): E2E first writes the issue's scenarios with the acceptance tests, before the code
  test_order:
    label: "Test order"
    group: Tests
    type: string
    enum: [e2e_first, code_first]
    default: e2e_first
    options: { e2e_first: "E2E first", code_first: "Code first" }
    description: "E2E first: the test writer writes the issue's E2E scenarios with the acceptance tests, before the code. Code first: the developer writes the code and its unit tests first; the test writer writes the acceptance tests after it (unit tests only, no E2E scenarios in this run)."
    # #29: the step a run starts at, per value (the engine's and the roadmap card's startStep); a value
    # not listed starts at the first step
    starts: { code_first: warm_up }
  # #630: the multi-model review (the old multi-model-review workflow) as a second reviewer on another model
  review:
    label: "Review"
    group: How it runs
    type: string
    enum: [single, multi_model]
    default: single
    options: { single: "Single reviewer", multi_model: "Multi-model" }
    description: "Single reviewer: the code reviewer alone. Multi-model: a second, independent reviewer on another model reviews the same diff in parallel."
  # #631: the old develop-to-retrospective pipeline; the run chains retrospective.yaml on itself
  retrospective:
    label: "Retrospective after"
    group: How it runs
    type: boolean
    default: false
    description: "When the run ends, the Retrospective workflow analyses it and reports what to change in the workflow first (one more model call)."
  git_platform:
    label: "Git platform"
    group: How it runs
    type: string
    enum: [gh, gl]
    default: gh
    options: { gh: GitHub, gl: GitLab }
    show_if: "mode != 'local'"
    description: "Where Remote and Fork + PR modes open the pull request (merge request on GitLab)."
  # owner 2026-10-04: the developer's model per run (Fable 5.1 for the hardest work), the mapper's too;
  # one case of the per-run agent choice (#262, the Start drawer's Agents): a Fable turn gets 3x the
  # turn timeout from `models`, whichever way it was chosen
  developer_model:
    label: "Developer model"
    group: Developer
    type: string
    enum: [claude-opus-5-5, claude-fable-5-2]
    default: claude-opus-5-5
    # #56: Fable 5.1 is no longer offered; its name stays so a value saved on it still runs and reads
    options: { claude-opus-5-5: "Opus 5.5", claude-fable-5-2: "Fable 5.2", claude-fable-5-1: "Fable 5.1" }
    description: "The model of the developer agent. Fable 5.2 is the most capable (Fable 5.1 cost about 2.5x the price per token of Opus 5.5; turns are slower: the turn timeout is 3x). The reviewer (Fable 5.2) and the test writer keep their own models."
  # #286: the developer's reasoning effort per run; `default` passes no --effort (the CLI's own
  # default for the model, the behaviour before #286); xhigh doubles the turn timeout
  developer_effort:
    label: "Developer effort"
    group: Developer
    type: string
    enum: [default, low, medium, high, xhigh]
    default: default
    options: { "default": "Default", "low": "Low", "medium": "Medium", "high": "High", "xhigh": "Extra high" }
    description: "How hard the developer thinks on each turn: a higher effort trades time and cost for depth (Extra high also doubles the turn timeout). Default: the CLI's own effort for the model."
  # A boolean; saved inputs "true"/"false" (before #116) are accepted by the engine.
  validate_every_round:
    label: "Validate every round"
    group: How it runs
    type: boolean
    default: false
    show_if: "validation == 'validated'"
    description: "Also stop for you after each round of review fixes, not only after the first change and your own change requests."
  # #203: the test step is the largest cost of a run (about half of it): turn its parts on or off.
  unit_tests:
    type: string
    enum: [write_and_run, run_existing, "off"]
    # tests first: the acceptance tests are always written before the code; this is the EXTRA
    # test step after the review (write_and_run, the default: owner 2026-10-03, quality first) or
    # only the suite (run_existing)
    default: write_and_run
    label: Unit tests
    group: Tests
    main: true
    options: { write_and_run: Write and run, run_existing: Run existing, "off": "Off" }
    description: "Write and run: the test writer writes the change's tests, then the orchestrator runs the whole suite (about half of a run's cost). Run existing: no new tests, the suite runs once without an agent and failures go to the developer (cheap, the change stays untested). Off: no suite at all (cheapest; test later with the test-backfill workflow)."
  e2e_tests:
    type: string
    enum: ["off", write, write_and_run]
    # owner 2026-10-03: quality first, the scenarios are written and run here by default
    default: write_and_run
    label: E2E tests
    group: Tests
    main: true
    options: { "off": "Off", write: Write, write_and_run: Write and run }
    description: "Write: the test writer writes the issue's end-to-end scenarios first, with the acceptance tests, and checks that they parse; the E2E release workflow runs them. Write and run: the orchestrator also runs them here, with the @smoke journeys, after the suite (no agent while they pass; starts the app). Off: none."
  # #223: the e2e step adds `--grep "@issue-<n>|@smoke"` (Playwright) to it
  e2e_command:
    type: string
    # #735: no Node assumption; the project's run defaults fill it when its facts found an E2E suite
    default: ""
    label: E2E command
    group: Tests
    show_if: "e2e_tests == 'write_and_run'"
    description: "The project's Playwright E2E command; the orchestrator runs it with --grep on the issue's tag and @smoke. Empty: the project's own (its run defaults), else npm run test:e2e."
  # #205: the evidence screenshots (the Product Owner's Cost step sets it on a roadmap item:
  # Economy off, Balanced changed, Generous all)
  screenshots:
    type: string
    enum: ["off", changed, all]
    default: changed
    label: Screenshots
    group: Tests
    main: true
    options: { "off": "Off", changed: Changed screens, all: All }
    description: "All: the developer's UI states before your check and the evidence's captures. Changed: only the screens the issue changes, original and modified. Off: no screenshot step and no npm run screenshot by any agent; the evidence is the diff, the logs and the test results (cheapest: the evidence step costs about $0.3-1.5 and 5-10 min of a run)."
  # #588: where the project's UI and its E2E step definitions live (another layout than src/renderer/)
  ui_folders:
    label: "UI folders"
    group: Tests
    type: array
    default: [src/renderer/]
    description: "The project's UI folders, repository-relative (one per line). A change under one of them takes its screenshots and the UI review; the test id check looks for the ids there."
  steps_folders:
    label: "Step definition folders"
    group: Tests
    type: array
    default: [features/steps]
    description: "The folders of the project's E2E step definitions, repository-relative (one per line), read by the test id check."
  test_command:
    type: string
    default: ""
    label: Test command
    group: Tests
    description: "The project's whole-suite command the orchestrator runs once per test round (e.g. npm test). Empty: found from the project's files (package.json, go.mod, Cargo.toml, pom.xml, build.gradle, *.csproj, pyproject.toml)."
  # T6: the command of the suite step's whole round (once per run, after the affected test files pass)
  whole_test_command:
    type: string
    default: ""
    label: Whole-round test command
    group: Tests
    description: "What the suite step runs for its whole round, once per run after the affected test files pass (e.g. npm run test:affected in a Turborepo monorepo: every test of the workspaces the change reaches, from the cache where nothing changed). Empty: the test command runs whole."
  # #404: the project's fast rule checks, run after each develop commit (rule_check)
  check_command:
    type: string
    default: ""
    label: Check command
    group: Checks
    description: "The project's fast rule checks (lint, layers, docs...) the orchestrator runs after each developer commit; failures go back to the developer. Empty: the project's `check` script from its package.json (npm run check), else the linter and the type checker the project itself configures and has installed (only what the change added goes back); a project with none skips the step. off: no checks."
  # #49: gitleaks on the run's own commits (secret_scan); off for a project that has its own scan
  secret_scan:
    type: string
    enum: ["on", "off"]
    default: "on"
    label: Secret scan
    group: Checks
    options: { "on": "On", "off": "Off" }
    description: "Before the code review, gitleaks looks for secrets in the commits of the run (no agent). On: a finding goes back to the developer, at most twice, then to you; nothing is merged or pushed while it is open. Without gitleaks installed the run goes on and says that secrets were not scanned. Off: for a project that has its own scan."
  # #396 (owner 2026-10-15): set before the run, never changed by an agent while it runs. With
  # continue, a suite red only outside the change goes on to the build without the test_failed gate.
  suite_red_outside_change:
    type: string
    enum: [ask, continue]
    default: ask
    label: Suite red outside the change
    group: Tests
    options: { ask: Ask, continue: Continue }
    description: "When the suite still fails but every failing test is outside the change (its test file reaches no changed file, passes alone, or fails or hangs on the base too). Ask: the test_failed gate waits for you, as for any red suite. Continue: the run goes on to the build and the merge, reported as not tested green. A failure in the change always asks."
  # #71: the owner's policy for a project with no test command and no test file
  no_tests:
    type: string
    enum: [continue, ask]
    default: continue
    label: A project with no tests
    group: Tests
    options: { continue: Continue, ask: Ask }
    description: "When the project has no test command and no test file. Continue: the run goes on to the build, reported as not tested because the project has no tests. Ask: the test_failed gate waits for you. A project with test files and no known command always asks."

# -----------------------------------------------------------------------------
# Final command line = args + capability and isolation flags + agent.cli_args + (resume_args if
# the session already exists) + skill_args (once per skill) + stdin_arg. The prompt always goes via stdin.
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    # #286: an agent's `effort` reaches the CLI only through effort_args (none: no --effort flag)
    effort_args: ["--effort", "{{ effort }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    # Lets the agent read the skill folder (outside working_dir). Codex in
    # read-only mode can already read any path.
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    effort_args: ["-c", "model_reasoning_effort={{ effort }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"

# Allowed commands, shared by the agents below (YAML anchors, used in capabilities.tools).
x-tools:
  # every supported language toolchain: the language skill says which one to use
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:uv, bash:poetry, bash:pip-audit, bash:osv-scanner, bash:go, bash:govulncheck, bash:mvn, bash:./mvnw, bash:mvnw.cmd, bash:gradle, bash:./gradlew, bash:gradlew.bat, bash:dotnet, bash:cargo]
  # gh / glab: called bare, in the Bash tool, one command per call. That is the only form this
  # allowlist accepts: no PowerShell, no full or 8.3 paths, no PATH edits, no ;/&&/pipes, no body
  # files (use --body). The engine refreshes PATH, so bare gh works inside runs.
  vcs: &vcs [bash:git, bash:gh, bash:glab]

defaults:
  # #320: a persistent agent idle past its prompt cache's lifetime (Claude on a subscription: 1 h,
  # minus a margin) continues in a fresh session from its handoff note; an agent's own value wins
  fresh_after_idle: 55m
  # the run's own git worktree (orchestrator.worktree), or repo_path when it is not a git repo
  working_dir: "{{ worktree_dir }}"
  # one agent turn: 30m, plus 10m per extra issue of a grouped run, at most 60m (#101); times the
  # model's timeout_factor (`models` below, #262); 2x more when its effort is xhigh (#286: longer
  # turns; high stays within the base limit)
  timeout: "{{ ((30 + 10 * ((inputs.issues | length) - 1)) | clamp(30, 60)) * (2 if inputs.developer_effort == 'xhigh' else 1) }}m"
  # persistent agents: once a turn ends above this context size, the next turn starts a fresh
  # session from the agent's handoff note (runs/<id>/handoffs/)
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

# #262: limits that follow the model an agent runs on (the Developer model input, or any agent's
# model chosen for one run in the Start drawer's Agents): Fable turns are slower, 3x the turn
# timeout (owner 2026-10-04: its first run needed more than 1.5x on a 3-issue change)
models:
  claude-fable-5-1: { timeout_factor: 3 } # a run saved on it (#56)
  claude-fable-5-2: { timeout_factor: 3 }

# v1: the graph is run by the app's deterministic engine (packages/engine/engine).
orchestrator:
  provider: claude
  model: claude-sonnet-5-5
  # One git worktree per run: <workspace>/worktrees/<run_id>, detached at the LOCAL <base> in Local
  # mode (remote false: no fetch), at the fetched origin/<base> in Remote mode (#630: the PR starts
  # from what the remote has). Removed when the run succeeds (in Local mode its branch is deleted
  # once merged into the local <base>), kept otherwise so "resume from step" continues there.
  # #738 Fork + PR: the fork's <base> is fast-forwarded to upstream/<base> and pushed to origin first;
  # the run starts there, or at origin/<parent_branch> for a dependent roadmap item.
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
    remote: "{{ inputs.mode != 'local' }}"
    fork: "{{ inputs.mode == 'fork' }}"
  # AI supervisor: called when a step fails; explains it and picks a recovery the engine
  # validates (fix the output, retry with an instruction, an allowed goto, or ask a human).
  # On call: gates with kind: escalation and stalls (the same answer 3 visits in a row, refused
  # tool calls, a slow step) call it before you are asked; decision gates never do.
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2   # per step
    max_cost_usd: 5        # what the supervisor may spend in one run
  limits:
    max_total_duration: 8h
    # owner 2026-10-04: 120 (was 60) so a run whose developer is on Fable 5.1 (2.5x per token) fits
    max_total_cost_usd: 120
    # context the agents read (input + cache), summed over every turn: past it the run pauses
    # before the next agent turn until you choose Continue (another 40M) or Stop
    max_total_context: 40M

# -----------------------------------------------------------------------------
# Agents. `capabilities` is what each agent may use; the engine turns it into each CLI's flags
# and runs every agent isolated from the user's own CLI setup (MCP servers, plugins, memory).
# Sessions: `handoff` (a fresh session per turn, started from the agent's handoff note) for the
# agents that come back for fixes and checks; `persistent` (with defaults.max_context) elsewhere.
# Skill names can be templates: they are resolved from the inputs at run time.
# -----------------------------------------------------------------------------
agents:
  developer:
    color: "#4C7DFF" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: "{{ inputs.developer_model or 'claude-opus-5-5' }}"
    # #286: empty for `default`, so no --effort flag and the session records effort null
    effort: "{{ '' if (inputs.developer_effort or 'default') == 'default' else inputs.developer_effort }}"
    session: handoff
    # #302: a turn ends after 40 model requests (about 150K of context), wraps up with a commit and
    # its note, and the step continues in a fresh session from that note
    max_requests: 40
    # subagents: exploration sub-agents map the code, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # tests first: the developer may add its own internal tests; the acceptance tests written before
    # it stay unchanged: the engine refuses a turn that changes one (#220; on the agent, so develop,
    # resolve_merge and the fixes delegated to it are all covered), and the reviewer checks it too
    edits_tests: true
    # #223: the issue's BDD scenarios and their step definitions, written first, are acceptance files too
    protect_files:
      - "{{ steps.acceptance_tests.output.tests_added }}"
      - "{% if inputs.e2e_tests != 'off' %}{{ steps.acceptance_tests.output.e2e_files }}{% endif %}"
      # #633: the SDLC documents are the pre-flow's (write-doc) and the post-flow's (sdlc-*), never the run's
      - "docs/work/**"
    # bug-diagnosis: fixes delegated after failures; merge-conflict-resolver is a step skill of
    # resolve_merge (#418: kept out of the develop prompt's 40K budget);
    # long-commands: installs, builds and focused checks in the foreground; ui-conventions: changes
    # that touch a screen (shared components, controls, the states to capture, the design plan);
    # design-system (#387): the tokens it builds with, the ones the ui_reviewer checks against;
    # developer-self-review (#756): the shared reuse pass and the issue's tasks before handing over
    skills: [long-commands, bug-diagnosis, context-economy, decision-log, ui-conventions, design-system, developer-self-review, secret-triage]
    system_prompt: |
      You are a senior software engineer. Make small, cohesive changes to the production code
      that follow the architecture and conventions of the existing code.
      Merge-friendly (parallel runs): add new code next to related code, not before a shared
      section comment; write shared name lists (module.exports, destructured requires) one item
      per line, sorted; document a file in its header comment or a topic doc, not in an index.
      Acceptance tests: the test writer writes them from the task and its criteria, before you
      (tests first) or after your first commit (test order "code first", #29). Never edit, delete, skip or weaken them (the orchestrator refuses a
      turn that changes one); if one contradicts the task, say why in `summary` and leave it (the
      reviewer decides). You may add your own tests for
      internal details in new test files, written with the code: your own tests go into the
      implementation commit. Never run the full test suite (the orchestrator runs it
      after the review): run the acceptance and affected test files, focused, in the foreground,
      output to a log, reading only the summary.
      Keep your context small (context-economy): on a task that touches more than about three
      files, start one exploration sub-agent before your first edit and have it report the
      files, functions and line numbers to change (when your prompt gives you the Warm Up map,
      start from it instead); then read only the files you will edit, and
      group several changes to a file in one edit. On a fix turn, read only what the findings name.
      Sub-agents are the default for code research: a search across files you will not edit,
      a long output (a failing check, a log, a long diff) or a finding in code you have not
      mapped goes to a sub-agent that returns a summary; edits and the checks that decide your
      step stay in your own turn.
      Your turn ends at green acceptance tests and a commit (#303): the code_review step reviews
      your diff next, in its own session, so never start a sub-agent to review your diff.
      Work on your own branch and commit your changes there. This run has its own git
      worktree (the current folder), which starts detached at the LOCAL {{ inputs.base_branch }}:
      this workflow works locally, and the local {{ inputs.base_branch }} holds earlier local
      merges that were never pushed. Work on the run's branch: the test writer creates it with the
      acceptance tests (if the worktree is still detached, create it: `git switch -c <branch>`). Never fetch, pull or branch from origin, and never push: the
      orchestrator merges your branch into the local {{ inputs.base_branch }} after approval.
      The engine gives the worktree its dependencies (linked from a shared cache, installed
      once per lockfile): never run `npm ci` and never delete `node_modules`. Adding a package
      with the package manager is fine: the engine installs the new lockfile after your turn.
      {% if inputs.issue or (inputs.issues | length) %}End every commit message with one line per issue this run implements,
      `Closes #<number>` (the numbers from: {{ inputs.issue }}{% for u in inputs.issues %} {{ u }}{% endfor %}):
      GitHub closes them when the local {{ inputs.base_branch }} is pushed.
      {% endif %}When you finish a requested fix, report the commit hash.

  reviewer:
    color: "#A06BFF" # #224: its role's colour in the run chat and the runs list
    provider: claude
    # owner 2026-10-03: Opus 5.5 (Sonnet 5.5 cost $1.64/M tokens in real runs vs Opus 5.5 $0.61/M);
    # owner 2026-11-07: Fable for every run, 5.2 since #56 (its turns get 3x the timeout from `models`)
    model: claude-fable-5-2
    effort: high
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    # Criteria, severities and per-language rules live in the skill
    # (<workspace>/skills/code-review, editable in the Skills screen).
    skills: [code-review]
    system_prompt: |
      You are the code reviewer of this workflow. Follow the code-review skill:
      detect the languages in the diff and read the rules for each one before the verdict.
      Read the project's REVIEW.md (repository root) when it exists and apply its rules (#633).

  # #630: the multi-model review's second reviewer (inputs.review == 'multi_model'), on another model
  second_reviewer:
    enabled: "{{ inputs.review == 'multi_model' }}"
    color: "#7C8CFF"
    provider: codex
    model: gpt-6-luna
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    skills: [code-review]
    system_prompt: |
      You are a second, independent code reviewer of this workflow, on another model than the first.
      Review the change on your own, following the code-review skill. Report real problems only.
      Read the project's REVIEW.md (repository root) when it exists and apply its rules (#633).

  # #630: Remote mode pushes the branch, opens the PR/MR and watches its CI (fragments/pr-pipeline.yaml)
  ci_pusher:
    provider: claude
    model: claude-sonnet-5-5
    session: handoff
    capabilities: { tools: [read, *vcs], web: false }
    skills: ["ci-pipeline-{{ inputs.git_platform }}"]
    system_prompt: |
      You are the CI Pusher. You push the branch, make sure a PR/MR is open and watch CI until it
      passes. When CI fails, you fetch the failure log and summarize the root cause so the
      orchestrator can hand it to the developer. You do not fix code and you do not merge.

  # #151: the visual review of the UI, in parallel with the reviewer (code_review's fan-out), on the
  # screenshots developer_screenshots takes right after develop; it never runs on a change without UI
  ui_reviewer:
    color: "#C77DFF"
    provider: claude
    # cost: it looks at a few screenshots and a CSS diff (like evidence)
    model: claude-sonnet-5-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: [ui-conventions, design-system]
    system_prompt: |
      You are the UI Reviewer of this workflow. You review how a change looks and is used, on its
      screenshots (original and modified) and its styles, against the ui-conventions skill (shared
      components, controls, states) and the design-system skill (colours, spacing, typography,
      alignment from the app's tokens). You do not review the code's logic (the code reviewer
      does), do not change code, do not commit and do not run tests.

  test_writer:
    color: "#FF8A3D" # #224: its role's colour in the run chat and the runs list
    provider: claude
    # owner 2026-10-03: Opus 5.5, it writes the acceptance tests first (the hardest test work)
    model: claude-opus-5-5
    session: persistent
    # #176: its re-read context is the largest controllable cost; past this, the next turn starts a
    # fresh session from its handoff note (never mid-turn)
    max_context: 120k
    # #247: Ask for changes at the owner's validation gate comes back to it after a wait of hours,
    # past the prompt cache: resuming would rewrite its whole context, so it starts a fresh session
    # from its handoff note (the lesson of #244)
    fresh_after_idle: 55m
    # edits test files only (a convention of its role: the tools can't tell tests from code)
    # subagents: exploration sub-agents map the behaviours and tests, so the main context stays small
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # only the parts the run's unit_tests / e2e_tests turn on (#203)
    skills:
      - "{% if inputs.unit_tests == 'write_and_run' %}unit-test-writer-{{ inputs.language }}{% endif %}"
      - "{% if inputs.e2e_tests != 'off' %}e2e-test-writer-{{ inputs.language }}{% endif %}"
      - context-economy
    system_prompt: |
      You are the test writer, the only agent of this workflow that writes tests. You write
      and update them (including tests an intended behaviour change makes obsolete) and run
      the focused tests of the change, following the test skill for this language; the
      orchestrator runs the whole suite once after your step and gives you its failures
      (never start the whole suite yourself). You also write the
      end-to-end acceptance scenarios (Given/When/Then feature files and their step
      definitions) and check that they parse, following the E2E test skill, when the run's
      E2E tests are on. Your step's prompt says which parts are on. You do NOT fix production
      code: when a test fails because of a bug in the code, describe the failure precisely
      (test, file, error, probable cause) so the orchestrator can hand it to the developer.
      Commit test files only.
      Keep your context small (context-economy): before writing tests, start one exploration
      sub-agent that maps, from the developer's test_notes and the branch diff, the changed
      behaviours, the existing tests that cover them and the test helpers and conventions,
      with file and line numbers; then read only the test files you edit and the production
      lines under test. A long test output or the suite's log goes to a sub-agent that returns
      the failures; the focused runs that decide your step stay in your own turn.
      Your session may continue in a fresh one from your handoff note: in it, keep the
      behaviours to test (from test_notes) and which are covered, the test files you wrote or
      edited, the last test command with its result (pass/fail counts, failing tests), and what
      is left, so the next session continues without mapping the change again.

  # #301: Warm Up maps the code before develop, so the developer starts from a map instead of
  # waiting for (or racing) its own exploration sub-agent. Read-only (a convention, as for the
  # reviewer: no edit/write tools); on the developer's model and effort.
  mapper:
    color: "#3FB8AF"
    provider: claude
    model: "{{ inputs.developer_model or 'claude-opus-5-5' }}"
    effort: "{{ '' if (inputs.developer_effort or 'default') == 'default' else inputs.developer_effort }}"
    session: ephemeral
    # subagents: it fans out exploration sub-agents, one per area of the task
    capabilities: { tools: [read, bash:git], web: false, subagents: true }
    skills: [code-mapping]
    system_prompt: |
      You are the mapper of this workflow. Before the developer starts, you map the code the task
      touches, following the code-mapping skill: per issue, the files and functions to change or
      reuse with their line numbers, how they connect, the tests to run for each file and the
      conventions to follow. You are read-only: never edit, create or delete a file, never commit,
      and never run the tests, a build or an install.

  builder:
    color: "#E6C229" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: ["build-audit-{{ inputs.language }}"]
    system_prompt: |
      You are the builder. You build the application and check its dependencies for
      vulnerabilities, following the build skill for this language. You do not change
      code and you do not run the test suite (the test writer ran it). Vulnerability policy:
      - blocks: any critical; high in production dependencies
      - report only: moderate/low, and anything in development-only dependencies

  verifier:
    color: "#2FBF71" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5-5
    session: persistent
    capabilities: { tools: [read, *toolchains], web: false }
    skills: [claim-verification]
    system_prompt: |
      You are the verifier. You prove or disprove that the change does what the task
      asked, by running the same command before and after it. You do not change code and
      you do not run the full test suite (the test writer ran it).

  evidence:
    color: "#1FC2D6" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5-5
    session: ephemeral
    capabilities: { tools: [read, *toolchains], web: false }
    # #151: it collects evidence only; the visual review is the ui_reviewer's, in code_review
    skills: [implementation-evidence]
    system_prompt: |
      You collect evidence that the change works: UI screenshots, HTTP requests and their
      responses, CLI output or log lines, local and simulated only. You do not change code, do not
      commit and do not run the test suite; a capture that fails is reported, never fixed.

  # #223: called only when the orchestrator's E2E run (step e2e) has a red scenario (Playwright Test
  # Agents' generator/healer split: the test writer generates, this agent heals)
  healer:
    color: "#F0569B" # #224: its role's colour in the run chat and the runs list
    provider: claude
    model: claude-sonnet-5-5
    session: persistent
    # screenshots: false: it reads traces and accessibility snapshots, never captures screenshots
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true, screenshots: false }
    skills: ["e2e-test-writer-{{ inputs.language }}", long-commands, context-economy]
    system_prompt: |
      You are the E2E healer. The orchestrator ran the issue's end-to-end scenarios and one is
      red. You sort each failure: a stale locator or a missing wait in the scenario's step
      definitions (you fix it) or the application (a product bug: you report it with the
      evidence, the developer fixes it). You only fix locators and waits: you never weaken or
      remove an assertion, never change what a scenario checks, never skip or delete a scenario
      and never change production code. Commit your fixes on the run's branch (it already
      exists: the worktree is on it). Never fetch, pull or push.

groups:
  - name: Tests
    steps: [acceptance_tests, red_check]
  - name: Develop
    steps: [warm_up, develop, rule_check, docs_check, testid_check, requirements_left_out, issue_not_done, developer_screenshots, secret_scan, developer_check]
  - name: Review
    steps: [code_review, human_review]
  - name: Validate
    steps: [test, suite, e2e, heal, check_failed, check_environment, secret_found, secret_scan_error, test_failed, build, build_failed, evidence, verify_change, verify_failed]
  - name: Merge
    steps: [resolve_merge, merge_blocked, push_main, ci, ci_failed, pr_monitor]

# -----------------------------------------------------------------------------
steps:

  # ============================ BUILD & TEST =================================

  # Tests first (owner, 2026-10-03): the acceptance tests of the task, from the issue and its criteria,
  # written before any code on the run's branch. Pointing at the right tests is what makes tests-first
  # work (TDAD, arXiv 2603.17973: TDD instructions without the affected tests made regressions worse).
  # #29: with the test order "code first" it comes after develop's first commit instead.
  - id: acceptance_tests
    display: Write tests (E2E)
    agent: test_writer
    # #223: with E2E on, the issue's BDD scenarios are written here too, first
    skills:
      - "unit-test-writer-{{ inputs.language }}"
      - "{% if inputs.e2e_tests != 'off' %}e2e-test-writer-{{ inputs.language }}{% endif %}"
      - context-economy
    # {{ test_map }}: the checkout's code → tests map (#219), rebuilt for each turn
    test_map: true
    prompt: |
      Task: {{ inputs.task }}
      {% if 'docs/work/' in (inputs.task or '') %}The task is an accepted document's path (#648, enrich-issue): read it, it is the task; the images and HTML files of its folder are the mockups of its screens.{% endif %}
      {% if inputs.issues | length > 1 %}This run implements these issues together: {% for u in inputs.issues %}{{ u }} {% endfor %}{% endif %}

      {% if steps.red_check.output and steps.red_check.output.status == 'broken' %}
      The orchestrator ran your acceptance tests and some cannot run at all:
      {{ steps.red_check.output.message }}
      Fix those files (a syntax error, a wrong import path, a crash before the tests) on the same
      branch, commit, and answer again in full. They must load and fail on the missing behaviour.
      {% endif %}
      {% if previous_step == 'developer_check' %}
      {% set prev = steps.acceptance_tests.output %}
      This visit comes from the owner's validation gate: the owner tried the developer's change and
      asks for changes (change request {{ steps.developer_check.visits }}):
      <owner_request>
      {{ steps.developer_check.output.feedback }}
      </owner_request>
      The developer implements the request after you and may not change your acceptance tests{% if inputs.e2e_tests != 'off' %} nor
      your E2E scenarios and their step definitions{% endif %}. First a quick triage, before any rewrite: does the request
      change the acceptance criteria your files assert? Read only the tests and scenarios it touches.
      - Criteria changed (a control moves, or a behaviour, a text or a state your tests or scenarios
        assert changes): update only the affected acceptance tests{% if inputs.e2e_tests != 'off' %}, scenarios and step definitions{% endif %} to the
        requested behaviour, commit on the run's branch (it already exists), set
        `criteria_changed: true` and list in `tests_changed` exactly the test files you changed (the
        orchestrator runs only them; they may fail on the new behaviour, the others are not re-judged).
        The other tests stay as they are.
      - Simple change (a detail no test or scenario asserts: spacing, a colour, wording no scenario
        reads): change nothing, set `criteria_changed: false`.
      In `criteria_note`, tell the developer in a line or two what changed in the tests and why, or
      why nothing did. Never weaken a test to make the current code pass. Never ask the owner: when
      the request is ambiguous, record your assumption in `criteria_note`.
      Keep `tests_added`{% if inputs.e2e_tests != 'off' %} and `e2e_files`{% endif %} the complete lists of the run's acceptance files (the
      developer may not change them), with any new file added: so far `tests_added`: {{ ((prev.tests_added if prev else []) or []) | join(', ') or 'none' }}{% if inputs.e2e_tests != 'off' %}; `e2e_files`: {{ ((prev.e2e_files if prev else []) or []) | join(', ') or 'none' }}{% endif %}.
      Keep `criteria`, `not_testable`{% if inputs.e2e_tests != 'off' %}, `e2e_scope` and `scenarios`{% endif %} from your previous answer, updated.
      {% elif inputs.test_order == 'code_first' %}
      {# #29: code first: the developer already committed the change; the tests come after it #}
      Write the ACCEPTANCE TESTS of this task AFTER the code (test order: code first). The developer
      already implemented the change on the run's branch `{{ steps.develop.output.branch if steps.develop.output else "(the worktree's branch)" }}`
      (the worktree is on it: stay on it, never create another, never fetch, pull or push).
      1. Derive the tests from the task and its acceptance criteria, not from the implementation:
         each checkable criterion or task of the issue gets at least one unit test, through the
         PUBLIC interfaces the criteria name. The code → tests map of this checkout is
         {{ test_map }} (search it for the files the change touched, do not read it whole): add the
         new tests in the test file of that area or a new file next to it, and list in
         `affected_tests` the existing test files the map gives for the changed files.
      2. Test files only: never edit production code. A test that fails shows a gap in the code:
         keep it (the orchestrator runs your files right after your turn and sends a red one back to
         the developer); never bend a test to the current code. A criterion that cannot be tested
         automatically goes in `not_testable` with the reason, never a fake test.
      3. Few and precise: one behaviour per test, mocks only at system boundaries.
      4. Commit the test files on the branch (message: "Acceptance tests for <issues>") and report
         the commit hash in `commit` and `committed: true`.
      A task with no observable behaviour (docs, refactor, infrastructure): write no test, leave
      `tests_added` empty and say why in `summary`.
      End-to-end scenarios: none in this run (test order: code first, #630); set `e2e_scope: none`.
      {% else %}
      Write the ACCEPTANCE TESTS of this task BEFORE any code is written (tests first). The developer
      implements the change after you and must make your tests pass without editing them.
      1. Create the run's branch where the worktree starts (the local {{ inputs.base_branch }}):
         `git switch -c <branch>` (a short name for the change). Never fetch, pull or push.
      2. Derive the tests from the task, not from how the code works today: each checkable
         acceptance criterion or task of the issue gets at least one test. Read the project's test
         conventions and helpers and the PUBLIC interfaces the criteria name (exported functions,
         IPC channels, CLI commands, the workflow YAML, a screen's rendered HTML); do not read or
         mirror internals the change will rewrite.
      3. Point at the right tests: the code → tests map of this checkout is {{ test_map }} (for each
         source file, the test files that import it; search it for the files the task touches, do
         not read it whole). For each criterion, take the existing test file of that area from the
         map and add the new tests there or in a new file next to it. List in `affected_tests` the
         existing test files the map gives for the files the change will touch, so the developer
         runs them too.
      4. New behaviour must fail now (red), and the orchestrator checks it: right after your turn it
         runs exactly the files of `tests_added` once. Each file must load before the code exists:
         load a module the change creates inside each test, never at the top of the file (see
         testing-principles). Before answering, run only your new files once, to check they load
         and fail on the missing behaviour; a file that crashes costs a whole extra turn. A test that already passes is reported to the developer as "already
         green" (it guards existing behaviour, or it is wrong); a file that cannot run comes back to
         you. A criterion that cannot be tested automatically (a measurement, a visual detail, a
         real-model call) goes in `not_testable` with the reason, never a fake test.
      5. Few and precise: one behaviour per test, through public seams, mocks only at system
         boundaries, no assertions on internals. Test files only: never production code.
      6. Commit the test files on the branch (message: "Acceptance tests for <issues>") and report
         the commit hash in `commit` and `committed: true`.
      A task with no observable behaviour (docs, refactor, infrastructure): write no test, still
      create the branch, leave `tests_added` empty and say why in `summary`.
      {% if inputs.e2e_tests != 'off' and inputs.test_order != 'code_first' %}{% set tags %}{% for n in inputs | issue_numbers %}{{ ', ' if not loop.first }}`@issue-{{ n }}`{% endfor %}{% endset %}
      {% if not tags %}
      End-to-end scenarios: none in this run. It has no issue number, so the scenarios could not be
      tagged `@issue-<n>` and the orchestrator would never run them: write no scenario, set
      `e2e_scope: none` and say so in `e2e_note`.
      {% else %}
      End-to-end scenarios (E2E tests are on in this run), written first like the unit tests:
      - Only for an issue with user-visible behaviour (a screen, a dialog, a CLI output a person
        reads). An engine, docs or refactor issue gets no scenario: `e2e_scope: none`, and say why
        in `e2e_note`. Otherwise `e2e_scope: scenarios`.
      - Split the work between two sub-agents started together, in parallel: one writes the unit
        acceptance tests, the other the BDD scenarios, each from the task and its criteria, not
        from the code. You review both, run the parse check and commit.
      - The scenarios: at most 3 per issue (the main path and the failure cases the issue names),
        Given/When/Then, in `features/<area>.feature`, tagged {{ tags or '`@issue-<n>`' }}, reusing the
        existing step definitions first; new steps go next to the existing ones. Locate by role
        and `data-testid`: a new step may use a `data-testid` that does not exist yet (the
        developer adds it). A visual check (`toHaveScreenshot`) only for the screens the issue
        changes: the developer creates or updates its baseline with the change.
      - Check that they parse (the E2E skill's dry run); never start the app or Electron here: the
        orchestrator runs them after the review ({% if inputs.e2e_tests == 'write_and_run' %}{{ tags or '`@issue-<n>`' }} plus the @smoke journeys{% else %}not in this run: the E2E release workflow runs them{% endif %}).
      - List the .feature files and step definition files you wrote or changed in `e2e_files` (the
        developer may not change them) and the scenarios in `scenarios` (status `pending`).
      {% endif %}
      {% endif %}
      {% endif %}
    output_schema:
      type: object
      required: [branch, tests_added, committed, summary]
      properties:
        branch:         { type: string }
        # repository-relative paths of the acceptance test files: the red check runs them and the
        # developer may not change them (protect_files)
        tests_added:    { type: array, items: { type: string } }
        affected_tests: { type: array, items: { type: string } }
        commit:         { type: string }
        committed:      { type: boolean }
        criteria:
          type: array
          items:
            type: object
            properties:
              criterion: { type: string }
              tests:     { type: array, items: { type: string } }
        not_testable:   { type: array, items: { type: string } }
        summary:        { type: string }
        # #223 (E2E on): scenarios = the issue got BDD scenarios (the e2e step runs them); none = no
        # user-visible behaviour (engine, docs, refactor)
        e2e_scope:      { type: string, enum: [scenarios, none] }
        # repository-relative .feature files and step definitions written first (protect_files)
        e2e_files:      { type: array, items: { type: string } }
        # E2E BDD scenarios (#143): shown in the run's summary and at the gates
        scenarios:
          type: array
          items:
            type: object
            required: [name, steps, status]
            properties:
              feature: { type: string }
              name:    { type: string }
              steps:   { type: array, items: { type: string } }
              status:  { type: string, enum: [pending, skipped, passed, failed] }
              reason:  { type: string }
        e2e_note:       { type: string }
        # #247, the visit from the owner's validation gate: whether the owner's request changes the
        # acceptance criteria, the note for the developer, and the test files changed in this visit
        # (the red check runs only them; tests_added stays the complete list, for protect_files)
        criteria_changed: { type: boolean }
        criteria_note:    { type: string }
        tests_changed:    { type: array, items: { type: string } }
    transitions:
      # #29: code first, the tests written after the developer's commit: they are checked (red_check)
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and (output.tests_added or []) | length"
        goto: red_check
      # #29: code first, nothing testable: develop's own routes after a commit (as in testid_check)
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round) and inputs.screenshots != 'off'"
        goto: developer_screenshots
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
      # rule_check (a skipped check included) takes the docs, the owner's gate and the review from there
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes'"
        goto: rule_check
      # nothing testable: straight to develop
      - when: "(output.tests_added or []) | length == 0"
        goto: develop
        set: { criteria_triage: "no" }
      # #247: the owner's request changes no criterion (or no test file): straight to develop
      - when: "vars.criteria_triage == 'yes' and (not output.criteria_changed or (output.tests_changed or []) | length == 0)"
        goto: develop
        set: { criteria_triage: "no" }
      - when: "true"
        goto: red_check

  # Red first, really (#220): the orchestrator runs exactly the acceptance test files once, with the
  # suite's runner restricted to them (no agent). Expected red; already-green files and the existing
  # tests related to them (the code → tests graph) go to develop; a file that cannot run goes back to
  # the test writer once. A red check that cannot run at all (no test command) goes on to develop.
  - id: red_check
    display: Red check (TDD)
    type: suite
    command: "{{ inputs.test_command }}"
    # #247: after the owner's request changed the criteria, only the test files changed in that visit
    files: "{{ steps.acceptance_tests.output.tests_changed if vars.criteria_triage == 'yes' else steps.acceptance_tests.output.tests_added }}"
    expect: red
    transitions:
      - when: "output.status == 'broken'"
        goto: acceptance_tests
        # counts this transition: one way back
        max_visits: 1
        on_exhausted: develop
      # #29: code first, the tests written after the code all pass: develop's own routes after a
      # commit (as in testid_check); a red test goes back to develop (the last route)
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and not (output.red_check and (output.red_check.red or []) | length) and inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and not (output.red_check and (output.red_check.red or []) | length) and inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round) and inputs.screenshots != 'off'"
        goto: developer_screenshots
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and not (output.red_check and (output.red_check.red or []) | length) and inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
      # rule_check (a skipped check included) takes the docs, the owner's gate and the review from there
      - when: "inputs.test_order == 'code_first' and steps.develop.output and vars.criteria_triage != 'yes' and not (output.red_check and (output.red_check.red or []) | length)"
        goto: rule_check
      # #301: the first implementation starts from the Warm Up map; an owner's change request
      # (develop already ran) starts from the request
      - when: "not steps.develop.output"
        goto: warm_up
        set: { criteria_triage: "no" }
      - when: "true"
        goto: develop
        set: { criteria_triage: "no" }

  # Warm Up (#301): a read-only agent maps the code before the first develop turn (fix rounds, change
  # requests and conflict resolutions start from their findings, not from a new map). Its map names,
  # per issue, the files and line numbers to change, how they connect, the conventions and the tests
  # to run for each file (#304: from the code → tests map, as a run-tests block), and the existing
  # helpers the change should reuse (#758: `reuse`, shown to develop and to the reviewer). It never blocks the
  # run: a failure or a timeout goes on to develop without a map (no supervisor: on_error).
  - id: warm_up
    display: Warm Up
    agent: mapper
    supervise: false
    on_error: develop
    # {{ test_map }}: the checkout's code → tests map (#219), for the tests of each file it maps
    test_map: true
    prompt: |
      Map the code for this task before the developer starts (code-mapping skill). The developer
      reads your map first and then only the files it names, at the lines it points to.

      Task: {{ inputs.task }}
      {% if 'docs/work/' in (inputs.task or '') %}The task is an accepted document's path (#648, enrich-issue): read it, it is the task; the images and HTML files of its folder are the mockups of its screens.{% endif %}
      {% if inputs.issue %}Issue: {{ inputs.issue }}
      {% endif %}{% if inputs.issues | length %}Issues (one section of the map per issue): {{ inputs.issues | join(', ') }}
      {% endif %}
      {% set acc = steps.acceptance_tests.output %}
      {% if acc and (acc.tests_added or []) | length %}
      Acceptance tests, written before the code on branch `{{ acc.branch }}` (the change must make
      them pass; follow what they import): {{ acc.tests_added | join(', ') }}.
      Criteria and their tests: {{ (acc.criteria or []) | to_yaml }}
      {% if (acc.not_testable or []) | length %}Not testable automatically: {{ acc.not_testable | join('; ') }}{% endif %}
      {% if (acc.affected_tests or []) | length %}Existing tests the test writer named: {{ acc.affected_tests | join(', ') }}.{% endif %}
      {% if inputs.e2e_tests != 'off' and acc.e2e_scope == 'scenarios' %}BDD scenarios and step definitions (their test ids and roles are what the screens must offer): {{ (acc.e2e_files or []) | join(', ') }}.{% endif %}
      {% elif acc %}
      The test writer wrote no acceptance test: {{ acc.summary }}
      {% endif %}
      {% if steps.red_check.output and (steps.red_check.output.affected_tests or []) | length %}
      Existing tests that reach the sources the acceptance tests import: {{ steps.red_check.output.affected_tests | join(', ') }}.
      {% endif %}
      Code → tests map of this checkout: {{ test_map }} (search it for the files you map, do not
      read it whole). For each production file you name, list its tests to run: direct first, then
      transitive, or `no test reaches it`; end each issue's section with a ```run-tests block.

      In `reuse`, per issue, list the existing functions, constants, rules and mapping tables the
      change will need (path, line, one line on what each does), so the developer calls them
      instead of rewriting them: an empty list when there is none.
      Keep the map under 300 lines. Change nothing: no edit, no commit, no test run.
    output_schema:
      type: object
      required: [map, files]
      properties:
        map:   { type: string }
        files: { type: array, items: { type: string } }
        # #758: the existing helpers to reuse, per issue (optional: an older answer stays valid)
        reuse:
          type: array
          items:
            type: object
            required: [name, path, line, what]
            properties:
              issue: { type: [string, integer] }
              name:  { type: string }
              path:  { type: string }
              line:  { type: integer }
              what:  { type: string }
    transitions:
      - when: "true"
        goto: develop

  - id: develop
    # a step's name says what it does ("Develop"); "Developer" is its agent's (#301's Run screen shows both)
    display: Develop
    agent: developer
    # #567: the developer may ask the owner (needs_human) when a choice is theirs to make
    ask_human: true
    # {{ test_map }}: the checkout's code → tests map (#219), for the tests of the files it changes
    test_map: true
    # #303: no self-review pass (#179, #300) in the develop turn: the code_review step is the review
    prompt: |
      Task: {{ inputs.task }}
      {% if 'docs/work/' in (inputs.task or '') %}The task is an accepted document's path (#648, enrich-issue): read it, it is the task; the images and HTML files of its folder are the mockups of its screens.{% endif %}

      {% if inputs.issues | length > 1 %}
      This run implements {{ inputs.issues | length }} issues together, in one branch:
      {{ inputs.issues | join(', ') }}.
      In `issues`, answer one entry per issue (its URL in `issue`): `done` and a `summary` of what
      you did for it, or `done: false` and why it cannot be done in this run. Never drop an issue
      silently: the owner decides whether the run goes on without it. Your `summary` lists what
      was done per issue.
      {% if steps.issue_not_done.output %}
      The owner chose to continue without the issues you could not do; leave them out.
      {% endif %}
      {% endif %}
      {% set review = steps.code_review.output.results.reviewer if steps.code_review.output and steps.code_review.output.results else none %}
      {% set second = steps.code_review.output.results.second_reviewer if steps.code_review.output and steps.code_review.output.results else none %}
      {% if (review and review.verdict == 'changes_requested') or (second and second.verdict == 'changes_requested') %}
      {% if review and review.verdict == 'changes_requested' %}
      The reviewer requested these changes (iteration {{ loop.iteration }}):
      {{ review.findings | to_yaml }}
      {% endif %}
      {% if second and second.verdict == 'changes_requested' %}
      The second reviewer (multi-model review) requested these changes (iteration {{ loop.iteration }}):
      {{ second.findings | to_yaml }}
      {% endif %}
      Fix the blocking items, make a new commit and answer each one.
      A finding that needs no production change (it asks for tests or screenshots, which the
      test writer owns, or you disagree with it): answer it in `summary` with the reason, make no
      empty commit, and set `no_change: true` when no finding of this round needed a code change.
      {% endif %}
      {% set ui_blocking = ((steps.code_review.output.results.ui_reviewer.ui_findings if steps.code_review.output and steps.code_review.output.results and steps.code_review.output.results.ui_reviewer else none) or []) | selectattr('blocking') | list %}
      {% if previous_step == 'code_review' and vars.ui_review_sent == 'yes' and ui_blocking | length %}
      The UI Reviewer found these UI problems on the screenshots (ui-conventions and design-system
      skills; one UI fix round):
      {{ ui_blocking | to_yaml }}
      Fix them on the same branch with a new commit and answer each one in `summary` (one you
      disagree with: say why). Keep `screenshots` listing the states to capture: they are taken
      again and the UI Reviewer looks once more.
      {% endif %}
      {# #670: the issue's mockups are the specification of its screens #}
      {% set mocks = inputs.task | mockups %}
      {% if mocks | length %}
      The issue's mockups are the specification of its screens: the screens you build or change
      match them (layout, icons, texts, controls, order, states); what this issue's phase does not
      do yet stays visible and disabled, as in the mockup. Copy each one into
      `{{ run_dir }}/evidence/mockups/` first (a repository path: copy the file; a link: download
      it), so you and the UI Reviewer look at the same files:
      {% for m in mocks %}- `{{ m.file }}`: {{ m.ref }}
      {% endfor %}
      List in `screenshots` every screen a mockup shows. The UI Reviewer compares each screenshot
      with its mockup: every difference is blocking and comes back here; one you made on purpose (a
      later phase) cites the issue's line that says so in `summary`.
      {% endif %}
      {% if inputs.mockup %}
      {# #836: a frozen mockup version is the specification of this run's screen #}
      This run follows a frozen mockup version, in `{{ inputs.mockup }}`: its `index.html` is the
      screen and `kit/` (tokens.css, components.css, kit.json) the kit it uses. Open both before the
      markup: the screen you build matches the mockup (layout, controls, texts, order, states) and
      takes its tokens and components from the project's own design system, the kit's names as a
      guide. List that screen in `screenshots`: the UI Reviewer checks that it matches the mockup.
      {% endif %}
      {% if previous_step == 'developer_screenshots' and vars.mockup_self_check == 'yes' and steps.developer_screenshots.output %}
      Before the review, look at your own screenshots next to the mockups: {{ steps.developer_screenshots.output.message }}{% if steps.developer_screenshots.output.dir %},
      in `{{ run_dir }}/{{ steps.developer_screenshots.output.dir }}` as `<name>.modified.png`{% endif %}.
      Your turn ends when the tests pass and the screens match the mockups, not on the tests alone:
      fix each difference on the same branch with a new commit (the screens are taken again), or,
      when every screen matches, answer with no commit and `no_change: true`.
      {% endif %}
      {% if previous_step == 'develop' and vars.ui_screens_returned == 'yes' and not (steps.develop.output.screenshots or []) | length %}
      Your previous answer changed files under the UI folders but listed no screen in
      `screenshots`: a UI change always has screenshots. List the states of the screens you changed;
      a screen the screenshot command cannot reach yet gets its demo data or seed in this run.
      {% endif %}
      {% set acc = steps.acceptance_tests.output %}
      {# #247: Ask for changes goes through the test writer first (acceptance_tests, then the red check when the criteria changed) #}
      {% if previous_step in ['developer_check', 'acceptance_tests', 'red_check'] and steps.developer_check.output and steps.developer_check.output.choice == 'changes' %}
      The owner tried your change and asks for these changes (change request {{ steps.developer_check.visits }}):
      {{ steps.developer_check.output.feedback }}
      Fix them on the same branch with a new commit, and answer each point in `summary`.
      {% if acc and acc.criteria_note %}
      The test writer read the request first{% if acc.criteria_changed and (acc.tests_changed or []) | length %} and updated these acceptance tests to it: {{ acc.tests_changed | join(', ') }}{% else %} and changed no test{% endif %}. Its note: {{ acc.criteria_note }}
      {% endif %}
      {% endif %}
      {% if previous_step == 'testid_check' and steps.testid_check.output.status == 'missing' %}
      The orchestrator checked the E2E scenarios' test ids after your commit (#246): {{ steps.testid_check.output.message }}
      Add each one to the screen its scenario exercises (`data-testid="<id>"`, with the role and
      accessible name the step uses), commit, and answer again in full. Never edit the scenarios or
      their step definitions.
      {% endif %}
      {% if previous_step == 'rule_check' and steps.rule_check.output.status == 'fail' %}
      The orchestrator ran the project's rule checks after your commit (#404), and they fail:
      {{ steps.rule_check.output.message }}
      Fix what they report in the production code or the docs (never weaken a rule or an acceptance
      test), run the check command again, commit, and answer again in full.
      {% endif %}
      {% if previous_step in ['secret_scan', 'secret_found'] and steps.secret_scan.output and steps.secret_scan.output.status == 'fail' %}
      The orchestrator scanned the run's commits for secrets (gitleaks, #49) and found (the secret-triage skill says how to judge each one):
      {% for f in steps.secret_scan.output.findings %}{% if loop.index <= 50 %}- {{ f.rule }} in {{ f.file }}:{{ f.line }} (commit {{ f.commit }})
      {% endif %}{% else %}{{ steps.secret_scan.output.message }}
      {% endfor %}Never print, copy, test or use a value. A false positive gets an entry in `.gitleaksignore` with its
      reason above it, in the same commit. A real secret is leaked: name it in `summary` (rule, file, line) so that
      the owner revokes it, and take it out of the run's own commits too, by rewriting them (a fixup commit and
      `git rebase --autosquash`): a new commit that deletes it leaves it in the history. Never rewrite a commit that is already on the base (`{{ inputs.base_branch }}`).
      Commit, and answer again in full.
      {% endif %}
      {% if previous_step == 'docs_check' and steps.docs_check.output.status == 'missing' %}
      The orchestrator compared your diff with the docs the issue lists under `## Expected files` (#757):
      {{ steps.docs_check.output.message }}
      Write them (a README section in docs/readme/ when the project generates its README), commit,
      and answer again in full; a doc you leave out on purpose goes to `left_out` with its reason.
      {% endif %}
      {% if not steps.develop.output and inputs.test_order == 'code_first' and not acc %}
      {# #29: code first, the developer goes first and the test writer after its commit #}
      Code first: you implement the change first, then the test writer writes the acceptance tests
      from the issue after your commit. Create the run's branch where the worktree starts (the
      local {{ inputs.base_branch }}): `git switch -c <branch>` (a short name for the change); never
      fetch, pull or push. Write the code and its unit tests (your own test files, in your commit),
      run them focused, and commit on that branch.
      {% elif not steps.develop.output %}
      Tests first: the test writer already worked on this task, on the run's branch
      `{{ acc.branch if acc else '(none: create it with git switch -c)' }}`{% if acc and acc.commit %} (commit {{ acc.commit }}){% endif %}.
      Stay on that branch (the worktree is on it); do not create another.
      {% endif %}
      {# #301: the first implementation starts from the Warm Up step's map (none after a failed or timed-out Warm Up) #}
      {% set wmap = steps.warm_up.output.map if not steps.develop.output and steps.warm_up.output and steps.warm_up.output.map else '' %}
      {% if wmap %}
      The Warm Up step mapped the code for you (read-only, before your turn). Start from this map:
      read only the files the map names, at the lines it points to; start an exploration sub-agent
      only for something the map lacks; never re-map the code yourself. Tests to run before
      committing: the map's run-tests blocks (the acceptance tests and the tests that reach each
      file it names), focused, never the whole suite.
      <warm_up_map>
      {{ wmap }}
      </warm_up_map>
      {# #758: the existing helpers the Warm Up found for the change #}
      {% set wreuse = steps.warm_up.output.reuse or [] %}
      {% if wreuse | length %}
      The Warm Up found these existing helpers, rules and tables: reuse these, do not rewrite them
      (call or import them; a new copy of one is a review finding):
      {% for r in wreuse %}- `{{ r.name }}` ({{ r.path }}:{{ r.line }}): {{ r.what }}{% if r.issue %} (for issue {{ r.issue }}){% endif %}
      {% endfor %}
      {% endif %}
      {% elif not steps.develop.output and previous_step == 'warm_up' %}
      The Warm Up step ended without a map (it failed or timed out): map the code yourself, with one exploration sub-agent before your first edit.
      {% endif %}
      {% set rc = steps.red_check.output %}
      {% if acc and (acc.tests_added or []) | length %}
      Acceptance tests ({{ 'written after your code' if inputs.test_order == 'code_first' else 'written before the code' }}, from the task): {{ acc.tests_added | join(', ') }}.
      {% if rc and inputs.test_order == 'code_first' %}{% if rc.red_check and (rc.red_check.red or []) | length %}Code first: these acceptance tests fail after your code, a gap in it to close: make them pass ({{ rc.red_check.red | join(', ') }}).
      {% endif %}{% elif rc %}{{ rc.message }}
      {% if rc.red_check and (rc.red_check.green | length) %}An already-green test passes before any change: it guards existing behaviour (keep it passing) or it is wrong (say which in `summary`; never edit it).
      {% endif %}{% endif %}
      Existing tests to keep green, from the code → tests map (through what the acceptance tests
      import): {{ ((rc.affected_tests if rc else []) or []) | join(', ') or 'none found' }}; named by
      the test writer: {{ (acc.affected_tests or []) | join(', ') or 'none' }}.
      {% if wmap %}For a file you change that the map does not name, its tests are in the code → tests map: {{ test_map }} (search it, do not read it whole).
      {% else %}Code → tests map of this checkout, for the files you change: {{ test_map }} (search it, do not read it whole).
      {% endif %}
      Criteria and their tests: {{ (acc.criteria or []) | to_yaml }}
      {% if (acc.not_testable or []) | length %}Not testable automatically (say in `summary` how you checked them): {{ acc.not_testable | join('; ') }}{% endif %}
      Implement until they pass. NEVER edit, delete, skip or weaken an acceptance test file: the
      orchestrator refuses a turn that changes one. If one contradicts the task, say why in
      `summary` and leave it (the reviewer decides). You may add your own tests for internal
      details, in new test files: write them with the code, so your own tests go into the
      implementation commit. To check, end your turn with a ```run-tests block listing the
      acceptance and related test files (the orchestrator runs them and resumes you with a short
      summary); never the whole suite (the orchestrator runs it after the review).
      {% elif acc %}
      The test writer wrote no acceptance test: {{ acc.summary }}
      {% endif %}
      {% if inputs.e2e_tests != 'off' and acc and acc.e2e_scope == 'scenarios' %}
      Acceptance E2E scenarios (BDD, tagged{% for n in inputs | issue_numbers %} @issue-{{ n }}{% else %} with the issue{% endfor %}, written before the code): {{ (acc.e2e_files or []) | join(', ') }}.
      They are acceptance files too: never edit them or their step definitions (the orchestrator
      refuses the turn). Their steps may locate controls that do not exist yet: add the
      `data-testid`s (and the roles and accessible names) they use to the screens you build.
      {% set ids = worktree_dir | missing_test_ids(inputs.steps_folders, inputs.ui_folders) %}{% if ids and not steps.develop.output %}Add these test ids: their step definitions use them and the renderer does not have them yet
      (the orchestrator checks them right after your commit, before the review):
      {{ ids }}
      {% endif %}
      {% if inputs.e2e_tests == 'write_and_run' %}The orchestrator runs them, with the @smoke journeys, after the review. When your change
      intentionally changes a screen with a `toHaveScreenshot` baseline, update that baseline on
      the branch (the reviewer approves it). Their run's screenshots and traces are the evidence of
      the states they cover: in `screenshots`, list only the states no scenario covers.{% else %}They run at release time (E2E release workflow), not in this run.{% endif %}
      {% endif %}
      In `test_notes`, list the tests you added yourself and anything the acceptance tests do not
      cover (behaviours, edge cases, files).
      In `evidence_plan`, say per issue how to show the change working, for the evidence step (it
      does not read the code): the screen and the screenshot options (view, tab, clicks), or the
      request, command or mock run whose output shows it; `none` and why when nothing is observable.
      For a UI change, list the interaction states to capture (the default view, then each edit
      form, empty state and error state the change adds, with the clicks that open them) and make
      the screenshot demo data cover the fields the change introduces (ui-conventions skill).
      {% if inputs.screenshots == 'off' %}
      Screenshots are off in this run (input `screenshots`): `screenshots` is an empty list, and
      the evidence plan shows the change with the diff, commands, logs or test results, never with
      `npm run screenshot`.
      {% else %}
      {% if inputs.screenshots == 'changed' %}Screenshots: only the screens this issue changes (input `screenshots`), at most the
      default view and one state per changed screen.
      {% endif %}
      In `screenshots`, list the same UI states as exact options of the project's screenshot command
      (`npm run screenshot -- …`), one entry each: `name` a plain file name
      `<issue>-<screen>-<state>`, `caption` one sentence, `args` the options as a list (e.g.
      ["--view", "backlog", "--mode", "roadmap", "--click", "[data-rm-edit]"]), never --out, --name,
      --side, --ref or --caption (the capture sets them). The engine captures each one, original and
      modified, before the owner tries the change. An empty list when the change has no UI; a
      change to files under the UI folders always lists its screens.
      Never run `npm run screenshot` yourself: make the demo data cover the change (that is code)
      and list the states; the engine captures them and the evidence step judges them.
      {% endif %}
      Never run a dev server or watcher in the foreground (long-commands).
      In `left_out`, list each requirement of the task (its acceptance criteria, each task of the
      issue) that you did not implement, with the reason: never leave one only in prose; an empty
      list when everything was done. A list that is not empty sends you back here, not to the review.
      Tasks that are not yours never go in `left_out`: tests (the test writer writes and runs them
      after the review; describe them in `test_notes`) and measurements that need real runs or the
      owner (say in `summary` what to measure and how).{% if inputs.issues | length > 1 %}
      A whole issue you could not do goes in `issues` (`done: false`), not in `left_out`.{% endif %}
      {% if vars.accepted_gaps %}
      The owner chose to continue without these requirements; do not list them again: {{ vars.accepted_gaps }}
      {% elif previous_step == 'develop' and vars.gaps_returned == 'yes' and steps.develop.output.left_out | developer_gaps | length %}
      Your previous answer left these requirements out, so the review was not called:
      {{ steps.develop.output.left_out | developer_gaps | to_yaml }}
      Finish them on the same branch with a new commit. Keep in `left_out` only those that are
      impossible in this run, each with the reason: the owner then decides whether the run goes on
      without them.
      {% endif %}
      {% if inputs.check_command | checks_off %}The project's rule checks are turned off for this run: run none (`checks: off`).
      {% else %}{% set checks = worktree_dir | check_command(inputs.check_command) %}Before your final answer, run the project's check command (`{{ checks or inputs.check_command or 'npm run check' }}`
      when it has one; no check command: say so) in the foreground, output in a log, fix what it
      reports and commit. Record the result in `checks` (`checks: pass` or the findings left). The
      orchestrator runs it again after your commit and sends failures back here.{% if checks not in ['', 'npm run check', (inputs.check_command or '') | trim] %}
      These are the project's own linter and type checker (#50): only what your change added goes
      back, leave the findings the base has.{% endif %}{% endif %}
      Your turn ends at green acceptance tests and a commit: answer once the ```run-tests block
      passes and the change is committed. The code_review step reviews your diff next, in its own
      session: never start a sub-agent to review your diff.
    # a fix round with a new commit, summary or set of files is progress, not "the same answer" (#121)
    stall:
      same_output_fields: [commit_sha, summary, files_changed]
    output_schema:
      type: object
      required: [branch, summary, files_changed, test_notes, committed, left_out]
      properties:
        branch:        { type: string }
        summary:       { type: string }
        files_changed: { type: array, items: { type: string } }
        # for the test writer: behaviours, edge cases and files to test
        test_notes:    { type: string }
        # #404: the project's check command before the answer: "checks: pass" or the findings left
        checks:        { type: string }
        # for the evidence step: per issue, the screen/command/request that shows the change
        evidence_plan: { type: string }
        # for developer_screenshots (#144): each UI state as the screenshot command's options;
        # an empty list for a change without UI
        screenshots:
          type: array
          items:
            type: object
            required: [name, caption, args]
            properties:
              name:    { type: string }
              caption: { type: string }
              args:    { type: array, items: { type: string } }
        committed:     { type: boolean }
        # a review round answered without a production change: back to the reviewer with the answer
        no_change:     { type: boolean }
        commit_sha:    { type: string }
        notes:         { type: string }
        # a run for several issues (inputs.issues): what was done for each one
        issues:
          type: array
          items:
            type: object
            required: [issue, done, summary]
            properties:
              issue:   { type: string }
              done:    { type: boolean }
              summary: { type: string }
        # requirements of the task the developer did not implement (#98), single issue or group;
        # required, so an answer cannot skip it (an empty list when nothing is missing)
        left_out:
          type: array
          items:
            type: object
            required: [requirement, reason]
            properties:
              requirement: { type: string }
              reason:      { type: string }
    transitions:
      # declared gaps (#98): no review is spent on work the developer says is missing. The first
      # time, back to the developer with the list (no reviewer call); any gap after that (also a new
      # one after the owner continued, or on a review round) goes to the owner at requirements_left_out.
      # Tests and Measure tasks are never the developer's (#173): developer_gaps drops them
      - when: "output.left_out | developer_gaps | length and vars.gaps_returned != 'yes'"
        goto: develop
        set: { gaps_returned: "yes" }
      - when: "output.left_out | developer_gaps | length"
        goto: requirements_left_out
      # #670: a UI change always has screenshots: files changed under the UI folders and no screen
      # listed go back to develop once (vars.ui_screens_returned), not past the capture as "no UI"
      - when: "output.committed and inputs.screenshots != 'off' and not (output.screenshots or []) | length and (output.files_changed or []) | ui_files(inputs.ui_folders) | length and vars.ui_screens_returned != 'yes'"
        goto: develop
        set: { ui_screens_returned: "yes" }
      # #670: the developer looked at its screenshots next to the mockups and changed nothing: the
      # same screens go on to the review
      - when: "not output.committed and previous_step == 'developer_screenshots' and vars.mockup_self_check == 'yes'"
        goto: developer_screenshots
      # #29: code first: the test writer writes the acceptance tests after the developer's first commit
      - when: "output.committed and inputs.test_order == 'code_first' and not steps.acceptance_tests.output"
        goto: acceptance_tests
      # #246: scenarios written first: their test ids are checked right after each commit
      # (testid_check, no model call); it then takes the routes below
      - when: "output.committed and inputs.e2e_tests != 'off' and steps.acceptance_tests.output and steps.acceptance_tests.output.e2e_scope == 'scenarios'"
        goto: testid_check
      # an issue of the group could not be done: the owner decides (once) whether the run goes on without it
      - when: "output.committed and inputs.issues | length > 1 and not steps.issue_not_done.output and (output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      # validated mode: the owner tries the first implementation and every round they asked for
      # (vars.owner_validated is "yes" once they approved; a review fix round goes on without them,
      # unless validate_every_round)
      - when: "inputs.validation == 'validated' and output.committed and (vars.owner_validated != 'yes' or inputs.validate_every_round) and inputs.screenshots != 'off'"
        goto: developer_screenshots
      # #151: a committed UI change (screens to capture, or files under the UI folders, #588) is
      # captured right after develop in every mode too, for the ui_reviewer in code_review (a UI fix
      # round included); a change without UI skips it
      - when: "output.committed and inputs.screenshots != 'off' and ((output.screenshots or []) | length or (output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
      # #404: the project's rule checks before the owner's gate or the review (rule_check, no model
      # call); a project without a check command goes on as before
      - when: "output.committed and worktree_dir | check_command(inputs.check_command)"
        goto: rule_check
      # #757: the docs the issues expect (docs_check, no agent), before the owner's gate or the review
      - when: "output.committed and inputs.task | expected_docs | length"
        goto: docs_check
      - when: "inputs.validation == 'validated' and output.committed and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
      # the review findings needed no production change (e.g. they ask for tests, which the test
      # writer owns): the reviewer gets the answer; a disagreement ends at human_review, never in a loop
      - when: "output.no_change and steps.code_review.output"
        goto: secret_scan
      - when: "output.committed"
        goto: secret_scan
      # #453: no commit this turn and no gaps, but the branch already has commits since the base
      # (e.g. the test writer's commit already fixes the issue): the rule checks and the review judge
      # those commits instead of develop looping until max_visits; a branch without any commit since
      # the base still goes back to develop
      - when: "not output.committed and worktree_dir | git_commits(inputs.base_branch) and worktree_dir | check_command(inputs.check_command)"
        goto: rule_check
      - when: "not output.committed and worktree_dir | git_commits(inputs.base_branch)"
        goto: secret_scan
      - when: "true"
        goto: develop
        max_visits: 3
        on_exhausted: fail

  # #404: the project's rule checks (lint, layers, file sizes, code health, docs, types...), run by
  # the orchestrator after each develop commit (no agent, no model call, about a minute): the
  # check_command input, or `npm run check` when the project's package.json has a `check` script, else
  # the project's own linter and type checker (#50: findings the base has are said, never sent back).
  # It is the last agent-less step after develop (after testid_check and the screenshots), just
  # before the owner's gate or the review; a project without a check command never reaches it.
  # Findings go back to the developer, at most twice per review round (a pass resets the count),
  # then to the owner at check_failed; never to the test writer. The suite still runs every test,
  # the rule tests included.
  - id: rule_check
    fragment: check-pipeline
    transitions:
      # #30: the environment, not the code (no dependencies installed): the owner fixes it, no round counted
      - when: "output.status == 'fail' and output.failure_kind == 'environment'"
        goto: check_environment
      - when: "output.status == 'fail' and (vars.check_returns or 0) | int < 2"
        goto: develop
        set: { check_returns: "{{ (vars.check_returns or 0) | int + 1 }}" }
      # rounds used up: the owner decides (a goto, not on_exhausted: no supervisor wake-up first)
      - when: "output.status == 'fail'"
        goto: check_failed
      # passed (or skipped): the docs the issues expect first (docs_check, #757)
      - when: "inputs.task | expected_docs | length"
        goto: docs_check
        set: &checks_passed { check_returns: "0" }
      # then the owner's gate in validated mode, else the review
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
        set: *checks_passed
      - when: "true"
        goto: secret_scan
        set: *checks_passed

  # #757: the docs the run's issues list under `## Expected files` (under docs/, README.md, any
  # *.md) against the run's diff since the base (packages/engine/engine/expected-files.js), no agent,
  # no model call, milliseconds. Right after rule_check, or in its place when the project has no
  # check command; the routes into it test `inputs.task | expected_docs | length`, so an issue
  # without the section, or without docs in it, never visits it. None of them touched, and not in
  # develop's left_out with a reason, goes back to develop with the list at most once per review
  # round (vars.docs_returns; going on resets it); never to the test writer.
  - id: docs_check
    display: Docs check
    type: docs_check
    base: "{{ inputs.base_branch }}"
    from: develop
    transitions:
      - when: "output.status == 'missing' and (vars.docs_returns or 0) | int < 1"
        goto: develop
        set: { docs_returns: "{{ (vars.docs_returns or 0) | int + 1 }}" }
      # passed, skipped or the return used up: the owner's gate in validated mode, else the review
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
        set: &docs_checked { docs_returns: "0" }
      - when: "true"
        goto: secret_scan
        set: *docs_checked

  # #49: gitleaks on the run's own commits (base to HEAD), no agent, no model call. Last of the agent-less steps after
  # develop: every route to the owner's gate or the review goes through it, and it picks between the two.
  # A finding goes back to the developer at most twice (a pass resets the count), then to you at
  # secret_found; not installed or turned off: skipped, said as "secrets not scanned", never as passed.
  - id: secret_scan
    fragment: secret-scan-pipeline
    transitions:
      # gitleaks failed, or its range could not be read: you, never a pass nor the developer's round
      - when: "output.status == 'error'"
        goto: secret_scan_error
      - when: "output.status == 'fail' and (vars.secret_returns or 0) | int < 2"
        goto: develop
        set: { secret_returns: "{{ (vars.secret_returns or 0) | int + 1 }}" }
      # returns used up: the owner decides (a goto, not on_exhausted: no supervisor wake-up first)
      - when: "output.status == 'fail'"
        goto: secret_found
      # passed or skipped: the owner's gate in validated mode, else the review
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round) and (steps.develop.output.committed or previous_step != 'develop')"
        goto: developer_check
        set: &secrets_scanned { secret_returns: "0" }
      - when: "true"
        goto: code_review
        set: *secrets_scanned

  # #49: a finding that stays. Every way on goes through the scan again
  - id: secret_found
    fragment: secret-scan-pipeline
    transitions:
      - when: "choice == 'stop'"
        goto: end
        status: failed
      - when: "choice == 'rescan'"
        goto: secret_scan
      # a gate answered by its first choice must not loop forever (as check_environment)
      - when: "true"
        goto: develop
        set: { secret_returns: "0" }
        max_visits: 3
        on_exhausted: end
        status: failed

  - id: secret_scan_error
    fragment: secret-scan-pipeline

  # #246: the test ids of the E2E scenarios written first, checked by the orchestrator right after
  # develop commits (no agent, no model call, milliseconds): every static getByTestId('…') of the
  # step definitions must be in the renderer (packages/engine/engine/test-ids.js, the rule of
  # test/e2e-playwright.test.js). Missing ones go back to the developer with the list and where each
  # is used, at most twice in the run; then the run goes on and the suite's test reports them. A
  # project without BDD step definitions is skipped (a note in the output). The folders come from
  # the steps_folders / ui_folders inputs (#588; default features/steps, src/renderer/).
  - id: testid_check
    display: Test id check (scenarios)
    type: test_ids
    steps: "{{ (inputs.steps_folders or []) | join('\\n') }}"
    renderer: "{{ (inputs.ui_folders or []) | join('\\n') }}"
    transitions:
      - when: "output.status == 'missing' and (vars.testid_returns or 0) | int < 2"
        goto: develop
        set: { testid_returns: "{{ (vars.testid_returns or 0) | int + 1 }}" }
      # then develop's own routes after a commit (its output is steps.develop.output here)
      - when: "inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
      # #670: a UI change always has screenshots, as in develop's transitions
      - when: "inputs.screenshots != 'off' and not (steps.develop.output.screenshots or []) | length and (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length and vars.ui_screens_returned != 'yes'"
        goto: develop
        set: { ui_screens_returned: "yes" }
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round) and inputs.screenshots != 'off'"
        goto: developer_screenshots
      - when: "inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
      # #404: the project's rule checks before the owner's gate or the review
      - when: "worktree_dir | check_command(inputs.check_command)"
        goto: rule_check
      # #757: the docs the issues expect
      - when: "inputs.task | expected_docs | length"
        goto: docs_check
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
      - when: "true"
        goto: secret_scan

  # Screenshots of the developer's UI states before the owner's check (#144) and the UI Reviewer
  # (#151): no agent, no model cost. The project's screenshot command runs once per entry of
  # develop's `screenshots`, modified (the worktree) and original (--ref the base), into
  # evidence/developer/round-<n>/ (one round per visit). Never blocks: an empty list, a simulated run
  # or a failed capture is in its output's message, which developer_check and the ui_reviewer read.
  - id: developer_screenshots
    display: Screenshots
    type: screenshots
    from: develop
    folder: developer
    base: "{{ inputs.base_branch }}"
    transitions:
      # #670: an issue with mockups: the developer looks at its screenshots next to them once
      # before the review (vars.mockup_self_check), and fixes what differs
      - when: "inputs.task | mockups | length and output.taken and vars.mockup_self_check != 'yes'"
        goto: develop
        set: { mockup_self_check: "yes" }
      # #404: the project's rule checks before the owner's gate or the review
      - when: "worktree_dir | check_command(inputs.check_command)"
        goto: rule_check
      # #757: the docs the issues expect
      - when: "inputs.task | expected_docs | length"
        goto: docs_check
      # validated mode: the owner's gate first (the same rounds as develop's transitions)
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
      - when: "true"
        goto: secret_scan

  # Validated mode (inputs.mode): the owner tries the developer's work before any review or test
  # token is spent. Ask for changes goes to the test writer's triage (#247), then back to the
  # developer with the text, and the run comes
  # back here; no automatic limit, the owner decides when to stop. A human gate: no timeout, and
  # neither the supervisor nor a retry ever answers it.
  - id: developer_check
    type: human_approval
    local_preview: true
    diff_base: "{{ inputs.base_branch }}"
    # the gate's card (#213): what happened, then one line per issue; the message below is its Details.
    # #715: rule_check (#404) runs between the screenshots and this gate; without screenshots nor a
    # check command the gate comes straight after develop or testid_check (or one of the gaps' gates)
    summary: |
      The developer finished {% if previous_step in ['check_failed', 'develop', 'developer_screenshots', 'issue_not_done', 'requirements_left_out', 'rule_check', 'docs_check', 'secret_scan', 'testid_check'] and steps.developer_check.output and steps.developer_check.output.choice == 'changes' %}your change request{% else %}the implementation{% endif %}: {{ steps.develop.output.summary | one_line(160) }}
      {{ steps.develop.output.issues | issue_lines }}
    message: |
      The developer finished {% if previous_step in ['check_failed', 'develop', 'developer_screenshots', 'issue_not_done', 'requirements_left_out', 'rule_check', 'docs_check', 'secret_scan', 'testid_check'] and steps.developer_check.output and steps.developer_check.output.choice == 'changes' %}your change request {{ steps.developer_check.visits - 1 }}{% else %}the implementation{% endif %}. Try it before the review and the tests run.
      Dev/QA: read the E2E scenarios and the screenshots; run the app and test by hand only what they do not cover.
      Branch `{{ steps.develop.output.branch }}`{% if worktree_dir %} in the worktree {{ worktree_dir }}{% endif %}.
      {% if local_preview %}Run App starts `{{ local_preview.command }}` there.{% else %}To try it: Run App proposes a command from the worktree (package.json, the README) and saves it as the project's Local preview.{% endif %} Try it with Run App, not by starting it by hand in the worktree.

      Summary: {{ steps.develop.output.summary }}
      {% if steps.develop.output.issues %}
      Issues:
      {% for i in steps.develop.output.issues %}- {{ i.issue }}: {% if i.done %}done{% else %}NOT done{% endif %}, {{ i.summary }}
      {% endfor %}{% endif %}
      Files changed: {{ steps.develop.output.files_changed | join(', ') }}
      {% set commits = worktree_dir | git_commits(inputs.base_branch) %}{% if commits %}Commits on the branch:
      {{ commits }}
      {% endif %}
      {% if worktree_dir %}Diff: Show the diff opens the branch's changes since `{{ inputs.base_branch }}` here.{% endif %}
      Test notes: {{ steps.develop.output.test_notes }}
      {% if steps.secret_scan.output and steps.secret_scan.output.status == 'skipped' %}{{ steps.secret_scan.output.message }}{% endif %}
      {% if tests_plan %}{{ tests_plan }}{% endif %}
      {% if inputs.screenshots == 'off' %}Screenshots: off in this run (the evidence is the diff, the logs and the test results).{% elif steps.developer_screenshots.output %}Screenshots: {{ steps.developer_screenshots.output.message }}{% endif %}
      {% if steps.develop.output.evidence_plan %}Evidence plan: {{ steps.develop.output.evidence_plan }}{% endif %}
      {% set e2e = steps.acceptance_tests.output | e2e_scenarios %}{% if inputs.e2e_tests == 'off' %}E2E scenarios: off in this run.{% elif e2e %}{{ e2e }}{% else %}E2E scenarios: none written for this issue.{% endif %}
    feedback: { label: "Your change request for the developer (required with \"Ask for changes\")", placeholder: "What to change, point by point" }
    choices:
      - { id: approve, label: "Approve: go on to the code review", help: "The code review, the tests and the verification run next; you are asked again only on a failure." }
      - { id: changes, label: "Ask for changes: back to the developer", feedback_required: true, help: "The test writer reads your text first and updates the acceptance tests only if it changes what they check; then the developer gets it. The run comes back to this gate after the fix." }
      - { id: stop,    label: "Stop the run (branch kept to resume)", help: "Ends the run as cancelled; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'approve'"
        goto: code_review
        set: { owner_validated: "yes" }
      # #247: the test writer triages the request first (criteria_changed), so the acceptance tests
      # locked from the developer never contradict it. requirements_left_out and issue_not_done take
      # no owner text (continue / stop only), so nothing there can change the criteria.
      - when: "choice == 'changes'"
        goto: acceptance_tests
        set: { owner_validated: "no", criteria_triage: "yes" }
      - when: "choice == 'stop'"
        goto: end
        status: cancelled

  # Requirements of the task the developer still leaves out after being sent back once to finish
  # them (#98): never dropped silently. A human gate: neither the supervisor nor a retry answers it.
  - id: requirements_left_out
    type: human_approval
    summary: |
      {% set gaps = steps.develop.output.left_out | developer_gaps %}The developer left {{ gaps | length }} requirement{{ '' if gaps | length == 1 else 's' }} of the task out, even after being sent back once to finish them.
      {% for g in gaps %}{% if loop.index <= 4 %}- ✖ {{ g.requirement | one_line(80) }}: {{ g.reason | one_line(60) }}
      {% endif %}{% endfor %}
    message: |
      The developer left these requirements of the task out, even after being sent back once to finish them:
      {% for g in steps.develop.output.left_out | developer_gaps %}
      - {{ g.requirement }}: {{ g.reason }}{% endfor %}
      The rest is on branch `{{ steps.develop.output.branch }}`; the code review has not run yet.
    choices:
      - { id: continue, label: "Continue without them", help: "Accepts the gaps: the run goes on to the review and the tests with what was done." }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      # nothing committed yet: the developer commits the rest first
      - when: "choice == 'continue' and not (steps.develop.output.committed or steps.develop.output.no_change)"
        goto: develop
        # the separator goes before each entry: the engine trims a set: value, so a trailing one is lost
        set: &accepted_gaps { accepted_gaps: "{{ vars.accepted_gaps }}{% for g in steps.develop.output.left_out | developer_gaps %}{% if vars.accepted_gaps or not loop.first %} {% endif %}{{ g.requirement }};{% endfor %}" }
      - when: "choice == 'continue' and inputs.issues | length > 1 and not steps.issue_not_done.output and (steps.develop.output.issues or []) | rejectattr('done') | list | length"
        goto: issue_not_done
        set: *accepted_gaps
      - when: "(choice == 'continue' and inputs.validation == 'validated' and vars.owner_validated != 'yes') and inputs.screenshots == 'off'"
        goto: secret_scan
        set: *accepted_gaps
      - when: "choice == 'continue' and inputs.validation == 'validated' and vars.owner_validated != 'yes'"
        goto: developer_screenshots
        set: *accepted_gaps
      # #151: a UI change is captured for the ui_reviewer, as in develop's transitions
      - when: "choice == 'continue' and inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
        set: *accepted_gaps
      - when: "choice == 'continue'"
        goto: secret_scan
        set: *accepted_gaps
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # A run for several issues where the developer could not do one of them: never dropped silently.
  - id: issue_not_done
    type: human_approval
    summary: |
      The developer could not do every issue of this run; the others are done on branch `{{ steps.develop.output.branch }}`.
      {{ steps.develop.output.issues | issue_lines }}
    message: |
      The developer could not do every issue of this run:
      {% for i in steps.develop.output.issues %}{% if not i.done %}
      - {{ i.issue }}: {{ i.summary }}{% endif %}{% endfor %}
      The other issues are done on branch `{{ steps.develop.output.branch }}`.
    choices:
      - { id: continue, label: "Continue without them", help: "The run goes on with the issues that are done; the others stay open." }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'continue' and inputs.validation == 'validated' and vars.owner_validated != 'yes' and inputs.screenshots != 'off'"
        goto: developer_screenshots
      # #151: a UI change is captured for the ui_reviewer, as in develop's transitions
      - when: "choice == 'continue' and inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
        goto: developer_screenshots
      # #404: the project's rule checks before the owner's gate or the review
      - when: "choice == 'continue' and worktree_dir | check_command(inputs.check_command)"
        goto: rule_check
      # #757: the docs the issues expect
      - when: "choice == 'continue' and inputs.task | expected_docs | length"
        goto: docs_check
      - when: "choice == 'continue' and inputs.validation == 'validated' and vars.owner_validated != 'yes'"
        goto: secret_scan
      - when: "choice == 'continue'"
        goto: secret_scan
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # After a merge conflict (vars.recheck == 'resolution', set by resolve_merge) the review covers
  # the resolution only: the rebase compared with the commit that was last approved.
  # #151: a fan-out, the reviewer and the ui_reviewer in parallel. The ui_reviewer runs only on a
  # round whose UI change was just captured (developer_screenshots, or the owner's gate after it);
  # otherwise the reviewer runs alone. min_success 1 + required_agents: a failed UI Reviewer never
  # blocks the run, a failed reviewer fails the step as before. output.results.<agent> holds each answer.
  - id: code_review
    agents: [reviewer, second_reviewer, ui_reviewer]
    min_success: 1
    required_agents: [reviewer]
    agent_when:
      second_reviewer: "inputs.review == 'multi_model'"
      ui_reviewer: "previous_step in ['developer_screenshots', 'developer_check', 'secret_scan'] and inputs.screenshots != 'off' and ((steps.develop.output.screenshots or []) | length or (steps.develop.output.files_changed or []) | ui_files(inputs.ui_folders) | length)"
    prompt: |
      {% if agent == 'ui_reviewer' %}
      {% set shots = steps.developer_screenshots.output %}
      Review how the change on branch `{{ steps.develop.output.branch }}` looks and is used (base
      `{{ inputs.base_branch }}`), against the ui-conventions and design-system skills.
      Task: {{ inputs.task }}
      Developer summary: {{ steps.develop.output.summary }}
      Files changed: {{ steps.develop.output.files_changed | join(', ') }}
      {% if steps.develop.output.evidence_plan %}The developer's evidence plan (the states the change adds): {{ steps.develop.output.evidence_plan }}{% endif %}
      Screenshots: {{ shots.message if shots else 'none taken' }}{% if shots and shots.dir %}, in `{{ run_dir }}/{{ shots.dir }}`
      as `<name>.original.png` (the base) and `<name>.modified.png` (the change){% endif %}.
      {% if shots and (shots.screenshots or []) | length %}{{ shots.screenshots | to_yaml }}{% endif %}
      {% set mocks = inputs.task | mockups %}
      {% if mocks | length %}
      The issue's mockups are the specification of its screens (#670), in
      `{{ run_dir }}/evidence/mockups/` (else at their path in the worktree, or the link):
      {% for m in mocks %}- `{{ m.file }}`: {{ m.ref }}
      {% endfor %}
      Compare each `<name>.modified.png` with its mockup: layout, icons, texts, controls, order,
      states. Each difference from the mockup is a blocking UI finding (`rule: mockup`, `source:
      mockup`, `convention: mockup: <file>`): the run goes back to develop with it, in every mode; it
      is not a suggestion. A mockup screen with no screenshot is blocking too. A difference the
      developer says is intended (a later phase) passes only when it cites the issue's line saying so.
      {% endif %}
      {% if inputs.mockup %}
      {# #836: the run's frozen mockup version #}
      Matches the mockup: this run follows the frozen mockup version in `{{ inputs.mockup }}`
      (`index.html` the screen, `kit/` its kit). Compare each `<name>.modified.png` of that screen
      with it: layout, controls, texts, order, states. Each difference is a blocking UI finding
      (`rule: mockup`, `source: mockup`, `convention: mockup: {{ inputs.mockup }}`); mark the
      checklist's "Matches the mockup" item pass or fail.
      {% endif %}
      Look at each PNG once, original and modified. When there is no screenshot (a simulated run, a
      failed capture, or no screen listed), review the diff of the styles and markup instead:
      `git diff {{ inputs.base_branch }}...{{ steps.develop.output.branch }} -- {{ (inputs.ui_folders or ['src/renderer/']) | join(' ') }}`.
      Judge only what the change touched, never the rest of the app, and never the code's logic.
      For each screenshot (or each changed screen, without screenshots), go through the fixed
      checklist of ui-conventions and mark each item pass or fail with one line of evidence:
      the 5-second test (the one message the screen gives and what leads; none, or buried, is
      blocking), the text budget (a one-line title and at most two lines before "more"), numbers
      as visuals, nothing printed by default that only experts need, one primary action per area,
      native controls themed, targets of at least 24 x 24 px, full screen for canvas and map views,
      empty, loading and error states in the evidence, nothing cut or overlapping; then the design
      items: copy, motion, decoration, focus and the minimum window size (a breach:
      `convention: ui-conventions: design`). Write each screen in `screens`: `screenshot`,
      `message` (its 5-second message), `weakness` (its biggest weakness: there always is one) and
      `checklist` (`item`, `pass`, `evidence`), also when you approve with no finding.
      For a data-heavy screen (lists, reports, charts, the city), say whether the evidence shows
      production-like volume (the large-project fixture): with only small data, set
      `small_data: true` on the screen and add a non-blocking UI finding asking for the real-scale state.
      {% if shots and (shots.axe_findings or []) | length %}
      The deterministic checks ran before you (axe-core `color-contrast` and `target-size` on each
      captured state, the native-control scan; `baseline: true` = the original side has it too,
      never blocking). Keep each one in `ui_findings`, or dismiss it in `dismissed` with a written
      `reason` (a false positive, a screen the change did not touch); a finding you neither keep nor
      dismiss with a reason is a review left unfinished:
      {{ shots.axe_findings | to_yaml }}
      {% endif %}
      List each problem in `ui_findings` (`element`, `problem`, `convention`: the rule of either skill
      it breaks, `screenshot`: the file it shows in, `blocking`: true when it makes the screen hard
      to read or use, false for polish); an empty list when there is none.
      {% if inputs.issues | length > 1 %}This run implements several issues: set `issue` (its URL) on each UI finding.{% endif %}
      {% if vars.ui_review_returned == 'yes' %}This is the look after the developer's UI fix round:
      report what is still wrong; it is recorded for the owner, not sent back.{% endif %}
      The code verdict is the code reviewer's: answer `verdict: approved` and `findings: []`; your
      review is `ui_findings`.
      {% elif vars.recheck == 'resolution' %}
      {% set approved = (action_error.head if action_error and action_error.head else '') or steps.resolve_merge.output.previous_head %}
      Review the RESOLUTION of a merge conflict on branch `{{ steps.develop.output.branch }}`, not the
      whole change: the change was already reviewed, tested and verified at commit `{{ approved }}`,
      then the local `{{ inputs.base_branch }}` moved and the developer rebased the branch onto it
      (now `{{ steps.resolve_merge.output.head }}`).
      `git range-diff {{ inputs.base_branch }} {{ approved }} {{ steps.develop.output.branch }}` compares the
      approved commits with the rebased ones, leaving out what came from `{{ inputs.base_branch }}`:
      review only what differs (the conflict hunks, what the resolution kept or dropped from each
      side, and any commit after the rebase). Findings on code the resolution did not change are not
      blocking: report them as minor or nit at most.
      Task (for context): {{ inputs.task }}
      Developer: {{ steps.resolve_merge.output.summary }}
      {% else %}
      Review the changes on branch `{{ steps.develop.output.branch }}` against
      `{{ inputs.base_branch }}` (`git diff {{ inputs.base_branch }}...{{ steps.develop.output.branch }}`).
      Task (the spec for the spec axis): {{ inputs.task }}
      Developer summary: {{ steps.develop.output.summary }}
      {% if not steps.develop.output.committed %}The developer made no production change this turn (its summary above says why): review the commits already on the branch (e.g. the test writer's) against the task.{% endif %}
      {% if steps.secret_scan.output and ((steps.secret_scan.output.ignored or []) | length or (steps.secret_scan.output.config or []) | length) %}
      Secret scan (#49, secret-triage skill): the change makes gitleaks skip the following. Judge each one, and refuse (a blocker finding) an entry that may be a real secret or has no good reason:
      {% for e in steps.secret_scan.output.ignored %}- `{{ e.entry }}`: {{ e.reason or 'no reason given' }}
      {% endfor %}{% for c in steps.secret_scan.output.config %}- `{{ c }}` changed: read its diff
      {% endfor %}{% endif %}{% if steps.secret_scan.output and steps.secret_scan.output.status == 'skipped' %}{{ steps.secret_scan.output.message }} Look for secrets in the diff yourself.
      {% endif %}
      {% if vars.accepted_gaps %}The owner accepted that the run goes on without these requirements (not blocking): {{ vars.accepted_gaps }}{% endif %}
      {# #758: the Warm Up's reuse list, what the reuse pass checks the diff against #}
      {% set wreuse = (steps.warm_up.output.reuse if steps.warm_up and steps.warm_up.output else none) or [] %}
      {% if wreuse | length %}
      Reuse pass: the Warm Up listed these existing helpers, rules and tables before develop. Start
      your reuse pass from them and check that the diff calls them instead of rewriting them:
      {% for r in wreuse %}- `{{ r.name }}` ({{ r.path }}:{{ r.line }}): {{ r.what }}{% if r.issue %} (for issue {{ r.issue }}){% endif %}
      {% endfor %}
      {% endif %}
      {% endif %}
      {% if inputs.issues | length > 1 and vars.recheck != 'resolution' %}
      This run implements several issues: check the spec axis per issue, and set `issue` (its URL)
      on the findings about one of them. An issue the change misses or only half does is a blocker,
      unless the developer reported it as not done:
      {{ steps.develop.output.issues | to_yaml }}
      {% endif %}
      {% set acc = steps.acceptance_tests.output %}{% if acc and (acc.tests_added or []) | length %}{% if inputs.test_order == 'code_first' %}Code first (#29): the acceptance tests were written after the developer's first commit, at commit{% else %}Tests first: the acceptance tests were written before the code, at commit{% endif %}
      `{{ acc.commit }}`: {{ acc.tests_added | join(', ') }}. Check with
      `git diff {{ acc.commit }} {{ steps.develop.output.branch }} -- {{ acc.tests_added | join(' ') }}`
      that the developer did not change them: any change to an acceptance test is a blocker
      finding (unless the test contradicts the task: then say so and approve the fix). Tests the
      developer added for internal details are fine.{% endif %}
      Running tests is not part of this review: the orchestrator runs the suite after your approval. A missing test, coverage or
      screenshot, even when the task asks for it, is never a finding here: list it in
      `for_test_writer` instead; it does not change the verdict. A measurement that needs real runs
      or the owner (an issue's Measure task) is the owner's, never a finding either.
    output_schema:
      type: object
      required: [verdict, findings]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        # what the test writer should cover (tests the task asks for); never a finding
        for_test_writer: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, description]
            properties:
              axis:        { type: string, enum: [correctness, spec, standards] }
              severity:    { type: string, enum: [blocker, major, minor, nit] }
              file:        { type: string }
              line:        { type: integer }
              description: { type: string }
              issue:       { type: string }
        # the ui_reviewer's answer (#151): the visual review of the screenshots (ui-conventions and
        # design-system skills); the reviewer leaves it out
        ui_findings:
          type: array
          items:
            type: object
            required: [element, problem, convention, blocking]
            properties:
              issue:      { type: string }
              element:    { type: string }
              problem:    { type: string }
              convention: { type: string }
              screenshot: { type: string }
              blocking:   { type: boolean }
              # a deterministic check's finding (#387, packages/engine/domains/evidence/ui-review-checks.js): its rule (axe's
              # id or native-control), where it came from (axe, markup), and a baseline (the
              # original side has it too: a ratchet, never blocking)
              rule:       { type: string }
              source:     { type: string }
              baseline:   { type: boolean }
    # the ui_reviewer's own answer (#387): no rubber-stamp approval, every screen gets its
    # 5-second message, its biggest weakness and each checklist item pass/fail with one line of
    # evidence; the deterministic findings it drops go to `dismissed` with a reason
    agent_output_schema:
      ui_reviewer:
        required: [screens]
        properties:
          screens:
            type: array
            minItems: 1
            items:
              type: object
              required: [screenshot, message, weakness, checklist]
              properties:
                screenshot: { type: string, minLength: 1 }
                message:    { type: string, minLength: 1 }
                weakness:   { type: string, minLength: 1 }
                small_data: { type: boolean }
                checklist:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [item, pass, evidence]
                    properties:
                      item:     { type: string, minLength: 1 }
                      pass:     { type: boolean }
                      evidence: { type: string, minLength: 1 }
          dismissed:
            type: array
            items:
              type: object
              required: [element, reason]
              properties:
                rule:    { type: string }
                element: { type: string }
                reason:  { type: string, minLength: 1 }
    transitions:
      # code findings, with the blocking UI findings when there are, go back to develop in one turn;
      # the UI is sent back once (vars.ui_review_returned), like evidence did before #151;
      # vars.ui_review_sent: this round shows develop the blocking UI findings (set first, from the
      # flag before this round). #630: with review multi_model, the second reviewer's changes_requested
      # sends it back too (both verdicts must approve)
      - when: "output.results.reviewer.verdict == 'changes_requested' or output.results.second_reviewer.verdict == 'changes_requested'"
        goto: develop
        set:
          ui_review_sent: "{% if (output.results.ui_reviewer.ui_findings or []) | selectattr('blocking') | list | length and vars.ui_review_returned != 'yes' %}yes{% else %}no{% endif %}"
          ui_review_returned: "{% if (output.results.ui_reviewer.ui_findings or []) | selectattr('blocking') | list | length %}yes{% else %}{{ vars.ui_review_returned }}{% endif %}"
        loop:
          name: review_cycle
          max_iterations: 3
          on_exhausted: human_review
      # #151: blocking UI findings alone: one UI fix round, back through developer_screenshots and
      # this review, never through test/suite/E2E/build
      - when: "(output.results.ui_reviewer.ui_findings or []) | selectattr('blocking') | list | length and vars.ui_review_returned != 'yes'"
        goto: develop
        set: { ui_review_sent: "yes", ui_review_returned: "yes" }
      # #203: unit tests written after the review → the test writer; only the existing suite → no
      # test writer. #223: the E2E scenarios were written first (acceptance_tests): the machine runs
      # them (e2e) after the suite, or right after the review when there is no suite.
      - when: "output.results.reviewer.verdict == 'approved' and inputs.unit_tests == 'write_and_run'"
        goto: test
      - when: "output.results.reviewer.verdict == 'approved' and inputs.unit_tests == 'run_existing'"
        goto: suite
      - when: "output.results.reviewer.verdict == 'approved' and inputs.e2e_tests == 'write_and_run' and steps.acceptance_tests.output.e2e_scope == 'scenarios'"
        goto: e2e
      - when: "output.results.reviewer.verdict == 'approved'"
        goto: build

  - id: human_review
    type: human_approval
    local_preview: true
    summary: |
      The code review did not converge in 3 rounds: the reviewer still asks for changes.
    approve_label: "Go on to testing anyway"
    approve_help: "The tests, the build and the verification run with the review's findings left open."
    reject_label: "Stop the run"
    reject_help: "Ends the run as cancelled; nothing is merged and its branch keeps the work to resume it."
    message: |
      The review loop did not converge in 3 iterations.
      Go on to testing anyway: move on to testing. Stop the run: the run ends as cancelled.
      {% if tests_plan %}{{ tests_plan }}{% endif %}
    transitions:
      # #203, #223: the same test routing as code_review's
      - when: "approved and inputs.unit_tests == 'write_and_run'"
        goto: test
      - when: "approved and inputs.unit_tests == 'run_existing'"
        goto: suite
      - when: "approved and inputs.e2e_tests == 'write_and_run' and steps.acceptance_tests.output.e2e_scope == 'scenarios'"
        goto: e2e
      - when: "approved"
        goto: build
      - when: "rejected"
        goto: end
        status: cancelled

  # Test writer: owns the tests (writes/updates them) and runs the focused ones; the suite step
  # after it runs the whole suite (#177). On a production-code failure the orchestrator hands it
  # to the developer and tells the test writer when it is fixed. Its parts follow unit_tests /
  # e2e_tests (#203): it only runs when one of them makes it write something.
  - id: test
    display: Write tests (Unit)
    agent: test_writer
    # the run's checkout of the base with its dependencies, for the pre-existing-failure check (#198)
    base_worktree: true
    # the orchestrator runs the whole suite: a whole-suite command of the test writer is noted (#177)
    full_suite: warn
    # test files left uncommitted are committed by the orchestrator before the build (#209)
    commit_tests: true
    # {{ test_map }}: the checkout's code → tests map (#219), when Warm Up gave no map (#304)
    test_map: true
    prompt: |
      Branch `{{ steps.develop.output.branch }}` (already reviewed).
      Original task: {{ inputs.task }}
      Change made: {{ steps.develop.output.summary }}
      Files: {{ steps.develop.output.files_changed | join(', ') }}
      {% if steps.develop.output.test_notes %}
      What the developer says should be tested:
      {{ steps.develop.output.test_notes }}
      {% endif %}
      {% set review = steps.code_review.output.results.reviewer if steps.code_review.output and steps.code_review.output.results else none %}
      {% if review and review.for_test_writer %}
      What the reviewer says should be tested:
      {{ review.for_test_writer }}
      {% endif %}

      This run's tests (#203): {{ tests_plan }}
      Never start the project's whole test suite yourself: the orchestrator runs it once after
      your step (round by round) and gives you its failing tests. Run only focused tests: the
      files you touch, filtered to the tests you are writing (e.g. `--test-name-pattern`), each
      slow one (over a minute) at most once per round. Never start a full mock run of a workflow
      (`scripts/run.js`).

      {% if previous_step == 'suite' and steps.suite.output and steps.suite.output.status == 'fail' %}
      The orchestrator ran the whole suite after your last step and it failed. Only these tests
      fail (the full output is in `{{ run_dir }}/{{ steps.suite.output.log }}`: read only what
      you need, or have a sub-agent summarise it):
      {{ steps.suite.output | suite_failures }}
      For each one: a test that is wrong or obsolete (yours or one the change made obsolete by an
      intended behaviour change) → fix the test and commit it; a failure caused by the production
      code → do NOT fix it, describe it in `failure_report` and set `tests_status: fail` (the
      developer fixes it); a test that also fails on the base → `preexisting_failures` (below).
      Run only these failing tests to confirm.
      {% elif delegate_result %}
      The developer fixed the production code you reported (it does not touch the tests):
      {{ delegate_result.text }}
      Run the failing tests again and confirm.
      {% elif vars.recheck == 'resolution' and (steps.resolve_merge.output.files_changed or []) | length <= 5 %}
      Your tests already passed on this change. Since then the developer rebased the branch onto
      the local `{{ inputs.base_branch }}` and resolved a conflict, touching only:
      {{ (steps.resolve_merge.output.files_changed or []) | join(', ') or '(no file listed: see the summary)' }}
      ({{ steps.resolve_merge.output.summary }})
      Run only the tests related to those files (their own tests and the tests of what uses them),
      plus a fast smoke check of the whole project (the quickest command that loads it: a build,
      a type check, or the test runner on one small file), NOT the full suite. Update a test only
      when the base's change made it obsolete (not a bug); no new tests. Say
      which tests you ran in `summary`.
      {% elif vars.recheck == 'resolution' %}
      Your tests already passed on this change. Since then the developer rebased the branch onto
      the local `{{ inputs.base_branch }}` and resolved a conflict that touched many files:
      {{ steps.resolve_merge.output.summary }}
      Run the tests of the files the resolution touched (the orchestrator runs the whole suite
      next). Update a test only when the base's change made it obsolete (not a bug); no new tests.
      {% else %}
      {% if inputs.unit_tests == 'write_and_run' %}
      1. Check out the branch. You own the tests: the developer did not write or run any.
         Write the tests the change needs, starting from the developer's notes (they are a
         starting point, not a limit), following the test skill (the framework and folder the
         project already uses). Update the tests the change makes obsolete because of an
         intended behaviour change (not a bug). Commit only test files. Purely visual changes
         may not need a new test — justify it.
      2. While writing, run only the test files you touch (see above); the whole suite is the
         orchestrator's.
      {% else %}
      1. Check out the branch. Unit tests are {{ 'run without new tests' if inputs.unit_tests == 'run_existing' else 'off' }} in this run: write no unit
         tests and leave `tests_added` empty; `tests_status` is pass unless an existing test
         fails because of the production code.
      {% endif %}
      {# #304: the tests to run come from the Warm Up map; without one, from the code → tests map #}
      {% if steps.warm_up.output and steps.warm_up.output.map %}
      Tests to run before committing: the run-tests blocks of the Warm Up step's map (below: the
      acceptance tests and, for each file it names, the tests that reach it, direct first), plus
      the test files you write. For a changed file the map does not name, its tests are in the
      code → tests map of this checkout: {{ test_map }} (search it, do not read it whole).
      <warm_up_map>
      {{ steps.warm_up.output.map }}
      </warm_up_map>
      {% else %}
      Tests to run before committing: for each changed file, the test files that reach it in the
      code → tests map of this checkout: {{ test_map }} (search it, do not read it whole), plus the
      test files you write.
      {% endif %}
      {% endif %}
      {% if inputs.e2e_tests != 'off' %}
      The E2E scenarios were written first (acceptance tests step){% if inputs.e2e_tests == 'write_and_run' %} and the orchestrator runs them after the suite{% endif %}: write no scenario here and never start the app for them.
      {% endif %}
      No screenshots here: the evidence of the change is collected after the build (evidence step).
      When a test fails (yours or one of the suite's), first check whether the same test fails on the local
      `{{ inputs.base_branch }}`, following the test skill (pre-existing failures): run only the
      failing files in the base checkout the engine prepared ({{ base_worktree_dir or "a
      temporary worktree of the base" }}, dependencies already there). A test that also fails there is not this
      run's: list it in `preexisting_failures` (test, file, reason), do not investigate or fix it
      (unless it is trivial and in files this change touches), and it does not make
      `tests_status` fail; the orchestrator's suite does not count it either. The owner gets the list as a follow-up.
      If a test fails because of production code, do NOT fix it:
      fill failure_report with test, file, error and probable cause.
      Last step, always: `git add` every test file you wrote or changed (feature files and step
      definitions included) and commit them on the branch, then set `committed: true`. Any other file
      left changed sends the step back to you. `committed: false` only when you changed no file.
    output_schema:
      type: object
      required: [tests_status, tests_added, committed]
      properties:
        tests_status:   { type: string, enum: [pass, fail] }
        tests_added:    { type: array, items: { type: string } }
        committed:      { type: boolean }
        failure_report: { type: string }
        summary:        { type: string }
        # tests that also fail on the base: reported, not chased (the engine logs them for the owner)
        preexisting_failures:
          type: array
          items:
            type: object
            required: [test, file]
            properties:
              test:   { type: string }
              file:   { type: string }
              reason: { type: string }
    transitions:
      # unit tests off (#203): no suite
      - when: "output.tests_status == 'pass' and inputs.unit_tests == 'off'"
        goto: build
      # a small conflict resolution: the related tests and a smoke check were enough, no whole suite
      - when: "output.tests_status == 'pass' and vars.recheck == 'resolution' and (steps.resolve_merge.output.files_changed or []) | length <= 5"
        goto: build
      # the orchestrator runs the whole suite (#177)
      - when: "output.tests_status == 'pass'"
        goto: suite
      - when: "output.tests_status == 'fail'"
        delegate:
          agent: developer
          prompt: |
            The test writer found failures caused by the production code on branch `{{ steps.develop.output.branch }}`:
            {{ output.failure_report }}
            Fix the production code only: never change the tests (if you think a test is wrong,
            say why in your answer; the test writer owns it). Run only the failing tests, not the
            full suite (the orchestrator runs it after the test writer), commit and report the commit hash.
        goto: test
        max_visits: 3
        on_exhausted: test_failed

  # The project's whole test suite, once per round, without an agent (#177): the command of
  # `test_command` (empty: found from the project's files), its output in logs/suite-<round>.log.
  # Failing tests go back to the test writer (write_and_run) or to the developer (run_existing),
  # 2 rounds, then test_failed. Tests that also fail on the base (the test writer's
  # preexisting_failures, or the step's own rerun of the failing files on the base, #211) never
  # count. A suite that cannot run (test files and no command) goes to test_failed; a project with no
  # tests (#71, `not_run`) goes on to the build unless `no_tests: ask`. No timeout: it comes from the
  # project's recent suite durations (#210).
  # scope affected (#212, #304): each round runs the test files the change reaches (import graph since
  # the base, plus the files that failed before); when they pass, the whole suite runs once in the run.
  # #553: at most once, pass or fail: later rounds run the files affected since it plus the files that
  # failed (a shared root changed: the whole suite again); a selection over the command line goes to
  # scripts/test.js as a list (CRAFTORIO_TEST_FILES) and still runs filtered.
  - id: suite
    display: Run suite (Unit)
    type: suite
    command: "{{ inputs.test_command }}"
    scope: affected
    # T6: its whole round (empty: `command` runs whole)
    whole_command: "{{ inputs.whole_test_command }}"
    # #225: node's coverage (an npm script's <name>:coverage, or a plain node --test) as a Tests artifact
    coverage: true
    transitions:
      # #223: the issue's scenarios, written first, run after the suite
      # (#396: a green suite clears an earlier "not tested green")
      - when: "output.status == 'pass' and inputs.e2e_tests == 'write_and_run' and steps.acceptance_tests.output.e2e_scope == 'scenarios'"
        goto: e2e
        set: { tested: "" }
      # build: after a merge-conflict resolution it goes on to verify_change (evidence kept)
      - when: "output.status == 'pass'"
        goto: build
        set: { tested: "" }
      # #71: a project with no tests is not a failure (no E2E scenario either: it would be a test file)
      - when: "output.status == 'not_run' and inputs.no_tests != 'ask'"
        goto: build
        set: { tested: "no tests" }
      - when: "output.status == 'not_run'"
        goto: test_failed
      - when: "output.status == 'blocked'"
        goto: test_failed
      # #396, the owner's policy: a suite red only outside the change (no counted failure in it, see
      # suite-step.js) goes on like a green one, recorded as not tested green (summary.json `tested`,
      # the build and verify prompts). Affected rounds only run files of the change, so such a red
      # comes from the whole-suite run, the step's last round. A failure in the change goes on below.
      - when: "output.status == 'fail' and output.in_change == 0 and inputs.suite_red_outside_change == 'continue' and inputs.e2e_tests == 'write_and_run' and steps.acceptance_tests.output.e2e_scope == 'scenarios'"
        goto: e2e
        set: { tested: "not green" }
      - when: "output.status == 'fail' and output.in_change == 0 and inputs.suite_red_outside_change == 'continue'"
        goto: build
        set: { tested: "not green" }
      - when: "output.status == 'fail' and inputs.unit_tests == 'write_and_run'"
        goto: test
        max_visits: 2
        on_exhausted: test_failed
      - when: "output.status == 'fail'"
        delegate:
          agent: developer
          prompt: |
            The project's test suite fails on branch `{{ steps.develop.output.branch }}` (no new
            tests were written in this run: unit_tests is run_existing):
            {{ output | suite_failures }}
            The whole log: {{ run_dir }}/{{ output.log }} (read only the failing tests' part).
            Fix the production code only: never change the tests (if you think a test is wrong or
            made obsolete by the intended change, say why in your answer). Run only the failing
            tests, not the full suite (the orchestrator runs it next), commit and report the commit hash.
        goto: suite
        max_visits: 2
        on_exhausted: test_failed

  # E2E (#223), without an agent like suite (#177): the issue's scenarios (written first, locked for
  # the developer) plus the @smoke journeys, in the suite's two lanes (#365: @visual one at a time
  # holding the machine's screenshot slot, #199; the rest in parallel), log in logs/e2e-<round>.log; a failure keeps its trace and the
  # page's accessibility snapshot under .test-output/e2e/artifacts/. The visual baselines of the
  # screens the issue changes are checked in the same run. Green: no LLM at all. Red: the healer.
  - id: e2e
    display: Run suite (E2E)
    type: suite
    command: '{{ inputs.e2e_command or "npm run test:e2e" }} -- --grep "{% for n in inputs | issue_numbers %}@issue-{{ n }}|{% endfor %}@smoke"'
    timeout: 30m
    transitions:
      - when: "output.status == 'pass'"
        goto: build
      - when: "output.status == 'blocked'"
        goto: test_failed
      # a red scenario: the only way to an agent; 2 healing rounds, then the gate
      - when: "output.status == 'fail'"
        goto: heal
        max_visits: 2
        on_exhausted: test_failed

  # The healer (#223; Playwright Test Agents' healer): the failure, the trace and the accessibility
  # snapshot, never screenshots by default. A stale locator or a missing wait: fixed, the scenarios
  # run again. A product bug: to the developer with the evidence, then the scenarios run again.
  - id: heal
    display: E2E Heal
    agent: healer
    prompt: |
      Task: {{ inputs.task }}
      Branch `{{ steps.develop.output.branch }}`. The orchestrator ran this issue's E2E scenarios and
      the @smoke journeys (`{{ steps.e2e.output.command }}`, round {{ steps.e2e.visits }}) and some are red:
      {{ steps.e2e.output | suite_failures }}
      The whole output: {{ run_dir }}/{{ steps.e2e.output.log }} (read only the failing scenarios' part).
      {% if steps.heal.output and steps.heal.output.heal_status == 'healed' %}
      Your previous fix did not make them pass: {{ steps.heal.output.summary }}
      {% endif %}
      For each red scenario, read in this order, and stop as soon as the cause is clear:
      1. the failure above: the step, the locator and the error;
      2. its Playwright trace (the `trace:` path above, under .test-output/e2e/artifacts/<scenario>/):
         the actions before the failing step and how long each one waited;
      3. the accessibility snapshot (ARIA snapshot) of the page at the failing step: the
         error-context file Playwright writes next to the trace, or the snapshot in the trace. It
         lists the roles, accessible names and test ids really on screen.
      Never open the failure screenshots or videos by default: only when the snapshot cannot
      explain the failure, and say so in `summary`.
      Then sort the failure and set `heal_status`:
      - healed: a stale locator (a renamed role, name or test id for the same control) or a missing
        wait (the control appears after a load or an animation). Fix the step definition only:
        locate by role or `data-testid`, wait with a web-first assertion or for the state, never a
        fixed sleep. Re-run only that scenario (`{{ inputs.e2e_command or "npm run test:e2e" }} -- --grep "<scenario name>"`),
        then commit on the branch.
      - app: a product bug: the application does not do what the scenario checks (a control the
        issue asks for is missing, a wrong value, an error), or a visual check (`toHaveScreenshot`)
        differs over its threshold. Change nothing; describe it in `failure_report` for the
        developer: scenario, step, error, what the trace and the snapshot show, probable cause.
      - blocked: nothing could run (the app does not start, no browser, no framework).
      Never weaken or remove an assertion: never change an expected value or text, loosen a matcher,
      raise a timeout or a screenshot threshold to hide a failure, update a baseline, tag a scenario
      to skip it, or delete a step or a scenario. A fix that would need one of these is `app`.
      Never change production code.
    output_schema:
      type: object
      required: [heal_status, summary]
      properties:
        heal_status:    { type: string, enum: [healed, app, blocked] }
        summary:        { type: string }
        # app: the evidence for the developer (scenario, step, error, trace, snapshot, probable cause)
        failure_report: { type: string }
        # healed: the step definition files changed and the commit
        files_changed:  { type: array, items: { type: string } }
        commit_sha:     { type: string }
    transitions:
      - when: "output.heal_status == 'healed'"
        goto: e2e
      - when: "output.heal_status == 'blocked'"
        goto: test_failed
      # a product fix changes production code: the unit suite runs again first (it goes on to e2e
      # when green), so a regression is never merged on the earlier green suite
      - when: "output.heal_status == 'app' and inputs.unit_tests != 'off'"
        delegate: &app_fix
          agent: developer
          prompt: |
            The issue's E2E scenarios fail because of the application on branch `{{ steps.develop.output.branch }}`.
            The E2E healer's evidence:
            {{ output.failure_report }}
            The run's output: {{ run_dir }}/{{ steps.e2e.output.log }} (read only the failing scenarios' part).
            Fix the production code only: never change the scenarios or their step definitions (if
            one is wrong, say why in your answer). Add the `data-testid`s the steps use; when the
            change intentionally changes a screen with a `toHaveScreenshot` baseline, update that
            baseline on the branch. Check with that scenario only, commit and report the commit hash.
        goto: suite
      - when: "output.heal_status == 'app'"
        delegate: *app_fix
        goto: e2e

  # #404: the project's rule checks still fail after the developer's rounds (rule_check). A human
  # gate (a decision: neither the supervisor nor a retry answers it). Continue takes rule_check's
  # routes after a pass; the suite's rule tests still report what is left.
  - id: check_failed
    fragment: check-pipeline
    choices:
      - { id: continue, label: "Continue to the review anyway", help: "The review and the suite run; the change is reported as not passing the rule checks." }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'stop'"
        goto: end
        status: failed
      # continue: rule_check's routes after a pass (the docs check first, #757)
      - when: "inputs.task | expected_docs | length"
        goto: docs_check
        set: *checks_passed
      - when: "inputs.validation == 'validated' and (vars.owner_validated != 'yes' or inputs.validate_every_round)"
        goto: secret_scan
        set: *checks_passed
      - when: "true"
        goto: secret_scan
        set: *checks_passed

  # #30: the rule checks cannot run here (the project's dependencies are not installed, a command is
  # missing): no developer can fix it, so it never counts as a round. The owner fixes the environment
  # (npm ci in the folder the cause names) and tries again, which reruns rule_check. A decision, like
  # check_failed: neither the supervisor nor a retry answers it.
  - id: check_environment
    fragment: check-pipeline

  - id: test_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    # the run's failures, the pre-existing ones as a count (#211). A run resumed at this gate has no
    # previous_step (#71): a suite that did not run is told by the other steps that lead here
    summary: |
      {% if steps.suite.output.status == 'blocked' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_could_not_run', { reason: steps.suite.output.reason | one_line(160) }) %}The project's test suite could not run: {{ steps.suite.output.reason | one_line(160) }}{% endfilter %}
      {% elif steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_no_tests') %}The suite was not run: the project has no tests.{% endfilter %}
      {% elif previous_step == 'suite' %}{% filter translated('engine.test_failed_suite_red', { rounds: steps.suite.visits, count: steps.suite.output.failures | length }) %}The test suite still fails after {{ steps.suite.visits }} round(s): {{ steps.suite.output.failures | length }} failing test(s) of this run.{% endfilter %}
      {{ steps.suite.output | suite_lines }}
      {% elif previous_step == 'heal' %}{% filter translated('engine.test_failed_heal_blocked', { summary: steps.heal.output.summary | one_line(160) }) %}The E2E healer could not run the scenarios: {{ steps.heal.output.summary | one_line(160) }}{% endfilter %}
      {% elif previous_step == 'e2e' and steps.e2e.output.status == 'blocked' %}{% filter translated('engine.test_failed_e2e_blocked', { reason: steps.e2e.output.reason | one_line(160) }) %}The E2E scenarios could not run: {{ steps.e2e.output.reason | one_line(160) }}{% endfilter %}
      {% elif previous_step == 'e2e' %}{% filter translated('engine.test_failed_e2e_red', { rounds: steps.heal.visits, count: steps.e2e.output.failures | length }) %}The E2E scenarios still fail after {{ steps.heal.visits }} healing round(s): {{ steps.e2e.output.failures | length }} red scenario(s).{% endfilter %}
      {{ steps.e2e.output | suite_lines }}
      {% else %}{% filter translated('engine.test_failed_tests_red') %}Tests still fail after 3 rounds of fixes.{% endfilter %}
      - ✖ {{ steps.test.output.failure_report | one_line(120) }}
      {% endif %}
    recommend: "{% if steps.suite.output.status == 'blocked' and previous_step not in ['test', 'e2e', 'heal'] %}stop: {% filter translated('engine.test_failed_recommend_blocked') %}set the workflow's test_command input, then resume the run.{% endfilter %}{% elif steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_recommend_no_tests') %}only the owner answers (they set no_tests to ask). The project has no tests, so nothing was tested.{% endfilter %}{% else %}stop: {% filter translated('engine.test_failed_recommend_red') %}the change is not tested green; look at the failures, then resume the run.{% endfilter %}{% endif %}"
    # named choices (#223), like build_failed: the same two answers as an Approve / Reject gate
    choices:
      - { id: continue, label: "Continue to the build anyway", label_key: engine.test_failed_continue, help: "The build and the verification run; the change is reported as {% if steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}not tested: the project has no tests{% else %}not tested green{% endif %}.", help_key: "engine.test_failed_continue_help{% if steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}_no_tests{% endif %}" }
      - { id: stop,     label: "Stop the run", label_key: engine.test_failed_stop, help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it.", help_key: engine.test_failed_stop_help }
    message: |
      {% if steps.suite.output.status == 'blocked' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_could_not_run', { reason: steps.suite.output.reason }) %}The project's test suite could not run:
      {{ steps.suite.output.reason }}{% endfilter %}
      {% filter translated('engine.test_failed_set_command') %}Set the workflow's `test_command` input (e.g. npm test) when the project's files do not give it.{% endfilter %}
      {% elif steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_no_tests_ask') %}The suite was not run: the project has no tests, so nothing was tested (the input `no_tests: ask` asks you before the run goes on).{% endfilter %}
      {% elif previous_step == 'suite' %}{% filter translated('engine.test_failed_suite_details', { count: steps.suite.visits }) %}The project's test suite still fails after {{ steps.suite.visits }} round(s):{% endfilter %}
      {{ steps.suite.output | suite_failures }}
      {% elif previous_step == 'heal' or previous_step == 'e2e' %}{% filter translated('engine.test_failed_e2e_details', { count: steps.heal.visits or 0 }) %}The issue's E2E scenarios (and the @smoke journeys) are not green after {{ steps.heal.visits or 0 }} healing round(s):{% endfilter %}
      {{ steps.e2e.output | suite_failures }}
      {% if steps.heal.output %}{% filter translated('engine.test_failed_healer', { summary: steps.heal.output.summary }) %}The healer: {{ steps.heal.output.summary }}{% endfilter %}{% endif %}
      {% else %}{% filter translated('engine.test_failed_tests_red_details') %}Tests are still failing after 3 rounds of fixes:{% endfilter %}
      {{ steps.test.output.failure_report }}
      {% endif %}
      {{ tests_plan | tests_plan_text(tests_plan_items) }}
      {% if steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal'] %}{% filter translated('engine.test_failed_answers_no_tests') %}Continue to the build anyway: the change is reported as not tested: the project has no tests. Stop the run: the run ends as failed (its branch keeps the work to resume it).{% endfilter %}{% else %}{% filter translated('engine.test_failed_answers') %}Continue to the build anyway: the change is reported as not tested green. Stop the run: the run ends as failed (its branch keeps the work to resume it).{% endfilter %}{% endif %}
    transitions:
      # #71: with nothing to run (no_tests: ask), never "not tested green"
      - when: "choice == 'continue' and steps.suite.output.status == 'not_run' and previous_step not in ['test', 'e2e', 'heal']"
        goto: build
        set: { tested: "no tests" }
      # #396: recorded in summary.json `tested` and told to the build and verify prompts
      - when: "choice == 'continue'"
        goto: build
        set: { tested: "not green" }
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # Builder: application build + dependency vulnerabilities.
  - id: build
    display: Builder
    agent: builder
    prompt: |
      On branch `{{ steps.develop.output.branch }}`:
      {% if delegate_result %}
      The developer applied a fix: {{ delegate_result.text }}
      {% endif %}
      {% if vars.tested == 'not green' %}
      The change is not tested green (#396): {% if steps.test_failed.output.choice == 'continue' %}the owner chose to continue at the test_failed gate{% else %}the suite is red only outside the change and the owner's policy (suite_red_outside_change: continue) lets the run go on{% endif %}. The failures:
      {% if steps.e2e.output and steps.e2e.output.status != 'pass' %}{{ steps.e2e.output | suite_failures }}{% elif steps.suite.output and steps.suite.output.status != 'pass' %}{{ steps.suite.output | suite_failures }}{% else %}{{ steps.test.output.failure_report }}{% endif %}
      Never report the change as tested green; do not try to fix these tests.
      {% elif vars.tested == 'no tests' %}
      The suite was not run: the project has no tests (#71), so nothing was tested here. Say so in your report; never
      report the change as tested and write no tests.
      {% endif %}
      1. Build the project following the build skill.
      2. Audit the dependencies following the build skill, separating production from development.
      Apply your role's vulnerability policy. In `vulnerabilities`, report the PRODUCTION
      counts; summarize the development ones in `dev_vulnerabilities`.
      When the build fails, set failure_class (see the build skill):
        code = a commit on the branch can fix it (code, tests, lockfile, build scripts);
        infra = no commit can (a file locked by a running process, e.g. EBUSY/EPERM under
        node_modules, missing permissions, network, disk): say what holds it in the report
        and never reinstall (`npm ci`): node_modules links the shared dependency cache;
        unknown = you could not tell.
    output_schema:
      type: object
      required: [build_status, vulnerabilities, report]
      properties:
        build_status: { type: string, enum: [success, failed] }
        failure_class: { type: string, enum: [code, infra, unknown] }
        vulnerabilities:
          type: object
          required: [critical, high, moderate, low]
          properties:
            critical: { type: integer }
            high:     { type: integer }
            moderate: { type: integer }
            low:      { type: integer }
        dev_vulnerabilities: { type: string }
        report:              { type: string }
    transitions:
      # after a merge-conflict resolution the evidence is kept: verify_change re-checks the claims
      - when: "output.build_status == 'success' and output.vulnerabilities.critical == 0 and output.vulnerabilities.high == 0 and vars.recheck == 'resolution'"
        goto: verify_change
      - when: "output.build_status == 'success' and output.vulnerabilities.critical == 0 and output.vulnerabilities.high == 0"
        goto: evidence
      # the environment, not the code: a developer round can't change it, a human can
      - when: "output.build_status == 'failed' and output.failure_class == 'infra'"
        goto: build_failed
      - when: "true"
        delegate:
          agent: developer
          prompt: |
            The builder blocked branch `{{ steps.develop.output.branch }}`:
            {{ output.report }}
            Fix it (build failure or vulnerable dependency), check it with a focused test or the build (not the full suite),
            commit and report the commit hash.
        goto: build
        max_visits: 3
        on_exhausted: build_failed

  # Reached by an infra failure (at once) or a build still blocked after 3 fix rounds.
  - id: build_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    # from the build's failure_class: infra (the environment) or still blocked after the fix rounds
    summary: |
      {% if steps.build.output.build_status == 'failed' and steps.build.output.failure_class == 'infra' %}The build failed because of the environment, not the code (no fix round was spent).{% else %}The build is still blocked after 3 rounds of fixes.{% endif %}
      - ✖ Build {{ steps.build.output.build_status }}{% if steps.build.output.failure_class %} ({{ steps.build.output.failure_class }}){% endif %}: {{ steps.build.output.report | one_line(120) }}
    recommend: "{% if steps.build.output.build_status == 'failed' and steps.build.output.failure_class == 'infra' %}retry: fix the environment first (stop what holds the worktree's files), then build again.{% else %}stop: the fix rounds ran out; read the build report before resuming the run.{% endif %}"
    message: |
      {% if steps.build.output.build_status == 'failed' and steps.build.output.failure_class == 'infra' %}The build failed because of the environment, not the code (no fix round was spent):{% else %}The build is still blocked after 3 rounds of fixes:{% endif %}
      {{ steps.build.output.report }}
      Building again only helps once the environment is fixed (e.g. the process holding a file
      of the worktree is stopped: the orchestrator stops the ones started from the worktree).
    choices:
      - { id: continue, label: "Continue to verification anyway", help: "The verification runs with the build still failing; the change may be merged without a green build." }
      - { id: retry,    label: "Build again (I fixed the environment)", help: "Runs the build again; useful only after you fixed what blocked it." }
      - { id: stop,     label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'continue'"
        goto: evidence
      - when: "choice == 'retry'"
        goto: build
      - when: "choice == 'stop'"
        goto: end
        status: failed

  # Evidence: shows the change working (UI screenshots, HTTP request/response, CLI output, log
  # lines), after the tests passed and the build succeeded. It never blocks: the verifier uses it.
  - id: evidence
    agent: evidence
    prompt: |
      Task: {{ inputs.task }}
      Change: {{ steps.develop.output.summary }}
      Files: {{ steps.develop.output.files_changed | join(', ') }}
      Branch `{{ steps.develop.output.branch }}`, base `{{ inputs.base_branch }}`, run folder `{{ run_dir }}`.
      {% if inputs.issues | length > 1 %}
      This run implements several issues ({{ inputs.issues | join(', ') }}): collect evidence per
      issue and set `issue` (its URL) on each entry.
      {% endif %}
      {% if steps.develop.output.evidence_plan %}
      The developer's evidence plan (follow it; don't explore the code to find another):
      {{ steps.develop.output.evidence_plan }}
      {% endif %}
      Stay within the skill's budget: no reading code beyond `git diff --stat` and the plan, no
      tests, no checking docs (the verifier does that), at most 2 captures per issue (plus the
      interaction states the plan lists for a UI change, at most 4 more).
      {% if steps.e2e.output and steps.acceptance_tests.output.e2e_scope == 'scenarios' %}
      The issue's E2E scenarios ran in this run (#223): {{ steps.e2e.output.message }}
      Scenarios: {{ (steps.acceptance_tests.output.e2e_files or []) | join(', ') }}; their log: {{ run_dir }}/{{ steps.e2e.output.log }}.
      Use the E2E run as the evidence of what the scenarios cover: an evidence entry per scenario
      (kind `log`, its result from the log), with the screenshots and trace links the run kept
      under .test-output/e2e/artifacts/ (the `trace:` paths of a red round, the screenshots of the
      scenarios' visual checks under features/__screenshots__/). Do not capture again a state a
      scenario covers: `npm run screenshot` only for the states without a scenario.
      {% endif %}
      {% if inputs.screenshots == 'off' %}
      Screenshots are off in this run (input `screenshots`): never run `npm run screenshot` or start the
      app. The evidence is the diff (`git diff --stat`), the logs and the test results. Say
      "Screenshots: off" in `note`.
      {% elif inputs.screenshots == 'changed' %}
      Screenshots: only the screens this issue changes (input `screenshots`), original and modified;
      no other screen.
      {% endif %}
      Collect the evidence that the change does what the task asked, following the
      implementation-evidence skill: pick the kind per issue (UI screenshots original/modified into
      `{{ evidence_dir }}` as `<issue>-<screen>-<state>.original.png` / `.modified.png`, HTTP
      request and response, CLI output, log lines of a simulated run), local and simulated only,
      and stay read-only on the working tree. Nothing observable, or no way to capture it: say why in `note`.
      You collect evidence only: the UI was already reviewed in code_review (#151), so do not judge
      the screenshots against UI rules.
    output_schema:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          items:
            type: object
            required: [kind, title]
            properties:
              issue:   { type: string }
              kind:    { type: string, enum: [screenshot, http, cli, log] }
              title:   { type: string }
              command: { type: string }
              original: { type: string }
              modified: { type: string }
        # UI changes: the captions of the images of this round (<run_dir>/evidence/<step>/round-<n>/);
        # the engine indexes them in <run_dir>/evidence/manifest.json, whose final set the gate, the
        # verifier and a PR/MR workflow use
        screenshots:
          type: array
          items:
            type: object
            required: [path, caption]
            properties:
              path:    { type: string }
              caption: { type: string }
        note: { type: string }
    transitions:
      # #151: never back to develop: the UI verdict is the ui_reviewer's, in code_review
      - when: "true"
        goto: verify_change

  # Verifier: does the change do what the task asked? Same command on the base and on
  # the branch. inconclusive (nothing observable, e.g. a refactor) does not block.
  - id: verify_change
    display: Final verification
    agent: verifier
    prompt: |
      Task: {{ inputs.task }}
      Change: {{ steps.develop.output.summary }}
      Branch `{{ steps.develop.output.branch }}`, base `{{ inputs.base_branch }}`.
      {% if delegate_result %}
      The developer changed the code after your last verdict:
      {{ delegate_result.text }}
      Run the treatment side again (the baseline did not change).
      {% endif %}
      {% if vars.recheck == 'resolution' and not delegate_result and steps.verify_change.output %}
      You already verified this change: {{ steps.verify_change.output | to_json }}
      Since then the developer rebased the branch onto the local `{{ inputs.base_branch }}` and
      resolved a conflict, touching only: {{ (steps.resolve_merge.output.files_changed or []) | join(', ') or '(no file listed)' }}
      ({{ steps.resolve_merge.output.summary }}).
      Re-check only the claims (issues) whose evidence depends on those files, on the rebased
      branch; keep your other verdicts and evidence as they were, and say which you kept.
      {% endif %}
      {% if steps.evidence.output and steps.evidence.output.evidence %}
      Evidence already collected (use it; run your own command only for a claim it does not
      cover or to compare original and modified): {{ steps.evidence.output.evidence | to_json }}
      {% endif %}
      The run's screenshots are indexed in `{{ run_dir }}/evidence/manifest.json`: use its final set
      (images with `final: true`; a `modified` image's `pair` is its original), not older rounds.
      Verify the change following the claim-verification skill. The issue's Tests task is checked
      at the test step and a measurement that needs real runs or the owner (its Measure task) is the
      owner's: neither is a claim to verify nor a reason for not_verified. Stay read-only: the
      working tree must not change (no files, stash, worktree or checkout).
      {% if tests_plan %}
      This run's tests (#203): {{ tests_plan }} Never claim or imply test coverage for a part that
      was off: say "not tested in this run" for it in your summary.
      {% endif %}
      {% if vars.tested == 'not green' %}
      The change is not tested green (#396): {% if steps.test_failed.output.choice == 'continue' %}the owner chose to continue at the test_failed gate{% else %}the suite is red only outside the change and the owner's policy (suite_red_outside_change: continue) lets the run go on{% endif %}. The failures:
      {% if steps.e2e.output and steps.e2e.output.status != 'pass' %}{{ steps.e2e.output | suite_failures }}{% elif steps.suite.output and steps.suite.output.status != 'pass' %}{{ steps.suite.output | suite_failures }}{% else %}{{ steps.test.output.failure_report }}{% endif %}
      Say "not tested green" in your summary; these failures are not a reason for not_verified on their own.
      {% elif vars.tested == 'no tests' %}
      The suite was not run: the project has no tests (#71), so nothing was tested here. Say "not tested:
      the project has no tests" in your summary; it is not a reason for not_verified on its own.
      {% endif %}
      {% if inputs.issues | length > 1 %}
      This run implements several issues: verify each one the developer did (their report:
      {{ steps.develop.output.issues | to_json }}). In `issues`, one entry per issue with its own
      verdict and evidence; `claim` lists each issue with its verdict. The overall `verdict` is
      not_verified when any issue the run still implements is not_verified.
      {% endif %}
    output_schema:
      type: object
      required: [verdict, claim, evidence]
      properties:
        verdict:  { type: string, enum: [verified, not_verified, inconclusive] }
        claim:    { type: string }
        command:  { type: string }
        evidence: { type: string }
        # a run for several issues: the verdict per issue
        issues:
          type: array
          items:
            type: object
            required: [issue, verdict]
            properties:
              issue:    { type: string }
              verdict:  { type: string, enum: [verified, not_verified, inconclusive] }
              evidence: { type: string }
    transitions:
      - when: "output.verdict != 'not_verified' and inputs.mode != 'local'"
        goto: ci
      - when: "output.verdict != 'not_verified'"
        merge: local
        goto: push_main
        on_error: resolve_merge
      - when: "output.verdict == 'not_verified'"
        delegate:
          agent: developer
          prompt: |
            The verifier could not confirm the change on branch `{{ steps.develop.output.branch }}`.
            Claim: {{ output.claim }}
            Command: {{ output.command }}
            Observed: {{ output.evidence }}
            Fix it, check it with a focused test or the build (not the full suite), commit and report the commit hash.
        goto: verify_change
        max_visits: 2
        on_exhausted: verify_failed

  - id: verify_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    # the verifier's verdict per issue (verify_change.output.issues), else its claim and evidence
    summary: |
      Verification failed after 2 rounds of fixes: the change does not do everything the task asked.
      {% if steps.verify_change.output.issues %}{{ steps.verify_change.output.issues | issue_lines }}{% else %}- ✖ Claim: {{ steps.verify_change.output.claim | one_line(100) }}
      - Observed: {{ steps.verify_change.output.evidence | one_line(100) }}{% endif %}
    recommend: "reject: merging would put unverified code on the local {{ inputs.base_branch }}; look at the evidence, then resume the run."
    approve_label: "Merge anyway"
    approve_help: "Merges the branch into the local {{ inputs.base_branch }} as it is, unverified (nothing is pushed)."
    reject_label: "Stop the run"
    reject_help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it."
    message: |
      The change still does not do what the task asked after 2 rounds of fixes.
      Claim: {{ steps.verify_change.output.claim }}
      Observed: {{ steps.verify_change.output.evidence }}
      {{ tests_plan }}{% if steps.suite.output %} {{ steps.suite.output.message }}{% elif inputs.unit_tests == 'off' %} The test suite did not run in this run: nothing was tested here.{% endif %}
      Dev/QA: read the E2E scenarios and the screenshots; run the app and test by hand only what they do not cover.
      {% set e2e = steps.acceptance_tests.output | e2e_scenarios %}{% if inputs.e2e_tests == 'off' %}E2E scenarios: off in this run (none written).{% elif e2e %}{{ e2e }}{% else %}E2E scenarios: none reported by the test writer.{% endif %}
      {% if steps.e2e.output %}E2E run: {{ steps.e2e.output.message }}{% endif %}
      Merge anyway: merge it into the local {{ inputs.base_branch }} as it is. Stop the run: the run ends as failed (its branch keeps the work to resume it).
    transitions:
      - when: "approved and inputs.mode != 'local'"
        goto: ci
      - when: "approved"
        merge: local
        goto: push_main
        on_error: resolve_merge
      - when: "rejected"
        goto: end
        status: failed

  # ============================ LOCAL MERGE ==================================

  # The merge itself is automatic (merge: local on verify_change). When it fails, the error is
  # in `action_error` (with `head`: the branch's commit that was last checked, which a failed merge
  # leaves as it was) and the developer resolves it on the run's branch; then only what the
  # resolution changed is reviewed, tested and verified (the build runs) before the next attempt.
  - id: resolve_merge
    display: Resolve conflicts
    agent: developer
    # a rebase replays the test writer's commits: resolving their conflicts is part of the job
    edits_tests: true
    # #418: loaded here, on each visit, instead of in the developer's first-turn system part
    skills: [merge-conflict-resolver]
    prompt: |
      Merging branch `{{ steps.develop.output.branch }}` into the local `{{ inputs.base_branch }}` failed:
      {{ action_error.message if action_error else 'unknown error' }}

      If it is a conflict with the local {{ inputs.base_branch }} (another run merged into it meanwhile):
      first note the branch's current commit (`git rev-parse HEAD`{% if action_error and action_error.head %}, should be `{{ action_error.head }}`{% endif %}):
      it is the one that was reviewed, tested and verified; answer it as `previous_head`. Then on your
      branch run `git rebase {{ inputs.base_branch }}`, resolve every conflict following the
      merge-conflict-resolver skill (keep the intent of both sides; never drop the other change),
      `git rebase --continue` and make sure everything is committed; answer the new commit as `head`.
      Resolve conflicts in test files too, but write no new tests and do not run the full suite: only
      what the resolution changed is reviewed and tested again. Never fetch, pull or push.
      A conflicted test file may only combine both sides: every line of the result comes from the
      branch's version (`git show :3:<file>` during the rebase) or the base's (`git show :2:<file>`),
      and no line either side added is dropped; the engine checks it. When a test file needs more
      than that (new or changed test lines, e.g. both sides edited the same step), do not write
      them: leave that file conflicted (do not `git add` it), stop the rebase there (no
      `--continue`, no `--abort`) and answer `test_conflict` with each such file, the conflicting
      hunk and both sides; the test writer resolves it, then you finish the rebase.
      {% if delegate_result %}
      The test writer resolved the test conflict you handed over:
      {{ delegate_result.text }}
      Finish the rebase (`git status` shows where it stands): resolve what is left outside the
      tests, `git rebase --continue`, and answer as above (`previous_head` is the commit you noted).
      {% endif %}
      In `files_changed`, list only the files where you resolved a conflict (not every file of the
      change). Answer `behaviour_changed: true` when the resolution does more than combine both
      sides (e.g. you had to adapt the change's logic to what the base now does): the change is
      then reviewed, tested and verified in full again.
      If it is anything you can't fix on your branch (for example uncommitted changes in the
      checkout where {{ inputs.base_branch }} is checked out: that is the user's work, don't touch it),
      change nothing and answer blocked: true with the reason.
    output_schema:
      type: object
      required: [resolved, blocked, summary]
      properties:
        resolved:          { type: boolean }
        blocked:           { type: boolean }
        summary:           { type: string }
        # the files the resolution touched: what the scoped checks cover
        files_changed:     { type: array, items: { type: string } }
        previous_head:     { type: string }
        head:              { type: string }
        behaviour_changed: { type: boolean }
        # #380: a test conflict that needs new or changed test lines (files, hunks, both sides)
        test_conflict:     { type: string }
    transitions:
      - when: "output.blocked"
        goto: merge_blocked
      # #380: the developer never writes tests; the test writer resolves the test conflict in the
      # rebase the developer left open, then the developer finishes it
      - when: "output.test_conflict"
        delegate:
          agent: test_writer
          prompt: |
            Rebasing branch `{{ steps.develop.output.branch }}` onto the local `{{ inputs.base_branch }}`
            stopped on a merge conflict in test files that needs new or changed test lines, which
            the developer may not write. The rebase is in progress in the checkout. The conflict:
            {{ output.test_conflict }}
            Resolve only the conflicted test files (`git diff --name-only --diff-filter=U`): keep
            the intent of both sides (`git show :2:<file>` is the base's, `:3:<file>` the branch's),
            then `git add` them. Do not resolve conflicts outside the tests and do not run
            `git rebase --continue` or `--abort`: the developer finishes the rebase. Run only the
            tests of the files you resolved, and say what you changed and why.
        goto: resolve_merge
        max_visits: 2
        on_exhausted: merge_blocked
      # `recheck: resolution`: code_review, test and verify_change cover only what the resolution changed
      - when: "output.resolved"
        set: { recheck: "{{ '' if output.behaviour_changed else 'resolution' }}" }
        goto: code_review
        max_visits: 3
        on_exhausted: merge_blocked
      - when: "true"
        goto: merge_blocked

  # Only when the automation can't go on: the developer is blocked, or 3 resolution rounds ran out.
  - id: merge_blocked
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    summary: |
      Branch `{{ steps.develop.output.branch }}` could not be merged into the local `{{ inputs.base_branch }}`{% if steps.resolve_merge.output %} and the developer could not resolve it{% endif %}.
      {% if action_error %}- ✖ {{ action_error.message | one_line(120) }}
      {% endif %}{% if steps.resolve_merge.output %}- Developer: {{ steps.resolve_merge.output.summary | one_line(120) }}{% endif %}
    recommend: "retry: fix what is in the way (e.g. commit or stash the changes where {{ inputs.base_branch }} is checked out), then retry the merge."
    message: |
      Branch `{{ steps.develop.output.branch }}` could not be merged into the local `{{ inputs.base_branch }}`:
      {{ action_error.message if action_error else '' }}
      {% if steps.resolve_merge.output %}Developer: {{ steps.resolve_merge.output.summary }}{% endif %}
      Fix what is in the way (e.g. commit or stash the changes where {{ inputs.base_branch }} is checked out), then retry.
    choices:
      - { id: retry, label: "Retry the merge", help: "Tries the merge into the local {{ inputs.base_branch }} again; a conflict goes back to the developer." }
      - { id: stop,  label: "Stop the run as failed (branch kept to resume)", help: "Ends the run as failed; nothing is merged and its branch keeps the work to resume it." }
    transitions:
      - when: "choice == 'retry'"
        merge: local
        goto: push_main
        on_error: resolve_merge
      - when: "choice == 'stop'"
        goto: end
        status: failed

# -----------------------------------------------------------------------------
# What the run hands to the next one when it finishes (#134): `then` at start, or a gate choice's.
  # #630 (closes #617): Local mode's last step pushes the local base (the project auto-push is gone);
  # #861: the engine pushes it (type: push_base in the fragment), no agent
  - id: push_main
    fragment: local-merge-pipeline

  # ============================ REMOTE MODE ==================================
  # #630: the pull request, its CI and the team's merge (fragments/pr-pipeline.yaml)
  - id: ci
    fragment: pr-pipeline
    agent: ci_pusher
  - id: ci_failed
    fragment: pr-pipeline
  - id: pr_monitor
    fragment: pr-pipeline

outputs:
  branch:
    type: string
    description: The branch the developer worked on.
    value: "{{ steps.develop.output.branch }}"
  merged_commit:
    type: string
    description: The commit the run merged into the local base branch (merge local). Empty when nothing was merged.
    value: "{{ run.local_merge.commit if run.local_merge else '' }}"
  issues:
    type: array
    description: "The issues the run implemented (number, url, title)."
    value: "{{ run.issues | to_json }}"
  pr_url:
    type: string
    description: The PR/MR the remote mode opened; empty in local mode (the work is merged locally, no PR/MR).
    value: "{{ steps.ci.output.pr_url if steps.ci.output and steps.ci.output.pr_url else '' }}"
  # #651: what the post-flow (sdlc-record) writes in docs/work/<item>/test.md: the suite, the E2E
  # scenarios, the before/after screenshots and the axe check; 'not run' / [] when a step did not run
  evidence:
    type: object
    description: "The run's evidence for the post-flow's test.md row: suite and e2e { status, passed, failed } (the runners' counts), the screenshots taken or the reason none were, the axe findings."
    value: "{% set so = steps.suite.output or {} %}{% set eo = steps.e2e.output or {} %}{% set ds = steps.developer_screenshots.output or {} %}{% set ev = { 'suite': { 'status': ('not run' if so.status == 'not_run' else so.status) or 'not run', 'passed': so.passed, 'failed': so.failed }, 'e2e': { 'status': eo.status or 'not run', 'passed': eo.passed, 'failed': eo.failed, 'message': eo.message }, 'screenshots': ((steps.evidence.output.screenshots if steps.evidence.output else []) or ds.screenshots or []), 'screenshots_reason': ds.reason or (ds.message if not ds.taken else ''), 'axe': ds.axe_findings or [] } %}{{ ev | to_json }}"

observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
