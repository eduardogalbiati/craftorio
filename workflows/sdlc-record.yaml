# =============================================================================
# Workflow: SDLC record (#633, #651, #702: docs/work/write-doc/spec.md R16)
# -----------------------------------------------------------------------------
#   record (record_docs, no model) ──merge: local──► end
#                 └── DocModel's lint found a problem ──► end (failed, nothing merged)
#
# The post-flow of the AI-native SDLC work model: the Code & Build runs (feature, fix) only take
# the issues filed from the plan and hand back their evidence as declared outputs; they never write
# docs/work/. The chain (`then`, docs/agents/engine/chaining.md) starts this run when a feature/fix
# run whose issue names docs/work/<item>/plan.md finishes with success (a default `then`, #702),
# with that run (`run`) and its outputs (`merged_commit`, `pr_url`, `issues`, `evidence`); a failed
# or stopped run starts nothing. One machine step (`type: record_docs`,
# packages/engine/engine/record-docs-step.js) writes the plan's Progress row (status, run, commit),
# sets `status: built` when every row is done, appends the run's evidence row to test.md and
# test.pt-BR.md (suite, E2E, screenshots or the reason none were, axe; `status: collecting`) and copies
# the screenshots to images/. DocModel's lint runs before its one commit (a docs commit runs no
# tests, #695). The run works in its own worktree, detached at the LOCAL <base_branch> (remote:
# false): the step commits on sdlc-record/<item>-<run id>, merged into the local base (never pushed).
# sdlc-test closes the Test stage at the code owner's gate, sdlc-release writes deploy.md.
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: sdlc-record
  version: 0.2.0
  description: Records what a Code & Build run of a work item produced (its plan.md Progress row and its test.md evidence row), without a model, and merges it into the local base.
  tags: [sdlc, documents, record]
  category: plan

# -----------------------------------------------------------------------------
inputs:
  project_path:
    label: "Project folder"
    type: string
    required: true
    description: The project whose docs/work/ holds the item.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the run starts from and merges into.
  item:
    label: "Work item"
    type: string
    required: true
    description: The item's folder name under docs/work/ (e.g. write-doc).
  # #651: the Code & Build run this post-flow records and its declared outputs (the chain maps them)
  run:
    label: "Code & Build run"
    type: run
    default: latest
    description: The feature or fix run whose result is recorded (the chain passes the run that just finished).
  merged_commit:
    label: "Merged commit"
    type: string
    required: false
    default: ""
    description: The commit the run merged into the local base branch. A chain only starts this run when it is set (a remote run that opened a PR pauses the chain); to record a PR, start sdlc-record by hand with the run and its PR.
  pr_url:
    label: "PR / MR"
    type: string
    required: false
    default: ""
    description: The PR or MR the run opened in remote mode; empty in local mode.
  issues:
    label: "Issues"
    type: array
    default: []
    description: The issues the run implemented (their numbers find the plan's Progress row).
  evidence:
    label: "Evidence"
    type: object
    required: false
    description: The run's evidence output (suite, e2e, screenshots, axe), for the test.md row.

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]

orchestrator:
  provider: claude
  model: claude-sonnet-5
  worktree:
    repo: "{{ inputs.project_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  limits:
    max_total_duration: 30m

# no model: the one step is a machine step (the loader wants the map, even empty)
agents: {}

groups:
  - name: Record
    steps: [record]

# -----------------------------------------------------------------------------
steps:

  # #702: plan.md's Progress row (and `status: built` at N of N), test.md's evidence row, the images.
  # Known limit: the record merges `local` only. A project that works with PRs pauses the chain (its run
  # has no merged_commit, chaining.md): started by hand, the record stays a local commit until pushed.
  - id: record
    type: record_docs
    item: "{{ inputs.item }}"
    branch: "sdlc-record/{{ inputs.item }}-{{ run_id }}"
    transitions:
      - when: "output.status == 'recorded' and output.commit"
        merge: local
        goto: end
      - when: "output.status == 'recorded' or output.status == 'skipped'"
        goto: end
      # DocModel's lint refused the documents: nothing written, the problems are in the step's output
      - goto: end
        status: failed
