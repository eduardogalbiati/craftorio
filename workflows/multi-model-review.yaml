# =============================================================================
# Workflow: Multi-model Code Review
# -----------------------------------------------------------------------------
#   review ──► blast_radius ──► judge
#   (3 models    (what breaks      (lead judgment: act on / consider /
#    in parallel) outside the diff)  noted / dismissed + verdict)
#
# 1. review:       the same diff goes IN PARALLEL to reviewers from different model
#                  families, each with the code-review skill. None sees the others.
# 2. blast_radius: one agent looks outside the diff and proves the key safety fact.
# 3. judge:        a separate agent reads the diff, merges and verifies the findings
#                  (anonymized, shuffled per run) and writes the final report
#                  (review-synthesis skill), saved as review.md in the run folder.
#
# Read-only on the repository. Does not post anything to the PR/MR.
# Ideas adapted from the interrogate and blast-radius skills in cursor/plugins pstack (MIT).
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: multi-model-review
  version: 0.2.0
  description: Several models review the same diff in parallel, a blast-radius check looks outside the diff, and a lead judge merges, verifies and ranks the findings.
  tags: [review, multi-model, quality]
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    label: "Task"
    type: string
    required: false
    description: What the change is supposed to do (the spec for the review's spec axis). Optional.
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path or git URL (cloned into <workspace>/repos).
  branch:
    label: "Branch"
    type: string
    default: HEAD
    description: Branch or ref under review.
  base_branch:
    label: "Base branch"
    type: string
    default: main

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]
  codex:
    type: codex-cli
    command: codex
    args: ["exec", "--json", "--skip-git-repo-check", "-m", "{{ model }}"]
    resume_args: ["resume", "{{ session_id }}"]
    stdin_arg: "-"

# Allowed commands (YAML anchors, used in capabilities.tools).
x-tools:
  readonly_git: &readonly_git [read, "bash:git diff", "bash:git log", "bash:git show", "bash:git grep", "bash:git rev-parse", "bash:git status"]
  # blast radius also runs one-liners (node -e, python -c) and tests to prove its safety fact
  toolchains: &toolchains [read, bash:git, bash:npm, bash:npx, bash:node, bash:python, bash:python3, bash:py, bash:pytest, bash:uv, bash:go, bash:mvn, bash:./mvnw, bash:gradle, bash:./gradlew, bash:dotnet]

defaults:
  working_dir: "{{ inputs.repo_path }}"
  timeout: 30m
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5
  # AI supervisor: called only when a step fails; explains it and picks a recovery the engine
  # validates (fix the output, retry with an instruction, an allowed goto, or ask a human).
  supervisor:
    enabled: true
    max_interventions: 2   # per step
  limits:
    max_total_duration: 2h
    max_total_cost_usd: 20

# -----------------------------------------------------------------------------
agents:
  opus:
    provider: claude
    model: claude-opus-5-5
    session: ephemeral
    capabilities: { tools: *readonly_git, web: false }
    skills: [code-review]
    system_prompt: &reviewer |
      You are one of several independent reviewers of the same change. Review it on
      your own, following the code-review skill. Report real problems only.

  sonnet:
    provider: claude
    model: claude-sonnet-5
    session: ephemeral
    capabilities: { tools: *readonly_git, web: false }
    skills: [code-review]
    system_prompt: *reviewer

  gpt:
    provider: codex
    model: gpt-6-luna
    session: ephemeral
    capabilities: { tools: [read, bash:git], web: false }
    skills: [code-review]
    system_prompt: *reviewer

  blaster:
    provider: claude
    model: claude-sonnet-5
    session: ephemeral
    capabilities: { tools: *toolchains, web: false }
    skills: [blast-radius]
    system_prompt: |
      You check what a change can break outside its diff. You are read-only: the working
      tree must not change; ad-hoc code runs as a single node -e / python -c command.

  judge:
    provider: claude
    model: claude-opus-5-5
    session: ephemeral
    capabilities: { tools: *readonly_git, web: false }
    skills: [review-synthesis]
    system_prompt: |
      You are the lead judge. You did not review this change before; you read the diff
      yourself and decide which findings stand, following the review-synthesis skill.

# Progress shown in the runs list and the Run screen (does not change the graph).
groups:
  - name: Reviews
    steps: [review]
  - name: Blast radius
    steps: [blast_radius]
  - name: Verdict
    steps: [judge]

# -----------------------------------------------------------------------------
steps:

  - id: review
    agents: [opus, sonnet, gpt]
    min_success: 2
    save_as: "review/{{ agent }}.json"
    prompt: |
      Review the changes on `{{ inputs.branch }}` against `{{ inputs.base_branch }}`
      (`git diff {{ inputs.base_branch }}...{{ inputs.branch }}`).
      {% if inputs.task %}Spec (what the change is supposed to do): {{ inputs.task }}{% else %}No spec was given: skip the spec axis.{% endif %}
    output_schema:
      type: object
      required: [verdict, findings]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, description]
            properties:
              axis:        { type: string, enum: [correctness, spec, standards] }
              severity:    { type: string, enum: [blocker, major, minor, nit] }
              file:        { type: string }
              line:        { type: integer }
              description: { type: string }

  - id: blast_radius
    agent: blaster
    save_as: review/blast-radius.md
    prompt: |
      Change: `{{ inputs.branch }}` against `{{ inputs.base_branch }}`
      (`git diff {{ inputs.base_branch }}...{{ inputs.branch }}`).
      {% if inputs.task %}Intent: {{ inputs.task }}{% endif %}
      Follow the blast-radius skill and answer with its report.

  - id: judge
    agent: judge
    save_as: review.md
    prompt: |
      Change: `{{ inputs.branch }}` against `{{ inputs.base_branch }}`
      (`git diff {{ inputs.base_branch }}...{{ inputs.branch }}`).
      {% if inputs.task %}Spec: {{ inputs.task }}{% endif %}

      Independent reviews (anonymized):
      {% for name in steps.review.output.succeeded | shuffle(run_id) %}
      ===== Reviewer {{ "ABCDEFGH"[loop.index0] }} =====
      {{ steps.review.output.results[name] | to_yaml }}
      {% endfor %}
      {% if steps.review.output.failed | length %}({{ steps.review.output.failed | length }} reviewer(s) failed to answer.){% endif %}

      ===== Blast radius =====
      {{ steps.blast_radius.output.text }}

      Write the final review following the review-synthesis skill. Answer only with the
      Markdown report.

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
