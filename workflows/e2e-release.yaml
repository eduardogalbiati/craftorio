# =============================================================================
# Workflow: E2E release (#199)
# -----------------------------------------------------------------------------
#   e2e (suite, no agent) ──(all green, nothing changed)──► end  (records the last green E2E)
#    │
#    ├──(a scenario red)──► heal (E2E runner) ──(the application)──► fix (developer) ──► review
#    │                        │   ▲                                                       │
#    │                        │   └── e2e (again) ◄──(approved)───────────────────────────┘
#    │                        └──(the scenario was stale: updated)──► e2e (again)
#    │        at most max_rounds heals, then e2e_failed (you)
#    ├──(green after a heal or a fix)──► approve_fixes (you) ──merge: local──► end
#    └──(could not run: environment)──► e2e_blocked (you)
#
# Where E2E runs: development runs (software-development, software-development-local-hero) only
# WRITE the issue's BDD scenarios and check that they parse (reported `pending`, "written, run at
# release"); this workflow runs the project's WHOLE E2E suite, once, at release time, so several
# runs never start the app or a browser at the same time. Their local merges never wait for it.
#
# 1. e2e:     a suite step (#177, #222: no agent, no tokens): the orchestrator runs the project's E2E
#             command (`e2e_command`, this app: `npm run test:e2e`, Playwright + playwright-bdd with
#             one Electron at a time) in its own worktree of the LOCAL base; the whole output goes to
#             logs/suite-<n>.log, the runner writes its JSON results and keeps the traces and
#             screenshots of the failed scenarios.
# 2. heal:    only for a red scenario: the E2E runner reads the log, the JSON results and the traces,
#             and sorts each failure: the application (a regression: to the developer, with the
#             changes since the last green E2E run), a stale scenario (an intended behaviour change:
#             it updates the scenario, its steps or its baseline on the run's branch, then the suite
#             runs again) or the environment (blocked).
# 3. fix:     the developer fixes the production code on the run's branch (scenarios stay the
#             E2E runner's).
# 4. review:  the reviewer checks the fix; then the suite runs again (step e2e).
# 5. Green after a heal or a fix: you approve, then the branch merges into the local base (merge:
#    local). Green with nothing changed: the run ends and records the tested commit as the last
#    green E2E (`refs/multiagent/e2e-last-green` in the repository, a local ref: never pushed,
#    never a tag).
# Never pushes, tags or publishes, and never crosses a human gate. The app's E2E launches take the
# machine's screenshot slot (one Electron at a time); on Windows the window stays off-screen.
# Start it by hand from Workflows, from the Backlog (any issue: its scenarios are in the suite) or
# as a roadmap item.
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: e2e-release
  version: 0.1.0
  description: Runs the project's whole end-to-end suite once, before a release, in its own worktree of the local base; a failing scenario goes to the developer and back to the suite, then you approve the fix. Never pushes or tags.
  tags: [test, e2e, bdd, release, local, worktree]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: build

# -----------------------------------------------------------------------------
inputs:
  task:
    label: "Task"
    type: string
    required: true
    default: "Run the whole E2E suite before a release."
    description: What this E2E run is for (e.g. the release it checks). The Backlog fills it with the issues.
  issue:
    label: "Issue"
    type: string
    default: ""
    description: "URL of an issue this run is about (set by the Backlog screen)."
  issues:
    label: "Issues"
    type: array
    default: []
    description: "URLs of the issues this run is about (set by the Backlog screen; one per line)."
  repo_path:
    label: "Repository"
    type: string
    required: true
    description: Local repository path (a git repository; no remote needed).
  # Picks the e2e-test-writer-<language> skill (the framework and its commands).
  language:
    label: "Language"
    type: string
    enum: [js, python, go, java, csharp]
    default: js
    options: { js: JavaScript, python: Python, go: Go, java: Java, csharp: "C#" }
    description: The project's main language, for its E2E framework and commands.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the suite runs on, and where an approved fix is merged.
  e2e_command:
    label: "E2E command"
    type: string
    default: "npm run test:e2e"
    description: The command that runs the whole E2E suite, run by the orchestrator (no agent). This app's is Playwright + playwright-bdd, results in .test-output/e2e/results.json.
  time_budget_minutes:
    label: "Time budget (minutes)"
    type: integer
    default: 60
    description: The time the whole suite may take in one pass; the suite step stops it after that.
  max_rounds:
    label: "Max rounds"
    type: integer
    default: 2
    description: Heal and fix rounds (the E2E runner, the developer, review, the suite again) before you are asked.

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

x-tools:
  # every supported language toolchain: the language skill says which one to use
  toolchains: &toolchains [bash:git, bash:npm, bash:npx, bash:node, bash:pnpm, bash:yarn, bash:python, bash:python3, bash:py, bash:pip, bash:pytest, bash:uv, bash:poetry, bash:behave, bash:robot, bash:go, bash:mvn, bash:./mvnw, bash:mvnw.cmd, bash:gradle, bash:./gradlew, bash:gradlew.bat, bash:dotnet]

defaults:
  # the run's own git worktree of the local base
  working_dir: "{{ worktree_dir }}"
  timeout: 30m
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5
  # <workspace>/worktrees/<run_id>, detached at the LOCAL <base> (remote: false: no fetch);
  # dependencies linked from the shared cache (#198)
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  supervisor:
    enabled: true
    on_call: true
    max_interventions: 2
    max_cost_usd: 5
  limits:
    max_total_duration: 8h
    max_total_cost_usd: 40
    max_total_context: 30M

# -----------------------------------------------------------------------------
agents:
  e2e_runner:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    # called only for a red suite: reading the failures, re-running a few scenarios
    timeout: 45m
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    skills: ["e2e-test-writer-{{ inputs.language }}", long-commands, context-economy]
    system_prompt: |
      You are the E2E runner (healer) of a release check. The orchestrator already ran the
      project's whole end-to-end BDD suite; you are called only when a scenario is red. Read the
      suite's log, its JSON results and the failed scenarios' traces and screenshots, and sort
      each failure: the application (a regression, for the developer), a stale scenario (an
      intended behaviour change: a moved control, a renamed label, a screen whose baseline
      changed on purpose) or the environment. You never fix production code. The scenarios,
      their steps and the visual baselines are yours: a stale one you update and commit on the
      run's branch (`git switch -c e2e-fix-{{ run_id }}` once, or `git switch e2e-fix-{{ run_id }}`
      when it exists). Never push, tag or publish anything.

  developer:
    provider: claude
    model: claude-opus-5-5
    session: handoff
    capabilities: { tools: [read, edit, write, *toolchains], web: false, subagents: true }
    # the scenarios and tests belong to the E2E runner
    edits_tests: false
    skills: [long-commands, bug-diagnosis, context-economy, decision-log]
    system_prompt: |
      You are a senior software engineer fixing what a release's end-to-end suite found. Make
      the smallest production-code fix that addresses the root cause, following the existing
      architecture. Never create, edit or delete tests or scenarios (the orchestrator refuses a
      turn that changes one): when a scenario is wrong, say why in your answer. Run a focused
      check, not the whole suite (the E2E runner runs the failed scenarios again).
      Work on your own branch in this worktree (it starts detached at the LOCAL
      {{ inputs.base_branch }}): `git switch -c e2e-fix-{{ run_id }}` once (or `git switch
      e2e-fix-{{ run_id }}` when the E2E runner already created it), then commit there.
      Never fetch, pull, push or tag: the orchestrator merges the branch into the local
      {{ inputs.base_branch }} after the owner approves. The dependencies are linked from a
      shared cache: never run `npm ci` and never delete `node_modules`.

  reviewer:
    provider: claude
    model: claude-sonnet-5-5
    effort: high
    session: persistent
    capabilities: { tools: [read, bash:git], web: false }
    skills: [code-review]
    system_prompt: |
      You are the code reviewer of a release fix. Follow the code-review skill: detect the
      languages in the diff and read the rules for each one before the verdict.

groups:
  - name: E2E
    steps: [e2e, heal, e2e_blocked]
  - name: Fix
    steps: [fix, review, e2e_failed]
  - name: Merge
    steps: [approve_fixes]

# -----------------------------------------------------------------------------
steps:

  # the whole suite, run by the orchestrator: no agent, no tokens while it is green (#222)
  - id: e2e
    type: suite
    command: "{{ inputs.e2e_command }}"
    timeout: "{{ inputs.time_budget_minutes }}m"
    transitions:
      - when: "output.status == 'pass' and not steps.fix.visits and not steps.heal.visits"
        # the tested commit becomes the last green E2E (a local ref, skipped in simulation)
        action: "git update-ref refs/multiagent/e2e-last-green HEAD"
        goto: end
      - when: "output.status == 'pass'"
        goto: approve_fixes
      - when: "output.status == 'blocked'"
        goto: e2e_blocked
      # a red scenario: the only way to an agent
      - when: "output.status == 'fail'"
        goto: heal
        max_visits: "{{ inputs.max_rounds }}"
        on_exhausted: e2e_failed

  - id: heal
    agent: e2e_runner
    prompt: |
      {{ inputs.task }}
      The orchestrator ran the project's whole E2E suite (`{{ steps.e2e.output.command }}`) on the
      local `{{ inputs.base_branch }}` (round {{ steps.e2e.visits }}): {{ steps.e2e.output.message }}
      Its whole output: {{ run_dir }}/{{ steps.e2e.output.log }} (read the failures from it, not the whole file).
      The runner's JSON results and the failed scenarios' traces and screenshots are in the
      worktree, where the project's E2E config writes them (this app: .test-output/e2e/results.json
      and .test-output/e2e/artifacts/<scenario>/trace.zip, failure.png).
      {% if steps.fix.visits %}
      The developer fixed earlier failures (round {{ steps.fix.visits }}) on branch
      `{{ steps.fix.output.branch }}`: {{ steps.fix.output.summary }}
      {% if steps.fix.output.scenario_notes %}The developer thinks these scenarios are wrong (update them only if the
      behaviour change was intended): {{ steps.fix.output.scenario_notes }}{% endif %}
      {% endif %}
      For each red scenario find the cause, from the error, the trace and the screenshot; re-run
      only that feature file when you need to (one at a time). Copy the useful failure screenshots
      to {{ evidence_dir }} (`<issue>-e2e-<scenario-slug>-<n>.modified.png`).

      What changed since the last green E2E run, for the developer (at most 30 commits, one line each):
      the commits of `git log --oneline refs/multiagent/e2e-last-green..HEAD` (when that ref does not
      exist: the last 30 commits), with the issues their messages close (`Closes #n`), and the runs
      that merged them: the `summary.json` files under {{ runs_dir }} whose local merge commit is in
      that range (run id, workflow, issues, title), at most 20.

      Set `heal_status`: app (a scenario fails because of the application: the developer fixes
      it), healed (every red scenario was stale and you updated and committed it: the suite runs
      again) or blocked (nothing could run: the app does not start, no browser, no framework).
    output_schema:
      type: object
      required: [heal_status, scenarios, summary]
      properties:
        heal_status: { type: string, enum: [app, healed, blocked] }
        summary:    { type: string }
        # the failed scenarios, for the developer: scenario, step, error, probable cause
        failure_report: { type: string }
        # the run's branch, when you committed updated scenarios on it
        branch:     { type: string }
        # commits, issues and runs since the last green E2E run (one line each)
        since_last_green: { type: array, items: { type: string } }
        scenarios:
          type: array
          items:
            type: object
            required: [name, steps, status]
            properties:
              feature:     { type: string }
              name:        { type: string }
              steps:       { type: array, items: { type: string } }
              status:      { type: string, enum: [passed, failed, skipped] }
              reason:      { type: string }
              screenshots: { type: array, items: { type: string } }
        e2e_note: { type: string }
    transitions:
      - when: "output.heal_status == 'healed'"
        goto: e2e
      - when: "output.heal_status == 'blocked'"
        goto: e2e_blocked
      - when: "output.heal_status == 'app'"
        goto: fix

  - id: fix
    agent: developer
    prompt: |
      The release's E2E suite found failures on the local `{{ inputs.base_branch }}` (its log:
      {{ run_dir }}/{{ steps.e2e.output.log }}); the E2E runner traced them to the application:
      {{ steps.heal.output.failure_report }}
      {{ steps.heal.output | e2e_scenarios }}
      Each failed scenario's screenshots are listed with it (paths relative to {{ run_dir }}).
      {% if steps.heal.output.since_last_green | length %}
      What changed since the last green E2E run (start from the change that touches the failing behaviour):
      {% for l in steps.heal.output.since_last_green %}- {{ l }}
      {% endfor %}{% endif %}
      {% if steps.review.output and steps.review.output.verdict == 'changes_requested' %}
      The reviewer asked for changes on your previous fix:
      {{ steps.review.output.summary }}
      {% endif %}
      Diagnose following bug-diagnosis, fix the production code on your branch, run a focused
      check, commit and report the commit hash. A scenario you think is wrong goes in
      `scenario_notes` with why; do not change it.
    output_schema:
      type: object
      required: [branch, summary, committed]
      properties:
        branch:         { type: string }
        summary:        { type: string }
        committed:      { type: boolean }
        commit_sha:     { type: string }
        scenario_notes: { type: string }
    transitions:
      - when: "true"
        goto: review

  - id: review
    agent: reviewer
    prompt: |
      Review the fix on branch `{{ steps.fix.output.branch }}` against the local `{{ inputs.base_branch }}`
      (`git diff {{ inputs.base_branch }}...{{ steps.fix.output.branch }}`).
      What it fixes: {{ steps.heal.output.failure_report }}
      The developer's summary: {{ steps.fix.output.summary }}
    output_schema:
      type: object
      required: [verdict, summary]
      properties:
        verdict: { type: string, enum: [approved, changes_requested] }
        summary: { type: string }
    transitions:
      - when: "output.verdict == 'approved'"
        goto: e2e
      - when: "output.verdict == 'changes_requested'"
        goto: fix
        max_visits: "{{ (inputs.max_rounds | int) + 1 }}"
        on_exhausted: e2e_failed

  - id: approve_fixes
    type: human_approval
    message: |
      The whole E2E suite passes after {{ steps.heal.visits }} heal round(s) and {{ steps.fix.visits or 0 }} fix round(s) on branch `e2e-fix-{{ run_id }}`:
      {% if steps.fix.visits %}{{ steps.fix.output.summary }}{% else %}{{ steps.heal.output.summary }}{% endif %}
      {{ steps.e2e.output.message }}
      Approve: merge the branch into the local {{ inputs.base_branch }} (nothing is pushed). Reject: stop; the worktree and the branch are kept.
    diff_base: "{{ inputs.base_branch }}"
    transitions:
      - when: "approved"
        # the tested commit becomes the last green E2E (a local ref, skipped in simulation)
        action: "git update-ref refs/multiagent/e2e-last-green HEAD"
        merge: local
        goto: end
      - when: "rejected"
        goto: end
        status: cancelled

  - id: e2e_failed
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      E2E scenarios still fail after {{ inputs.max_rounds }} round(s): {{ steps.e2e.output.message }}
      Log: {{ run_dir }}/{{ steps.e2e.output.log }}
      {{ steps.heal.output.failure_report }}
      {{ steps.heal.output | e2e_scenarios }}
      Approve: one more fix round. Reject: stop the run as failed (its branch keeps the work to resume it).
    transitions:
      - when: "approved"
        goto: fix
      - when: "rejected"
        goto: end
        status: failed

  - id: e2e_blocked
    type: human_approval
    kind: escalation   # the supervisor on call tries first
    message: |
      The E2E suite could not run: {{ steps.e2e.output.reason or steps.heal.output.e2e_note or steps.heal.output.summary or steps.e2e.output.message }}
      Log: {{ run_dir }}/{{ steps.e2e.output.log }}
      Approve: run it again (after you fixed the environment). Reject: stop the run as failed.
    transitions:
      - when: "approved"
        goto: e2e
      - when: "rejected"
        goto: end
        status: failed

# -----------------------------------------------------------------------------
outputs:
  e2e_status:
    type: string
    description: "pass, fail or blocked: the last pass of the suite."
    value: "{{ steps.e2e.output.status }}"
  log:
    type: string
    description: The last pass's whole output (the suite step's log).
    value: "{{ steps.e2e.output.log }}"
  scenarios:
    type: array
    description: The red scenarios the E2E runner looked at, with their cause (empty when the suite was green at once).
    value: "{{ (steps.heal.output.scenarios or []) | to_json }}"

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
