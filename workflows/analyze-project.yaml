# =============================================================================
# Workflow: Analyze project (#631: project-map #372 #381 and refactor-proposals #378 in one workflow):
# the project's city plan and the Oracle's architecture analysis, or, since a tag, the refactors worth
# doing filed as `refactor` issues
# -----------------------------------------------------------------------------
#   facts ─► plan ─► validate ──ok──► save ──► analyze ──► end        (no since: the map, mode auto)
#     │        ▲         │     └─ok, mode validated─► gate ──approved──► save
#     │        │         │                                 └─rejected─► end (nothing saved)
#     │        └─────────┘ not ok: back with the report, at most 2 times; then invalid (run failed)
#     │
#     └─since set─► refactor_facts ─► refactor_analysis ─► propose ─► prioritize ──────────► file ─► end
#                                                                        └─mode validated─► proposals_gate
#
# The map (no `since`). A deterministic scan cannot say what a project's areas are for; placing every
# file with a model is costly and goes stale with the next commit. So the cartographer writes a short
# city plan (zones, districts, landmarks and ports as path rules, #371's format) and the deterministic
# core applies the rules on every draw: a new file lands in its district without another model call.
#   1. facts (no agent): the tracked files counted by folder and by file-name pattern, the manifests,
#      #371's folder city and its edges, and the plan saved now (project-map/facts.json in the run).
#   2. plan (the cartographer, read-only on the project, project-map skill): answers the plan only;
#      the engine writes it (project-map/plan.json). A refresh starts from the saved plan.
#   3. validate (no agent): #371's validator (schema, duplicate ids, unknown zones, 95% coverage). A
#      refresh keeps the saved plan's zone and district ids and the names the owner saw, takes the new
#      rules and adds districts (CityModel.refreshPlan).
#   4. gate (human, only with inputs.mode validated, #381): the plan's zones and districts, the
#      validation (on a refresh: districts added and removed, coverage before and after).
#   5. save (no agent): written as architecture:savePlan writes it (the replaced plan is kept).
#   6. analyze (no agent, unless inputs.analyze is off, #381): the Oracle's architecture analysis of
#      the project (its hotspots and co-changing files), saved as architecture:analyze saves it, in
#      the Oracle's daily budget; a refusal fails the run with the reason (the plan stays saved).
# The refactor proposals (`since` set, e.g. a pipeline after a release: its previous tag; the old
# refactor-proposals workflow):
#   7. refactor_facts (no agent): the Architecture facts (#356) at the default branch, the files
#      changed since `since` and the analyst's prompt, focused on the Danger Zone and those files.
#   8. refactor_analysis (the analyst, read-only, the one model call): #356's report.
#   9. propose (no agent): the findings become Refactor tab proposals (#357); a finding that matches
#      an open or dismissed proposal, or an open `refactor` issue, is dropped and named.
#  10. prioritize (no agent besides the Product Owner's turn): #357's ranking, the top `limit` kept.
#  11. proposals_gate (human, only with inputs.mode validated): the ranked proposals.
#  12. file (no agent): #357's "File as issue" for each kept proposal (a simulation previews).
# Started by "Analyze this project" in the project's Architecture tab (one click, its estimate next to
# it, no gate), by the release-then-refactors pipeline (since: the release's previous tag), or by hand.
# Outputs: `issues` (the filed issues, for a pipeline's product_owner or queue target) and `report`.
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: analyze-project
  version: 0.3.0
  description: "The project's architecture in one workflow: the cartographer reads the repository (read-only) and writes the city plan (zones, districts, landmarks and ports as path rules, validated by rules and saved), then the Oracle analyses the project's hotspots. With `since` (a tag or a commit, e.g. after a release) it suggests refactors instead: the analysis of the files changed since then and the Danger Zone (one real model call), the findings as Refactor tab proposals, ranked by the Product Owner, the top ones filed as `refactor` issues."
  tags: [architecture, map, refactor, read-only]
  # Dashboard category: plan (Plan & Design), build (Code & Build) or monitor (Monitor & Improve).
  category: monitor

# -----------------------------------------------------------------------------
inputs:
  repo_path:
    label: "Repository"
    type: string
    required: true
    # refactor-proposals' old name for it: an old run's or a saved pipeline's project_path still starts
    was: project_path
    description: "The project's local git repository (read-only: nothing in it changes)."
  project_id:
    label: "Project"
    type: string
    default: ""
    description: "The project whose plan or proposals are written (set by the Architecture tab); empty: the run's project, found from the repository."
  mode:
    label: "Mode"
    type: string
    enum: [auto, validated]
    default: auto
    options: { auto: Automatic, validated: Validated }
    description: "Automatic: the validated plan is saved (the analysis follows), the top proposals are filed. Validated: the run shows the plan, or the proposals, at a gate first."
  analyze:
    label: "Analyse with the Oracle"
    type: boolean
    default: true
    description: "After the plan is saved, the Oracle analyses the project's hotspots and writes its report (one Oracle turn in its daily budget)."
  since:
    label: "Since"
    type: string
    default: ""
    description: "A tag or a commit: suggests refactors for the files changed since then (after a release: its previous tag) instead of writing the map. Empty: the map and the Oracle's analysis."
  limit:
    label: "Issues to file"
    type: integer
    default: 5
    description: "With since: at most this many of the new proposals, the best ranked, are filed as issues."

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    # #286: an agent's `effort` reaches the CLI only through effort_args
    effort_args: ["--effort", "{{ effort }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

defaults:
  working_dir: "{{ inputs.repo_path }}"
  timeout: 20m
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5-5
  # no worktree: nothing is merged into the project
  supervisor:
    enabled: true
    max_interventions: 1
  limits:
    max_total_duration: 1h
    max_total_cost_usd: 10

# -----------------------------------------------------------------------------
agents:
  cartographer:
    display: Cartographer
    color: "#3DB8FF"
    provider: claude
    # the workflow's defaults; a run can pick another model or effort per agent
    model: claude-sonnet-5-5
    effort: medium
    session: ephemeral
    # read-only on the project: it never edits code, docs or agent instructions; the engine writes the plan
    capabilities: { tools: [read], web: false }
    skills: [project-map]
    system_prompt: |
      You are the cartographer: you read a repository and write its city plan, following the
      project-map skill. You are read-only: never edit, create or delete a file of the project;
      your answer is the plan, and the orchestrator writes it.

  analyst:
    display: Architecture analyst
    color: "#3DB8FF"
    provider: claude
    # the workflow's defaults; a run can pick another model or effort per agent
    model: claude-sonnet-5-5
    effort: medium
    session: ephemeral
    # read-only on the project: its answer is the report, the orchestrator stores the proposals
    capabilities: { tools: [read], web: false }
    system_prompt: |
      You are the architecture analyst: you read a repository and report the refactors worth doing,
      in the Architecture tab's report format. You are read-only: never edit, create or delete a
      file of the project; your answer is the report, and the orchestrator stores it.

groups:
  - name: Facts
    steps: [facts]
  - name: Plan
    steps: [plan, validate, invalid]
  - name: Review
    steps: [gate, save]
  - name: Analysis
    steps: [analyze]
  - name: Proposals
    steps: [refactor_facts, refactor_analysis, propose, prioritize]
  - name: Issues
    steps: [proposals_gate, file]

# -----------------------------------------------------------------------------
steps:

  # #631: with `since`, the run suggests refactors (the old refactor-proposals) instead of the map
  - id: facts
    display: Facts
    type: project_map
    action: facts
    transitions:
      - when: "inputs.since"
        goto: refactor_facts
      - when: "true"
        goto: plan

  - id: plan
    display: City plan
    agent: cartographer
    # Keep in step with planPrompt in packages/engine/domains/project/project-map.js (#731: the
    # onboarding's cartographer turn, outside this workflow): same paragraphs, same closing line.
    prompt: |
      Write the city plan of the repository in the current folder ({{ inputs.repo_path }}),
      following the project-map skill. Read the manifests, the README, the agent instructions and
      the entry points it names before you write; never edit a file.

      The facts step's inputs (counted from `git ls-files`, no model):
      - tracked files: {{ steps.facts.output.files }}
      - manifests: {{ steps.facts.output.manifests | join(', ') or 'none' }}
      - files per folder (any depth, `(root)` = the files at the root):
      {{ steps.facts.output.folders | to_json }}
      - files per file-name pattern:
      {{ steps.facts.output.patterns | to_json }}
      - #371's folder city (districts by folder, with their files and lines) and the edges between
        its districts (imports or crate dependencies, heaviest first; a text when not read):
      {{ steps.facts.output.folder_city | to_json }}
      {% if steps.facts.output.current_plan %}

      This is a REFRESH. The current plan, which the owner has seen:
      {{ steps.facts.output.current_plan | to_json }}
      Start from it: keep every zone and district id and name, change only the rules (include,
      exclude, ignore) and add districts for what the rules miss. The orchestrator keeps the ids
      and names of the current plan whatever you answer.
      {% endif %}
      {% if steps.validate.visits %}

      Your previous plan failed the validation (round {{ steps.validate.visits }}):
      {{ steps.validate.output.report }}

      Your previous plan:
      {{ steps.plan.output.city_plan | to_json }}
      Fix the rules so that the problems above go away; do not add a catch-all district.
      {% endif %}

      Answer with the plan as `city_plan` in the JSON block, in the format of the project-map skill.
    output_schema:
      type: object
      required: [city_plan]
      properties:
        city_plan: { type: object }
        notes: { type: string }
    transitions:
      - when: "true"
        goto: validate

  # #371's validator on the plan (a refresh keeps the saved plan's ids and names); a valid plan is
  # saved at once, or shown at the gate first in validated mode (#381)
  - id: validate
    display: Validation
    type: project_map
    action: validate
    from: plan
    transitions:
      - when: "output.ok and inputs.mode == 'validated'"
        goto: gate
      - when: "output.ok"
        goto: save
      - when: "not output.ok"
        goto: plan
        max_visits: 2
        on_exhausted: invalid

  # the plan failed the validation 3 times: the run fails with the report, nothing is saved
  - id: invalid
    display: Plan not valid
    type: project_map
    action: fail
    from: validate
    transitions:
      - when: "true"
        goto: end
        status: failed

  # validated mode only: the plan's zones and districts and its validation, before anything is saved
  - id: gate
    display: Review the plan
    type: human_approval
    summary: |
      {% if steps.validate.output.refresh %}A refresh of the saved city plan{% else %}A new city plan{% endif %}: coverage {{ (steps.validate.output.coverage * 100) | round(1) }}%, {{ steps.validate.output.plan.zones | length }} zones, {{ steps.validate.output.plan.districts | length }} districts.
      {% for z in steps.validate.output.plan.zones %}{% if loop.index <= 5 %}- {{ z.name }} ({{ z.kind }})
      {% endif %}{% endfor %}
    report: "{{ steps.validate.output.report }}"
    message: |
      {% if steps.validate.output.refresh %}A refresh of the saved city plan{% else %}A new city plan{% endif %} for {{ steps.validate.output.plan.project }}: {{ steps.validate.output.plan.summary }}

      Zones:
      {% for z in steps.validate.output.plan.zones %}- {{ z.name }} (`{{ z.id }}`, {{ z.kind }}){% if z.purpose %}: {{ z.purpose }}{% endif %}
      {% endfor %}
      Districts, the first whose rules match a file wins:
      {% for d in steps.validate.output.plan.districts %}- {{ d.name }} (`{{ d.id }}`, zone `{{ d.zone }}`): {{ d.include | join(', ') }}{% if d.exclude and d.exclude | length %}, except {{ d.exclude | join(', ') }}{% endif %}
      {% endfor %}
      The whole plan is project-map/plan.json in the run folder; once saved, the project's
      Architecture tab draws it as the City view (the plan's districts as plates, a building per file).
    approve_label: Save the plan
    approve_help: "Saves it as the project's city plan (the plan it replaces is kept in city-plan-history/); the Oracle's analysis follows."
    reject_label: Discard
    reject_help: "Ends the run; the saved plan does not change and nothing is analysed."
    transitions:
      - when: "approved"
        goto: save
      - when: "rejected"
        goto: end
        status: cancelled

  - id: save
    display: Save the plan
    type: project_map
    action: save
    from: validate
    transitions:
      - when: "inputs.analyze"
        goto: analyze
      - when: "true"
        goto: end

  # #381: the Oracle's architecture analysis, saved as architecture:analyze saves it
  - id: analyze
    display: Oracle analysis
    type: project_map
    action: analyze
    transitions:
      - when: "true"
        goto: end

  # #378 (the old refactor-proposals): the facts since `since` and #356's analysis prompt
  - id: refactor_facts
    display: Refactor facts
    type: refactor_proposals
    action: facts
    transitions:
      - when: "true"
        goto: refactor_analysis

  # #356's analysis, its prompt and its report schema (named: the Architecture tab's own)
  - id: refactor_analysis
    display: Refactor analysis
    agent: analyst
    prompt: |
      {{ steps.refactor_facts.output.prompt }}
    output_schema: architecture_report
    transitions:
      - when: "true"
        goto: propose

  - id: propose
    display: Proposals
    type: refactor_proposals
    action: propose
    from: refactor_analysis
    transitions:
      - when: "true"
        goto: prioritize

  - id: prioritize
    display: Ranking
    type: refactor_proposals
    action: prioritize
    from: propose
    transitions:
      - when: "inputs.mode == 'validated'"
        goto: proposals_gate
      - when: "true"
        goto: file

  # validated mode only: the ranked proposals before anything is filed
  - id: proposals_gate
    display: Review the proposals
    type: human_approval
    summary: |
      {{ steps.prioritize.output.ranked | length }} new refactor proposal(s), the top {{ steps.prioritize.output.kept | length }} to file; {{ steps.propose.output.dropped | length }} finding(s) dropped as known.
    message: |
      New refactor proposals, best first (the first {{ steps.prioritize.output.limit }} are filed):
      {% for p in steps.prioritize.output.ranked %}- {{ p.rank }}. {{ p.title }} ({{ p.files | join(', ') }}): {{ p.reason }}
      {% endfor %}
      {% if steps.propose.output.dropped | length %}Dropped as known:
      {% for d in steps.propose.output.dropped %}- {{ d.title }}: {{ d.reason }}
      {% endfor %}{% endif %}
      To drop one, dismiss it on the project's Refactor tab before you approve: the file step skips
      dismissed proposals.
    approve_label: File the issues
    approve_help: "Files the kept proposals as `refactor` issues (the Refactor workflow named), skipping the ones dismissed since."
    reject_label: File nothing
    reject_help: "Ends the run; the proposals stay on the Refactor tab."
    transitions:
      - when: "approved"
        goto: file
      - when: "rejected"
        goto: end
        status: cancelled

  - id: file
    display: File issues
    type: refactor_proposals
    action: file
    from: prioritize
    transitions:
      - when: "true"
        goto: end

# -----------------------------------------------------------------------------
# What the run hands to the next one when it finishes (#134): a pipeline's product_owner or queue target.
outputs:
  issues:
    type: array
    description: "The refactor issues filed (with since): number, url, title (a simulation: numbered previews); empty for a map run."
    value: "{{ (steps.file.output.issues or []) | to_json }}"
  report:
    type: object
    description: "With since: the analysis, #356's architecture report (summary, areas, findings)."
    value: "{{ steps.refactor_analysis.output | to_json }}"

# -----------------------------------------------------------------------------
observability:
  storage:
    type: jsonl
    path: "./runs/{{ run_id }}/"
  capture:
    prompts: true
    outputs: true
    thinking: true
    tool_calls: true
    redact:
      - pattern: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
