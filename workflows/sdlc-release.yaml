# =============================================================================
# Workflow: SDLC release (#633, docs/work/first-project-onboarding/spec.md R9)
# -----------------------------------------------------------------------------
#   record ──► approval (you) ──► merge: local ──► end
#
# The last step of the AI-native SDLC work model's post-flow, after sdlc-record and sdlc-test:
# writes the release notes of a work item in docs/work/<item>/release.md (what changed for the
# person who uses it, the issues and the version or tag that shipped it). The Code & Build runs
# and the release workflow never write docs/work/: this run records what they produced.
# The run works in its own worktree, detached at the LOCAL <base_branch> (remote: false): the
# recorder writes on the branch sdlc-release/<item>-<run id>, the accept merges it into the local
# base (never pushed).
# =============================================================================

apiVersion: multiagent/v1
kind: Workflow

metadata:
  name: sdlc-release
  version: 0.1.0
  description: Writes a work item's release notes (what changed, its issues, the tag that shipped it) in docs/work/<item>/release.md, for you to accept.
  tags: [sdlc, documents, release]
  category: plan

# -----------------------------------------------------------------------------
inputs:
  project_path:
    label: "Project folder"
    type: string
    required: true
    description: The project whose docs/work/ holds the item.
  base_branch:
    label: "Base branch"
    type: string
    default: main
    description: The local branch the run starts from and merges into at the accept.
  item:
    label: "Work item"
    type: string
    required: true
    description: The item's folder name under docs/work/ (e.g. write-doc).

# -----------------------------------------------------------------------------
providers:
  claude:
    type: claude-code
    command: claude
    args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{{ model }}"]
    resume_args: ["--resume", "{{ session_id }}"]
    skill_args: ["--add-dir", "{{ skill_dir }}"]

defaults:
  working_dir: "{{ worktree_dir }}"
  # #320: a persistent agent idle past its prompt cache's lifetime continues fresh from its handoff note
  fresh_after_idle: 55m
  timeout: 20m
  max_context: 150k
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: 10s

orchestrator:
  provider: claude
  model: claude-sonnet-5
  worktree:
    repo: "{{ inputs.project_path }}"
    base: "{{ inputs.base_branch }}"
    remote: false
  supervisor:
    enabled: true
    max_interventions: 2
  limits:
    max_total_duration: 2h
    max_total_cost_usd: 10

# -----------------------------------------------------------------------------
agents:
  recorder:
    provider: claude
    model: claude-sonnet-5
    session: persistent
    capabilities: { tools: [read, write, edit, bash:git], web: false }
    skills: [plan-writing]
    system_prompt: |
      You are the release recorder of the work item `{{ inputs.item }}`. You write only under
      docs/work/{{ inputs.item }}/ and change no other file; you never tag or push. Nobody
      answers questions during a turn: state an assumption.

groups:
  - name: Record
    steps: [record, approval]

# -----------------------------------------------------------------------------
steps:

  - id: record
    agent: recorder
    prompt: |
      Read docs/work/{{ inputs.item }}/intent.md, plan.md, progress.md and test.md (what exists),
      and the tags of {{ inputs.base_branch }} (`git tag --contains` on the item's commits). Switch
      to the branch `sdlc-release/{{ inputs.item }}-{{ run_id }}`, write docs/work/{{ inputs.item }}/release.md:
      what changed for the person who uses it (plain words, one bullet each), the issues, and the
      tag that shipped it ("not released yet" when none); then commit it ("docs(work): release
      notes of {{ inputs.item }}"). Answer with `summary` (one sentence) and `file` (the path).
    output_schema:
      type: object
      required: [summary, file]
      properties:
        summary: { type: string }
        file:    { type: string }

  - id: approval
    type: human_approval
    message: |
      {{ steps.record.output.summary }}
      Approve: merge {{ steps.record.output.file }} into the local {{ inputs.base_branch }}. Reject: stop; the branch is kept, not merged.
    transitions:
      - when: "approved"
        merge: local
        goto: end
      - when: "rejected"
        goto: end
        status: cancelled
