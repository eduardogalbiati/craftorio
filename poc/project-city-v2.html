<title>Project city v2 (proof of concept)</title>
<!--
  Proof of concept, second iteration (2026-10-15): the same city as poc/project-city.html with buildings
  that look like a game's. Every file gets an archetype from its metrics (shed, pavilion, hall, block,
  tower, complex) drawn as parts on a few instanced geometries, a seed from its path keeps its shape
  stable, the complexity tier adds articulation (setbacks, a corner tower, rooftop plant), the quadrant
  adds its props (Danger Zone plant, Cowboy Code water tower, Fertile Ground crane, Healthy Closure
  roof garden), and the walls get windows at a real floor height, lit by churn (see `partsOf`). A
  "Showroom" button lays the models side by side. The facade follows the zone kind (`FACADES`: a
  glass curtain in the commercial zone, tall windows between pilasters in the civic one...), every
  building has a touch of its own tone, the tall ones get a band every six floors, a canopy over the
  entrance, a helipad or a spire on the top tiers. Around them: a sidewalk around every district
  plate, a lawn strip with trees and a bench in front of the buildings (`PLAZA`), trees and lamps on
  the avenues' sidewalks and lamps on the street corners (`propsOf`), crosswalks at the crossings,
  cars driving the avenues with their lights (`makeTraffic`, `drive`), water around the city with the
  ports as piers, a bloom pass over the lights (the "Glow" button) and a vignette. Big data and prose
  files (`DATA_LANGS`) are low halls rather than grey towers. The sky is a gradient dome with stars
  that twinkle at night and clouds drifting high over the city; at night the sun is a cool moonlight
  with a fill from the far side and pools of light under the lamps. The city lives: crane arms turn,
  warning lights pulse, windows switch on and off slowly, the water ripples, the cars drive, and left
  alone for 20 s the camera drifts around what it looks at (`animate`). The model is loaded from project-city-v2.data.js
  (a classic script, so this page stays readable); everything else below is the first proof of concept.

  The first proof of concept: a repository as a 3D city (three.js), one file, no build step. It is drawn like
  the run's 3D view of the app (src/renderer/run3d/scene.jsx, run3d-theme.js, run3d.css): the same
  two themes (dark, the app's tokens, is the default; light is the palette of poc/run-3d.html),
  rounded boxes everywhere (RoundedBoxGeometry), the same lights, soft shadows over a sky disc, no
  tone mapping, and the same HUD (cards, chips, pills, tags).
  - Zones are the big areas of a city plan (poc/project-map/SKILL.md), laid out in the plan's order
    as strips from the front (foundations) to the back; avenues with quiet lane markings and
    sidewalks run between them, and each zone is a rounded slab whose ground follows its kind
    (campus lawn, industrial asphalt, infrastructure concrete, commercial paving...). Inside a zone,
    the districts are raised rounded plates in a squarified treemap with streets between them and
    the district's name on the plate; the zone's name is big along its avenue side. Inside a
    district, the buildings are a treemap of the files by lines of code. Without a plan
    (poc/embed-city.js without --plan) the zones are the top folders and the districts their
    subfolders.
  - A building: footprint by lines; height by the complexity scripts/code-health.js measured (by
    the lines when a file has none: Rust, CSS, YAML, tests); floors as thin ledges from the function
    count (the lines otherwise, capped); a thin mast on the roof as tall as the worst function's
    complexity, with a cap (red over the ratchet limit). Colour by quadrant (complexity x churn,
    Danger Zone red), by zone (a material per zone kind) or by churn (a heat ramp). Campus zones
    (tests) are drawn quieter (lower, grey in quadrant mode) and a toggle hides them. Landmarks stand
    on a plinth under a pulsing beacon with a tag that stays visible; ports (external systems) are
    docks outside the city edge with arcs to the files that talk to them. Unmatched files live in
    the Outskirts.
  - Orbit with the mouse, pan with the right button (or shift), zoom with the wheel. Hovering a
    building draws arcs to the files it requires (accent) and the files that require it (amber)
    and dims the rest; hovering a district draws its crate dependencies (Rust) the same way. Click
    a building to pin its card, a district or a zone to focus it; search a file to fly to it. From
    far away only zones, avenues and zone names show; district labels, floors and masts appear as
    you zoom in.
  - The model is embedded below by poc/embed-city.js (<script id="city-data">): no engine, no
    model call, nothing is read at run time. three.js loads from a CDN (needs internet).
  - Hooks for the next phases (not built): `window.city` exposes the model and the layout,
    `city.roofOf(path)` (where a robot would stand on a building), `city.highlight({ path: colour })`
    (the files an issue touches, the files a release changed), `city.flyToBuilding(path)`,
    `city.flyToDistrict(id)`, `city.flyToZone(id)` and `city.setTheme(name)`.
-->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- themes ----------
// The scene colours of src/renderer/run3d-theme.js (THEMES.dark / THEMES.light), by the keys there:
// sky, floor, pad, lane, wallCap, shadow {color, opacity}, light {sky, ground, hemi, sun}, accent,
// ink, muted, status {pending, running, done, changes, failed}, machine.mast. The rest is the city's
// own, derived from them: the quadrant colours on the state colours (Danger Zone = failed, Cowboy
// Code = changes, Fertile Ground = running, Healthy Closure = done), the campus quieter, the churn
// ramp, the docks and plinths, and a ground / plate / building tint / label ink per zone kind.
const THEMES = {
  dark: {
    name: 'dark', sky: '#0e1014', skyTop: '#06070c', skyHorizon: '#161c2c', cloud: '#1c2334', floor: '#181c26', pad: '#242a39', lane: '#2c3345', wallCap: '#343c52',
    shadow: { color: '#000000', opacity: 0.38 }, light: { sky: '#e4eaff', ground: '#6a7594', hemi: 1.7, sun: 1.25, sunColor: '#c9d4ff' },
    accent: '#7c9cff', ink: '#e6e8ee', muted: '#8a91a3', mast: '#596079',
    status: { pending: '#6f788c', running: '#7c9cff', done: '#4ade80', changes: '#facc15', failed: '#f87171' },
    quadrant: { 'Danger Zone': '#f87171', 'Cowboy Code': '#facc15', 'Fertile Ground': '#7c9cff', 'Healthy Closure': '#4ade80' },
    unmeasured: '#6f788c', campus: '#3e4659', dim: '#242a37', dash: '#3a4357', dock: '#2b3247', hall: '#3d4766', plinth: '#343c52', beacon: '#7c9cff', garden: '#4f9c74', lawn: '#2c4a38', water: '#17233b', pool: '#ffd9a0', night: 1.0,
    churn: ['#2a3040', '#facc15', '#fb923c', '#f87171'],
    kinds: { // grounds a step above the floor (#181c26), plates a step above the pad (#242a39), as run3d's floor / pad / wall steps
      civic: { ground: '#2b2d34', block: '#3b3e47', tint: '#c9b58f', ink: '#dad5c7' },
      commercial: { ground: '#2a303c', block: '#3a4253', tint: '#8db4e2', ink: '#d2dcee' },
      industrial: { ground: '#242830', block: '#343a4a', tint: '#c47a63', ink: '#dcd6d2' },

// ---------- layout ----------
/** Squarified treemap: lays `items` (weight in `key`) inside `rect`, filling it; sets item.rect. */
function squarify(items, rect, key = 'w') {
  const total = items.reduce((s, it) => s + it[key], 0);
  if (!total || rect.w <= 0 || rect.h <= 0) { for (const it of items) it.rect = { x: rect.x, y: rect.y, w: 0, h: 0 }; return; }
  const scale = (rect.w * rect.h) / total;
  const area = (it) => it[key] * scale;
  const sorted = items.slice().sort((a, b) => b[key] - a[key]);
  let { x, y, w, h } = rect;
  let row = [], rowArea = 0;
  const worst = (r, a, side) => {
    let mn = Infinity, mx = 0;
    for (const it of r) { const v = area(it); mn = Math.min(mn, v); mx = Math.max(mx, v); }
    return Math.max((side * side * mx) / (a * a), (a * a) / (side * side * mn));
  };
  const flush = () => {
    const vertical = w >= h;
    const side = vertical ? h : w, thick = side > 0 ? rowArea / side : 0;
    let off = 0;
    for (const it of row) {
      const len = thick > 0 ? area(it) / thick : 0;
      it.rect = vertical ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick };
      off += len;
    }
    if (vertical) { x += thick; w = Math.max(0, w - thick); } else { y += thick; h = Math.max(0, h - thick); }
    row = []; rowArea = 0;
  };
  for (const it of sorted) {
    const side = Math.min(w, h), a = area(it);
    if (row.length && worst(row, rowArea, side) < worst(row.concat(it), rowArea + a, side)) flush();
    row.push(it); rowArea += a;
  }
  if (row.length) flush();
}

/** Strip treemap, order kept: strips from the south edge of `rect` northward, items left to right. Returns the strips. */
function stripLayout(items, rect, key = 'w') {
  const total = items.reduce((s, it) => s + it[key], 0);
  const scale = (rect.w * rect.h) / total, area = (it) => it[key] * scale;
  const aspect = (strip, a) => { const h = a / rect.w; return strip.reduce((s, it) => { const w = area(it) / h; return s + Math.max(w / h, h / w); }, 0) / strip.length; };
  const strips = [];
  let y = rect.y + rect.h, strip = [], stripArea = 0;
  const flush = () => {
    const h = stripArea / rect.w;
    let x = rect.x;
    for (const it of strip) { const w = area(it) / h; it.rect = { x, y: y - h, w, h }; x += w; }
    strips.push({ y0: y - h, y1: y, items: strip });
    y -= h; strip = []; stripArea = 0;
  };
  for (const it of items) {
    const a = area(it);
    if (strip.length && aspect(strip, stripArea) < aspect(strip.concat(it), stripArea + a)) flush();
    strip.push(it); stripArea += a;
  }
  if (strip.length) flush();
  return strips;
}

const inset = (r, m) => ({ x: r.x + m, y: r.y + m, w: Math.max(0, r.w - 2 * m), h: Math.max(0, r.h - 2 * m) });
const weightOf = (b) => Math.pow(b.loc + 15, 0.85) * (isCampus(b) ? CAMPUS_WEIGHT : 1);
const heightOf = (b) => {
  const c = b.complexity != null ? b.complexity : b.loc * PER_LINE * (isCampus(b) ? CAMPUS_HEIGHT : 1);
  return H_MIN + H_K * Math.sqrt(Math.max(0, c));
};
const floorsOf = (b) => (b.functions != null ? Math.min(FLOOR_CAP, b.functions) : Math.min(FLOOR_CAP_UNMEASURED, Math.round(b.loc / FLOOR_LINES)));

/** A district plate's inside: the label strip (south, or east when the plate is much taller than wide) and the buildings' treemap. */
function layoutDistrict(g, unit) {
  g.block = inset(g.rect, STREET / 2);
  const vertical = g.block.h > g.block.w * 1.25;
  const lh = Math.min(LABEL_H, (vertical ? g.block.w : g.block.h) * 0.3);
  const need = labelWidth(g.d.name, g.d.files, lh), room = (vertical ? g.block.h : g.block.w) - 2 * SIDEWALK;
  const len = Math.min(Math.max(need, room), room + STREET * 1.5);
  if (vertical) { // on the east edge: the camera looks from the south-east, so the plate's own towers do not hide it
    g.label = { x: g.block.x + g.block.w - SIDEWALK - lh, y: g.block.y + (g.block.h - len) / 2, w: lh, h: len, vertical };
    g.inner = { x: g.block.x + SIDEWALK, y: g.block.y + SIDEWALK, w: g.block.w - 2 * SIDEWALK - lh, h: g.block.h - 2 * SIDEWALK };
  } else {
    g.label = { x: g.block.x + (g.block.w - len) / 2, y: g.block.y + g.block.h - lh, w: len, h: lh, vertical };
    g.inner = { x: g.block.x + SIDEWALK, y: g.block.y + SIDEWALK, w: g.block.w - 2 * SIDEWALK, h: g.block.h - lh - SIDEWALK };
  }
  const want = g.w * unit * FILL;
  if (g.inner.w * g.inner.h > want) { const s = Math.sqrt(want / (g.inner.w * g.inner.h)); g.inner.w *= s; g.inner.h *= s; }
  // a plaza strip (a lawn with trees and a bench) between the buildings and the label, on the plates with room
  g.lawns = [];
  if ((vertical ? g.inner.w : g.inner.h) > 12) {
    const plaza = Math.min(7, Math.max(3, (vertical ? g.inner.w : g.inner.h) * PLAZA));
    if (vertical) { g.lawns.push({ x: g.inner.x + g.inner.w - plaza + 0.8, y: g.inner.y, w: plaza - 0.8, h: g.inner.h }); g.inner.w -= plaza; }
    else { g.lawns.push({ x: g.inner.x, y: g.inner.y + g.inner.h - plaza + 0.8, w: g.inner.w, h: plaza - 0.8 }); g.inner.h -= plaza; }
  }
  squarify(g.items, g.inner);
  const areas = g.items.map((it) => it.rect.w * it.rect.h).sort((a, b) => a - b);
  g.medianArea = areas[Math.floor(areas.length / 2)] || 0;
  const out = [];
  for (const it of g.items) {
    const gap = Math.min(GAP, it.rect.w * 0.22, it.rect.h * 0.22);
    const r = inset(it.rect, gap);
    out.push({ b: it.b, x: r.x + r.w / 2, z: r.y + r.h / 2, w: r.w, d: r.h, h: heightOf(it.b), district: g, zone: g.zone });
  }
  return out;
}

/** The city: zones as strips in the plan's order, districts as a treemap inside each, buildings inside each district. */
function layoutCity(showTests) {
  const buildings = model.buildings.filter((b) => showTests || !isCampus(b));
  const groups = new Map();
  for (const b of buildings) {
    const g = groups.get(b.district) || groups.set(b.district, { d: districtById.get(b.district), items: [], w: 0 }).get(b.district);
    g.items.push({ b, w: weightOf(b) }); g.w += weightOf(b);
  }
  const zones = model.zones.map((z) => ({ z, districts: model.districts.filter((d) => d.zone === z.id && groups.has(d.id)).map((d) => groups.get(d.id)), w: 0 }))
    .filter((zg) => zg.districts.length);
  for (const zg of zones) { zg.w = zg.districts.reduce((s, g) => s + g.w, 0); for (const g of zg.districts) g.zone = zg; }
  const inner = zones.filter((zg) => zg.z.kind !== 'outskirts'), outskirts = zones.find((zg) => zg.z.kind === 'outskirts');
  const total = inner.reduce((s, zg) => s + zg.w, 0);
  for (const zg of inner) zg.wBlock = Math.max(zg.w, total * ZONE_FLOOR);
  const cityH = CITY_W / CITY_ASPECT;
  const rect = { x: -CITY_W / 2, y: -cityH / 2, w: CITY_W, h: cityH };
  const strips = stripLayout(inner, rect, 'wBlock');
  const unit = (rect.w * rect.h) / inner.reduce((s, zg) => s + zg.wBlock, 0);
  let bounds = { ...rect };
  if (outskirts) { // a block outside the east edge
    const side = Math.min(cityH, Math.max(28, Math.sqrt(outskirts.w * unit * 1.6) + STREET + ZONE_LABEL_H));
    outskirts.rect = { x: rect.x + rect.w, y: rect.y + rect.h - side, w: side, h: side };
    outskirts.wBlock = outskirts.w;
    bounds = { x: rect.x, y: rect.y, w: rect.w + side, h: rect.h };
  }
  const out = [], avenues = [];
  strips.forEach((s, i) => { if (i) avenues.push({ x0: rect.x, x1: rect.x + rect.w, y0: s.y1, y1: s.y1 }); s.items.forEach((zg, j) => { if (j) avenues.push({ x0: zg.rect.x, x1: zg.rect.x, y0: s.y0, y1: s.y1 }); }); });
  for (const zg of zones) {
    zg.block = inset(zg.rect, AVENUE / 2);
    // the zone's name along the avenue side: the south edge, or the east edge of a block much taller than wide; it may overflow onto the avenue
    const vertical = zg.block.h > zg.block.w * 1.3, k = kindOf(zg.z.kind);
    const need = labelWidth(zg.z.name, zg.z.kind, ZONE_LABEL_H), room = (vertical ? zg.block.h : zg.block.w) - 2 * SIDEWALK;
    const len = Math.min(Math.max(need, room), room + AVENUE * 1.4);
    zg.label = vertical
      ? { x: zg.block.x + zg.block.w - SIDEWALK - ZONE_LABEL_H, y: zg.block.y + (zg.block.h - len) / 2, w: ZONE_LABEL_H, h: len, vertical }
      : { x: zg.block.x + (zg.block.w - len) / 2, y: zg.block.y + zg.block.h - ZONE_LABEL_H, w: len, h: ZONE_LABEL_H, vertical };
    const dRect = vertical
      ? { x: zg.block.x + STREET / 2, y: zg.block.y + STREET / 2, w: zg.block.w - STREET - ZONE_LABEL_H, h: zg.block.h - STREET }
      : { x: zg.block.x + STREET / 2, y: zg.block.y + STREET / 2, w: zg.block.w - STREET, h: zg.block.h - STREET - ZONE_LABEL_H };
    const dTotal = zg.districts.reduce((s, g) => s + g.w, 0);
    for (const g of zg.districts) g.wBlock = Math.max(g.w, dTotal * DISTRICT_FLOOR);
    squarify(zg.districts, dRect, 'wBlock');
    const dUnit = Math.min(unit, (dRect.w * dRect.h) / zg.districts.reduce((s, g) => s + g.wBlock, 0));
    for (const g of zg.districts) out.push(...layoutDistrict(g, dUnit));
    void k;
  }
  const districts = zones.flatMap((zg) => zg.districts);
  return { zones, districts, buildings: out, avenues, rect, bounds, showTests, ports: layoutPorts(out, bounds) };
}

/** Ports as docks outside the nearest city edge to their files, spread apart along it. */
function layoutPorts(buildings, bounds) {
  const byPath = new Map(buildings.map((it) => [it.b.path, it]));
  const docks = [];
  for (const p of model.ports || []) {
    const via = p.via.map((v) => byPath.get(v)).filter(Boolean);
    if (!via.length) continue;
    const cx = via.reduce((s, it) => s + it.x, 0) / via.length, cz = via.reduce((s, it) => s + it.z, 0) / via.length;
    const dists = { S: bounds.y + bounds.h - cz, N: cz - bounds.y, E: bounds.x + bounds.w - cx, W: cx - bounds.x };
    const edge = Object.keys(dists).sort((a, b) => dists[a] - dists[b])[0];
    docks.push({ p, via, edge, t: edge === 'S' || edge === 'N' ? cx : cz });
  }
  const off = AVENUE * 0.9;
  for (const edge of ['S', 'N', 'E', 'W']) {
    const row = docks.filter((d) => d.edge === edge).sort((a, b) => a.t - b.t);
    for (let i = 1; i < row.length; i++) row[i].t = Math.max(row[i].t, row[i - 1].t + 22);
    for (const d of row) {
      d.along = edge === 'S' || edge === 'N';
      d.x = edge === 'S' || edge === 'N' ? d.t : edge === 'E' ? bounds.x + bounds.w + off : bounds.x - off;
      d.z = edge === 'S' ? bounds.y + bounds.h + off : edge === 'N' ? bounds.y - off : d.t;
    }
  }
  return docks;
}

    b.complexity == null ? `<div class="note">Not measured: code-health measures JS files under src/ and scripts/ only${isCampus(b) ? '; this is campus (tests)' : b.lang === 'rust' ? '; this is Rust' : b.lang !== 'js' ? `; this is ${esc(b.lang)}` : ''}. Height and floors from the lines, no mast.</div>` : b.quadrant ? `<div class="note">${esc(QUADRANT_WHY[b.quadrant])} (score ${b.score}); mast: worst function ${fmt(b.worst)}${b.worst > COMPLEXITY_LIMIT ? ', over the limit' : ''}.</div>` : ''
  }${lm ? `<div class="note gold">Landmark: ${esc(lm)}</div>` : ''}${ports.length ? `<div class="note port">Talks to: ${ports.map((p) => esc(p.name)).join(', ')}</div>` : ''}`;
}
function districtCard(g) {

const tip = $('tip'), detail = $('detail');
let hover = null, pointer = { x: 0, y: 0, moved: false, inside: false };
function showTip(target, ev) {

  else if (target.g) tip.innerHTML = `${districtCard(target.g)}<div class="hint">Click to focus the district</div>`;
  else if (target.zg) tip.innerHTML = `<div class="d-head"><div><div class="kind">zone · ${esc(target.zg.z.kind)}</div><h3>${esc(target.zg.z.name)}</h3><p>${esc(target.zg.z.purpose || '')}</p></div></div><dl class="rows"><dt>Districts</dt><dd>${fmt(target.zg.districts.length)}</dd><dt>Files</dt><dd>${fmt(target.zg.districts.reduce((s, g) => s + g.d.files, 0))}</dd></dl><div class="hint">Click to focus the zone</div>`;

// ---------- hover arcs ----------
const setArcs = (lines, points) => { lines.geometry.setFromPoints(points.length ? points : [new THREE.Vector3(), new THREE.Vector3()]); lines.geometry.computeBoundingSphere(); lines.computeLineDistances(); };

const districtAnchor = (g) => new THREE.Vector3(g.block.x + g.block.w / 2, Y0 + 4, g.block.y + g.block.h / 2);

    const from = (deps.in.get(modelIndex) || []).map((j) => byLayout(model.buildings[j].path)).filter(Boolean);
    if (to.length || from.length) {

    const from = (districtDeps.in.get(target.g.d.id) || []).map((e) => layout.districts.find((g) => g.d.id === e.id)).filter(Boolean);

}

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick() {

  const hits = raycaster.intersectObjects([kinds.box, ...blockMeshes, ...zoneMeshes], false);
  if (!hits.length) return null;
  const hit = hits[0];
  if (hit.object === kinds.box) { const it = layout.buildings[boxOwner[hit.instanceId]]; return it ? { b: it.b, it } : null; }

let lastEvent = null, downAt = null;
renderer.domElement.addEventListener('pointermove', (ev) => { pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.moved = true; pointer.inside = true; lastEvent = ev; });

renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || downAt.button !== 0) return;

window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { unpin(); $('results').hidden = true; $('q').blur(); } });

// ---------- search ----------
const q = $('q'), results = $('results');
let found = [];
function search(text) {
  const s = text.trim().toLowerCase();
  if (!s) { results.hidden = true; found = []; return; }
  const ds = model.districts.filter((d) => d.id.toLowerCase().includes(s) || d.name.toLowerCase().includes(s)).slice(0, 3).map((d) => ({ d }));
  const bs = model.buildings.filter((b) => b.path.toLowerCase().includes(s))
    .sort((a, b) => (a.path.toLowerCase().indexOf(s) - b.path.toLowerCase().indexOf(s)) || a.path.length - b.path.length).slice(0, 9).map((b) => ({ b, hidden: !layout.showTests && isCampus(b) }));
  found = ds.concat(bs);
  results.innerHTML = found.length ? found.map((r, i) => r.d
    ? `<button data-i="${i}"><b>${esc(r.d.name)}</b> <span class="muted">district · ${fmt(r.d.files)} files</span><small>${esc(zoneOfDistrict(r.d.id).name)}</small></button>`
    : `<button data-i="${i}"><span class="mono">${esc(r.b.path)}</span><small>${esc((districtById.get(r.b.district) || {}).name || r.b.district)} · ${fmt(r.b.loc)} lines${r.b.quadrant ? ` · ${esc(r.b.quadrant)}` : ''}${r.hidden ? ' · tests are hidden' : ''}</small></button>`).join('')

q.addEventListener('input', () => search(q.value));

q.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go(found[0]); });

// ---------- header, legend, toggles ----------
const danger = model.buildings.filter((b) => b.quadrant === 'Danger Zone').length;

  model.meta.measured ? `<b class="danger">${fmt(danger)}</b> in the Danger Zone` : '', plan ? `coverage <b>${plan.coverage}%</b>` : '', `head <span class="mono">${esc(model.meta.head)}</span>`].filter(Boolean).join(' · ');

const pocText = `Proof of concept v2 · the repository as a city · ${plan ? `plan ${plan.file}` : 'grouped by folders'} · built ${String(model.meta.generatedAt || '').slice(0, 10)}`;

function legend() {
  const row = (c, name, sub) => `<div class="sw-row"><i class="sw" style="--c:${c}"></i>${esc(name)}<small>${esc(sub)}</small></div>`;
  let html = '';
  if (mode === 'quadrant') html = `<h4>Quadrant (complexity × churn)</h4>${Object.keys(T.quadrant).map((k) => row(T.quadrant[k], k, QUADRANT_WHY[k])).join('')}${row(T.unmeasured, 'Not measured', 'Rust, CSS, YAML, JSON…')}${row(T.campus, 'Campus (tests)', 'no complexity, shown lower')}`;
  else if (mode === 'zone') html = `<h4>Zones (a material per kind)</h4>${model.zones.map((z) => row(kindOf(z.kind).tint, z.name, z.kind)).join('')}`;
  else html = `<h4>Churn (commits that touched the file)</h4><div class="ramp"></div><div class="ramp-ends"><span>0</span><span>${fmt(MAX_CHURN)}</span></div>`;

}
function setMode(m) { mode = m; for (const b of $('mode').querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === m); legend(); paint(); }
$('mode').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setMode(b.dataset.mode); });

// ---------- showroom: the building models side by side ----------
const campusZone = (model.zones.find((z) => z.kind === 'campus') || {}).id;
const SAMPLES = [
  { label: 'Shed', sub: 'tiny file · 18 lines', b: { path: 'showroom/shed.md', lang: 'md', loc: 18 } },
  { label: 'Pavilion', sub: 'a test · campus', b: { path: 'showroom/pavilion.test.js', lang: 'js', loc: 160, zone: campusZone } },
  { label: 'Hall', sub: 'big data file · not measured', b: { path: 'showroom/hall.json', lang: 'json', loc: 1400 } },
  { label: 'Block', sub: 'complexity 40 · 18 functions · healthy', b: { path: 'showroom/block.js', lang: 'js', loc: 220, complexity: 40, functions: 18, worst: 6, churn: 3, quadrant: 'Healthy Closure' } },
  { label: 'Block, tier 2', sub: 'complexity 150 · corner tower · water tower', b: { path: 'showroom/block-2.js', lang: 'js', loc: 520, complexity: 150, functions: 60, worst: 14, churn: 2, quadrant: 'Cowboy Code' } },
  { label: 'Tower', sub: 'complexity 420 on a small footprint', b: { path: 'showroom/tower.js', lang: 'js', loc: 380, complexity: 420, functions: 90, worst: 30, churn: 40, quadrant: 'Danger Zone' }, narrow: true },
  { label: 'Tower, tier 3', sub: 'complexity 900 · four setbacks and a crown', b: { path: 'showroom/tower-3.js', lang: 'js', loc: 700, complexity: 900, functions: 160, worst: 60, churn: 90, quadrant: 'Danger Zone' }, narrow: true },
  { label: 'Complex', sub: '3x the median footprint · wings, garden, skybridges', b: { path: 'showroom/complex.js', lang: 'js', loc: 2600, complexity: 600, functions: 210, worst: 40, churn: 120, quadrant: 'Danger Zone' }, wide: true },
  { label: 'Complex, healthy', sub: 'big and quiet · roof garden', b: { path: 'showroom/complex-ok.js', lang: 'js', loc: 2000, complexity: 300, functions: 150, worst: 10, churn: 4, quadrant: 'Healthy Closure' }, wide: true },
  { label: 'Crane', sub: 'Fertile Ground · simple, changes a lot', b: { path: 'showroom/crane.js', lang: 'js', loc: 700, complexity: 150, functions: 50, worst: 9, churn: 150, quadrant: 'Fertile Ground' } },
  { label: 'Plant', sub: 'Danger Zone · worst function over the limit', b: { path: 'showroom/plant.js', lang: 'js', loc: 600, complexity: 150, functions: 70, worst: 48, churn: 60, quadrant: 'Danger Zone' } },
  { label: 'Landmark', sub: 'a plan landmark · plinth and beacon', b: { path: 'showroom/landmark.js', lang: 'js', loc: 800, complexity: 350, functions: 110, worst: 22, churn: 70, quadrant: 'Danger Zone' } },
];
landmarkOf.set('showroom/landmark.js', 'Landmark');
/** A layout of the samples on a grid of plinths (two rows), as the city's layout objects go. */
function layoutShowroom() {
  const cell = 26, cols = 4, rows = Math.ceil(SAMPLES.length / cols), unit = 0.29, buildings = [], plinths = [];
  SAMPLES.forEach((s, i) => {
    const b = { district: 'showroom', zone: 'showroom', complexity: null, worst: null, functions: null, churn: 0, quadrant: null, ...s.b };
    let w = Math.sqrt(weightOf(b) * unit), d = w;

// ---------- level of detail ----------
let lodLevel = -1;
function lod(force) {
  const d = camera.position.distanceTo(controls.target) / homeDistance;
  const level = d > LOD_LABELS ? 0 : d > LOD_DETAIL ? 1 : 2;
  if (level === lodLevel && !force) return;
  lodLevel = level;
  for (const l of districtLabels) l.visible = level >= 1;
  for (const k in kinds) if (kinds[k].userData.detail) kinds[k].visible = level >= 1;

const v = new THREE.Vector3();
/** Projects the tags; one that would overlap another already placed moves up until it is clear. */

    t.el.style.display = visible ? '' : 'none';
    if (visible) shown.push({ t, x: ((v.x + 1) / 2) * innerWidth, y: ((1 - v.y) / 2) * innerHeight - 8 });

// ---------- loop ----------
applyTheme(T.name, false);
build(layoutCity(true));
setMode(mode);
homeView(true);
lod(true);
$('boot').remove();
window.cityFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (flight) {
    const t = Math.min(1, (now - flight.t0) / flight.ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0v, flight.t1, e);
    if (t >= 1) flight = null;
  }
  controls.update();
  lod(false);
  const glow = 0.7 + 0.5 * Math.sin(now / 1000 * 3.5); // the beacons pulse like a running machine's
  for (const bcn of beacons) bcn.material.emissiveIntensity = glow;
  if (ringPin.visible) ringPin.material.opacity = 0.55 + 0.25 * Math.sin(now / 1000 * 3);
  if (pointer.moved) {
    pointer.moved = false;
    const t = downAt ? null : pick();
    const key = t ? (t.b ? `b:${t.b.path}` : t.g ? `d:${t.g.d.id}` : `z:${t.zg.z.id}`) : '';
    if (key !== (hover || '')) { hover = key; if (t && t.b) placeHalo(haloHover, t.it, 0.7); else haloHover.visible = false; showDeps(t); }
    if (t) showTip(t, lastEvent); else showTip(null);
    renderer.domElement.style.cursor = t ? 'pointer' : '';
  }
  placeTags();
  drive(now); animate(now);
  if (glow) composer.render(); else renderer.render(scene, camera);
  window.cityFrames++;
  if (window.cityFrames === 2) window.cityReady = true;
}
requestAnimationFrame(frame);

// ---------- hooks for the next phases (not built here) ----------
window.city = {
  model, camera, controls, get layout() { return layout; }, get homeDistance() { return homeDistance; }, get theme() { return T.name; },
  flyToBuilding, flyToDistrict, flyToZone, pin: (path) => showPin(byLayout(path)), unpin, home: () => homeView(false), setMode, setTheme: (name) => applyTheme(name), showroom,
  /** Where a robot would stand: the roof centre of a building and its footprint (world units). */

  /** Colours a set of files ({ path: '#hex' }) and greys the rest; null restores the current colour mode. */
  highlight(colours) { override = colours || null; paint(); },
};
