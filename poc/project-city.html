<title>Project city (proof of concept)</title>
<!--
  Proof of concept: a repository as a 3D city (three.js), one file, no build step. It is drawn like
  the run's 3D view of the app (src/renderer/run3d/scene.jsx, run3d-theme.js, run3d.css): the same
  two themes (dark, the app's tokens, is the default; light is the palette of poc/run-3d.html),
  rounded boxes everywhere (RoundedBoxGeometry), the same lights, soft shadows over a sky disc, no
  tone mapping, and the same HUD (cards, chips, pills, tags).
  - Zones are the big areas of a city plan (poc/project-map/SKILL.md), laid out in the plan's order
    as strips from the front (foundations) to the back; avenues with quiet lane markings and
    sidewalks run between them, and each zone is a rounded slab whose ground follows its kind
    (campus lawn, industrial asphalt, infrastructure concrete, commercial paving...). Inside a zone,
    the districts are raised rounded plates in a squarified treemap with streets between them and
    the district's name on the plate; the zone's name is big along its avenue side. Inside a
    district, the buildings are a treemap of the files by lines of code. Without a plan
    (poc/embed-city.js without --plan) the zones are the top folders and the districts their
    subfolders.
  - A building: footprint by lines; height by the complexity scripts/code-health.js measured (by
    the lines when a file has none: Rust, CSS, YAML, tests); floors as thin ledges from the function
    count (the lines otherwise, capped); a thin mast on the roof as tall as the worst function's
    complexity, with a cap (red over the ratchet limit). Colour by quadrant (complexity x churn,
    Danger Zone red), by zone (a material per zone kind) or by churn (a heat ramp). Campus zones
    (tests) are drawn quieter (lower, grey in quadrant mode) and a toggle hides them. Landmarks stand
    on a plinth under a pulsing beacon with a tag that stays visible; ports (external systems) are
    docks outside the city edge with arcs to the files that talk to them. Unmatched files live in
    the Outskirts.
  - Orbit with the mouse, pan with the right button (or shift), zoom with the wheel. Hovering a
    building draws arcs to the files it requires (accent) and the files that require it (amber)
    and dims the rest; hovering a district draws its crate dependencies (Rust) the same way. Click
    a building to pin its card, a district or a zone to focus it; search a file to fly to it. From
    far away only zones, avenues and zone names show; district labels, floors and masts appear as
    you zoom in.
  - The model is embedded below by poc/embed-city.js (<script id="city-data">): no engine, no
    model call, nothing is read at run time. three.js loads from a CDN (needs internet).
  - Hooks for the next phases (not built): `window.city` exposes the model and the layout,
    `city.roofOf(path)` (where a robot would stand on a building), `city.highlight({ path: colour })`
    (the files an issue touches, the files a release changed), `city.flyToBuilding(path)`,
    `city.flyToDistrict(id)`, `city.flyToZone(id)` and `city.setTheme(name)`.
-->

// ---------- camera moves ----------
let flight = null, homeDistance = 1;
function flyTo(target, position, ms = 900) {

}

/** The camera distance along `dir` from `target` at which every point of `rect` (ground) shows, clear of the HUD. */

  const corners = [[rect.x, rect.y], [rect.x + rect.w, rect.y], [rect.x, rect.y + rect.h], [rect.x + rect.w, rect.y + rect.h]];
  const points = corners.flatMap(([x, z]) => [new THREE.Vector3(x, 0, z), new THREE.Vector3(x, top, z)]);

    if (points.every((p) => { v.copy(p).project(probe); return Math.abs(v.x) < 0.94 && v.y < 0.76 && v.y > -0.95; })) return d;
  }

}

  const target = new THREE.Vector3(rect.x + rect.w / 2, 0, rect.y + rect.h / 2 + rect.h * 0.1), dir = HOME_DIR.clone();
  homeDistance = fitDistance(target, dir, rect, 12);

}
function flyToRect(rect, top) {
  const target = new THREE.Vector3(rect.x + rect.w / 2, 0, rect.y + rect.h / 2);
  const dir = dirOfCamera(); dir.y = Math.max(dir.y, 0.6); dir.normalize();

function flyToDistrict(id) {

}

// ---------- hover arcs ----------
const setArcs = (geometry, points) => { geometry.setFromPoints(points.length ? points : [new THREE.Vector3(), new THREE.Vector3()]); geometry.computeBoundingSphere(); };

    const from = (deps.in.get(modelIndex) || []).map((j) => byLayout(model.buildings[j].path)).filter(Boolean);
    if (to.length || from.length) {

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick() {
  if (!layout || !pointer.inside) return null;
  ndc.set((pointer.x / innerWidth) * 2 - 1, -(pointer.y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([mesh, ...blockMeshes, ...zoneMeshes], false);
  if (!hits.length) return null;
  const hit = hits[0];
  if (hit.object === mesh) return { b: layout.buildings[hit.instanceId].b, it: layout.buildings[hit.instanceId] };
  if (hit.object.userData.district) return { g: hit.object.userData.district };
  return { zg: hit.object.userData.zone };
}
let lastEvent = null, downAt = null;
renderer.domElement.addEventListener('pointermove', (ev) => { pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.moved = true; pointer.inside = true; lastEvent = ev; });

  if (t && t.b) showPin(t.it);
  else if (t && t.g) flyToDistrict(t.g.d.id);

// ---------- search ----------
const q = $('q'), results = $('results');
let found = [];
function search(text) {
  const s = text.trim().toLowerCase();
  if (!s) { results.hidden = true; found = []; return; }
  const ds = model.districts.filter((d) => d.id.toLowerCase().includes(s) || d.name.toLowerCase().includes(s)).slice(0, 3).map((d) => ({ d }));
  const bs = model.buildings.filter((b) => b.path.toLowerCase().includes(s))
    .sort((a, b) => (a.path.toLowerCase().indexOf(s) - b.path.toLowerCase().indexOf(s)) || a.path.length - b.path.length).slice(0, 9).map((b) => ({ b, hidden: !layout.showTests && isCampus(b) }));
  found = ds.concat(bs);
  results.innerHTML = found.length ? found.map((r, i) => r.d
    ? `<button data-i="${i}"><b>${esc(r.d.name)}</b> <span class="muted">district · ${fmt(r.d.files)} files</span><small>${esc(zoneOfDistrict(r.d.id).name)}</small></button>`
    : `<button data-i="${i}"><span class="mono">${esc(r.b.path)}</span><small>${esc((districtById.get(r.b.district) || {}).name || r.b.district)} · ${fmt(r.b.loc)} lines${r.b.quadrant ? ` · ${esc(r.b.quadrant)}` : ''}${r.hidden ? ' · tests are hidden' : ''}</small></button>`).join('')

}

q.addEventListener('input', () => search(q.value));
q.addEventListener('focus', () => { if (q.value) search(q.value); });
q.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go(found[0]); });
results.addEventListener('click', (ev) => { const btn = ev.target.closest('button'); if (btn) go(found[+btn.dataset.i]); });
document.addEventListener('pointerdown', (ev) => { if (!ev.target.closest('.search')) results.hidden = true; });

  $('legend').innerHTML = `${html}<div class="how">Footprint grows with the lines, height with the complexity (the lines when there is none), ledges with the functions; the mast is the worst function. Avenues separate zones, streets separate districts.</div>`;
}
function setMode(m) { mode = m; for (const b of $('mode').querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === m); legend(); paint(); }
$('mode').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setMode(b.dataset.mode); });
$('tests').addEventListener('change', (ev) => build(layoutCity(ev.target.checked)));
$('home').addEventListener('click', () => homeView(false));
$('theme').addEventListener('click', () => applyTheme(T.name === 'dark' ? 'light' : 'dark'));
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- level of detail ----------
let lodLevel = -1;
function lod(force) {
  const d = camera.position.distanceTo(controls.target) / homeDistance;
  const level = d > LOD_LABELS ? 0 : d > LOD_DETAIL ? 1 : 2;
  if (level === lodLevel && !force) return;
  lodLevel = level;
  for (const l of districtLabels) l.visible = level >= 1;
  floorsMesh.visible = antennaMesh.visible = tipMesh.visible = level >= 2;
}
const v = new THREE.Vector3();
/** Projects the tags; one that would overlap another already placed moves up until it is clear. */
function placeTags() {
  const placed = [];
  const shown = [];
  for (const t of tags) {
    v.copy(t.position).project(camera);
    const visible = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    t.el.style.display = visible ? '' : 'none';
    if (visible) shown.push({ t, x: ((v.x + 1) / 2) * innerWidth, y: ((1 - v.y) / 2) * innerHeight - 8 });
  }
  shown.sort((a, b) => b.y - a.y); // the lowest on screen first: the ones above it move up
  for (const s of shown) {
    const w = s.t.el.offsetWidth || 120, h = (s.t.el.offsetHeight || 22) + 4;
    const r = { x0: s.x - w / 2, x1: s.x + w / 2, y1: s.y, y0: s.y - h };
    for (let i = 0; i < 12; i++) {
      const hit = placed.find((p) => r.x0 < p.x1 && r.x1 > p.x0 && r.y0 < p.y1 && r.y1 > p.y0);
      if (!hit) break;
      const dy = r.y1 - hit.y0; r.y0 -= dy; r.y1 -= dy;
    }
    placed.push(r);
    s.t.el.style.transform = `translate(${s.x}px, ${r.y1}px) translate(-50%, -100%)`;
  }
}

// ---------- loop ----------
applyTheme(T.name, false);
build(layoutCity(true));
setMode(mode);
homeView(true);
lod(true);
$('boot').remove();
window.cityFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (flight) {
    const t = Math.min(1, (now - flight.t0) / flight.ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0v, flight.t1, e);
    if (t >= 1) flight = null;
  }
  controls.update();
  lod(false);
  const glow = 0.7 + 0.5 * Math.sin(now / 1000 * 3.5); // the beacons pulse like a running machine's
  for (const bcn of beacons) bcn.material.emissiveIntensity = glow;
  if (ringPin.visible) ringPin.material.opacity = 0.55 + 0.25 * Math.sin(now / 1000 * 3);
  if (pointer.moved) {
    pointer.moved = false;
    const t = downAt ? null : pick();
    const key = t ? (t.b ? `b:${t.b.path}` : t.g ? `d:${t.g.d.id}` : `z:${t.zg.z.id}`) : '';
    if (key !== (hover || '')) { hover = key; if (t && t.b) placeHalo(haloHover, t.it, 0.7); else haloHover.visible = false; showDeps(t); }
    if (t) showTip(t, lastEvent); else showTip(null);
    renderer.domElement.style.cursor = t ? 'pointer' : '';
  }
  placeTags();
  renderer.render(scene, camera);
  window.cityFrames++;
  if (window.cityFrames === 2) window.cityReady = true;
}
requestAnimationFrame(frame);

// ---------- hooks for the next phases (not built here) ----------
window.city = {
  model, camera, controls, get layout() { return layout; }, get homeDistance() { return homeDistance; }, get theme() { return T.name; },
  flyToBuilding, flyToDistrict, flyToZone, pin: (path) => showPin(byLayout(path)), unpin, home: () => homeView(false), setMode, setTheme: (name) => applyTheme(name),
  /** Where a robot would stand: the roof centre of a building and its footprint (world units). */
  roofOf(path) { const it = byLayout(path); return it ? { position: new THREE.Vector3(it.x, Y0 + it.h, it.z), width: it.w, depth: it.d, height: it.h } : null; },
  /** Colours a set of files ({ path: '#hex' }) and greys the rest; null restores the current colour mode. */
  highlight(colours) { override = colours || null; paint(); },
};
</script>
</body>
