<!doctype html>
<!-- #650 (docs/work/write-doc/spec.md R16) the shell of an interactive mock: the Documents screen loads it
     by src in an iframe sandboxed with allow-scripts only (an opaque origin), the mock's page in the URL's
     fragment (DocsPage.mountMocks). A real document has its own CSP: an about:srcdoc page would inherit the
     app's script-src 'self' and none of the mock's scripts would run. This CSP allows inline scripts and
     no network; the fragment never reaches a server. -->
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:"></head>
<body><script>
  (function () {
    var page = '';
    try { page = decodeURIComponent(location.hash.slice(1)); } catch (e) { page = ''; }
    document.open();
    document.write(page);
    document.close();
  })();
</script></body></html>
