<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City modes (proof of concept)</title>
<!--
  Proof of concept for #442 (the city map: one use at a time, each with the minimum it needs), to be
  approved by the owner before #440, #441, #430, #428, #438 and #439 run; those issues port this
  page's layout code, not a new interpretation. One file, no build step, nothing read at run time.
  - The city is poc/project-city.html as approved (#370/#379): the same embedded model (this
    repository with its city plan, built 2026-10-13) and the same three.js engine, with four small
    patches (the scene is sized by its box instead of the window, so the city can live inside the
    Architecture tab or inside a modal; the legend writes into its own body; "Colour by" is the
    app's select; hooks for tags, roof points and arcs). three.js loads from a CDN (needs internet).
  - The HUD uses the app's stylesheets verbatim (src/renderer/run3d.css, project-city.css and the
    three overlay stylesheets, inlined below), then the POC's own rules: what the issues change.
  - The six modes of #440, one at a time, picked here by a demo bar at the bottom (in the product
    the mode comes from the entry point): Explore (the Architecture tab), Live (Explore's toggle),
    Run replay, Issue impact, Stage, Release. The title says the mode; Close goes back to the screen
    the map was called from; each mode owns its panels; the legend lists only the current mode's
    colours (#440). Every panel has a chevron (#441); the legend closes and a small "Legend" button
    brings it back (#441). A mode opened from another screen is a modal over that screen (#430: a
    mock of the Roadmap, Releases or Run screen stands behind it; Explore and Live live in the
    Project screen's Architecture tab). The mode's card is at the top of the left column, where the
    notes start (#428). The release legend shows the change ramp with its cut points and a renamed
    file is told apart by a ring at its base (#438); an older release lists no false plan problems,
    one muted line says what did not exist yet (#439).
  - The sample data is plausible, not read: release 1.0.0 → 1.1.2 (452 added, 360 changed, 8 renamed,
    1 removed, spread over the files last changed after 1.0.0), issue #426, stage 113 (#426 + #436),
    two runs in progress, the replay of one run. "Most connected" is computed from the model's edges.
  - URL parameters, for the screenshots: ?mode=explore|live|replay|issue|stage|release
    &theme=dark|light &frame=tab|modal &min=1 (every panel minimized) &legend=0 (closed)
    &edge=1 (the modal edge to edge) &after=1 (the issue after its run) &bar=0 (no demo bar).
-->

<style>
/* ===== the app's stylesheets, verbatim (src/renderer): the HUD looks like the product ===== */
/* --- run3d.css --- */
/* The run's 3D view (run3d.js, the scene from generated/run3d-scene.js): a full-screen overlay over
   the whole app, and the HUD over its scene. Two themes, chosen by `data-theme` on the overlay
   (run3d-theme.js; the 3D scene's colours are there):
   - dark, the default: the app's own tokens (style.css :root), so the overlay looks like the app;
   - light: the palette of the proof of concept the owner approved (poc/run-3d.html), as it was.
   Every colour of the HUD is a `--r3d-*` variable set by the theme; a state's colour (`--c`, from the
   theme's palette) always comes with its label. Every class is `r3d-` so the app's .pill, .badge,
   .row... never apply here. The robots' animations (rb-*) come from chat.css. */
.r3d {
  --r3d-bg: var(--bg, #0e1014); --r3d-card: color-mix(in srgb, var(--panel, #151820) 90%, transparent); --r3d-card-line: var(--border, #262b37);
  --r3d-ink: var(--text, #e6e8ee); --r3d-ink-2: #b9bfce; --r3d-muted: var(--muted, #8a91a3); --r3d-line: var(--border, #262b37);
  --r3d-accent: var(--accent, #7c9cff); --r3d-on-accent: #0b0d12; --r3d-accent-soft: color-mix(in srgb, var(--accent, #7c9cff) 16%, transparent);
  --r3d-green: var(--green, #4ade80); --r3d-amber: var(--yellow, #facc15); --r3d-red: var(--red, #f87171); --r3d-grey: #6f788c;
  /* soft surfaces inside a card, their hover, a bar's track; what a state colour is mixed into for
     its soft background (tint) and a role colour for its text (shade) */
  --r3d-soft: var(--panel-2, #1b1f29); --r3d-hover: #262c3a; --r3d-track: #2a3040; --r3d-tint: var(--panel, #151820); --r3d-shade: #fff;
  --r3d-live-bg: color-mix(in srgb, var(--green, #4ade80) 14%, var(--panel, #151820)); --r3d-wait-bg: color-mix(in srgb, var(--yellow, #facc15) 14%, var(--panel, #151820));
  --r3d-stop-bg: color-mix(in srgb, var(--red, #f87171) 14%, var(--panel, #151820));
  --r3d-note-live: #c9d5ff; --r3d-note-warn: #f3dc8c; --r3d-mile: var(--panel, #151820); --r3d-mile-line: #2a3040; --r3d-mile-ring: #4a5266;
  --r3d-tag: var(--panel-2, #1b1f29); --r3d-tag-shadow: 0 0 0 1px #343b4d, 0 4px 14px rgba(0, 0, 0, .55);
  --r3d-radius: 18px; --r3d-shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
  position: fixed; inset: 0; z-index: 900; overflow: clip; outline: none;
  font: 13px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--r3d-ink); background: var(--r3d-bg);
}
.r3d[data-theme="light"] {
  --r3d-bg: #E8EDF7; --r3d-card: rgba(255, 255, 255, .88); --r3d-card-line: rgba(255, 255, 255, .95);
  --r3d-ink: #1B2233; --r3d-ink-2: #4A546B; --r3d-muted: #7A859C; --r3d-line: #E6EAF3;
  --r3d-accent: #4C6FFF; --r3d-on-accent: #fff; --r3d-accent-soft: #EAF0FF;
  --r3d-green: #1FAE6E; --r3d-amber: #E39A12; --r3d-red: #EA4E4B; --r3d-grey: #A7B0C2;
  --r3d-soft: #F3F5FA; --r3d-hover: #EEF1F8; --r3d-track: #EDF0F7; --r3d-tint: #fff; --r3d-shade: #000;
  --r3d-live-bg: #E7F8F0; --r3d-wait-bg: #FFF4DC; --r3d-stop-bg: #FDECEC;
  --r3d-note-live: #2B3A75; --r3d-note-warn: #6B4A00; --r3d-mile: #fff; --r3d-mile-line: #DDE3EE; --r3d-mile-ring: #D5DCE9;
  --r3d-tag: #fff; --r3d-tag-shadow: 0 4px 14px rgba(40, 60, 120, .18);
  --r3d-shadow: 0 12px 32px rgba(40, 60, 120, .13), 0 1px 2px rgba(40, 60, 120, .08);
  color-scheme: light;
}
.r3d *, .r3d *::before, .r3d *::after { box-sizing: border-box; }
/* issue 383: a HUD select's list (style.css's select) in the view's light or dark theme */
.r3d select::picker(select) { background: var(--r3d-tint); color: var(--r3d-ink); border-color: var(--r3d-line); box-shadow: var(--r3d-shadow); }
.r3d select option { color: var(--r3d-ink); }
.r3d select option:hover, .r3d select option:focus-visible { background: var(--r3d-hover); }
.r3d select option:checked { background: var(--r3d-accent-soft); }
.r3d select option::checkmark { color: var(--r3d-accent); }
.r3d button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
/* clip, not hidden: never a scroll container, so focusing or scrolling a card into view cannot shift the HUD */
.r3d-root, .r3d-app { position: absolute; inset: 0; overflow: clip; }
.r3d-message { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--r3d-muted); font-size: 14px; text-align: center; padding: 24px; }
.r3d-message p { margin: 0; max-width: 520px; }
.r3d-stage { position: absolute; inset: 0; }
.r3d-stage canvas { display: block; }
.r3d-tags, .r3d-hud { position: absolute; inset: 0; pointer-events: none; overflow: clip; }
.r3d-hud > * { pointer-events: auto; position: absolute; }
.r3d-card { background: var(--r3d-card); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--r3d-card-line); border-radius: var(--r3d-radius); box-shadow: var(--r3d-shadow); }
.r3d-mono { font-family: "Cascadia Code", Consolas, monospace; }

/* floating tags over the scene; far away (the whole floor) the quiet ones fold to their name */
.r3d-tag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--r3d-tag); box-shadow: var(--r3d-tag-shadow); font-size: 11.5px; font-weight: 650; will-change: transform; }
.r3d-tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 9px; height: 9px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.r3d-tag span { font-weight: 500; color: var(--r3d-muted); }
.r3d-tag.sel { background: var(--r3d-accent); color: var(--r3d-on-accent); z-index: 2; }
.r3d-tag.live { z-index: 1; }
.r3d-tag.sel span { color: inherit; opacity: .8; }
.r3d-tag.dim { opacity: .72; font-weight: 550; }
.r3d-tags.far .r3d-tag:not(.sel):not(.live) span { display: none; }
.r3d-tags.far .r3d-tag.dim:not(.sel) { font-size: 10.5px; padding: 3px 8px 3px 6px; }
.r3d-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--r3d-grey)); flex: none; }
.r3d-dot.live { animation: r3d-live 1.2s ease-in-out infinite; }
@keyframes r3d-live { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent); } }

/* top bar */
.r3d-top { top: 14px; left: 14px; right: 14px; height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 16px; }
.r3d-brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 15px; letter-spacing: -.2px; flex: none; }
.r3d-brand i { width: 28px; height: 28px; border-radius: 9px; background: var(--r3d-accent); display: grid; place-items: center; color: var(--r3d-on-accent); }
.r3d-run { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.r3d-run b, .r3d-run small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.r3d-run small { color: var(--r3d-muted); font-size: 11.5px; }
.r3d-search { flex: 1 1 120px; min-width: 0; max-width: 340px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 11px; background: var(--r3d-soft); color: var(--r3d-muted); }
.r3d-search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; color: var(--r3d-ink); min-width: 0; padding: 0; }
.r3d-search input::placeholder { color: var(--r3d-muted); }
.r3d-search:focus-within { box-shadow: 0 0 0 2px var(--r3d-accent); }
.r3d-grow { flex: 1; }
.r3d-chip { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 11px; background: var(--r3d-soft); font-weight: 600; white-space: nowrap; flex: none; }
.r3d-state.live { color: var(--r3d-green); background: var(--r3d-live-bg); }
.r3d-state.live.waiting { color: var(--r3d-amber); background: var(--r3d-wait-bg); }
.r3d-state.completed, .r3d-state.replay { color: var(--r3d-accent); background: var(--r3d-accent-soft); }
.r3d-state.replay.paused { color: var(--r3d-ink-2); background: var(--r3d-soft); }
.r3d-state.interrupted { color: var(--r3d-red); background: var(--r3d-stop-bg); }
.r3d-close { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--r3d-ink-2); flex: none; }
.r3d-theme { margin-right: -10px; }
.r3d-close:hover, .r3d-zoom button:hover { background: var(--r3d-hover); }
.r3d button:focus-visible, .r3d-strip:focus-visible { outline: 2px solid var(--r3d-accent); outline-offset: 2px; }

/* KPI tiles */
.r3d-kpis { top: 82px; left: 14px; display: flex; gap: 10px; }
.r3d-kpi { padding: 11px 16px 11px 12px; display: flex; gap: 11px; align-items: center; min-width: 150px; }
.r3d-kpi i { width: 34px; height: 34px; border-radius: 11px; background: var(--r3d-accent-soft); color: var(--r3d-accent); display: grid; place-items: center; flex: none; }
.r3d-kpi label { display: block; font-size: 11px; color: var(--r3d-muted); font-weight: 600; }
.r3d-kpi b { font-size: 20px; letter-spacing: -.4px; line-height: 1.15; }
.r3d-kpi b small { font-size: 12px; font-weight: 600; color: var(--r3d-muted); letter-spacing: 0; }
.r3d-kpi em { display: block; font-style: normal; font-size: 11px; color: var(--r3d-muted); }

/* detail card + zoom column */
.r3d-detail { top: 82px; right: 14px; width: 304px; padding: 14px; max-height: calc(100% - 82px - 284px); overflow: auto; }
.r3d-zoom { top: 82px; right: 328px; padding: 5px; display: flex; flex-direction: column; gap: 2px; border-radius: 15px; }
.r3d-zoom button { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--r3d-ink-2); }
.r3d-zoom button.on { background: var(--r3d-accent); color: var(--r3d-on-accent); }
.r3d-d-head { display: flex; gap: 10px; align-items: center; }
.r3d-d-head .r3d-avatar { flex: none; margin: -8px 0 -8px -8px; }
.r3d-kind { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--r3d-accent); }
.r3d-d-head h3 { margin: 1px 0 0; font-size: 17px; letter-spacing: -.3px; }
.r3d-d-head p { margin: 1px 0 0; color: var(--r3d-muted); font-size: 12px; }
.r3d-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--r3d-tint)); white-space: nowrap; }
.r3d-d-status { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }
.r3d-pct { margin-left: auto; font-weight: 650; font-size: 12px; color: var(--r3d-muted); }
.r3d-bar { display: block; height: 6px; border-radius: 3px; background: var(--r3d-track); overflow: hidden; }
.r3d-bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--r3d-accent)); }
/* a live visit has no known end: an indeterminate bar */
.r3d-bar.open > i { width: 40% !important; animation: r3d-sweep 1.4s ease-in-out infinite; }
@keyframes r3d-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.r3d-rows { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; }
.r3d-rows dt { color: var(--r3d-muted); }
.r3d-rows dd { margin: 0; text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r3d-note { margin-top: 12px; padding: 9px 11px; border-radius: 11px; background: var(--r3d-soft); font-size: 12px; color: var(--r3d-ink-2); max-height: 92px; overflow: hidden; }
.r3d-note b { display: block; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--r3d-muted); margin-bottom: 2px; }
.r3d-note.live { background: var(--r3d-accent-soft); color: var(--r3d-note-live); }
.r3d-note.warn { background: var(--r3d-wait-bg); color: var(--r3d-note-warn); }
.r3d-note .r3d-mono { font-size: 11.5px; word-break: break-word; }
.r3d .r3d-primary { margin-top: 12px; width: 100%; height: 36px; border-radius: 11px; background: var(--r3d-accent); color: var(--r3d-on-accent); font-weight: 700; }
.r3d .r3d-primary.inline { width: auto; padding: 0 18px; margin: 0; }
.r3d .r3d-primary:disabled { background: var(--r3d-line); color: var(--r3d-muted); cursor: default; }
.r3d-role { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: color-mix(in srgb, var(--c) 62%, var(--r3d-shade)); background: color-mix(in srgb, var(--c) 18%, var(--r3d-tint)); }
.r3d-badge { display: grid; place-items: center; border-radius: 30%; flex: none; color: color-mix(in srgb, var(--c) 68%, var(--r3d-shade)); background: color-mix(in srgb, var(--c) 22%, var(--r3d-tint)); }
.r3d-crew { margin-top: 11px; display: grid; gap: 5px; }
.r3d-mate { display: flex; align-items: center; gap: 8px; }
.r3d-mate .r3d-txt { flex: 1; min-width: 0; }
.r3d-mate .r3d-txt small { display: block; color: var(--r3d-muted); font-size: 11.5px; margin-top: 2px; }
.r3d-state-word { font-size: 11.5px; color: var(--r3d-muted); font-weight: 600; }
.r3d-avatar svg { width: 100%; height: 100%; display: block; }

/* list card */
.r3d-list { right: 14px; bottom: 14px; width: 404px; padding: 10px 10px 6px; }
.r3d-tabs { display: flex; gap: 4px; padding: 0 2px 8px; border-bottom: 1px solid var(--r3d-line); }
.r3d-tabs button { padding: 5px 11px; border-radius: 9px; font-weight: 650; color: var(--r3d-muted); }
.r3d-tabs button.on { background: var(--r3d-accent-soft); color: var(--r3d-accent); }
.r3d-tabs button small { font-weight: 600; opacity: .75; margin-left: 3px; }
.r3d-scroll { height: 196px; overflow: auto; margin-top: 4px; }
.r3d-row { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 5px 6px; border-radius: 11px; }
.r3d-row:hover { background: var(--r3d-soft); }
.r3d-row.sel { background: var(--r3d-accent-soft); }
.r3d-row.unused { opacity: .55; }
.r3d-row .r3d-avatar { flex: none; }
.r3d-txt { flex: 1; min-width: 0; }
.r3d-row .r3d-txt b { display: block; font-size: 12.5px; }
.r3d-row .r3d-txt small { display: block; color: var(--r3d-muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r3d-mini { width: 44px; flex: none; }
.r3d-mini small { display: block; text-align: right; font-size: 10.5px; color: var(--r3d-muted); margin-top: 2px; }
.r3d-ev { display: flex; gap: 9px; padding: 5px 6px; font-size: 12px; align-items: baseline; width: 100%; text-align: left; border-radius: 9px; }
.r3d-ev:hover { background: var(--r3d-soft); }
.r3d-ev time { color: var(--r3d-muted); font-size: 11px; width: 44px; flex: none; }
.r3d-ev .r3d-dot { position: relative; top: -1px; }
.r3d-empty { padding: 26px; text-align: center; color: var(--r3d-muted); }

/* pipeline card */
.r3d-pipe { left: 14px; bottom: 14px; right: 432px; max-width: 760px; padding: 13px 16px 12px; }
.r3d-pipe-top { display: flex; gap: 18px; align-items: center; }
.r3d-pipe-main { flex: 1; min-width: 0; }
.r3d-pipe-title { display: flex; align-items: center; gap: 14px; font-weight: 700; margin-bottom: 11px; white-space: nowrap; }
.r3d-pipe-title span { margin-left: auto; min-width: 0; font-weight: 500; color: var(--r3d-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r3d-miles { display: flex; }
.r3d-mile { flex: 1; min-width: 0; position: relative; text-align: left; }
.r3d-mile::before { content: ""; position: absolute; left: 22px; right: -2px; top: 10px; height: 2px; background: var(--r3d-mile-line); border-radius: 1px; }
.r3d-mile.done::before { background: var(--r3d-accent); }
.r3d-mile:last-child::before { display: none; }
.r3d-mile i { position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--r3d-mile); border: 2px solid var(--r3d-mile-ring); color: var(--r3d-on-accent); font-style: normal; }
.r3d-mile.done i { background: var(--r3d-accent); border-color: var(--r3d-accent); }
.r3d-mile.part i { border-color: var(--r3d-accent); }
.r3d-mile.active i { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
.r3d-mile.active i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.r3d-mile b { display: block; margin-top: 5px; font-size: 12px; }
.r3d-mile small { display: block; font-size: 11px; color: var(--r3d-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
.r3d-item { flex: none; width: 214px; display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; background: var(--r3d-soft); text-align: left; }
.r3d-item:hover, .r3d-item.sel { background: var(--r3d-accent-soft); }
.r3d-item i { width: 38px; height: 38px; border-radius: 11px; background: var(--r3d-accent); color: var(--r3d-on-accent); display: grid; place-items: center; flex: none; }
.r3d-item b { display: block; font-size: 12.5px; }
.r3d-item small { display: block; color: var(--r3d-muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
/* the strip of step visits, a slider: a live run's spans the run so far (the open visit up to now); a
   replay's spans the whole run, what comes after the shown moment dimmed, a playhead on the moment
   and a dashed mark where a long wait for the owner was cut */
.r3d-strip-wrap { margin-top: 12px; }
.r3d-strip { position: relative; height: 18px; border-radius: 6px; background: var(--r3d-track); overflow: hidden; cursor: pointer; touch-action: none; }
.r3d-strip i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.r3d-strip i.open { animation: r3d-pulse 1.4s ease-in-out infinite; }
.r3d-strip i.todo { opacity: .28; }
.r3d-strip u { position: absolute; top: 0; bottom: 0; width: 0; margin-left: -1px; border-left: 2px dashed var(--r3d-ink); opacity: .6; text-decoration: none; }
.r3d-strip b { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--r3d-ink); box-shadow: 0 0 0 1.5px var(--r3d-tint); }
@keyframes r3d-pulse { 50% { opacity: .55; } }
/* the replay's controls: play / pause, previous / next step, the speeds, the time, back to live */
.r3d-replay { display: flex; align-items: center; gap: 3px; margin-top: 8px; min-width: 0; }
.r3d-ctl { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--r3d-ink-2); flex: none; }
.r3d-ctl:hover:not(:disabled) { background: var(--r3d-hover); }
.r3d-ctl:disabled { opacity: .35; cursor: default; }
.r3d-ctl[data-testid="run3d-play"] { background: var(--r3d-accent-soft); color: var(--r3d-accent); }
.r3d-speeds { display: flex; gap: 2px; margin-left: 6px; flex: none; }
.r3d-ctl.speed { width: auto; padding: 0 7px; font-weight: 700; font-size: 11.5px; }
.r3d-ctl.on, .r3d-ctl.on:hover:not(:disabled) { background: var(--r3d-accent); color: var(--r3d-on-accent); }
.r3d-time { flex: 1; min-width: 0; margin-left: 8px; font-size: 12px; color: var(--r3d-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.r3d-time b { color: var(--r3d-ink); }
.r3d-time em { font-style: normal; }
.r3d-replay .r3d-live { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 9px; font-weight: 700; font-size: 12px; white-space: nowrap; flex: none;
  color: var(--r3d-green); background: var(--r3d-live-bg); }
.r3d-replay .r3d-live small { font-weight: 600; font-size: 11.5px; opacity: .85; font-variant-numeric: tabular-nums; }
.r3d-replay .r3d-live.end { color: var(--r3d-accent); background: var(--r3d-accent-soft); }

.r3d-hint { left: 50%; top: 82px; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; font-size: 11.5px; color: var(--r3d-muted); white-space: nowrap; }

@media (max-width: 1280px) { .r3d-search { display: none; } }
@media (max-width: 1180px) { .r3d-item, .r3d-hint { display: none; } .r3d-kpi:nth-child(3) { display: none; } .r3d-run b, .r3d-run small { max-width: 220px; } }
@media (max-width: 920px) { .r3d-pipe, .r3d-kpis { display: none; } .r3d-list { width: 340px; } }
@media (prefers-reduced-motion: reduce) { .r3d-dot.live, .r3d-bar.open > i, .r3d-strip i.open { animation: none; } }

/* --- project-city.css --- */
/* The project city (#373): the Architecture tab's City view (views/project/project-city.js, the scene
   from generated/project-city.js). Its HUD uses the run's 3D view classes (run3d.css: .r3d and its
   two themes, .r3d-top, .r3d-card, .r3d-detail, .r3d-zoom, .r3d-tag...); this file only places them
   inside the tab instead of over the whole app, and adds what the run's view has no class for: the
   notes under the header, the legend, the hover card, the connections panel (#382,
   views/project/project-city-connections.js) and the expanded city (#381: over the whole window). */
.r3d.pc-city { position: relative; inset: auto; z-index: auto; height: calc(100vh - 318px); min-height: 460px; border-radius: 14px; border: 1px solid var(--border); margin-top: 10px; }
.r3d.pc-city.expanded { position: fixed; inset: 0; z-index: 900; height: auto; min-height: 0; border-radius: 0; border: 0; margin: 0; }
.pc-stage { position: absolute; inset: 0; }
.pc-stage canvas { display: block; }
.pc-city .r3d-top { top: 12px; left: 12px; right: 12px; }
.pc-city .r3d-brand i svg { width: 16px; height: 16px; }
.pc-city .r3d-run small { max-width: 560px; }
.pc-city .r3d-search { display: flex; max-width: 300px; }
.pc-city .r3d-chip select { width: auto; border: 0; outline: 0; background: none; font: inherit; color: var(--r3d-ink); cursor: pointer; padding: 0 2px; }
.pc-city .r3d-chip select:focus-visible, .pc-city .r3d-chip input:focus-visible { outline: 2px solid var(--r3d-accent); outline-offset: 2px; }
.pc-city .r3d-chip input[type="checkbox"] { margin: 0; accent-color: var(--r3d-accent); }
.pc-city .r3d-chip > span { color: var(--r3d-muted); font-weight: 600; }
.pc-city .r3d-close svg { width: 16px; height: 16px; }
.pc-city .r3d-zoom { top: auto; bottom: 12px; right: 12px; }
.pc-city .r3d-detail { top: 78px; right: 12px; max-height: calc(100% - 150px); }
.pc-city .r3d-hint { top: auto; bottom: 14px; }
.pc-city .r3d-message .r3d-bar { width: 240px; }

/* the notes under the header: no plan, a stale plan, the analysis' state, the plan's problems, the aggregation */
.pc-notes { top: 78px; left: 12px; width: min(460px, calc(100% - 360px)); display: grid; gap: 8px; max-height: calc(100% - 260px); overflow: auto; }
.pc-note { padding: 10px 12px; font-size: 12.5px; color: var(--r3d-ink-2); }
.pc-note b { color: var(--r3d-ink); }
.pc-note.warn { background: color-mix(in srgb, var(--r3d-amber) 14%, var(--r3d-card)); }
.pc-note p { margin: 4px 0 0; }
.pc-note p .r3d-dot { display: inline-block; vertical-align: middle; margin-right: 4px; background: var(--r3d-accent); }
.pc-note ul { margin: 6px 0 0; padding-left: 18px; max-height: 120px; overflow: auto; }
.pc-note .pc-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.pc-note .r3d-primary { margin: 0; }
.pc-estimate { font-weight: 650; color: var(--r3d-ink); }

/* the legend of "Colour by" */
.pc-legend { left: 12px; bottom: 12px; padding: 10px 14px; font-size: 12px; max-width: 320px; max-height: calc(50% - 24px); overflow: auto; }
.pc-legend b { display: block; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--r3d-muted); margin-bottom: 6px; }
.pc-legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pc-legend li { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-legend li small { color: var(--r3d-muted); margin-left: auto; padding-left: 10px; font-size: 11px; }
.pc-legend li .r3d-dot { border-radius: 3px; }

/* the hover card: next to the pointer, never in its way */
.r3d-hud > .pc-hover { pointer-events: none; width: 260px; padding: 10px 12px; z-index: 3; }
.pc-hover .r3d-rows { margin-top: 8px; }
.pc-detail-close { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--r3d-ink-2); }
.pc-detail-close:hover { background: var(--r3d-hover); }
.pc-city .r3d-d-head { padding-right: 26px; }
.pc-city .r3d-d-head h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-city .r3d-d-head p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* #382: the connections panel (the most connected files, a click pins the arcs), right of the city
   under the pinned card's place; the pinned card moves below it */
.pc-city .pcc { position: absolute; top: 78px; right: 12px; width: 300px; max-height: 42%; overflow: auto; padding: 10px 12px; font-size: 12.5px; color: var(--r3d-ink-2); z-index: 2; display: grid; gap: 6px; align-content: start; }
.pc-city .pcc.hidden { display: none; }
.pc-city .pcc ~ .r3d-detail { top: calc(42% + 92px); max-height: calc(58% - 160px); }
.pcc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pcc-head b { color: var(--r3d-ink); }
.pcc-head .link-btn { font-size: 11.5px; }
.pcc-search { max-width: none; height: 30px; }
.pcc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pcc-file { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 9px; text-align: left; color: inherit; }
.pcc-file:hover { background: var(--r3d-hover); }
.pcc-file.on { background: var(--r3d-accent-soft); }
.pcc-name { display: grid; min-width: 0; flex: 1; }
.pcc-name b { color: var(--r3d-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcc-name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--r3d-muted); font-size: 11px; }
.pcc-counts { display: flex; gap: 6px; flex: none; font-variant-numeric: tabular-nums; }
.pcc-counts em, .pcc-hint em { font-style: normal; font-weight: 700; }
.pcc em.out { color: var(--r3d-accent); }
.pcc em.in { color: var(--r3d-amber); }
.pcc-empty, .pcc-hint { margin: 0; font-size: 11.5px; }

@media (max-width: 1180px) { .pc-city .r3d-search { max-width: 180px; } .pc-notes { width: min(420px, calc(100% - 24px)); } .pc-city .pcc { width: 240px; } }

/* --- views/project/project-city-agents.css --- */
/* The agents at work on the project city (#374, project-city-agents.js): a card over the city, in the
   run's 3D view classes (run3d.css .r3d-card, .r3d-dot), next to the camera buttons. */
.pc-city .pca { position: absolute; right: 64px; bottom: 12px; width: min(340px, calc(100% - 90px)); max-height: 45%; overflow: auto; padding: 10px 12px; font-size: 12.5px; color: var(--r3d-ink-2); z-index: 2; }
.pca-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.pca-head b { color: var(--r3d-ink); }
.pca-empty { margin: 0; }
.pca-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pca-agent { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 9px; text-align: left; color: inherit; background: none; border: 0; cursor: pointer; font: inherit; }
.pca-agent:hover { background: var(--r3d-hover); }
.pca-agent:focus-visible { outline: 2px solid var(--r3d-accent); outline-offset: 1px; }
.pca-robot { width: 30px; height: 30px; flex: none; }
.pca-robot svg { width: 100%; height: 100%; }
.pca-who { display: grid; min-width: 0; flex: 1; }
.pca-who b { color: var(--r3d-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pca-who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pca-collision { margin-top: 8px; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--r3d-red) 14%, var(--r3d-card)); display: grid; gap: 2px; }
.pca-collision b { color: var(--r3d-red); }
.pca-collision code, .pca-new code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pca-collision .pcm-link { margin: 4px 0 0; }
.pca-new { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.pca-replay { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pca-replay input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--r3d-accent); }
.pca-replay select { font: inherit; }

/* --- views/project/project-city-impact.css --- */
/* An issue's impact preview on the project city (#375, project-city-impact.js): its card, top centre
   over the city, and its rows in the city's legend, with the run's 3D view classes (run3d.css
   .r3d-card, .r3d-dot). */
.pc-city .pci { position: absolute; top: 78px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100% - 24px)); max-height: 45%; overflow: auto; padding: 10px 12px; font-size: 12px; color: var(--r3d-ink-2); z-index: 2; }
.pc-city .pci.hidden { display: none; }
.pci-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.pci-head > b { font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--r3d-muted); }
.pci-header { display: grid; gap: 6px; }
.pci-title { display: flex; gap: 6px; min-width: 0; font-size: 13px; color: var(--r3d-ink); }
.pci-title strong { font-family: var(--mono); flex: none; }
.pci-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pci-total { margin: 0; }
.pci-counts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.pci-counts li { display: flex; gap: 6px; padding: 2px 8px; border-radius: 999px; background: var(--r3d-hover); max-width: 100%; }
.pci-counts li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pci-new, .pci-conflicts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pci-new li, .pci-conflicts li { display: flex; gap: 6px; min-width: 0; }
.pci-new code, .pci-conflicts code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pci-cmp { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--r3d-card-line); }
.pci-cmp span { display: flex; align-items: center; gap: 6px; }
.pci-rate { color: var(--r3d-ink); }
.pci-conflicts { display: grid; gap: 4px; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--r3d-red) 14%, var(--r3d-card)); }
.pci-conflicts > b { color: var(--r3d-red); }
.pci-legend { margin-top: 8px; }

/* --- views/project/project-city-release.css --- */
/* A release on the project city (#376, project-city-release.js): its card takes the impact card's
   place and look (project-city-impact.css .pci), with the two-tag picker, the status counts and the
   issue filter (run3d.css .r3d-chip, .r3d-dot, .r3d-primary). */
.pcr-picker, .pcr-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pcr-picker select, .pcr-actions select { max-width: 120px; font-family: var(--mono); }
.pcr-counts { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; font-size: 13px; color: var(--r3d-ink); }
.pcr-count { display: inline-flex; align-items: center; gap: 6px; }

/* ===== the POC's own rules (parts/poc.css): the page, the mock screens, what #440/#441/#430/#428/#438/#439 change ===== */
/* ---------- the page and the mock screen the map is called from (the app's shell: style.css tokens) ---------- */
:root { --bg: #0e1014; --panel: #151820; --panel-2: #1b1f29; --border: #262b37; --text: #e6e8ee; --muted: #8a91a3; --accent: #7c9cff; --green: #4ade80; --yellow: #facc15; --red: #f87171; --mono: "Cascadia Code", Consolas, "SF Mono", monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; overflow: clip; }
[hidden] { display: none !important; }
button { font: inherit; }
.app { position: fixed; inset: 0; display: flex; }
.sidebar { width: 200px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-menu { padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-weight: 600; cursor: pointer; text-align: left; }
.nav-item svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-item.active { background: rgba(124,156,255,.12); color: var(--text); }
.nav-item.active svg { color: var(--accent); }
.nav-group-title { padding: 10px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 20px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
.topbar .brand { font-weight: 700; font-size: 15px; }
.topbar .brand span { color: var(--accent); }
.topbar .sel { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.topbar .sel b { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-weight: 600; width: 200px; }
.topbar .right { margin-left: auto; display: flex; gap: 8px; }
.topbar .right i { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); font-style: normal; }
.content { flex: 1; min-height: 0; overflow: auto; padding: 20px 24px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
.page-head h1 { font-size: 22px; margin: 0 0 4px; }
.page-head p { margin: 0; color: var(--muted); }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { background: none; border: 0; color: var(--muted); padding: 10px 16px; font-weight: 600; border-bottom: 2px solid transparent; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border); }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; border: 0; background: none; color: var(--muted); font-weight: 600; }
.seg button.on { background: rgba(124,156,255,.16); color: var(--accent); }
.arch-row { display: flex; align-items: center; gap: 12px; }
.btn { height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pill { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
.pill-running { background: rgba(124,156,255,.15); color: var(--accent); border-color: rgba(124,156,255,.35); }
.pill-success { background: rgba(74,222,128,.12); color: var(--green); border-color: rgba(74,222,128,.3); }
.pill-idle { background: #222733; color: var(--muted); }
/* the Roadmap's stages (backlog.css .rm-stage / .rm-item) */
.rm-list { display: grid; gap: 10px; max-width: 980px; }
.rm-stage { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--panel); display: grid; gap: 6px; }
.rm-stage.current { border-color: var(--accent); }
.rm-stage.finished { opacity: .7; }
.rm-stage.disabled { border-style: dashed; opacity: .7; }
.rm-stage-head { display: flex; align-items: center; gap: 8px; }
.rm-stage-head b { flex: 1; }
.rm-items { display: grid; gap: 6px; }
.rm-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.rm-item-head { display: flex; align-items: center; gap: 8px; }
.rm-item-head b { flex: 1; }
.rm-item-head code { font-family: var(--mono); color: var(--accent); }
.rm-item .rm-actions { display: flex; gap: 6px; }
/* the Releases list and the Run screen */
.rel-list { display: grid; gap: 10px; max-width: 760px; }
.rel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; align-items: center; gap: 14px; }
.rel b { font-family: var(--mono); font-size: 14px; }
.rel .grow { flex: 1; }
.run-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.run-steps { display: flex; gap: 8px; margin-bottom: 18px; }
.run-step { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.run-step b { display: block; }
.run-step.done { border-color: rgba(74,222,128,.4); }
.run-step.live { border-color: var(--accent); }
.run-log { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 12px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); max-width: 980px; }

/* ---------- the city inside the Architecture tab (as project-city.css), or as the modal of #430 ---------- */
.pc-backdrop { position: fixed; inset: 0; z-index: 890; background: rgba(6, 8, 12, .62); }
.r3d.pc-city.pc-modal { position: fixed; inset: 12px; z-index: 900; height: auto; min-height: 0; margin: 0; border-radius: 14px; border: 1px solid var(--r3d-card-line); box-shadow: 0 24px 64px rgba(0, 0, 0, .55); }
.r3d.pc-city.pc-modal.edge { inset: 0; border-radius: 0; border: 0; }
.pc-city .boot { position: absolute; inset: 0; }
.pc-city .tags { position: absolute; inset: 0; pointer-events: none; overflow: clip; }
/* the POC engine's tags (its .tag) look like the app's floating tags (.r3d-tag) */
.tag { position: absolute; left: 0; top: 0; white-space: nowrap; display: flex; align-items: center; gap: 6px; transform: translate(-50%, -100%); padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--r3d-tag); box-shadow: var(--r3d-tag-shadow); font-size: 11.5px; font-weight: 650; will-change: transform; pointer-events: none; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 9px; height: 9px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--r3d-grey)); flex: none; }
.tag span { font-weight: 500; color: var(--r3d-muted); }
.tag.port { background: var(--r3d-accent); color: var(--r3d-on-accent); }
.tag.port span { color: inherit; opacity: .8; }
.tag.port .dot { background: var(--r3d-on-accent); opacity: .75; }
.tag.mark { font-weight: 600; }
.tag.mark.ghost { opacity: .8; }

/* the v2 city's own: the vignette (inside the box), the score tags, the Glow / Showroom buttons */
.pc-city .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, .42) 100%); }
.tag.score { padding: 2px 7px; font-size: 11px; font-weight: 750; background: var(--c, var(--r3d-grey)); color: #0b0d12; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); gap: 0; }
.tag.score .dot { display: none; }
.score-badge { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 999px; background: var(--c, var(--r3d-grey)); color: #0b0d12; font-weight: 750; }
.pc-city .r3d-close.on { background: var(--r3d-accent-soft); color: var(--r3d-accent); }
.pc-city .r3d-close svg { width: 16px; height: 16px; }

/* ---------- the header: the mode's title, its controls, Close (#440) ---------- */
.pc-city .r3d-brand small { display: none; }
.pc-city .r3d-run b { font-size: 14px; }
.pc-city .r3d-run small { max-width: 760px; }
.pc-city .r3d-search { position: relative; }
.pc-city .results { position: absolute; left: 0; right: 0; top: 40px; padding: 6px; display: grid; gap: 2px; max-height: 320px; overflow: auto; z-index: 5; }
.pc-city .results button { display: block; width: 100%; text-align: left; padding: 6px 9px; border-radius: 11px; font-size: 12px; }
.pc-city .results button:hover, .pc-city .results button.on { background: var(--r3d-soft); }
.pc-city .results button small { display: block; color: var(--r3d-muted); font-size: 11.5px; }
.pc-city .results .none { padding: 8px 9px; color: var(--r3d-muted); font-size: 12px; }
.pc-city .r3d-chip.pc-live.on { color: var(--r3d-green); background: var(--r3d-live-bg); }
.pc-city .link-btn { background: none; border: 0; padding: 0; color: var(--r3d-accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.pc-city .link-btn:hover { text-decoration: underline; }
.pc-city .r3d-close.pc-close svg { width: 16px; height: 16px; }

/* ---------- the panels: one column on the left (#428), the mode's; a chevron on every one (#441) ---------- */
.pc-left { position: absolute; top: 78px; left: 12px; width: min(420px, calc(100% - 360px)); display: grid; gap: 8px; align-content: start; max-height: calc(100% - 150px); overflow: auto; scrollbar-width: thin; z-index: 2; }
.pc-left > * { position: static !important; transform: none !important; width: auto !important; max-height: none !important; right: auto !important; bottom: auto !important; }
.pc-panel-head { display: flex; align-items: center; gap: 8px; min-height: 22px; }
.pc-panel-head > b { color: var(--r3d-ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-panel-head > small { color: var(--r3d-muted); font-size: 11.5px; white-space: nowrap; }
.pc-panel-head .r3d-grow { flex: 1; }
.pc-chev, .pc-x { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--r3d-ink-2); background: none; border: 0; padding: 0; cursor: pointer; flex: none; margin-right: -6px; }
.pc-chev:hover, .pc-x:hover { background: var(--r3d-hover); }
.pc-chev svg, .pc-x svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
.pc-chev svg { transform: rotate(180deg); } /* expanded: it folds up */
.pc-panel.min .pc-chev svg { transform: none; } /* minimized: it opens down */
.pc-panel-body { margin-top: 6px; }
.pc-panel.min .pc-panel-body { display: none; }
/* the cards keep their app classes (.pc-note, .pci, .pca, .pcc) and their inner rules */
.pc-left .pc-note { padding: 10px 12px; }
.pc-left .pci, .pc-left .pca { padding: 10px 12px; font-size: 12.5px; }
.pci .pci-head, .pca .pca-head { margin: 0; }
.pc-note .pc-actions { margin-top: 8px; }
.pci-counts li strong { color: var(--r3d-ink); }
.pci-cmp { margin-top: 6px; }
.pci-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.pci-items li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pci-items li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pci-items li strong { color: var(--r3d-ink); flex: none; }
.pcr-count i.ramp { display: inline-block; width: 26px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f6d58e, #f2a541, #e8743b, #d9480f); }
.pcr-count i.ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--r3d-ink); box-sizing: border-box; }
.pcr-base { margin: 2px 0 0; }
.pcr-base summary { cursor: pointer; }
.pcr-base ul { margin: 4px 0 0; padding-left: 18px; }
.pcr-base code { font-family: var(--mono); }
.pc-mini { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.pc-mini li { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pc-mini li code { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pc-mini li time { color: var(--r3d-muted); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; width: 36px; }
.pc-mini li.now code { color: var(--r3d-ink); font-weight: 600; }
.pc-mini li.todo { opacity: .55; }
.pca-replay .btn { height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--r3d-line); background: var(--r3d-soft); color: var(--r3d-ink); font-weight: 600; }
.pca-replay select { background: var(--r3d-soft); color: var(--r3d-ink); border: 1px solid var(--r3d-line); border-radius: 8px; height: 26px; }
.pca-agent .robot { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
.pca-agent .robot svg { width: 26px; height: 26px; }
.pca-who code { font-family: var(--mono); }
.pca-collision code { font-family: var(--mono); }
.pca-new code { font-family: var(--mono); background: var(--r3d-soft); padding: 1px 6px; border-radius: 6px; }
/* "Most connected" (#382) stays on the right in Explore; without it, the pinned card takes its place */
.pc-city .pcc { padding: 10px 12px; }
.pc-city .pcc .pc-panel-head { margin-bottom: 2px; }
.pc-city .pcc.min { max-height: none; }
.pc-city .pcc[hidden] ~ .r3d-detail { top: 78px; max-height: calc(100% - 150px); }
.pcc-file { background: none; border: 0; font: inherit; cursor: pointer; }
.pcc-name small { font-family: var(--mono); }
/* the pinned file card and the hover card (the POC engine writes .d-head/.rows/.note/.pill/.deps into them) */
.pc-city .r3d-detail { padding: 14px; }
.d-head { display: flex; gap: 10px; align-items: flex-start; }
.d-head .kind { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--r3d-accent); }
.d-head h3 { margin: 1px 0 0; font-size: 14px; letter-spacing: -.2px; word-break: break-all; }
.d-head p { margin: 2px 0 0; color: var(--r3d-muted); font-size: 12px; }
.d-head .x { margin-left: auto; width: 28px; height: 28px; border-radius: 9px; color: var(--r3d-ink-2); display: grid; place-items: center; flex: none; background: none; border: 0; cursor: pointer; }
.d-head .x:hover { background: var(--r3d-hover); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--r3d-tint)); white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.rows { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; }
.rows dt { color: var(--r3d-muted); }
.rows dd { margin: 0; text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin-top: 12px; padding: 9px 11px; border-radius: 11px; background: var(--r3d-soft); font-size: 12px; color: var(--r3d-ink-2); }
.note.gold { background: var(--r3d-wait-bg); color: var(--r3d-note-warn); }
.note.port { background: var(--r3d-accent-soft); color: var(--r3d-ink); }
.primary { margin-top: 12px; width: 100%; height: 36px; border-radius: 11px; background: var(--r3d-accent); color: var(--r3d-on-accent); font-weight: 700; border: 0; cursor: pointer; }
.deps { margin-top: 10px; font-size: 11.5px; color: var(--r3d-ink-2); display: flex; gap: 10px; }
.deps b { color: var(--r3d-accent); }
.deps b.in { color: var(--r3d-amber); }
.pc-hover .hint { margin-top: 9px; font-size: 11px; color: var(--r3d-muted); }
.pc-hover .rows { margin-top: 8px; }
.mono { font-family: var(--mono); }

/* ---------- the legend: the mode's only (#440); it closes, a small button brings it back (#441) ---------- */
.pc-city .pc-legend { max-width: 340px; min-width: 220px; padding: 10px 14px 12px; }
.pc-legend .pc-panel-head { margin-bottom: 4px; }
.pc-legend .pc-panel-head > b { margin: 0; }
.pc-legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pc-legend li { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.pc-legend li > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-legend li small { color: var(--r3d-muted); margin-left: auto; padding-left: 10px; font-size: 11px; flex: none; }
.pc-legend .r3d-dot { border-radius: 3px; }
.pc-legend .sw-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; white-space: nowrap; overflow: hidden; }
.pc-legend .sw-row small { color: var(--r3d-muted); margin-left: auto; padding-left: 10px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.pc-legend .sw { width: 8px; height: 8px; border-radius: 3px; background: var(--c); flex: none; }
.pc-legend h4, .pc-legend .how { display: none; }
.pc-legend .ramp { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--ramp-0), var(--ramp-1), var(--ramp-2), var(--ramp-3)); margin: 6px 0 4px; }
.pc-legend .ramp-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--r3d-muted); }
.pc-legend .ramp4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 4px 0 2px; }
.pc-legend .ramp4 i { height: 10px; border-radius: 3px; display: block; }
.pc-legend .ramp4 small { display: block; text-align: center; font-size: 10.5px; color: var(--r3d-muted); margin-top: 2px; }
.pc-legend .ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--r3d-ink); box-sizing: border-box; flex: none; }
.pc-legend .ghost { width: 8px; height: 8px; border-radius: 50%; border: 1.5px dashed var(--r3d-muted); box-sizing: border-box; flex: none; }
.pc-legend .pin { width: 8px; height: 8px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); flex: none; }
.pc-legend .r3d-dot.live { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent); }
.pc-legend-btn { left: 12px; bottom: 12px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: var(--r3d-ink-2); border: 1px solid var(--r3d-card-line); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.pc-legend-btn:hover { color: var(--r3d-ink); }
.pc-legend-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.pc-city .r3d-zoom button { font-size: 16px; }

/* ---------- the demo bar (not in the product) ---------- */
.poc-bar { position: fixed; left: 0; right: 0; top: 0; height: 34px; z-index: 1000; display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 2px; padding: 0 12px; border-radius: 0; border: 0 !important; border-bottom: 1px dashed var(--accent) !important; box-shadow: none !important; font-size: 12px; color: var(--text); background: var(--panel); border: 1px dashed var(--accent); box-shadow: 0 12px 32px rgba(0,0,0,.45); max-width: calc(100% - 24px); }
.poc-bar > b { color: var(--accent); font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; margin-right: 6px; white-space: nowrap; flex: none; }
.poc-bar button { height: 26px; padding: 0 8px; white-space: nowrap; flex: none; border-radius: 999px; border: 0; background: none; color: var(--text); font-weight: 600; cursor: pointer; }
.poc-bar button.on { background: var(--accent); color: #0b0d12; }
.poc-bar button:hover:not(.on) { background: var(--panel-2); }
.poc-bar #bar-modes { display: flex; gap: 2px; flex: none; }
.poc-bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.poc-bar .poc-from { color: var(--muted); max-width: 330px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.poc-bar .poc-from b { color: var(--text); font-weight: 600; }
.poc-bar label { display: flex; align-items: center; gap: 4px; padding: 0 5px; cursor: pointer; white-space: nowrap; flex: none; }
/* with the bar, the product's screen starts under it */
body.with-bar .app { top: 34px; }
body.with-bar .r3d.pc-city.pc-modal { top: 46px; }
body.with-bar .r3d.pc-city.pc-modal.edge { top: 34px; }
@media (max-width: 1500px) { .poc-bar .poc-from { max-width: 240px; } }
@media (max-width: 1300px) { .poc-bar .poc-from { display: none; } }
.poc-bar input { margin: 0; accent-color: var(--accent); }
@media (max-width: 1180px) { .pc-left { width: min(380px, calc(100% - 24px)); } }

/** Squarified treemap: lays `items` (weight in `key`) inside `rect`, filling it; sets item.rect. */
function squarify(items, rect, key = 'w') {
  const total = items.reduce((s, it) => s + it[key], 0);
  if (!total || rect.w <= 0 || rect.h <= 0) { for (const it of items) it.rect = { x: rect.x, y: rect.y, w: 0, h: 0 }; return; }

/** Strip treemap, order kept: strips from the south edge of `rect` northward, items left to right. Returns the strips. */

/** The city: zones as strips in the plan's order, districts as a treemap inside each, buildings inside each district. */
function layoutCity(showTests) {

    const dRect = vertical
      ? { x: zg.block.x + STREET / 2, y: zg.block.y + STREET / 2, w: zg.block.w - STREET - ZONE_LABEL_H, h: zg.block.h - STREET }
      : { x: zg.block.x + STREET / 2, y: zg.block.y + STREET / 2, w: zg.block.w - STREET, h: zg.block.h - STREET - ZONE_LABEL_H };

function renderMenu(active) {

// ---------- render ----------
const cityEl = $('city');
const mode = () => MODES[state.mode];
const frameOf = () => state.frame || mode().frame;

function place() {
  const modal = frameOf() === 'modal';
  const screen = mode().screen;
  renderMenu(screen);
  $('content').innerHTML = screenHtml(modal ? screen : 'project');
  cityEl.classList.toggle('pc-modal', modal);
  cityEl.classList.toggle('edge', modal && state.edge);
  cityEl.classList.remove('expanded');
  if (modal) { document.body.insertBefore(cityEl, $('bar')); $('backdrop').hidden = !state.open; cityEl.hidden = !state.open; }
  else { $('slot').appendChild(cityEl); $('backdrop').hidden = true; cityEl.hidden = false; }
  $('open-projects').hidden = !modal;
  $('close').innerHTML = modal ? ICON.close : ICON.expand;
  $('close').title = modal ? 'Close: back to the screen the map was opened from (Esc)' : 'Expand the city over the whole window';
  $('close').setAttribute('aria-label', modal ? 'Close' : 'Expand to the whole window');
  city.resize();
}

function renderHeader() {
  const m = mode();
  $('title').innerHTML = m.title();
  $('summary').textContent = m.subtitle();
  $('summary').title = $('summary').textContent;
  const show = new Set(m.header);
  $('search-box').hidden = !show.has('search');
  $('colour-chip').hidden = !show.has('colour');
  $('tests-chip').hidden = !show.has('tests');
  $('live-chip').hidden = !show.has('live');
  $('showroom').hidden = state.mode !== 'explore';
  renderLife();
  $('live').checked = state.mode === 'live';
  $('live-chip').classList.toggle('on', state.mode === 'live');
}

function renderPanels() {
  const m = mode();
  $('left').innerHTML = m.panels().join('');
  const pcc = $('pcc');
  pcc.hidden = !m.right;
  pcc.innerHTML = m.right ? m.right() : '';
  const mins = state.minimized.get(state.mode) || new Set();
  for (const p of document.querySelectorAll('.pc-panel')) {
    const id = p.dataset.panel || p.id;
    const min = state.min || mins.has(id);
    p.classList.toggle('min', min);
    p.querySelector('.pc-chev')?.setAttribute('aria-expanded', String(!min));
  }
}

// the street life: on in Explore and Live, off in the analysis modes (the owner's ask), unless he switched it
const LIFE_DEFAULT = { explore: true, live: true, replay: false, issue: false, stage: false, release: false };
function lifeOf() { const forced = params.get('life'); if (forced === '0' || forced === '1') return forced === '1'; return state.life.has(state.mode) ? state.life.get(state.mode) : LIFE_DEFAULT[state.mode]; }
function renderLife() {
  const on = lifeOf();
  if (city.life !== on) city.setLife(on);
  $('life').classList.toggle('on', on);
  $('life').setAttribute('aria-pressed', String(on));
}
const COLOUR_LABEL = { quadrant: 'Quadrant', zone: 'Zone', churn: 'Churn' };
function renderLegend() {
  const m = mode();
  const own = !!m.legend;
  $('legend-body').hidden = own;
  $('legend-mode').hidden = !own;
  $('legend-mode').innerHTML = own ? m.legend() : '';
  $('legend-title').textContent = own ? (typeof m.title === 'function' ? m.title().replace(/<[^>]+>/g, '') : '') : `Colour by ${COLOUR_LABEL[$('mode').value] || ''}`;
  $('legend').hidden = !state.legend;
  $('legend-btn').hidden = state.legend;
}

function renderScene() {
  clearScene();
  mode().scene();
}

function render() {
  place();
  renderHeader();
  renderPanels();
  renderLegend();
  renderScene();
  renderBar();
}

  live: ['Live', 'Where are the agents working now?', 'the Live toggle in Explore, or a run\x27s screen'],
  replay: ['Run replay', 'What did this run touch, in order?', 'Run › Replay on the map'],
  issue: ['Issue impact', 'Where will this issue change the code?', 'a Backlog card or a roadmap item › Show on the map'],
  stage: ['Stage', 'Do the stage\x27s items touch the same files?', 'Roadmap › Show the stage on the map'],
  release: ['Release', 'What changed between two releases?', 'Releases (or a release run) › Show on the map'],
};
function renderBar() {
  $('bar-modes').innerHTML = MODE_IDS.map((id) => `<button type="button" class="${id === state.mode ? 'on' : ''}" data-mode="${id}" title="${esc(USE_CASES[id][1])} · opened from ${esc(USE_CASES[id][2])}">${USE_CASES[id][0]}</button>`).join('');
  const u = USE_CASES[state.mode];
  $('bar-from').innerHTML = `<b>${esc(u[1])}</b> · opened from ${esc(u[2])}${frameOf() === 'modal' ? ' · Close goes back there' : ''}`;
  $('bar-from').title = $('bar-from').textContent;
  $('bar-frame').checked = frameOf() === 'modal';
  $('bar-min').checked = state.min;
  $('bar-legend').checked = !state.legend;
  $('bar-edge').checked = state.edge;
  $('bar-after').checked = state.after;
  $('bar-after-wrap').hidden = state.mode !== 'issue';
}

function setMode(id, { frame = null } = {}) {
  state.mode = id;
  state.frame = frame;
  state.open = true;
  render();
}

// ---------- events ----------
$('bar').addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
$('bar-frame').addEventListener('change', (e) => { state.frame = e.target.checked ? 'modal' : 'tab'; state.open = true; render(); });
$('bar-min').addEventListener('change', (e) => { state.min = e.target.checked; renderPanels(); });
$('bar-legend').addEventListener('change', (e) => { state.legend = !e.target.checked; renderLegend(); });
$('bar-edge').addEventListener('change', (e) => { state.edge = e.target.checked; place(); });
$('bar-after').addEventListener('change', (e) => { state.after = e.target.checked; renderPanels(); renderLegend(); renderScene(); });
$('live').addEventListener('change', (e) => setMode(e.target.checked ? 'live' : 'explore', { frame: frameOf() }));
$('legend-close').addEventListener('click', () => { state.legend = false; renderLegend(); });
$('legend-btn').addEventListener('click', () => { state.legend = true; renderLegend(); });
$('life').addEventListener('click', () => { state.life.set(state.mode, !lifeOf()); params.delete('life'); renderLife(); });
$('zoom-in').addEventListener('click', () => city.zoom(0.72));
$('zoom-out').addEventListener('click', () => city.zoom(1.38));
$('mode').addEventListener('change', () => renderLegend());
$('open-projects').addEventListener('click', () => setMode('explore'));
$('close').addEventListener('click', () => {
  if (frameOf() === 'modal') { state.open = false; cityEl.hidden = true; $('backdrop').hidden = true; return; }
  cityEl.classList.toggle('expanded');
  $('close').innerHTML = cityEl.classList.contains('expanded') ? ICON.close : ICON.expand;
  city.resize();
});
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('results').matches(':not([hidden])')) $('close').click(); });
// the screen behind: "Show on the map" opens its mode again
$('content').addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b) setMode(b.dataset.open); });
// the chevrons (#441): remembered per mode
document.addEventListener('click', (e) => {
  const chev = e.target.closest('.pc-chev');
  if (!chev) return;
  const p = chev.closest('.pc-panel');
  const id = p.dataset.panel || p.id;
  const mins = state.minimized.get(state.mode) || state.minimized.set(state.mode, new Set()).get(state.mode);
  const min = !p.classList.contains('min');
  p.classList.toggle('min', min);
  chev.setAttribute('aria-expanded', String(!min));
  if (min) mins.add(id); else { mins.delete(id); state.min = false; $('bar-min').checked = false; }
});
// Most connected: a click flies to the file and pins its card
$('pcc').addEventListener('click', (e) => { const b = e.target.closest('[data-fly]'); if (b) { city.flyToBuilding(b.dataset.fly); city.pin(b.dataset.fly); } });
// the replay's controls
$('left').addEventListener('click', (e) => {
  if (e.target.closest('[data-replay-play]')) { REPLAY.playing = !REPLAY.playing; renderPanels(); }
});
$('left').addEventListener('input', (e) => {
  if (e.target.matches('[data-replay-seek]')) { REPLAY.index = +e.target.value; renderPanels(); renderScene(); }
});
$('left').addEventListener('change', (e) => { if (e.target.matches('[data-replay-speed]')) REPLAY.speed = +e.target.value; });
setInterval(() => { if (state.mode === 'replay' && REPLAY.playing) { REPLAY.index = (REPLAY.index + 1) % REPLAY.touches.length; renderPanels(); renderScene(); } }, 1200);
// a rebuild of the city (theme, tests) drops the tags: the mode draws its scene again
$('theme').addEventListener('click', () => renderScene());
$('tests').addEventListener('change', () => renderScene());

// ---------- start ----------
$('summary').dataset.facts = $('summary').textContent.replace(/\s+/g, ' ').trim();
const wantTheme = params.get('theme');
if (wantTheme && wantTheme !== city.theme) city.setTheme(wantTheme);
render();
window.cityModes = { state, setMode, render, MODES, RELEASE, ISSUE, STAGE, LIVE, REPLAY };

</script>
</body>
</html>
