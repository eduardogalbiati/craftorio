<!doctype html>
<!--
  A chapter page: the template site/24x7/build.js fills once per published chapter and language.
  {{title}} {{teaser}} {{n}} {{date}} {{dateText}} {{body}} (the chapter's Markdown, rendered) {{next}}
  (the next chapter's card) {{self}} {{alt}} (the same chapter in {{altLang}}) {{home}}, and the
  language's strings as {{s_<key>}} (build.js STRINGS).
-->
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · {{s_home}}</title>
  <meta name="description" content="{{teaser}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{teaser}}">
  <meta property="og:type" content="article">
  <meta property="article:published_time" content="{{date}}">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M21 19.5A8 8 0 1 1 12.5 9a6.2 6.2 0 0 0 8.5 10.5z' fill='%23f5b041'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{base}}/style.css">
  <link rel="alternate" hreflang="{{lang}}" href="{{self}}">
  <link rel="alternate" hreflang="{{altLang}}" href="{{alt}}">
</head>
<body class="post-page">
  <header class="top">
    <div class="wrap top-in">
      <a class="mark" href="{{home}}"><span class="moon" aria-hidden="true"></span>{{s_home}}</a>
      <nav aria-label="{{s_all}}"><a href="{{home}}#chapters-list">{{s_all}}</a></nav>
      <div class="top-actions"><a class="lang" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}" title="{{s_other}}">{{s_otherShort}}</a><a class="btn btn-sm" href="#newsletter">{{s_subscribe}}</a></div>
    </div>
  </header>

  <main>
    <header class="post-head">
      <div class="wrap narrow">
        <p class="kicker">{{s_chapter}} {{n}} · <time datetime="{{date}}">{{dateText}}</time></p>
        <h1>{{title}}</h1>
        <p class="lead">{{teaser}}</p>
      </div>
    </header>

    <article class="prose wrap narrow">
{{body}}
    </article>

    <div class="wrap narrow post-foot">
      {{next}}
      <a class="back" href="{{home}}">← {{s_all}}</a>
    </div>

    <section class="section section-dark" id="newsletter">
      <div class="wrap news">
        <div class="news-copy">
          <p class="kicker">Newsletter</p>
          <h2>{{s_subscribeTitle}}.</h2>
          <p class="body">{{s_subscribeText}}</p>
        </div>
        <form class="form" id="news-form" novalidate>
          <label class="field"><span>{{s_name}} <em>{{s_optional}}</em></span>
            <input name="name" type="text" autocomplete="name" placeholder="{{s_namePh}}" maxlength="120">
            <small class="err" data-for="name"></small>
          </label>
          <label class="field"><span>{{s_email}}</span>
            <input name="email" type="email" autocomplete="email" inputmode="email" placeholder="{{s_emailPh}}" required maxlength="254">
            <small class="err" data-for="email"></small>
          </label>
          <!-- honeypot: people never see it, bots fill it -->
          <div class="hp" aria-hidden="true"><label>Company <input name="company" type="text" tabindex="-1" autocomplete="off"></label></div>
          <label class="consent"><input type="checkbox" name="consent" required><span>{{s_consent}}</span></label>
          <small class="err" data-for="consent"></small>
          <button class="btn btn-block" type="submit" id="news-submit"><span class="btn-label">{{s_subscribe}}</span></button>
          <p class="form-msg" id="news-msg" role="status" aria-live="polite"></p>
        </form>
        <div class="done" id="news-done" hidden>
          <div class="done-icon" aria-hidden="true">✓</div>
          <h3>{{s_done}}</h3>
          <p>{{s_doneText}}</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <span>{{s_footer}}</span>
      <a href="{{full}}">{{s_seeAll}} →</a>
    </div>
  </footer>

  <script src="{{base}}/main.js"></script>
</body>
</html>
