<title>Run 3D view (proof of concept)</title>
<style>body.cover .tag { pointer-events: none; } body.cover .boot { color: #7A859C; }</style>
<script>if (new URLSearchParams(location.search).has('cover')) document.documentElement.classList.add('cover-mode');</script>
<!--
  Proof of concept: a workflow run as a 3D floor (React + React Three Fiber), one file, no build step.
  - Every step is a desk with its agent's robot; a human_approval step is a gate; the work item is a
    cart that travels the route from step to step; the supervisor waits on a podium until a step fails.
  - The run is SIMULATED in this page (see `sim`): no engine, no real model call.
  - The robots come from src/renderer/robots.js, inlined below unchanged: the 3D robots are built from
    the same boxes and colours (VARIANTS), their faces, emblems and balloons are the same SVG art
    (STATES, emblem) used as textures, and the cards show Robots.svg() / Robots.gate() as they are.
  - React, three and React Three Fiber load from a CDN (needs internet). Open the file in a browser.
-->
<style>
  :root {
    --bg: #E8EDF7; --card: rgba(255, 255, 255, .88); --ink: #1B2233; --muted: #7A859C; --line: #E6EAF3;
    --accent: #4C6FFF; --accent-soft: #EAF0FF; --green: #1FAE6E; --amber: #E39A12; --red: #EA4E4B; --grey: #A7B0C2;
    --radius: 18px; --shadow: 0 12px 32px rgba(40, 60, 120, .13), 0 1px 2px rgba(40, 60, 120, .08);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font: 13px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; }
  .stage { position: fixed; inset: 0; }
  .stage canvas { display: block; }
  .tags, .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; position: absolute; }
  .card { background: var(--card); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .95); border-radius: var(--radius); box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  .mono { font-family: "Cascadia Code", Consolas, monospace; }

  /* floating tags over the scene */
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 8px; border-radius: 999px; background: #fff; box-shadow: 0 4px 14px rgba(40, 60, 120, .18); font-size: 11.5px; font-weight: 650; will-change: transform; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 9px; height: 9px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .tag span { font-weight: 500; color: var(--muted); }
  .tag.sel { background: var(--accent); color: #fff; }
  .tag.sel span { color: rgba(255, 255, 255, .8); }
  .tag.dim { opacity: .72; font-weight: 550; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--grey)); flex: none; }
  .dot.live { animation: live 1.2s ease-in-out infinite; }
  @keyframes live { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent); } }

  /* top bar */
  .top { top: 14px; left: 14px; right: 14px; height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 16px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 15px; letter-spacing: -.2px; }
  .brand i { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; }
  .search { flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 11px; background: #F3F5FA; color: var(--muted); }
  .search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; color: var(--ink); min-width: 0; }
  .grow { flex: 1; }
  .chip { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 11px; background: #F3F5FA; font-weight: 600; white-space: nowrap; }
  .chip small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .live-pill { color: var(--green); background: #E7F8F0; }
  .live-pill.paused { color: var(--amber); background: #FFF4DC; }
  .live-pill.completed { color: var(--accent); background: var(--accent-soft); }
  .ctl { display: flex; gap: 4px; }
  .ctl button, .zoom button { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #4A546B; }
  .ctl button:hover, .zoom button:hover { background: #EEF1F8; }
  .ctl button.on, .zoom button.on { background: var(--accent); color: #fff; }
  .ctl .speed { width: auto; padding: 0 10px; font-weight: 700; font-size: 12px; }

  /* KPI tiles */
  .kpis { top: 82px; left: 14px; display: flex; gap: 10px; }
  .kpi { padding: 11px 16px 11px 12px; display: flex; gap: 11px; align-items: center; min-width: 150px; }
  .kpi i { width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .kpi label { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }

  .kpi b small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .kpi em { display: block; font-style: normal; font-size: 11px; color: var(--muted); }

  /* detail card + zoom column */
  .detail { top: 82px; right: 14px; width: 304px; padding: 14px; }
  .zoom { top: 82px; right: 328px; padding: 5px; display: flex; flex-direction: column; gap: 2px; border-radius: 15px; }
  .d-head { display: flex; gap: 10px; align-items: center; }
  .d-head .avatar { flex: none; margin: -8px 0 -8px -8px; }
  .d-head .kind { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
  .d-head h3 { margin: 1px 0 0; font-size: 17px; letter-spacing: -.3px; }
  .d-head p { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650;
    color: var(--c); background: color-mix(in srgb, var(--c) 13%, #fff); white-space: nowrap; }
  .d-status { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }
  .d-status .pct { margin-left: auto; font-weight: 650; font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: #EDF0F7; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); transition: width .15s linear; }
  .rows { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { margin-top: 12px; padding: 9px 11px; border-radius: 11px; background: #F3F5FA; font-size: 12px; color: #4A546B; }

  .primary { margin-top: 12px; width: 100%; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; font-weight: 700; }
  .primary:disabled { background: #E6EAF3; color: var(--muted); cursor: default; }
  .role { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: color-mix(in srgb, var(--c) 62%, #000); background: color-mix(in srgb, var(--c) 18%, #fff); }

  /* list card */
  .list { right: 14px; bottom: 14px; width: 404px; padding: 10px 10px 6px; }
  .tabs { display: flex; gap: 4px; padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 5px 11px; border-radius: 9px; font-weight: 650; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }

  .row.sel { background: var(--accent-soft); }
  .row .avatar { flex: none; }

  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 12.5px; }

  .ev { display: flex; gap: 9px; padding: 5px 6px; font-size: 12px; align-items: baseline; width: 100%; text-align: left; border-radius: 9px; }

  /* pipeline card */
  .pipe { left: 14px; bottom: 14px; right: 432px; max-width: 760px; padding: 13px 16px 14px; display: flex; gap: 18px; align-items: center; }
  .pipe-main { flex: 1; min-width: 0; }

  .miles { display: flex; }
  .mile { flex: 1; min-width: 0; position: relative; text-align: left; }
  .mile::before { content: ""; position: absolute; left: 22px; right: -2px; top: 10px; height: 2px; background: #DDE3EE; border-radius: 1px; }

  .mile:last-child::before { display: none; }
  .mile i { position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid #D5DCE9; color: #fff; font-style: normal; }

  .mile.active i { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }

  .mile b { display: block; margin-top: 5px; font-size: 12px; }

  .item { flex: none; width: 214px; display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; background: #F3F5FA; text-align: left; }
  .item:hover, .item.sel { background: var(--accent-soft); }
  .item i { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .item b { display: block; font-size: 12.5px; }
  .item small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }

  .avatar svg { width: 100%; height: 100%; display: block; }
  .poc { left: 50%; top: 82px; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  /* the robots' animations, as in src/renderer/chat.css */
  .rb-bob { animation: rb-bob 3s ease-in-out infinite; }
  @keyframes rb-bob { 50% { transform: translateY(-5px); } }
  .rb-breathe { animation: rb-bob 5s ease-in-out infinite; }
  .rb-shake { animation: rb-shake 2.4s infinite; }
  @keyframes rb-shake { 0%, 78%, 100% { transform: translateX(0); } 82% { transform: translateX(-5px); } 86% { transform: translateX(5px); } 90% { transform: translateX(-4px); } 94% { transform: translateX(3px); } }
  .rb-blink { transform-box: fill-box; transform-origin: center; animation: rb-blink 4s infinite; }
  @keyframes rb-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .rb-look { animation: rb-look 2.4s ease-in-out infinite; }
  @keyframes rb-look { 0%, 100% { transform: translateX(-7px); } 50% { transform: translateX(7px); } }
  .rb-pulse { animation: rb-pulse 1.4s ease-in-out infinite; }
  @keyframes rb-pulse { 50% { opacity: .35; } }
  .rb-fast { animation: rb-pulse .6s steps(2) infinite; }
  .rb-dot { animation: rb-dot 1.2s ease-in-out infinite; }
  @keyframes rb-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-7px); opacity: 1; } }
  .rb-type { transform-box: fill-box; transform-origin: left center; animation: rb-type 3.6s ease-out infinite; }
  @keyframes rb-type { 0% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }
  .rb-caret { animation: rb-pulse .8s steps(2) infinite; }
  .rb-pop { transform-box: fill-box; transform-origin: center; animation: rb-pop 2.4s ease-out infinite; }
  @keyframes rb-pop { 0% { transform: scale(.5); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 22%, 100% { transform: scale(1); } }

  @media (max-width: 1180px) { .item, .poc { display: none; } .kpi:nth-child(3) { display: none; } }
  @media (max-width: 920px) { .pipe, .search, .kpis { display: none; } .list { width: 340px; } }

<script>
// Robot avatars ("Visor" model): isometric robots drawn as SVG, one brand variant per provider and
// one animated state per phase of a turn (thinking, writing, done...). Ported from the owner's
// avatar generators. Animations are CSS classes prefixed with `rb-` (see chat.css), so the SVGs can
// be inlined in the page without clashing with the app's own class names.
// Exposes window.Robots = { svg(variant, state, opts), variantFor(provider, model), plaqueFor(model),
// fromAppearance(appearance, label), define(name, appearance), emblem(name), VARIANTS, STATES, ... }.
(() => {
  const C = Math.cos(Math.PI / 6), S = 0.5;
  const f = (n) => +(+n).toFixed(2);
  let BB;
  const resetBB = () => (BB = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 });
  // offset of everything drawn (a robot seated on a chair is the same robot, moved)
  let OFF = { x: 0, y: 0, z: 0 };
  function P(x, y, z) {
    x += OFF.x; y += OFF.y; z += OFF.z;
    const X = (x - y) * C, Y = (x + y) * S - z;
    BB.x0 = Math.min(BB.x0, X); BB.x1 = Math.max(BB.x1, X);
    BB.y0 = Math.min(BB.y0, Y); BB.y1 = Math.max(BB.y1, Y);
    return [X, Y];
  }
  const pts = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const c = (s) => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
    return '#' + ((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1);
  }
  const lighten = (h, t) => mix(h, '#ffffff', t);
  const darken = (h, t) => mix(h, '#000000', t);

  // Isometric box: top, left and right faces, plus the transforms that map 2D art onto each face.
  function box(x, y, z, W, D, H, col, o = {}) {
    const top = [P(x, y, z + H), P(x + W, y, z + H), P(x + W, y + D, z + H), P(x, y + D, z + H)];
    const left = [P(x, y + D, z + H), P(x + W, y + D, z + H), P(x + W, y + D, z), P(x, y + D, z)];
    const right = [P(x + W, y + D, z + H), P(x + W, y, z + H), P(x + W, y, z), P(x + W, y + D, z)];
    const L = `matrix(${f(C)},0.5,0,1,${f(left[0][0])},${f(left[0][1])})`;
    const R = `matrix(${f(C)},-0.5,0,1,${f(right[0][0])},${f(right[0][1])})`;
    const T = `matrix(${f(C)},0.5,${f(-C)},0.5,${f(top[0][0])},${f(top[0][1])})`;
    const sh = o.shade ?? 0.2;
    let s = `<g stroke="${o.outline}" stroke-width="4" stroke-linejoin="round">` +
      `<polygon points="${pts(top)}" fill="${lighten(col, sh + 0.02)}"/>` +
      `<polygon points="${pts(left)}" fill="${col}"/>` +
      `<polygon points="${pts(right)}" fill="${darken(col, sh)}"/></g>`;
    if (o.gloss)
      s += `<g fill="#fff" opacity="${o.glossOp ?? .35}"><rect transform="${L}" x="8" y="7" width="${f(W * 0.45)}" height="5" rx="2.5"/>` +
        `<rect transform="${L}" x="${f(W * 0.45 + 14)}" y="7" width="8" height="5" rx="2.5"/>` +
        `<rect transform="${T}" x="${f(W * 0.12)}" y="${f(D * 0.12)}" width="${f(W * 0.3)}" height="${f(D * 0.08)}" rx="4" opacity=".7"/></g>`;
    return { svg: s, L, R, T };
  }
  const at = (tf, x, y, inner) => `<g transform="${tf} translate(${f(x)},${f(y)})">${inner}</g>`;

  // ---------- emblems (stylized references) ----------
  const LOGOS = {
    spark(r, fill) {
      const lens = [1, .8, .94, .76, 1, .84, .92, .78, .98, .82, .9, .77];
      let s = '';
      lens.forEach((l, i) => {
        const a = i * 30 + (i % 2 ? 5 : -3), len = r * l, w = r * 0.14;
        s += `<path transform="rotate(${a})" d="M0 ${f(-w)} L${f(len * .8)} ${f(-w * .55)} Q${f(len)} 0 ${f(len * .8)} ${f(w * .55)} L0 ${f(w)}Z"/>`;
      });
      return `<g fill="${fill}">${s}<circle r="${f(r * 0.24)}"/></g>`;
    },
    knot(r, col) {
      let s = '';
      for (let i = 0; i < 6; i++)
        s += `<rect transform="rotate(${i * 60})" x="${f(r * 0.2)}" y="${f(-r * 0.9)}" width="${f(r * 0.44)}" height="${f(r * 1.2)}" rx="${f(r * 0.22)}"/>`;
      return `<g fill="none" stroke="${col}" stroke-width="${f(r * 0.14)}" stroke-linejoin="round">${s}</g>`;
    },
    star(r, col) {
      const k = f(r * 0.95);
      return `<path fill="${col}" d="M0 ${-k} Q${f(r * .1)} ${f(-r * .1)} ${k} 0 Q${f(r * .1)} ${f(r * .1)} 0 ${k} Q${f(-r * .1)} ${f(r * .1)} ${-k} 0 Q${f(-r * .1)} ${f(-r * .1)} 0 ${-k}Z"/>`;
    },
    slash(r, col) {
      const k = r * 0.68, a = (d) => [f(k * Math.cos(d * Math.PI / 180)), f(k * Math.sin(d * Math.PI / 180))];
      const [x1, y1] = a(-28), [x2, y2] = a(-62);
      return `<g fill="none" stroke="${col}" stroke-width="${f(r * 0.2)}" stroke-linecap="round">` +
        `<path d="M${x1} ${y1} A${f(k)} ${f(k)} 0 1 1 ${x2} ${y2}"/>` +
        `<line x1="${f(-r * .5)}" y1="${f(r * .5)}" x2="${f(r * .9)}" y2="${f(-r * .9)}"/></g>`;
    },
  };

  // Generic emblems for the user's own agents (no brand), drawn in a 20x20 box centered on 0.
  // Keep the names in sync with EMBLEMS in src/agents.js.
  const line = (d, w = 2.4) => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const ICONS = {
    bolt: '<path d="M2 -10 L-6 2 H-1 L-2 10 L6 -2 H1 Z"/>',
    // the Product Owner's badge (#105): a clipboard with a checklist
    clipboard: '<path fill-rule="evenodd" d="M-7 -7 H-3.5 V-9.5 H3.5 V-7 H7 Q8 -7 8 -6 V9 Q8 10 7 10 H-7 Q-8 10 -8 9 V-6 Q-8 -7 -7 -7Z M-4.5 -2 H4.5 V0 H-4.5Z M-4.5 3 H4.5 V5 H-4.5Z"/>',
    heart: '<path d="M0 8 C-9 2 -10 -4 -6 -7 C-3 -9 0 -7 0 -4 C0 -7 3 -9 6 -7 C10 -4 9 2 0 8Z"/>',
    shield: '<path d="M0 -9 L8 -6 V0 C8 5 4 8 0 10 C-4 8 -8 5 -8 0 V-6Z"/>',
    leaf: '<path d="M-7 8 C-10 -3 -3 -9 9 -9 C9 3 3 9 -7 8Z"/>',
    gear: '<circle r="5" fill="none" stroke="currentColor" stroke-width="3.6"/>' +
      [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<rect transform="rotate(${a})" x="-1.8" y="-9.5" width="3.6" height="4.5" rx="1"/>`).join(''),
    code: line('M-4 -6 L-9 0 L-4 6 M4 -6 L9 0 L4 6 M1.8 -8 L-1.8 8'),
    rocket: '<path d="M0 -10 C5 -6 5 2 3 6 H-3 C-5 2 -5 -6 0 -10Z M-3 1 L-7 7 L-3 6Z M3 1 L7 7 L3 6Z M-2 7.5 L0 10.5 L2 7.5Z"/>',
    eye: line('M-10 0 Q0 -9 10 0 Q0 9 -10 0Z', 2.2) + '<circle r="3.4"/>',
    crown: '<path d="M-9 6 L-9 -5 L-4 0 L0 -8 L4 0 L9 -5 L9 6Z"/>',
    flask: '<path d="M-2.5 -9 H2.5 V-3 L8 7 Q9 9 6.5 9 H-6.5 Q-9 9 -8 7 L-2.5 -3Z"/>',
    star5: '<path d="M0 -10 L2.9 -4 L9.5 -3.1 L4.7 1.5 L5.9 8.1 L0 5 L-5.9 8.1 L-4.7 1.5 L-9.5 -3.1 L-2.9 -4Z"/>',
  };
  for (const [name, art] of Object.entries(ICONS)) {
    LOGOS[name] = (r, col) => `<g transform="scale(${f(r / 10)})" fill="${col}" color="${col}">${art}</g>`;
  }

  // ---------- eyes on the visor (front face coordinates, 120x110) ----------
  const EYES = {
    dots: (a) => `<g fill="${a}"><ellipse cx="40" cy="47" rx="9" ry="11"/><ellipse cx="80" cy="47" rx="9" ry="11"/></g>`,
    bars: (a) => `<g fill="${a}"><rect x="34" y="34" width="13" height="26" rx="3"/><rect x="73" y="34" width="13" height="26" rx="3"/></g>`,
    arcs: (a) => `<path d="M30 56 Q41 34 52 56 M68 56 Q79 34 90 56" fill="none" stroke="${a}" stroke-width="7" stroke-linecap="round"/>`,
    slits: (a) => `<g fill="${a}"><rect x="28" y="42" width="26" height="8" rx="4"/><rect x="66" y="42" width="26" height="8" rx="4"/></g>`,
  };

  // Name plate: a small 3D desk prism leaning at 45° in front of the robot, on top of the base,
  // showing the model (e.g. "Opus 5.5"). Falls back to the brand name; '' removes it.
  function nameplate(v) {
    const text = String(v.plaque ?? v.name ?? v.label ?? '').trim();
    if (!text) return '';
    const ol = v.outline, x0 = 8, x1 = 142, yb = 184, h = 28, z0 = 16, L = h * Math.SQRT2;
    const bg = v.plaqueBg || lighten(v.base, .88);
    const front = [P(x0, yb - h, z0 + h), P(x1, yb - h, z0 + h), P(x1, yb, z0), P(x0, yb, z0)];
    const side = [P(x1, yb - h, z0 + h), P(x1, yb, z0), P(x1, yb - h, z0)];
    const o = front[0];
    const tf = `matrix(${f(C)},0.5,${f(-Math.SQRT1_2 * C)},${f(Math.SQRT1_2 * 1.5)},${f(o[0])},${f(o[1])})`;
    const W = x1 - x0, esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const fit = text.length * 12.8 > W - 22 ? ` textLength="${W - 22}" lengthAdjust="spacingAndGlyphs"` : '';
    return `<g stroke="${ol}" stroke-width="3.5" stroke-linejoin="round"><polygon points="${pts(side)}" fill="${darken(bg, .28)}"/><polygon points="${pts(front)}" fill="${bg}"/></g>` +
      `<g transform="${tf}"><rect x="5" y="4" width="${W - 10}" height="${f(L - 8)}" rx="6" fill="none" stroke="${darken(bg, .18)}" stroke-width="1.5"/>` +
      `<rect x="10" y="6.5" width="${f(W * .4)}" height="2.5" rx="1.25" fill="#fff" opacity=".6"/>` +
      `<text${v.mirror ? ` transform="translate(${W},0) scale(-1,1)"` : ''} x="${W / 2}" y="${f(L / 2 + 8)}" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="${darken(v.base, .1)}" text-anchor="middle"${fit}>${esc}</text></g>`;
  }

  function visorBot(v, id) {
    const ol = v.outline;
    let s = '';
    const base = box(0, 0, 0, 150, 190, 16, v.base, { outline: ol });
    // a robot seated at a desk has no base (v.noBase)
    if (!v.noBase) s += base.svg;
    // A mirrored robot counter-flips its text and emblems so they still read the right way.
    const unflip = v.mirror ? 'scale(-1,1)' : '';
    if (v.name && !v.noBase)
      s += `<text transform="${base.L}${v.mirror ? ' translate(150,0) scale(-1,1)' : ''}" x="75" y="12" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="10" fill="${lighten(v.base, .55)}" text-anchor="middle" letter-spacing="2">${v.name.toUpperCase()}</text>`;
    const o = { outline: ol, shade: v.shade };
    s += box(48, 78, 16, 22, 22, 28, v.limb, o).svg;
    s += box(80, 78, 16, 22, 22, 28, v.limb, o).svg;
    s += box(20, 76, 48, 20, 24, 40, v.limb, o).svg;
    const body = box(40, 40, 44, 70, 70, 60, v.body, { ...o, gloss: true, glossOp: v.glossOp });
    s += body.svg;
    // emblems drawn at the picker's size (emblem()) and scaled: the same artwork everywhere
    if (v.logo) s += at(body.L, 35, 30, `<g transform="${unflip} scale(1.9)">${LOGOS[v.logo](10, v.chestLogo || '#fff')}</g>`);
    else s += at(body.L, 35, 30, `<rect x="-16" y="-10" width="32" height="20" rx="6" fill="${darken(v.body, .12)}" stroke="${ol}" stroke-width="2.5"/><circle cx="-6" r="3.5" fill="${v.accent}"/><circle cx="6" r="3.5" fill="${lighten(v.body, .5)}"/>`);
    s += box(110, 76, 48, 20, 24, 40, v.limb, o).svg;
    const head = box(15, 15, 104, 120, 120, 110, v.head, { ...o, gloss: true, glossOp: v.glossOp });
    s += head.svg;
    s += at(head.L, 0, 0,
      `<rect x="10" y="20" width="100" height="66" rx="18" fill="${v.screen}" stroke="${ol}" stroke-width="3"/>` +
      `<g filter="url(#glow-${id})">${v.face ? v.face(v, id) : EYES[v.eyes](v.accent) + `<path d="M48 72 Q60 80 72 72" fill="none" stroke="${v.accent}" stroke-width="4" stroke-linecap="round"/>`}</g>` +
      `<rect x="18" y="26" width="30" height="5" rx="2.5" fill="#fff" opacity=".18"/>`);
    const plate = v.logo
      ? `<circle r="32" fill="${v.plate}" stroke="${ol}" stroke-width="4"/><g transform="${unflip} scale(2)">${LOGOS[v.logo](10, v.plateLogo || '#fff')}</g>`
      : `<circle r="32" fill="${v.plate}" stroke="${ol}" stroke-width="4"/><circle r="22" fill="none" stroke="${darken(v.plate, .25)}" stroke-width="3"/>` +
        `<g fill="${darken(v.plate, .3)}">${[-8, 0, 8].flatMap((x) => [-8, 0, 8].map((y) => `<circle cx="${x}" cy="${y}" r="2.6"/>`)).join('')}</g>`;
    s += at(head.R, 60, 55, plate + (v.plateExtra || ''));
    for (const [x, y] of [[45, 75], [105, 75]]) {
      const a0 = P(x, y, 214), a1 = P(x, y, 238);
      s += `<line x1="${f(a0[0])}" y1="${f(a0[1])}" x2="${f(a1[0])}" y2="${f(a1[1])}" stroke="${ol}" stroke-width="5" stroke-linecap="round"/>`;
      s += `<circle cx="${f(a1[0])}" cy="${f(a1[1])}" r="9" fill="${v.antenna || v.accent}" stroke="${ol}" stroke-width="3" filter="url(#glow-${id})" class="${v.antennaClass || ''}" style="animation-delay:${x > 50 ? '.7s' : '0s'}"/>`;
    }
    s += nameplate(v);
    return s;
  }

  // Just the robot on a transparent canvas: no background card, no floor shadow. `v.mirror` flips
  // it horizontally (across the vertical axis) so a robot on the left of a chat faces right.
  function render(v, id) {
    resetBB();
    const inner = visorBot(v, id);
    const w = BB.x1 - BB.x0, h = BB.y1 - BB.y0;
    const sc = Math.min(450 / w, 450 / h);
    const tx = 256 - sc * (BB.x0 + BB.x1) / 2, ty = 262 - sc * (BB.y0 + BB.y1) / 2;
    const robot = `<g class="${v.motion || ''}"><g transform="translate(${f(tx)},${f(ty)}) scale(${f(sc)})">${inner}</g></g>`;
    const flip = (x) => (v.mirror ? `<g transform="translate(512,0) scale(-1,1)">${x}</g>` : x);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
<defs>
<filter id="glow-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
${flip(robot)}
${flip(v.overlay || '')}
</svg>`;
  }

  const VARIANTS = {
    vanilla: {
      label: 'Vanilla',
      head: '#E6E6E9', body: '#D4D4D8', limb: '#E6E6E9', plate: '#D4D4D8', base: '#8E8E95',
      screen: '#1D1E22', accent: '#F2F2F2', eyes: 'dots', outline: '#3B3B40',
      bg1: '#F7F7F8', bg2: '#DEDEE2',
    },
    claude: {
      label: 'Claude', name: 'Claude', logo: 'spark',
      head: '#F0EEE6', body: '#D97757', limb: '#F0EEE6', plate: '#D97757', base: '#2B2A27',
      screen: '#2B2A27', accent: '#FFB38A', eyes: 'bars', outline: '#3A2A22', markColor: '#D97757',
      bg1: '#FBF3EC', bg2: '#F1D3C0',
    },
    gpt: {
      label: 'ChatGPT', name: 'ChatGPT', logo: 'knot',
      head: '#EAF1FF', body: '#3D7BF7', limb: '#EAF1FF', plate: '#3D7BF7', base: '#0F1E45',
      screen: '#0F1E45', accent: '#6EE7FF', eyes: 'arcs', outline: '#16244D', markColor: '#3D7BF7',
      bg1: '#EEF4FF', bg2: '#BCD3FF',
    },
    grok: {
      label: 'Grok', name: 'Grok', logo: 'slash',
      head: '#F4F4F6', body: '#18181B', limb: '#F4F4F6', plate: '#18181B', base: '#111113',
      screen: '#000000', accent: '#FFFFFF', eyes: 'slits', outline: '#0A0A0B',
      chestLogo: '#FFFFFF', plateLogo: '#FFFFFF', markColor: '#18181B',
      bg1: '#EDEDEF', bg2: '#B9B9BF',
    },
    gemini: {
      label: 'Gemini', name: 'Gemini', logo: 'star',
      head: '#F4F6FB', body: '#6A5CF0', limb: '#F4F6FB', plate: '#4A86F0', base: '#1E1B4B',
      screen: '#14123A', accent: '#A9C8FF', eyes: 'dots', outline: '#1E1B4B', markColor: '#6A5CF0',
      bg1: '#EEF2FF', bg2: '#D5CCFF',
    },
    // The platform's own supervisor: no brand, the app's purple.
    supervisor: {
      label: 'Supervisor',
      head: '#F4F4F6', body: '#7C5CFF', limb: '#F4F4F6', plate: '#7C5CFF', base: darken('#7C5CFF', .55),
      screen: '#15161A', accent: '#C9B8FF', eyes: 'dots', outline: darken('#7C5CFF', .65),
      bg1: lighten('#7C5CFF', .88), bg2: lighten('#7C5CFF', .6),
    },
    // The Backlog's Product Owner (#105): teal, a clipboard on the chest.
    'product-owner': {
      label: 'Product Owner', logo: 'clipboard',
      head: '#F4F4F6', body: '#0F9F8F', limb: '#F4F4F6', plate: '#0F9F8F', base: darken('#0F9F8F', .55),
      screen: '#15161A', accent: '#9FF5E6', eyes: 'arcs', outline: darken('#0F9F8F', .65),
      chestLogo: '#FFFFFF', plateLogo: '#FFFFFF',
      bg1: lighten('#0F9F8F', .88), bg2: lighten('#0F9F8F', .6),
    },
    // The app-wide Oracle (#122): deep blue and gold, an eye on the chest, slit eyes.
    oracle: {
      label: 'Oracle', logo: 'eye',
      head: '#F4F4F6', body: '#1E3A8A', limb: '#F4F4F6', plate: '#1E3A8A', base: darken('#1E3A8A', .55),
      screen: '#15161A', accent: '#FCD34D', eyes: 'slits', outline: darken('#1E3A8A', .65),
      chestLogo: '#FCD34D', plateLogo: '#FCD34D',
      bg1: lighten('#1E3A8A', .88), bg2: lighten('#1E3A8A', .6),
    },
  };

  // ---------- states of a turn ----------
  const INK = '#3B3B40', AMBER = '#FFC24B', GREEN = '#4ADE80', RED = '#FF6B6B', DIM = '#8A8A90';
  const d = (s) => `style="animation-delay:${s}s"`;
  const mouth = {
    smile: (a) => `<path d="M48 72 Q60 80 72 72" fill="none" stroke="${a}" stroke-width="4" stroke-linecap="round"/>`,
    big: (a) => `<path d="M44 68 Q60 84 76 68" fill="none" stroke="${a}" stroke-width="4.5" stroke-linecap="round"/>`,
    flat: (a) => `<path d="M52 74 L68 74" stroke="${a}" stroke-width="4" stroke-linecap="round"/>`,
    side: (a) => `<path d="M54 74 L70 71" stroke="${a}" stroke-width="4" stroke-linecap="round"/>`,
    wavy: (a) => `<path d="M44 75 q4 -5 8 0 t8 0 t8 0 t8 0" fill="none" stroke="${a}" stroke-width="3.5" stroke-linecap="round"/>`,
  };
  const dots = (a, dx = 0, dy = 0, rx = 9, ry = 11) =>
    `<g fill="${a}"><ellipse cx="${40 + dx}" cy="${47 + dy}" rx="${rx}" ry="${ry}"/><ellipse cx="${80 + dx}" cy="${47 + dy}" rx="${rx}" ry="${ry}"/></g>`;

  // Speech or thought balloon in the 512 frame.
  function bubble(content, kind = 'speech') {
    const tail = kind === 'thought'
      ? `<circle cx="184" cy="154" r="10" fill="#fff" stroke="${INK}" stroke-width="3.5"/><circle cx="201" cy="173" r="6" fill="#fff" stroke="${INK}" stroke-width="3"/>`
      : `<path d="M152 126 L194 166 L124 134Z" fill="#fff" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
    return `<g>${tail}<rect x="38" y="38" width="152" height="102" rx="30" fill="#fff" stroke="${INK}" stroke-width="3.5"/>` +
      `<g transform="translate(114,89) scale(1.25)__UNFLIP__">${content}</g></g>`;
  }
  const docLines = () => [-14, 0, 14].map((y, i) =>
    `<rect x="-38" y="${y - 3.5}" width="${[64, 52, 36][i]}" height="7" rx="3.5" fill="${INK}" class="rb-type" ${d(i * 0.6)}/>`).join('');

  const STATES = {
    sleeping: {
      accent: DIM, antenna: '#5A5A60', motion: 'rb-breathe', screen: '#141417',
      face: (v) => `<path d="M31 48 Q40 55 49 48 M71 48 Q80 55 89 48" fill="none" stroke="${v.accent}" stroke-width="4.5" stroke-linecap="round"/>${mouth.flat(v.accent)}`,
    },
    idle: { motion: 'rb-bob', face: (v) => `<g class="rb-blink">${EYES[v.eyes](v.accent)}</g>${mouth.smile(v.accent)}` },
    thinking: {
      antennaClass: 'rb-pulse',
      face: (v) => `${dots(v.accent, 7, -7, 8, 10)}${mouth.side(v.accent)}`,
      overlay: bubble([-22, 0, 22].map((x, i) => `<circle class="rb-dot" ${d(i * 0.18)} cx="${x}" cy="4" r="8" fill="${INK}"/>`).join(''), 'thought'),
    },
    writing: {
      face: (v) => `<g fill="${v.accent}"><rect x="29" y="47" width="22" height="7" rx="3.5"/><rect x="69" y="47" width="22" height="7" rx="3.5"/></g>${mouth.flat(v.accent)}`,
      overlay: bubble(docLines() + `<rect class="rb-caret" x="0" y="10" width="4" height="12" rx="1" fill="${INK}"/>`),
    },
    reading: {
      antennaClass: 'rb-pulse',
      face: (v) => `<g class="rb-look">${dots(v.accent, 0, 0, 8, 10)}</g>${mouth.flat(v.accent)}`,
      overlay: bubble(`<g fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"><circle cx="-4" cy="-4" r="14"/><path d="M7 7 L18 18"/></g>`),
    },
    done: {
      antenna: GREEN, motion: 'rb-bob',
      face: (v) => `<path d="M30 52 Q40 36 50 52 M70 52 Q80 36 90 52" fill="none" stroke="${v.accent}" stroke-width="6" stroke-linecap="round"/>${mouth.big(v.accent)}`,
      overlay: bubble(`<g class="rb-pop"><circle r="24" fill="${GREEN}" stroke="${INK}" stroke-width="3"/><path d="M-11 1 L-3 9 L12 -8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`),
    },
    waiting: {
      antenna: AMBER, antennaClass: 'rb-pulse',
      face: (v) => `<g class="rb-blink">${dots(v.accent, 0, 0, 9, 11)}</g><path d="M30 30 L48 33" stroke="${v.accent}" stroke-width="3.5" stroke-linecap="round"/>${mouth.side(v.accent)}`,
      overlay: bubble(`<text class="rb-pulse" y="16" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="48" fill="${AMBER}" stroke="${INK}" stroke-width="2.5" paint-order="stroke">?</text>`),
    },
    error: {
      accent: RED, antenna: RED, antennaClass: 'rb-fast', motion: 'rb-shake',
      face: (v) => `<g stroke="${v.accent}" stroke-width="6" stroke-linecap="round"><path d="M33 40 L47 54 M47 40 L33 54 M73 40 L87 54 M87 40 L73 54"/></g>${mouth.wavy(v.accent)}`,
      overlay: bubble(`<path d="M0 -24 L26 20 L-26 20Z" fill="${RED}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` +
        `<rect x="-3" y="-10" width="6" height="16" rx="3" fill="#fff"/><circle cy="13" r="3.5" fill="#fff"/>`),
    },
  };

  // ---------- user-defined looks (Agents screen, src/agents.js) ----------
  // An appearance is { body, shell, visor, glow, eyes, emblem }: the main color (body, shoulder plate),
  // the shell (head and limbs), the visor (screen), the glow (eyes and antennas), the eye style and
  // an emblem ('none' = the plain panel). Base and outline are derived from the main color.
  const EYE_STYLES = Object.keys(EYES);
  const EMBLEMS = ['none', ...Object.keys(ICONS)];
  const luma = (h) => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  const hex = (h, d) => (/^#[0-9a-f]{6}$/i.test(h || '') ? h : d);
  function fromAppearance(a = {}, label = '') {
    const body = hex(a.body, '#7C5CFF'), shell = hex(a.shell, '#F4F4F6');
    // an emblem on a light body would vanish in white
    const mark = luma(body) > 0.7 ? darken(body, .6) : '#FFFFFF';
    return {
      label,
      head: shell, limb: shell, body, plate: body, base: darken(body, .55),
      screen: hex(a.visor, '#15161A'), accent: hex(a.glow, '#C9B8FF'),
      eyes: EYE_STYLES.includes(a.eyes) ? a.eyes : 'dots', outline: darken(body, .65),
      logo: ICONS[a.emblem] ? a.emblem : undefined, chestLogo: mark, plateLogo: mark,
      bg1: lighten(body, .88), bg2: lighten(body, .6),
    };
  }
  // Replaces (or adds) a named variant, e.g. the supervisor with the look saved in Agents. Screens
  // that already drew it listen for 'robots:changed'.
  function define(name, appearance, label) {
    VARIANTS[name] = fromAppearance(appearance, label ?? VARIANTS[name]?.label ?? name);
    document.dispatchEvent(new CustomEvent('robots:changed', { detail: { name } }));
  }
  // An emblem alone, for pickers: an <svg> with a 20x20 viewBox in `color` (a brand's logo too).
  const emblem = (name, color = 'currentColor') =>
    `<svg viewBox="-11 -11 22 22" aria-hidden="true" focusable="false">${Object.hasOwn(LOGOS, name) ? LOGOS[name](10, color) : ''}</svg>`;

  let uid = 0;
  // `variant` is a name from VARIANTS or a variant object (see fromAppearance).
  // `bubble: false` drops the balloon overlay (small avatars, where it would be unreadable);
  // `plaque` is the name plate text (the model), `mirror` faces the robot right.
  // `color` (#RRGGBB, the agent's role colour, #227) paints the body and the shoulder plate, the shell
  // (head, limbs) in a light tint of it, with the base and outline derived from it and a lighter tint
  // for the visor glow (unless the state has its own, e.g. error red); the emblem and the plaque stay
  // the provider's.
  function svg(variant, state = 'idle', opts = {}) {
    const st = STATES[state] || STATES.idle;
    const v = { ...(typeof variant === 'object' && variant ? variant : VARIANTS[variant] || VARIANTS.vanilla), ...st };
    v.mirror = !!opts.mirror;
    if (opts.plaque !== undefined) v.plaque = opts.plaque;
    if (hex(opts.color)) {
      const c = opts.color;
      // an emblem on a light body would vanish in white (as in fromAppearance)
      const mark = luma(c) > 0.7 ? darken(c, .6) : '#FFFFFF';
      Object.assign(v, { body: c, plate: c, head: lighten(c, .7), limb: lighten(c, .7), base: darken(c, .55), outline: darken(c, .65), chestLogo: mark, plateLogo: mark });
      if (!st.accent) v.accent = lighten(c, .45);
    }
    if (opts.accent) v.accent = opts.accent; // the glow in the agent's colour (#224, agent-colors.js)
    if (opts.bubble === false) delete v.overlay;
    else if (v.overlay) v.overlay = v.overlay.replace('__UNFLIP__', v.mirror ? ' scale(-1,1)' : '');
    return render(v, `rb${++uid}`);
  }

  function variantFor(provider, model = '') {
    if (/gemini/i.test(model) || provider === 'gemini-cli') return 'gemini';
    return { 'claude-code': 'claude', 'codex-cli': 'gpt', 'grok-cli': 'grok' }[provider] || 'vanilla';
  }

  // Name plate text for a model id: "claude-opus-5-5" → "Opus 5.5", "gpt-6-luna" → "GPT-6 Luna".
  function plaqueFor(model = '') {
    const m = /^claude-([a-z]+)-(\d+)-(\d+)/.exec(model);
    if (m) return `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}.${m[3]}`;
    return model.split('-').map((w, i) => (i === 0 && /^(gpt|glm)$/i.test(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1)))
      .join(' ').replace(/^GPT (\d)/, 'GPT-$1');
  }

  // ---------- workflow builder: a desk with a chair, and an approval gate ----------
  const escText = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Text on a box face (its L transform), centered, shrunk to fit.
  function faceText(tf, W, y, text, size, fill, weight = 800) {
    const t = String(text || '').trim();
    if (!t) return '';
    const fit = t.length * size * 0.6 > W - 24 ? ` textLength="${W - 24}" lengthAdjust="spacingAndGlyphs"` : '';
    return `<text transform="${tf}" x="${W / 2}" y="${y}" font-family="Arial,Helvetica,sans-serif" font-weight="${weight}" font-size="${size}" fill="${fill}" text-anchor="middle"${fit}>${escText(t)}</text>`;
  }
  function scene(inner, id, extraDefs = '') {
    const pad = 12, w = BB.x1 - BB.x0 + pad * 2, h = BB.y1 - BB.y0 + pad * 2;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(BB.x0 - pad)} ${f(BB.y0 - pad)} ${f(w)} ${f(h)}" aria-hidden="true" focusable="false">` +
      `<defs><filter id="glow-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>${extraDefs}</defs>${inner}</svg>`;
  }

  // A step of the visual builder: the agent (a variant, or null for an empty desk) seated on a chair
  // behind a desk, in the robots' isometric style. `label` and `sub` are written on the desk's
  // front panel (e.g. the step id and the model).
  function desk(variant, opts = {}) {
    const id = `dk${++uid}`;
    resetBB();
    const wood = opts.desk || '#8B6A4E', chair = opts.chair || '#2E3340', ol = '#1A1410', cOl = '#12141A';
    const o = { outline: ol, shade: 0.22 }, co = { outline: cOl, shade: 0.25 };
    let s = '';
    // chair: back (behind the robot), post and seat
    s += box(10, -26, 44, 130, 16, 150, chair, co).svg;
    s += box(62, 70, 0, 26, 26, 40, darken(chair, .2), co).svg;
    s += box(0, 10, 40, 150, 170, 14, chair, co).svg;
    if (variant) {
      const v = { ...(typeof variant === 'object' ? variant : VARIANTS[variant] || VARIANTS.vanilla), ...STATES.idle, motion: '', plaque: '', noBase: true };
      delete v.name; // the brand name on the base is hidden by the desk anyway
      OFF = { x: 0, y: 0, z: 40 };
      s += visorBot(v, id);
      OFF = { x: 0, y: 0, z: 0 };
    }
    // desk: back legs, top and front panel (it hides the robot's lower body)
    const x0 = -60, x1 = 210, y0 = 150, D = 110, top = 150;
    s += box(x0 + 8, y0 + 6, 0, 16, 16, top - 12, darken(wood, .15), o).svg;
    s += box(x1 - 24, y0 + 6, 0, 16, 16, top - 12, darken(wood, .15), o).svg;
    s += box(x1 - 24, y0 + D - 22, 0, 16, 16, top - 12, darken(wood, .15), o).svg;
    const panel = box(x0 + 6, y0 + D - 20, 18, x1 - x0 - 12, 12, top - 30, darken(wood, .05), o);
    s += panel.svg;
    const slab = box(x0, y0, top - 12, x1 - x0, D, 14, wood, { ...o, gloss: true, glossOp: .18 });
    s += slab.svg;
    // a laptop on the desk, its screen towards the agent: we see the keyboard and the back of the lid
    s += box(x0 + 110, y0 + 24, top + 2, 84, 56, 5, '#C9CED8', { outline: cOl }).svg;
    const lid = box(x0 + 110, y0 + 80, top + 2, 84, 5, 46, '#9AA1AE', { outline: cOl });
    s += lid.svg;
    s += `<circle transform="${lid.L}" cx="42" cy="20" r="6" fill="#C9CED8" opacity=".8"/>`;
    // papers
    s += box(x0 + 22, y0 + 40, top + 2, 56, 44, 6, '#F4F1EA', { outline: '#6B6358', shade: .1 }).svg;
    const PW = x1 - x0 - 12, PH = top - 30;
    s += faceText(panel.L, PW, PH * 0.45, opts.label, 30, lighten(wood, .82));
    s += faceText(panel.L, PW, PH * 0.45 + 32, opts.sub, 20, lighten(wood, .55), 700);
    return scene(s, id);
  }

  // A person standing, facing the viewer, holding a clipboard with a check mark (the human approver).
  function person(x0, y0, z0) {
    const skin = '#F1C9A5', shirt = '#4F7CC9', pants = '#2E3A55', hair = '#3A2A22', ol = '#1A1A22';
    const o = { outline: ol, shade: .22 };
    let s = '';
    s += box(x0 + 8, y0 + 8, z0, 18, 18, 80, pants, o).svg;
    s += box(x0 + 34, y0 + 8, z0, 18, 18, 80, pants, o).svg;
    s += box(x0 - 14, y0 + 8, z0 + 92, 14, 18, 64, shirt, o).svg;
    s += box(x0, y0, z0 + 80, 60, 34, 78, shirt, { ...o, gloss: true, glossOp: .15 }).svg;
    s += box(x0 + 60, y0 + 8, z0 + 92, 14, 18, 64, shirt, o).svg;
    const head = box(x0 + 10, y0 + 2, z0 + 158, 40, 34, 40, skin, o);
    s += head.svg;
    s += box(x0 + 8, y0, z0 + 192, 44, 38, 12, hair, o).svg;
    s += `<g transform="${head.L}"><circle cx="13" cy="18" r="2.8" fill="${ol}"/><circle cx="27" cy="18" r="2.8" fill="${ol}"/>` +
      `<path d="M13 27 Q20 32 27 27" fill="none" stroke="${ol}" stroke-width="2.2" stroke-linecap="round"/></g>`;
    // the clipboard, held in front of the chest
    const board = box(x0 + 12, y0 + 34, z0 + 96, 36, 4, 46, '#F4F1EA', { outline: '#6B6358', shade: .1 });
    s += board.svg;
    s += `<path transform="${board.L}" d="M9 24 L16 32 L28 13" fill="none" stroke="#2F9E5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    return s;
  }

  // An approval gate, same style as the desks. `reviewer: 'human'` (default): an amber arch with a
  // barrier and a person holding a clipboard; `reviewer: 'ai'`: a violet arch with a scanner beam
  // and the reviewing agent's robot (`robot`: a variant, see fromAppearance).
  function gate(opts = {}) {
    const id = `gt${++uid}`;
    resetBB();
    const ai = opts.reviewer === 'ai';
    const col = ai ? '#8B7CF6' : '#E0A93B', ol = ai ? '#1E1640' : '#2A1E08', o = { outline: ol, shade: .22 };
    let s = '';
    s += box(-230, 60, 0, 490, 170, 12, '#3A3F4D', { outline: '#12141A', shade: .25 }).svg;
    if (ai) {
      const v = { ...(typeof opts.robot === 'object' && opts.robot ? opts.robot : VARIANTS[opts.robot] || VARIANTS.vanilla), ...STATES.idle, motion: '', plaque: '', noBase: true };
      delete v.name;
      OFF = { x: -215, y: 70, z: 12 };
      s += visorBot(v, id);
      OFF = { x: 0, y: 0, z: 0 };
    } else {
      s += person(-170, 150, 12);
    }
    s += box(-10, 100, 12, 30, 30, 230, col, o).svg;
    if (ai) {
      // the scanner: a faint light curtain between the posts and a glowing beam across
      const plane = [P(20, 115, 22), P(190, 115, 22), P(190, 115, 232), P(20, 115, 232)];
      s += `<polygon points="${pts(plane)}" fill="#6EE7FF" opacity=".13"/>`;
    }
    s += box(190, 100, 12, 30, 30, 230, col, o).svg;
    const beam = box(-24, 94, 242, 258, 42, 40, darken(col, .05), { ...o, gloss: true, glossOp: .2 });
    s += beam.svg;
    if (ai) {
      const a = P(20, 115, 128), b = P(190, 115, 128);
      s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#6EE7FF" stroke-width="7" stroke-linecap="round" filter="url(#glow-${id})"/>`;
      s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#E8FCFF" stroke-width="2.5" stroke-linecap="round"/>`;
    } else {
      // the barrier across, striped
      const bar = box(20, 108, 90, 170, 14, 20, '#F4F1EA', { outline: ol, shade: .15 });
      s += bar.svg;
      s += `<g fill="#D9483B">${[0, 1, 2, 3].map((i) => `<rect transform="${bar.L}" x="${12 + i * 42}" y="2" width="20" height="16"/>`).join('')}</g>`;
    }
    s += faceText(beam.L, 258, 29, opts.label || (ai ? 'AI CHECK' : 'HUMAN'), 24, ai ? '#F4F1FF' : '#2A1E08');
    return scene(s, id);
  }

  window.Robots = { svg, variantFor, plaqueFor, fromAppearance, define, emblem, desk, gate, VARIANTS, STATES, EYE_STYLES, EMBLEMS };
})();
</script>

<script type="module">
import React, { useMemo, useRef, useState, useEffect, useSyncExternalStore } from 'react';
import { createRoot } from 'react-dom/client';
import * as THREE from 'three';
import { Canvas, useFrame, useThree } from '@react-three/fiber';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import htm from 'htm';

const html = htm.bind(React.createElement);
// ?cover: the landing page's cover (site/cover-poc.html): the scene and its tags only, no controls
const COVER = new URLSearchParams(location.search).has('cover');
const Robots = window.Robots;

// ---------------------------------------------------------------------------------------------
// The run: a simplified software-development workflow (ids, agents and colours as in the YAML;
// the providers are mixed here only to show the three robot brands).
// ---------------------------------------------------------------------------------------------
const RUN = { workflow: 'software-development', issue: '#412', title: 'Add CSV export to the runs list', branch: 'run/a41c-csv-export', id: 'a41c' };
const COLS = [-5.5, 0, 5.5], ROWS = [-6.5, 0, 6.5], LANE = 3.2;
const STEPS = [
  { id: 'develop', agent: 'developer', provider: 'claude-code', model: 'claude-opus-5-5', color: '#4C7DFF', title: 'Implements the issue in the run worktree', group: 'Develop', col: 0, row: 0 },
  { id: 'code_review', agent: 'reviewer', provider: 'codex-cli', model: 'gpt-6-luna', color: '#A06BFF', title: 'Reviews the diff against the rules', group: 'Review', col: 1, row: 0 },
  { id: 'test', agent: 'test_writer', provider: 'claude-code', model: 'claude-sonnet-5', color: '#FF8A3D', title: 'Writes and runs unit and E2E tests', group: 'Test', col: 2, row: 0 },
  { id: 'build', agent: 'builder', provider: 'claude-code', model: 'claude-sonnet-5', color: '#E6C229', title: 'Builds the app and fixes build errors', group: 'Test', col: 2, row: 1 },
  { id: 'evidence', agent: 'evidence', provider: 'grok-cli', model: 'grok-4.7', color: '#1FC2D6', title: 'Captures screenshots as evidence', group: 'Verify', col: 1, row: 1 },
  { id: 'verify_change', agent: 'verifier', provider: 'claude-code', model: 'claude-sonnet-5', color: '#2FBF71', title: 'Checks the acceptance criteria', group: 'Verify', col: 0, row: 1 },
  { id: 'ci', agent: 'ci_pusher', provider: 'claude-code', model: 'claude-sonnet-5', color: '#8C96A8', title: 'Pushes the branch and watches CI', group: 'CI', col: 0, row: 2 },
  { id: 'approve_merge', kind: 'gate', title: 'Human approval before the merge', group: 'Approve', col: 1, row: 2 },
  { id: 'deploy_prod', agent: 'deployer', provider: 'claude-code', model: 'claude-sonnet-5', color: '#F0569B', title: 'Merges the pull request and deploys', group: 'Deploy', col: 2, row: 2 },
];
const STEP = Object.fromEntries(STEPS.map((s) => [s.id, s]));
const GROUPS = [...new Set(STEPS.map((s) => s.group))];
const PROVIDER = { 'claude-code': 'Claude Code', 'codex-cli': 'Codex CLI', 'grok-cli': 'Grok Build' };
const STATUS = {
  pending: { label: 'Queued', color: '#A7B0C2' },
  running: { label: 'Running', color: '#4C6FFF' },
  done: { label: 'Done', color: '#1FAE6E' },
  changes: { label: 'Changes requested', color: '#E39A12' },
  failed: { label: 'Failed', color: '#EA4E4B' },
  waiting: { label: 'Waiting for you', color: '#E39A12' },
};
const TIME_SCALE = 20; // one simulated second shows as 20 s of run time
const SUP_POS = new THREE.Vector3(-11.1, 0, 0.2);
const CENTER = new THREE.Vector3(0, 0, 2.2);

// the route of the work item: along each row's lane, down to the next row
const PATH = [[-10.6, 0], [8.7, 0], [8.7, 1], [-8.7, 1], [-8.7, 2], [10.6, 2]].map(([x, r]) => new THREE.Vector3(x, 0, ROWS[r] + LANE));
const CUM = [0];
for (let i = 1; i < PATH.length; i++) CUM.push(CUM[i - 1] + PATH[i].distanceTo(PATH[i - 1]));
const TOTAL = CUM[CUM.length - 1];
function pointAt(d, out) {
  d = Math.max(0, Math.min(TOTAL, d));
  let i = 0;
  while (i < PATH.length - 2 && d > CUM[i + 1]) i++;
  return out.lerpVectors(PATH[i], PATH[i + 1], (d - CUM[i]) / (CUM[i + 1] - CUM[i]));
}
function dockOf(id) {
  const st = STEP[id], seg = st.row * 2;
  const d = CUM[seg] + Math.abs(COLS[st.col] - PATH[seg].x);
  return st.kind === 'gate' ? d - 1.9 : d; // the cart stops before the barrier
}
const stepPos = (st) => (st.kind === 'gate' ? [COLS[st.col], 0, ROWS[st.row] + LANE] : [COLS[st.col], 0, ROWS[st.row]]);

// ---------------------------------------------------------------------------------------------
// The simulated run: a queue of operations (travel, work, supervise, gate) advanced every frame.
// ---------------------------------------------------------------------------------------------
const sim = (() => {
  const listeners = new Set();
  const s = { speed: 1, paused: false, version: 0 };
  let queue = [], cur = null, lastNotify = 0, evN = 0;
  const notify = () => { s.version++; lastNotify = performance.now(); listeners.forEach((l) => l()); };
  const log = (kind, text, stepId) => { s.events.unshift({ n: ++evN, t: s.t, kind, text, stepId }); if (s.events.length > 60) s.events.pop(); };

  function script() {
    const q = [{ op: 'wait', dur: 1.4 }];
    const go = (id, dur, outcome, note) => { q.push({ op: 'travel', id }); if (dur) q.push({ op: 'work', id, dur, outcome, note }); };
    go('develop', 8, 'done', 'Implemented the CSV export: 6 files changed, +214 −31.');
    go('code_review', 6, 'changes', '2 findings: unescaped separator, missing empty state.');
    go('develop', 5, 'done', 'Addressed both findings in 2 files.');
    go('code_review', 4, 'done', 'Approved: no findings left.');
    go('test', 7, 'done', '12 unit tests and 2 E2E scenarios pass.');
    go('build', 4.5, 'done', 'Build succeeded in 41 s.');
    go('evidence', 5, 'done', '3 screenshots captured.');
    go('verify_change', 4.5, 'failed', 'The turn ended without the JSON verdict.');
    q.push({ op: 'supervise', id: 'verify_change', dur: 5.5 });
    q.push({ op: 'work', id: 'verify_change', dur: 5, outcome: 'done', note: 'All 5 acceptance criteria verified.' });
    go('ci', 5.5, 'done', 'Pull request #431 opened, CI is green.');
    go('approve_merge');
    q.push({ op: 'gate', id: 'approve_merge', auto: 14 });
    go('deploy_prod', 5, 'done', 'Merged into main and deployed.');
    q.push({ op: 'travel', to: TOTAL }, { op: 'finish' }, { op: 'wait', dur: 10 }, { op: 'restart' });
    return q;
  }

  function reset() {
    Object.assign(s, {
      t: 0, clock: 0, status: 'running', activeId: null, tokens: 0, cost: 0, turns: 0, events: [],
      courier: { d: 0, moving: false, dir: 1 }, reached: 0,
      sup: { state: 'sleeping', target: null, calls: 0 },
      steps: Object.fromEntries(STEPS.map((st) => [st.id, { status: 'pending', phase: null, visits: 0, tokens: 0, cost: 0, dur: 0, progress: 0, note: '', endedAt: -99, auto: 0, approved: false }])),
    });
    queue = script(); cur = null;
    log('info', `Run ${RUN.id} started: ${RUN.workflow} on issue ${RUN.issue}`);
    notify();
  }

  const begin = {
    wait(o) { o.el = 0; },
    travel(o) {
      if (o.to === undefined) o.to = dockOf(o.id);
      if (o.id) { s.activeId = o.id; log('info', `Handoff on its way to ${o.id}`, o.id); }
      s.courier.moving = true;
    },
    work(o) {
      const st = s.steps[o.id];
      Object.assign(st, { status: 'running', phase: 'reading', progress: 0, visits: st.visits + 1 });
      s.turns++; s.activeId = o.id; o.el = 0;
      log('running', `${STEP[o.id].agent} started ${o.id}${st.visits > 1 ? ` (visit ${st.visits})` : ''}`, o.id);
    },
    supervise(o) {
      Object.assign(s.sup, { state: 'thinking', target: o.id, calls: s.sup.calls + 1 });
      o.el = 0;
      log('failed', `Supervisor called: ${o.id} failed`, 'supervisor');
    },
    gate(o) {
      const st = s.steps[o.id];
      Object.assign(st, { status: 'waiting', visits: st.visits + 1, approved: false, auto: o.auto });
      s.activeId = o.id; o.el = 0;
      log('waiting', 'Waiting for the human approval before the merge', o.id);
    },
    finish() { s.status = 'completed'; s.activeId = null; log('done', 'Run completed: the change is on main'); },
    restart() { reset(); },
  };

  const step = {
    wait: (o, dt) => (o.el += dt) >= o.dur,
    travel(o, dt) {
      const c = s.courier, left = o.to - c.d;
      c.dir = Math.sign(left) || c.dir;
      c.d = Math.abs(left) <= 4.4 * dt ? o.to : c.d + c.dir * 4.4 * dt;
      s.reached = Math.max(s.reached, c.d);
      if (c.d === o.to) { c.moving = false; return true; }
      return false;
    },
    work(o, dt) {
      const st = s.steps[o.id], def = STEP[o.id];
      o.el += dt; st.dur += dt;
      st.progress = Math.min(1, o.el / o.dur);
      st.phase = ['reading', 'thinking', 'writing', 'writing'][Math.min(3, Math.floor(st.progress * 4))];
      const tok = (/opus/.test(def.model) ? 13000 : 8000) * dt, usd = tok * (/opus/.test(def.model) ? 14e-6 : 5e-6);
      st.tokens += tok; s.tokens += tok; st.cost += usd; s.cost += usd;
      if (o.el < o.dur) return false;
      Object.assign(st, { status: o.outcome, phase: null, note: o.note, endedAt: s.clock });
      log(o.outcome, `${o.id}: ${o.note}`, o.id);
      return true;
    },
    supervise(o, dt) {
      o.el += dt; s.cost += 0.02 * dt;
      if (s.sup.state === 'thinking' && o.el > o.dur * 0.72) {
        s.sup.state = 'done';
        log('info', 'Supervisor: retry the step with a fresh session', 'supervisor');
      }
      if (o.el < o.dur) return false;
      Object.assign(s.sup, { state: 'sleeping', target: null });
      return true;
    },
    gate(o, dt) {
      const st = s.steps[o.id];
      o.el += dt; st.dur += dt; st.auto = Math.max(0, o.auto - o.el);
      if (!st.approved && o.el < o.auto) return false;
      Object.assign(st, { status: 'done', note: st.approved ? 'Approved by you.' : 'Approved automatically (demo).', endedAt: s.clock });
      log('done', `approve_merge: ${st.note}`, o.id);
      return true;
    },
    finish: () => true,
    restart: () => true,
  };

  function tick(realDt) {
    if (s.paused) return;
    const dt = Math.min(realDt, 0.1) * s.speed;
    s.clock += dt;
    if (s.status === 'running') s.t += dt;
    if (!cur) {
      cur = queue.shift();
      if (!cur) return;
      begin[cur.op](cur);
      notify();
    }
    if (cur && step[cur.op](cur, dt)) { cur = null; notify(); }
    else if (performance.now() - lastNotify > 130) notify();
  }

  reset();
  return {
    s, tick,
    subscribe: (l) => (listeners.add(l), () => listeners.delete(l)),
    approve() { s.steps.approve_merge.approved = true; },
    setSpeed(v) { s.speed = v; notify(); },
    togglePause() { s.paused = !s.paused; notify(); },
    restart() { reset(); },
  };
})();
const useSim = (sel) => useSyncExternalStore(sim.subscribe, () => sel(sim.s));
const useTick = () => useSim((s) => s.version);

function robotState(st, clock) {
  if (st.status === 'running') return st.phase || 'thinking';
  if (st.status === 'failed') return 'error';
  if (st.status === 'done') return clock - st.endedAt < 5 ? 'done' : 'idle';
  if (st.status === 'changes') return 'idle';
  return 'sleeping';
}
const variantOf = (def) => Robots.variantFor(def.provider, def.model);

// positions of what can be selected: steps, 'supervisor', 'item' (the cart), 'start', 'end'
function entityPos(id, out, lift = 0) {
  if (id === 'item') pointAt(sim.s.courier.d, out);
  else if (id === 'supervisor') out.copy(SUP_POS);
  else if (id === 'start') out.copy(PATH[0]);
  else if (id === 'end') out.copy(PATH[PATH.length - 1]).setX(12);
  else if (STEP[id]) out.set(...stepPos(STEP[id]));
  else out.copy(CENTER);
  out.y += lift;
  return out;
}
const TAG_LIFT = { item: 1.55, supervisor: 3.0, start: 1.7, end: 3.1 };

// ---------------------------------------------------------------------------------------------
// Camera: an isometric-like view that eases to a target (the run, or the selected entity);
// dragging or scrolling hands the camera to the user (MapControls: pan, rotate, zoom).
// ---------------------------------------------------------------------------------------------
const VIEW_DIR = new THREE.Vector3(1, 0.86, 1).normalize();
const rig = {
  targetFn: null, distGoal: 36, free: false, angleGoal: false, onUserMove: null,
  zoom(f) { this.zoomBy = f; },
};
function followRunTarget(out) {
  const s = sim.s;
  if (s.status === 'completed') return out.copy(CENTER);
  pointAt(s.courier.d, out);
  if (!s.courier.moving && s.activeId) { const [x, , z] = stepPos(STEP[s.activeId]); out.lerp(_v.set(x, 0, z), 0.55); }
  return out;
}
const _v = new THREE.Vector3();

function CameraRig() {
  const { camera, gl } = useThree();
  const controls = useMemo(() => {
    const c = new MapControls(camera, gl.domElement);
    Object.assign(c, { enableDamping: true, dampingFactor: 0.12, minDistance: 9, maxDistance: 75, minPolarAngle: 0.35, maxPolarAngle: 1.2, zoomSpeed: 0.8 });
    c.target.copy(CENTER);
    if (COVER) c.enabled = false;
    camera.position.copy(CENTER).addScaledVector(VIEW_DIR, COVER ? 30 : 52);
    return c;

const tagEls = new Map();
const tagRef = (id) => (el) => { if (el) tagEls.set(id, el); else tagEls.delete(id); };

// 3D building blocks
// ---------------------------------------------------------------------------------------------
const U = 0.01; // robots.js draws in units of 1/100 of ours
const geoCache = new Map();
function rbox(w, h, d, r = 0.04) {
  const rr = Math.max(0.001, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
  const key = [w, h, d, rr].map((n) => n.toFixed(3)).join();
  if (!geoCache.has(key)) geoCache.set(key, new RoundedBoxGeometry(w, h, d, 3, rr));
  return geoCache.get(key);
}
// a rounded box by its centre and size
const B = React.forwardRef(({ p, s, c, r, rough = 0.78, emissive, glow = 0, ...rest }, ref) =>
  html`<mesh ref=${ref} position=${p} geometry=${rbox(s[0], s[1], s[2], r)} castShadow receiveShadow ...${rest}>
    <meshStandardMaterial color=${c} roughness=${rough} emissive=${emissive || '#000000'} emissiveIntensity=${glow} />
  </mesh>`);
// robots.js box(x, y, z, W, D, H) (x right, y depth, z up, origin at the robot's corner) → centre + size here
const S = (x, y, z, W, D, H, ox = 75, oy = 75) => ({ p: [(x + W / 2 - ox) * U, (z + H / 2) * U, (y + D / 2 - oy) * U], s: [W * U, H * U, D * U] });

const texCache = new Map();
function svgTexture(svg, w, h) {
  if (texCache.has(svg)) return texCache.get(svg);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const img = new Image();
  img.onload = () => { canvas.getContext('2d').drawImage(img, 0, 0, w, h); tex.needsUpdate = true; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  texCache.set(svg, tex);
  return tex;
}
function canvasTexture(key, w, h, draw) {
  if (texCache.has(key)) return texCache.get(key);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  draw(canvas.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  texCache.set(key, tex);

}
function textTexture(lines, w, h) {
  return canvasTexture('text:' + JSON.stringify(lines) + w + h, w, h, (g) => {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const l of lines) {
      g.font = `${l.weight || 800} ${l.size}px Arial, Helvetica, sans-serif`;
      g.fillStyle = l.color;
      let text = l.text;
      while (g.measureText(text).width > w - 30 && text.length > 4) text = text.slice(0, -2);
      g.fillText(text, w / 2, l.y);
    }

}
// a flat picture on a surface (unlit, so screens and emblems keep their colours)
function Decal({ tex, size, ...rest }) {
  return html`<mesh ...${rest}><planeGeometry args=${size} /><meshBasicMaterial map=${tex} transparent toneMapped=${false} depthWrite=${false} /></mesh>`;
}
const SVG = (viewBox, w, h, inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" width="${w}" height="${h}">${inner}</svg>`;
const nested = (svg, x, y, w, h) => svg.replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${h}" `);

// ---- colour helpers, as in robots.js ----
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const c = (sh) => Math.round(((pa >> sh) & 255) + (((pb >> sh) & 255) - ((pa >> sh) & 255)) * t);
  return '#' + ((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1);
}
const lighten = (h, t) => mix(h, '#ffffff', t), darken = (h, t) => mix(h, '#000000', t);

// The look of a robot: a variant of robots.js in a state, painted in the agent's colour (as Robots.svg does).
function lookFor(variant, color, state) {
  const st = Robots.STATES[state] || Robots.STATES.idle;
  const v = { ...(Robots.VARIANTS[variant] || Robots.VARIANTS.vanilla), ...st };
  if (color) {
    const mark = luma(color) > 0.7 ? darken(color, 0.6) : '#FFFFFF';
    Object.assign(v, { body: color, plate: color, head: lighten(color, 0.7), limb: lighten(color, 0.7), base: darken(color, 0.55), outline: darken(color, 0.65), chestLogo: mark, plateLogo: mark });

}
// the robot's SVG art, cut into the pieces a 3D robot needs
const faceSvg = (v) => SVG('0 0 120 110', 480, 440,
  `<rect x="10" y="20" width="100" height="66" rx="18" fill="${v.screen}" stroke="${v.outline}" stroke-width="3"/>${v.face(v, 'f')}` +
  `<rect x="18" y="26" width="30" height="5" rx="2.5" fill="#fff" opacity=".18"/>`);
const chestSvg = (v) => (v.logo
  ? SVG('-11 -11 22 22', 256, 256, nested(Robots.emblem(v.logo, v.chestLogo || '#fff'), -11, -11, 22, 22))
  : SVG('-21 -21 42 42', 256, 256, `<rect x="-16" y="-10" width="32" height="20" rx="6" fill="${darken(v.body, 0.12)}" stroke="${v.outline}" stroke-width="2.5"/><circle cx="-6" r="3.5" fill="${v.accent}"/><circle cx="6" r="3.5" fill="${lighten(v.body, 0.5)}"/>`));
const plateSvg = (v) => SVG('-36 -36 72 72', 288, 288, `<circle r="32" fill="${v.plate}" stroke="${v.outline}" stroke-width="4"/>` + (v.logo
  ? nested(Robots.emblem(v.logo, v.plateLogo || '#fff'), -22, -22, 44, 44)
  : `<circle r="22" fill="none" stroke="${darken(v.plate, 0.25)}" stroke-width="3"/>`));
const bubbleSvg = (v) => SVG('30 30 184 156', 368, 312, v.overlay.replace('__UNFLIP__', ''));

// A robot of robots.js in 3D: the same boxes (visorBot), its face, emblems and balloon as textures.
function Robot({ variant, color, state, seated = false }) {

  const root = useRef(), head = useRef(), armL = useRef(), armR = useRef(), bubble = useRef();
  const seed = useMemo(() => Math.random() * 10, []);
  const antenna = v.antenna || v.accent;
  const ballMat = useMemo(() => new THREE.MeshStandardMaterial({ color: antenna, emissive: antenna, roughness: 0.4 }), [antenna]);
  useFrame(({ clock }) => {
    if (!root.current) return;
    const t = clock.elapsedTime + seed;
    let x = 0, y = 0, hx = 0, hy = 0, hz = 0, la = 0, ra = 0, glow = 0.9;
    if (state === 'sleeping') { y = Math.sin(t * 1.2) * 0.012; hx = 0.1; glow = 0.1; }
    else if (state === 'thinking') { hz = Math.sin(t * 1.4) * 0.06; hy = Math.sin(t * 0.9) * 0.14; glow = 0.55 + 0.45 * Math.sin(t * 4.5); }

    else if (state === 'writing') { la = Math.max(0, Math.sin(t * 13)) * 0.07; ra = Math.max(0, -Math.sin(t * 13)) * 0.07; hx = 0.07; }

    ${!seated && html`<${B} ...${S(0, 0, 0, 150, 190, 16)} c=${v.base} r=${0.05} />`}

    <group ref=${armL}><${B} ...${S(20, 76, 48, 20, 24, 40)} c=${v.limb} r=${0.05} /></group>
    <group ref=${armR}><${B} ...${S(110, 76, 48, 20, 24, 40)} c=${v.limb} r=${0.05} /></group>

      <${Decal} tex=${svgTexture(faceSvg(v), 480, 440)} size=${[1.2, 1.1]} position=${[0, 0, 0.607]} />
      <${Decal} tex=${svgTexture(plateSvg(v), 288, 288)} size=${[0.72, 0.72]} position=${[0.607, 0, 0]} rotation=${[0, Math.PI / 2, 0]} />
      ${[-0.3, 0.3].map((x) => html`<group key=${x} position=${[x, 0.55, 0]}>
        <mesh position=${[0, 0.12, 0]} castShadow><cylinderGeometry args=${[0.025, 0.025, 0.24, 8]} /><meshStandardMaterial color=${v.outline} /></mesh>

// The supervisor on its podium; while it works on a failed step, packets fly to that step.
function Supervisor({ selected, onSelect }) {
  const state = useSim((s) => s.sup.state);

    if (!target) return null;

  });

// The work item: a cart that carries the change (and its handoff note) from step to step.
function Courier({ selected, onSelect }) {
  const ref = useRef(), box = useRef();
  const pos = useMemo(() => new THREE.Vector3(), []);
  useFrame(({ clock }, dt) => {
    const c = sim.s.courier;
    pointAt(c.d, pos);
    ref.current.position.copy(pos);
    // heading: along the segment it is on, in its direction of travel
    let i = 0;
    while (i < PATH.length - 2 && c.d > CUM[i + 1] + 1e-6) i++;
    const dx = (PATH[i + 1].x - PATH[i].x) * c.dir, dz = (PATH[i + 1].z - PATH[i].z) * c.dir;
    const want = Math.atan2(dx, dz);
    let diff = want - ref.current.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    ref.current.rotation.y += diff * (1 - Math.exp(-dt * 9));
    box.current.position.y = 0.62 + Math.sin(clock.elapsedTime * (c.moving ? 9 : 2.5)) * (c.moving ? 0.012 : 0.03);
  });
  return html`<group ref=${ref} onClick=${(e) => { e.stopPropagation(); onSelect('item'); }} ...${pointer}>
    ${selected && html`<${SelectionRing} r=${1.0} />`}
    <${B} p=${[0, 0.27, 0]} s=${[0.78, 0.16, 1.15]} c="#2B3350" r=${0.06} />
    ${[[-0.36, 0.38], [0.36, 0.38], [-0.36, -0.38], [0.36, -0.38]].map(([x, z]) => html`<mesh key=${x + ':' + z} position=${[x, 0.15, z]} rotation-z=${Math.PI / 2} castShadow>
      <cylinderGeometry args=${[0.15, 0.15, 0.12, 16]} /><meshStandardMaterial color="#12141A" roughness=${0.9} /></mesh>`)}
    <group ref=${box} position=${[0, 0.62, -0.05]}>
      <${B} p=${[0, 0, 0]} s=${[0.62, 0.52, 0.72]} c="#4C6FFF" r=${0.06} rough=${0.5} />
      <${B} p=${[0, 0.27, 0]} s=${[0.64, 0.05, 0.2]} c="#FFFFFF" r=${0.02} castShadow=${false} />
      <${B} p=${[0, 0.31, 0.08]} s=${[0.4, 0.03, 0.5]} c="#F4F1EA" r=${0.01} castShadow=${false} />
    </group>
    <mesh position=${[0, 0.36, 0.585]}><sphereGeometry args=${[0.05, 8, 8]} /><meshBasicMaterial color="#FFE9A8" toneMapped=${false} /></mesh>
  </group>`;
}

// The route on the floor: grey where the work item has not been yet, blue where it has.
function Route() {
  const done = useRef([]);
  const segs = useMemo(() => PATH.slice(0, -1).map((a, i) => {
    const b = PATH[i + 1], alongX = Math.abs(b.x - a.x) > 0.01;
    return { a, b, len: a.distanceTo(b), alongX, mid: a.clone().lerp(b, 0.5), dir: b.clone().sub(a).normalize() };
  }), []);
  useFrame(() => {
    segs.forEach((g, i) => {
      const m = done.current[i], covered = Math.max(0, Math.min(g.len, sim.s.reached - CUM[i]));
      m.visible = covered > 0.02;
      m.scale.x = Math.max(0.001, covered);
      m.position.copy(g.a).addScaledVector(g.dir, covered / 2).setY(0.035);
    });
  });
  return html`<group>
    ${segs.map((g, i) => html`<group key=${i}>
      <mesh position=${[g.mid.x, 0.012, g.mid.z]} rotation-y=${g.alongX ? 0 : Math.PI / 2} receiveShadow>
        <boxGeometry args=${[g.len + 0.9, 0.02, 0.9]} /><meshStandardMaterial color="#DDE3F0" roughness=${0.9} />
      </mesh>
      <mesh ref=${(m) => { done.current[i] = m; }} rotation-y=${g.alongX ? 0 : Math.PI / 2}>
        <boxGeometry args=${[1, 0.02, 0.2]} /><meshBasicMaterial color="#4C6FFF" toneMapped=${false} />
      </mesh>
    </group>`)}
    ${STEPS.filter((s) => s.kind !== 'gate').map((s) => html`<${Dock} key=${s.id} def=${s} />`)}
  </group>`;
}

  return html`<section className="list card">
    <div className="tabs">
      <button className=${tab === 'steps' ? 'on' : ''} onClick=${() => setTab('steps')}>Steps<small>${steps.length}</small></button>
      <button className=${tab === 'agents' ? 'on' : ''} onClick=${() => setTab('agents')}>Agents<small>${agents.length}</small></button>
      <button className=${tab === 'events' ? 'on' : ''} onClick=${() => setTab('events')}>Events<small>${events.length}</small></button>
    </div>
    <div className="scroll">${body.length ? body : html`<div className="empty">Nothing matches “${query}”.</div>`}</div>
  </section>`;
}

function Pipeline({ shown, onSelect }) {
  useTick();
  const s = sim.s;
  const at = s.status === 'completed' ? 'delivered to main' : s.courier.moving ? `to ${s.activeId || 'main'}` : s.activeId ? `at ${s.activeId}` : 'in the issue inbox';
  return html`<section className="pipe card">
    <div className="pipe-main">
      <div className="pipe-title">Run pipeline<span>${s.events[0]?.text}</span></div>
      <div className="miles">${GROUPS.map((g) => {
        const defs = STEPS.filter((d) => d.group === g), sts = defs.map((d) => s.steps[d.id]);
        const done = sts.every((x) => x.status === 'done');
        const live = defs.find((d) => !['pending', 'done'].includes(s.steps[d.id].status)) || defs.find((d) => d.id === s.activeId);
        const status = live ? s.steps[live.id].status : 'pending';
        const cls = done ? 'done' : live ? 'active' : '';
        const dur = sts.reduce((a, x) => a + x.dur, 0);
        return html`<button key=${g} className=${'mile ' + cls} style=${{ '--c': STATUS[status === 'pending' ? 'running' : status].color }} onClick=${() => onSelect((live || defs[0]).id)}>
          <i>${done && html`<${Icon} name="check" size=${13} />`}</i>
          <b>${g}</b><small>${done ? clockOf(dur) : live ? (status === 'pending' ? 'arriving' : STATUS[status].label.toLowerCase()) : 'queued'}</small>
        </button>`;
      })}</div>
    </div>
    <button className=${'item' + (shown === 'item' ? ' sel' : '')} onClick=${() => onSelect('item')}>
      <i><${Icon} name="box" size=${20} /></i><span><b>Issue ${RUN.issue}</b><small>${RUN.title}</small><small>${at}</small></span>
    </button>
  </section>`;
}

// The floating tags over the scene: one per step, plus the supervisor, the work item and both ends.
function Tags({ shown, onSelect }) {
  useTick();
  const s = sim.s;
  return html`<div className="tags">
    <div className="tag dim" ref=${tagRef('start')}><i className="dot" style=${{ '--c': '#A7B0C2' }} />issue ${RUN.issue}</div>
    <div className="tag dim" ref=${tagRef('end')}><i className="dot" style=${{ '--c': s.status === 'completed' ? STATUS.done.color : '#A7B0C2' }} />main</div>
    ${STEPS.map((d) => {
      const st = s.steps[d.id];
      return html`<div key=${d.id} ref=${tagRef(d.id)} className=${'tag' + (shown === d.id ? ' sel' : '') + (st.status === 'pending' ? ' dim' : '')} onClick=${() => onSelect(d.id)}>
        <i className=${'dot' + (st.status === 'running' || st.status === 'waiting' ? ' live' : '')} style=${{ '--c': STATUS[st.status].color }} />${d.id}
        ${st.status !== 'pending' && html`<span>${st.status === 'running' ? st.phase : STATUS[st.status].label.toLowerCase()}</span>`}
      </div>`;
    })}
    <div ref=${tagRef('supervisor')} className=${'tag' + (shown === 'supervisor' ? ' sel' : '') + (s.sup.target ? '' : ' dim')} onClick=${() => onSelect('supervisor')}>
      <i className=${'dot' + (s.sup.target ? ' live' : '')} style=${{ '--c': '#7C5CFF' }} />supervisor${s.sup.target && html`<span>unblocking ${s.sup.target}</span>`}</div>
    <div ref=${tagRef('item')} className=${'tag' + (shown === 'item' ? ' sel' : '')} onClick=${() => onSelect('item')}>
      <i className="dot" style=${{ '--c': '#4C6FFF' }} />${RUN.issue}</div>
  </div>`;
}

function App() {
  const [sel, setSel] = useState(null); // the entity pinned by the user
  const [follow, setFollow] = useState(true); // the camera and the detail card follow the run
  const [query, setQuery] = useState('');
  const activeId = useSim((s) => s.activeId);
  const shown = follow ? (activeId || 'item') : sel;
  const live = useRef({});
  live.current = { shown, follow };

  const select = (id) => {
    setSel(id); setFollow(false);
    Object.assign(rig, { free: false, distGoal: id === 'item' ? 22 : 26, targetFn: (out) => entityPos(id, out, 1) });
  };
  const followRun = () => { setFollow(true); Object.assign(rig, { free: false, distGoal: 36, targetFn: followRunTarget }); };
  const overview = () => { setSel(null); setFollow(false); Object.assign(rig, { free: false, distGoal: 50, angleGoal: true, targetFn: (out) => out.copy(CENTER) }); };
  useEffect(() => {
    if (COVER) rig.distGoal = 30;
    rig.targetFn = followRunTarget;
    // dragging the scene pins what was shown and stops following the run
    rig.onUserMove = () => { if (live.current.follow) { setSel(live.current.shown); setFollow(false); } };
  }, []);

  return html`<div>
    <div className="stage">
      <${Canvas} shadows flat dpr=${[1, 2]} camera=${{ fov: 30, near: 1, far: 400 }} onPointerMissed=${() => {}}>
        <color attach="background" args=${['#E8EDF7']} />
        <${Scene} shown=${shown} onSelect=${select} />
      <//>
    </div>
    <${Tags} shown=${shown} onSelect=${select} />
    ${!COVER && html`<div className="hud">
      <${TopBar} query=${query} setQuery=${setQuery} />
      <${Kpis} />
      <div className="poc card">Simulated run · drag to pan, right-drag to rotate, scroll to zoom</div>
      <div className="zoom card">
        <button title="Zoom in" onClick=${() => rig.zoom(0.78)}><${Icon} name="plus" /></button>
        <button title="Zoom out" onClick=${() => rig.zoom(1.28)}><${Icon} name="minus" /></button>
        <button title="Whole floor" onClick=${overview}><${Icon} name="home" /></button>
        <button title="Follow the run" className=${follow ? 'on' : ''} onClick=${followRun}><${Icon} name="follow" /></button>
      </div>
      <${Detail} shown=${shown || 'item'} />
      <${List} shown=${shown} onSelect=${select} query=${query} />
      <${Pipeline} shown=${shown} onSelect=${select} />
    </div>`}
  </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
