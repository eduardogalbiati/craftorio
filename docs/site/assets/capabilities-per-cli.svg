<text x="24" y="460" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="start">Context economy, not a security boundary: only Codex’s sandbox is enforced by the OS.</text>
<text x="24" y="482" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="start">What a CLI cannot enforce is written to the run log, once per agent.</text>
