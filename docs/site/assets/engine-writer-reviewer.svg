<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, system-ui, sans-serif" font-size="15">
<rect width="1000" height="330" rx="12" fill="#0e1014"/>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a91a3"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c9cff"/></marker></defs>
<text x="24" y="40" fill="#e6e8ee" font-size="17" font-weight="600" text-anchor="start">workflows/writer-reviewer.yaml</text>
<text x="24" y="62" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="start">the engine decides by the reviewer's score; two steps are human gates (yellow)</text>
<rect x="60" y="96" width="150" height="64" rx="10" fill="#151820" stroke="#c084fc" stroke-opacity="0.8"/>
<text x="135" y="124" fill="#e6e8ee" font-size="15" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">write</text>
<text x="135" y="146" fill="#c084fc" font-size="13.5" font-weight="400" text-anchor="middle">writer</text>
<rect x="310" y="96" width="150" height="64" rx="10" fill="#151820" stroke="#c084fc" stroke-opacity="0.8"/>
<text x="385" y="124" fill="#e6e8ee" font-size="15" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">review</text>
<text x="385" y="146" fill="#c084fc" font-size="13.5" font-weight="400" text-anchor="middle">reviewer</text>
<rect x="560" y="96" width="150" height="64" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.8"/>
<text x="635" y="124" fill="#e6e8ee" font-size="15" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">signoff</text>
<text x="635" y="146" fill="#7c9cff" font-size="13.5" font-weight="400" text-anchor="middle">supervisor</text>
<rect x="810" y="96" width="150" height="64" rx="10" fill="#151820" stroke="#facc15" stroke-opacity="0.8"/>
<text x="885" y="124" fill="#e6e8ee" font-size="15" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">decide</text>
<text x="885" y="146" fill="#facc15" font-size="13.5" font-weight="400" text-anchor="middle">you</text>
<rect x="310" y="210" width="150" height="64" rx="10" fill="#151820" stroke="#facc15" stroke-opacity="0.8"/>
<text x="385" y="238" fill="#e6e8ee" font-size="15" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">out_of_rounds</text>
<text x="385" y="260" fill="#facc15" font-size="13.5" font-weight="400" text-anchor="middle">you</text>
<line x1="210" y1="128" x2="310" y2="128" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<line x1="460" y1="128" x2="560" y2="128" stroke="#4ade80" stroke-width="1.8" marker-end="url(#a-ok)"/>
<text x="510" y="116" fill="#4ade80" font-size="12.5" font-weight="400" text-anchor="middle">score ≥ threshold</text>
<line x1="710" y1="128" x2="810" y2="128" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<path d="M 400 160 V 182 H 135 V 162" fill="none" stroke="#fb923c" stroke-width="1.8" marker-end="url(#a-warn)"/>
<text x="255" y="176" fill="#fb923c" font-size="13" font-weight="400" text-anchor="middle">below threshold · up to max_rounds</text>
<line x1="430" y1="160" x2="430" y2="210" stroke="#f87171" stroke-width="1.8" marker-end="url(#a-bad)"/>
<text x="440" y="200" fill="#f87171" font-size="13" font-weight="400" text-anchor="start">rounds used up</text>
<path d="M 885 160 V 300 H 100 V 162" fill="none" stroke="#8a91a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-g)"/>
<text x="640" y="294" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">revise: your instructions go into every next prompt</text>
<line x1="960" y1="128" x2="986" y2="128" stroke="#4ade80" stroke-width="1.8" marker-end="url(#a-ok)"/>
<text x="962" y="150" fill="#4ade80" font-size="12.5" font-weight="400" text-anchor="start">accept</text>
</svg>
