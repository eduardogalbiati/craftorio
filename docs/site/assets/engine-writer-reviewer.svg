<text x="600" y="220" text-anchor="middle" fill="#8a91a3" font-size="10.5">revise (your instructions go into every next prompt)</text>
<line x1="910" y1="108" x2="945" y2="108" stroke="#4ade80" stroke-width="1.5" marker-end="url(#a-ok)"/>
<text x="927.5" y="101.0" text-anchor="middle" fill="#4ade80" font-size="10.5">accept</text>
<text x="24" y="40" fill="#e6e8ee" font-size="14" font-weight="600">workflows/writer-reviewer.yaml</text>
<text x="24" y="58" fill="#8a91a3" font-size="11.5">the engine decides by the reviewer's score; two steps are human gates (yellow)</text>
</svg>