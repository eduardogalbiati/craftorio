<text x="664" y="101" fill="#e6e8ee" font-size="17" font-weight="600" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">decide</text>
<text x="664" y="125" fill="#facc15" font-size="15" font-weight="400" text-anchor="middle">you</text>
