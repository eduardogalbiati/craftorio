<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 346" font-family="Segoe UI, system-ui, sans-serif" font-size="15">
<rect width="1000" height="346" rx="12" fill="#0e1014"/>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a91a3"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c9cff"/></marker></defs>
<text x="24" y="44" fill="#e6e8ee" font-size="17" font-weight="600" text-anchor="start">One visit of a step</text>
<rect x="24" y="74" width="172" height="92" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.7"/>
<text x="110" y="112" fill="#7c9cff" font-size="15.5" font-weight="700" text-anchor="middle">Pick the step</text>
<text x="110" y="138" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">by the last transition</text>
<line x1="199" y1="120" x2="216" y2="120" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<rect x="219" y="74" width="172" height="92" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.7"/>
<text x="305" y="112" fill="#7c9cff" font-size="15.5" font-weight="700" text-anchor="middle">Render the prompt</text>
<text x="305" y="138" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">inputs, outputs, feedback</text>
<line x1="394" y1="120" x2="411" y2="120" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<rect x="414" y="74" width="172" height="92" rx="10" fill="#151820" stroke="#fb923c" stroke-opacity="0.7"/>
<text x="500" y="112" fill="#fb923c" font-size="15.5" font-weight="700" text-anchor="middle">Agent turn</text>
<text x="500" y="138" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">one headless CLI process</text>
<line x1="589" y1="120" x2="606" y2="120" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<rect x="609" y="74" width="172" height="92" rx="10" fill="#151820" stroke="#4ade80" stroke-opacity="0.7"/>
<text x="695" y="112" fill="#4ade80" font-size="15.5" font-weight="700" text-anchor="middle">Check the answer</text>
<text x="695" y="138" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">output_schema, retries</text>
<line x1="784" y1="120" x2="801" y2="120" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<rect x="804" y="74" width="172" height="92" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.7"/>
<text x="890" y="112" fill="#7c9cff" font-size="15.5" font-weight="700" text-anchor="middle">Transitions</text>
<text x="890" y="138" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">when → goto, loops</text>
<path d="M 890 166 V 210 H 110 V 168" fill="none" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<text x="500" y="204" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="middle">next step · the same step again (a visit) · a human gate (the run waits) · end</text>
<rect x="24" y="262" width="468" height="60" rx="8" fill="#151820" stroke="#262b37" stroke-opacity="1"/>
<text x="40" y="287" fill="#f87171" font-size="14.5" font-weight="700" text-anchor="start">On a failure</text>
<text x="40" y="309" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="start">the supervisor is called, a few times per step at most; never for a gate</text>
<rect x="508" y="262" width="468" height="60" rx="8" fill="#151820" stroke="#262b37" stroke-opacity="1"/>
<text x="524" y="287" fill="#4ade80" font-size="14.5" font-weight="700" text-anchor="start">Everything is recorded</text>
<text x="524" y="309" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="start">events.jsonl, summary.json, sessions, handoffs, evidence</text>
</svg>
