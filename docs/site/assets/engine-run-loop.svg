<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
<rect width="960" height="300" rx="12" fill="#0e1014"/>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a91a3"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c9cff"/></marker></defs>
<rect x="24" y="70" width="160" height="78" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity=".7"/>
<text x="104" y="102" text-anchor="middle" fill="#7c9cff" font-size="13.5" font-weight="700">Pick the step</text>
<text x="104" y="124" text-anchor="middle" fill="#8a91a3" font-size="11">by the last transition</text>
<line x1="187.0" y1="109" x2="209.0" y2="109" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a-g)"/>
<rect x="212" y="70" width="160" height="78" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity=".7"/>
<text x="292" y="102" text-anchor="middle" fill="#7c9cff" font-size="13.5" font-weight="700">Render the prompt</text>
<text x="292" y="124" text-anchor="middle" fill="#8a91a3" font-size="11">inputs, steps.*.output, feedback</text>
<line x1="375.0" y1="109" x2="397.0" y2="109" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a-g)"/>
<rect x="400" y="70" width="160" height="78" rx="10" fill="#151820" stroke="#fb923c" stroke-opacity=".7"/>
<text x="480" y="102" text-anchor="middle" fill="#fb923c" font-size="13.5" font-weight="700">Agent turn</text>
<text x="480" y="124" text-anchor="middle" fill="#8a91a3" font-size="11">one headless CLI process</text>
<line x1="563.0" y1="109" x2="585.0" y2="109" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a-g)"/>
<rect x="588" y="70" width="160" height="78" rx="10" fill="#151820" stroke="#4ade80" stroke-opacity=".7"/>
<text x="668" y="102" text-anchor="middle" fill="#4ade80" font-size="13.5" font-weight="700">Check the answer</text>
<text x="668" y="124" text-anchor="middle" fill="#8a91a3" font-size="11">output_schema, retries</text>
<line x1="751.0" y1="109" x2="773.0" y2="109" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a-g)"/>
<rect x="776" y="70" width="160" height="78" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity=".7"/>
<text x="856" y="102" text-anchor="middle" fill="#7c9cff" font-size="13.5" font-weight="700">Transitions</text>
<text x="856" y="124" text-anchor="middle" fill="#8a91a3" font-size="11">when → goto, loops, actions</text>
<path d="M 856 148 V 188 H 104.0 V 148" fill="none" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a-g)"/>
<text x="480" y="182" text-anchor="middle" fill="#8a91a3" font-size="11">next step · the same step again (a visit) · a human gate (the run waits) · end</text>
<rect x="24" y="226" width="440" height="50" rx="8" fill="#151820" stroke="#262b37"/>
<text x="40" y="247" fill="#f87171" font-size="12" font-weight="700">On a failure</text>
<text x="40" y="265" fill="#8a91a3" font-size="11.5">the supervisor is called (bounded per step); it never answers a human gate.</text>
<rect x="496" y="226" width="440" height="50" rx="8" fill="#151820" stroke="#262b37"/>
<text x="512" y="247" fill="#4ade80" font-size="12" font-weight="700">Everything is recorded</text>
<text x="512" y="265" fill="#8a91a3" font-size="11.5">events.jsonl, summary.json, sessions, handoff notes, outputs, evidence.</text>
<text x="24" y="40" fill="#e6e8ee" font-size="14" font-weight="600">One visit of a step</text>
</svg>