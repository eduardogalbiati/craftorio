<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
<rect width="960" height="200" rx="12" fill="#0e1014"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a91a3"/></marker></defs>
<rect x="24" y="40" width="190" height="92" rx="10" fill="#151820" stroke="#c084fc" stroke-opacity=".6"/>
<text x="119" y="70" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="700">UI</text>
<text x="119" y="92" text-anchor="middle" fill="#e6e8ee" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace" font-size="11.5">packages/ui-kit + fronts</text>
<text x="119" y="112" text-anchor="middle" fill="#8a91a3" font-size="11.5">desktop window or browser</text>
<line x1="218" y1="86.0" x2="261" y2="86.0" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a)"/>
<text x="239" y="78.0" text-anchor="middle" fill="#8a91a3" font-size="10.5">window.api (IPC or HTTP/WS)</text>
<rect x="265" y="40" width="190" height="92" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity=".6"/>
<text x="360" y="70" text-anchor="middle" fill="#7c9cff" font-size="15" font-weight="700">Service</text>
<text x="360" y="92" text-anchor="middle" fill="#e6e8ee" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace" font-size="11.5">packages/engine/service</text>
<text x="360" y="112" text-anchor="middle" fill="#8a91a3" font-size="11.5">channels, one per area</text>
<line x1="459" y1="86.0" x2="501" y2="86.0" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a)"/>
<text x="480" y="78.0" text-anchor="middle" fill="#8a91a3" font-size="10.5">calls</text>
<rect x="505" y="40" width="190" height="92" rx="10" fill="#151820" stroke="#4ade80" stroke-opacity=".6"/>
<text x="600" y="70" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="700">Engine</text>
<text x="600" y="92" text-anchor="middle" fill="#e6e8ee" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace" font-size="11.5">packages/engine/engine</text>
<text x="600" y="112" text-anchor="middle" fill="#8a91a3" font-size="11.5">walks the workflow graph</text>
<line x1="699" y1="86.0" x2="742" y2="86.0" stroke="#8a91a3" stroke-width="1.5" marker-end="url(#a)"/>
<text x="721" y="78.0" text-anchor="middle" fill="#8a91a3" font-size="10.5">spawns</text>
<rect x="746" y="40" width="190" height="92" rx="10" fill="#151820" stroke="#fb923c" stroke-opacity=".6"/>
<text x="841" y="70" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="700">Agent CLIs</text>
<text x="841" y="92" text-anchor="middle" fill="#e6e8ee" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace" font-size="11.5">claude · codex · grok</text>
<text x="841" y="112" text-anchor="middle" fill="#8a91a3" font-size="11.5">one headless process per turn</text>
<text x="480" y="178" text-anchor="middle" fill="#8a91a3" font-size="11.5">Everything a run produces is written to &lt;workspace&gt;/runs/&lt;run&gt;/ · the workspace is the product</text>
</svg>