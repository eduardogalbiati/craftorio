<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="Segoe UI, system-ui, sans-serif" font-size="16">
<rect width="820" height="600" rx="12" fill="#0e1014"/>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a91a3"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c9cff"/></marker></defs>
<rect x="24" y="24" width="330" height="96" rx="10" fill="#151820" stroke="#c084fc" stroke-opacity="0.7"/>
<text x="42" y="58" fill="#c084fc" font-size="20" font-weight="700" text-anchor="start">UI</text>
<text x="42" y="84" fill="#e6e8ee" font-size="15.5" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/ui-kit + fronts</text>
<text x="42" y="106" fill="#8a91a3" font-size="14.5" font-weight="400" text-anchor="start">the desktop window, or a browser</text>
<line x1="189" y1="123" x2="189" y2="161" stroke="#8a91a3" stroke-width="2" marker-end="url(#a-g)"/>
<text x="203" y="147" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="start">window.api: IPC in the app, HTTP/WebSocket from a browser</text>
<rect x="24" y="164" width="330" height="96" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.7"/>
<text x="42" y="198" fill="#7c9cff" font-size="20" font-weight="700" text-anchor="start">Service</text>
<text x="42" y="224" fill="#e6e8ee" font-size="15.5" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/engine/service</text>
<text x="42" y="246" fill="#8a91a3" font-size="14.5" font-weight="400" text-anchor="start">channels, one per area of the UI</text>
<line x1="189" y1="263" x2="189" y2="301" stroke="#8a91a3" stroke-width="2" marker-end="url(#a-g)"/>
<text x="203" y="287" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="start">calls</text>
<rect x="24" y="304" width="330" height="96" rx="10" fill="#151820" stroke="#4ade80" stroke-opacity="0.7"/>
<text x="42" y="338" fill="#4ade80" font-size="20" font-weight="700" text-anchor="start">Engine</text>
<text x="42" y="364" fill="#e6e8ee" font-size="15.5" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/engine/engine</text>
<text x="42" y="386" fill="#8a91a3" font-size="14.5" font-weight="400" text-anchor="start">walks the workflow graph, stops at gates</text>
<line x1="189" y1="403" x2="189" y2="441" stroke="#8a91a3" stroke-width="2" marker-end="url(#a-g)"/>
<text x="203" y="427" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="start">spawns</text>
<rect x="24" y="444" width="330" height="96" rx="10" fill="#151820" stroke="#fb923c" stroke-opacity="0.7"/>
<text x="42" y="478" fill="#fb923c" font-size="20" font-weight="700" text-anchor="start">Agent CLIs</text>
<text x="42" y="504" fill="#e6e8ee" font-size="15.5" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">claude · codex · grok</text>
<text x="42" y="526" fill="#8a91a3" font-size="14.5" font-weight="400" text-anchor="start">one headless process per turn</text>
<text x="24" y="562" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">Everything a run produces goes to &lt;workspace&gt;/runs/&lt;run&gt;/: the workspace is the product.</text>
<text x="430" y="60" fill="#e6e8ee" font-size="15.5" font-weight="600" text-anchor="start">The UI never reads files or runs code:</text>
<text x="430" y="84" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">it asks the service, through one API,</text>
<text x="430" y="106" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">whether it runs in Electron or a browser.</text>
<text x="430" y="200" fill="#e6e8ee" font-size="15.5" font-weight="600" text-anchor="start">The engine is deterministic:</text>
<text x="430" y="224" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">the YAML decides the next step; a model</text>
<text x="430" y="246" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">only runs inside an agent turn.</text>
<text x="430" y="340" fill="#e6e8ee" font-size="15.5" font-weight="600" text-anchor="start">A turn is a process:</text>
<text x="430" y="364" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">claude -p, codex exec or grok, with the</text>
<text x="430" y="386" fill="#8a91a3" font-size="15" font-weight="400" text-anchor="start">flags that match the agent's capabilities.</text>
</svg>
