<rect x="24" y="44" width="205" height="108" rx="10" fill="#151820" stroke="#c084fc" stroke-opacity="0.7"/>
<text x="126.5" y="80" fill="#c084fc" font-size="18" font-weight="700" text-anchor="middle">UI</text>
<text x="126.5" y="106" fill="#e6e8ee" font-size="13.5" font-weight="400" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/ui-kit + fronts</text>
<text x="126.5" y="130" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="middle">desktop window or browser</text>
<line x1="233" y1="98" x2="269" y2="98" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<text x="251" y="89" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">window.api (IPC or HTTP/WS)</text>
<rect x="273" y="44" width="205" height="108" rx="10" fill="#151820" stroke="#7c9cff" stroke-opacity="0.7"/>
<text x="375.5" y="80" fill="#7c9cff" font-size="18" font-weight="700" text-anchor="middle">Service</text>
<text x="375.5" y="106" fill="#e6e8ee" font-size="13.5" font-weight="400" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/engine/service</text>
<text x="375.5" y="130" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="middle">channels, one per area</text>
<line x1="482" y1="98" x2="518" y2="98" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<text x="500" y="89" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">calls</text>
<rect x="522" y="44" width="205" height="108" rx="10" fill="#151820" stroke="#4ade80" stroke-opacity="0.7"/>
<text x="624.5" y="80" fill="#4ade80" font-size="18" font-weight="700" text-anchor="middle">Engine</text>
<text x="624.5" y="106" fill="#e6e8ee" font-size="13.5" font-weight="400" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">packages/engine/engine</text>
<text x="624.5" y="130" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="middle">walks the workflow graph</text>
<line x1="731" y1="98" x2="767" y2="98" stroke="#8a91a3" stroke-width="1.8" marker-end="url(#a-g)"/>
<text x="749" y="89" fill="#8a91a3" font-size="13" font-weight="400" text-anchor="middle">spawns</text>
<rect x="771" y="44" width="205" height="108" rx="10" fill="#151820" stroke="#fb923c" stroke-opacity="0.7"/>
<text x="873.5" y="80" fill="#fb923c" font-size="18" font-weight="700" text-anchor="middle">Agent CLIs</text>
<text x="873.5" y="106" fill="#e6e8ee" font-size="13.5" font-weight="400" text-anchor="middle" font-family="Cascadia Code, Consolas, SF Mono, Menlo, monospace">claude · codex · grok</text>
<text x="873.5" y="130" fill="#8a91a3" font-size="13.5" font-weight="400" text-anchor="middle">one headless process per turn</text>
<text x="500" y="204" fill="#8a91a3" font-size="14" font-weight="400" text-anchor="middle">Everything a run produces is written to &lt;workspace&gt;/runs/&lt;run&gt;/ · the workspace is the product</text>
