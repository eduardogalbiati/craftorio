# Automatic production deploy: every push/merge to main builds the packaged
# Windows app and publishes it as a GitHub Release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: read        # scripts/ci-plan.js: the ci/tested status CI left on the PR head
  pull-requests: read   # scripts/ci-plan.js: the PR merged as this commit

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30   # a hung job must not eat the quota
    steps:
      - uses: actions/checkout@v5
      # The PR's CI already tested this code when the merge kept the tree CI tested (main unchanged since):
      # do not repeat `npm test` (Windows minutes count x2).
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js tested "${{ github.sha }}" --merged
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        if: steps.plan.outputs.tested != 'true'
        env:
          MULTIAGENT_SIMULATION_ONLY: "1"   # automated checks never call real models
      - name: Package app (win32 x64)
        run: npm run package
      - name: Compress
        shell: pwsh
        run: Compress-Archive -Path dist/MultiagentOrchestrator-win32-x64/* -DestinationPath MultiagentOrchestrator-win32-x64.zip
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" MultiagentOrchestrator-win32-x64.zip \
            --target "${{ github.sha }}" --title "$TAG" --generate-notes --latest
          echo "Release published: $TAG"
