# Automatic production deploy: every push/merge to main builds the packaged
# Windows app and publishes it as a GitHub Release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MULTIAGENT_SIMULATION_ONLY: "1"   # automated checks never call real models
      - name: Package app (win32 x64)
        run: npm run package
      - name: Compress
        shell: pwsh
        run: Compress-Archive -Path dist/MultiagentOrchestrator-win32-x64/* -DestinationPath MultiagentOrchestrator-win32-x64.zip
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" MultiagentOrchestrator-win32-x64.zip \
            --target "${{ github.sha }}" --title "$TAG" --generate-notes --latest
          echo "Release published: $TAG"
