# Builds only for a release (owner decision of 2026-10-31, docs/agents/decisions.md): GitHub Actions
# minutes are spent when a version ships, not on every merge.
# - pushing a vX.Y.Z tag (the app's "Promote to stable" on the Releases screen pushes it) builds the
#   packaged app for Windows, macOS and Linux (one job per OS and architecture), runs `npm test` and
#   smoke-tests each package in simulation, and publishes them together as the release vX.Y.Z, marked
#   latest;
# - a run by hand on main publishes a PRERELEASE v<package.json version>-rc.N (N: the rcs of that
#   version so far + 1), never latest, to try a build before tagging it.
# A push to main builds nothing. Every release carries SHA256SUMS of its packages, signed with cosign
# keyless (SHA256SUMS.sigstore.json), and the sums in its notes (#557).
# macOS builds are not signed nor notarized (README "Install").
name: Deploy

on:
  push:
    tags: ['v*', '!v*-rc.*']
  workflow_dispatch:

permissions:
  contents: write
  statuses: read        # scripts/ci-plan.js: the ci/tested status CI left on the PR head
  pull-requests: read   # scripts/ci-plan.js: the PR merged as this commit

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Assets: Craftorio-<platform>-<arch>.<ext> (scripts/release-assets.js)
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false  # every OS runs to the end (no paid minutes thrown away); publish still needs all of them
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            assets: Craftorio-win32-x64.zip
          - os: macos-latest      # Apple Silicon
            platform: darwin
            arch: arm64
            assets: Craftorio-darwin-arm64.zip
          - os: macos-15-intel    # Intel: its smoke test runs natively
            platform: darwin
            arch: x64
            assets: Craftorio-darwin-x64.zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            assets: |
              Craftorio-linux-x64.AppImage
              Craftorio-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150   # a hung job must not eat the quota; the Windows `npm test` alone takes ~100 min on 2 CPUs (a private repository)
    defaults:
      run:
        shell: bash   # Git Bash on Windows: the same scripts on every OS
    steps:
      - uses: actions/checkout@v7
      # The PR's CI already tested this code when the merge kept the tree CI tested (main unchanged since):
      # do not repeat `npm test`. CI runs only by hand now, so a release usually runs the tests here.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js tested "${{ github.sha }}" --merged
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux build tools (node-pty, AppImage, display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb desktop-file-utils   # appimagetool 1.9.0 stops without desktop-file-validate
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      # apps/desktop/scripts/package.js builds the native sidecars (native/, #341) for this leg's target into resources/bin/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - run: npm test
        if: steps.plan.outputs.tested != 'true'
        env:
          CRAFTORIO_SIMULATION_ONLY: "1"   # automated checks never call real models
      # node-pty has no Linux prebuild: npm ci compiled it for Node; build it again for Electron's ABI
      - name: node-pty for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          export npm_config_runtime=electron
          export npm_config_target="$(node -p "require('electron/package.json').version")"
          export npm_config_disturl=https://electronjs.org/headers
          export npm_config_build_from_source=true
          npm rebuild node-pty
      - name: Package app (${{ matrix.platform }} ${{ matrix.arch }})
        run: npm run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Release assets
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE on the runner
        run: node scripts/release-assets.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      # The packaged app opens its window in simulation on a scratch workspace and quits by itself
      # (scripts/smoke-package.js); Linux runs the AppImage (its AppRun) on a virtual display
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        env:
          CRAFTORIO_SIMULATION_ONLY: "1"
        run: node scripts/smoke-package.js
      - name: Smoke test of the packaged app (AppImage, xvfb-run)
        if: runner.os == 'Linux'
        env:
          CRAFTORIO_SIMULATION_ONLY: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a node scripts/smoke-package.js Craftorio-linux-x64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # a vX.Y.Z tag or main, never a fork: the signature's identity is deploy.yml@refs/tags/vX.Y.Z
    # (deploy.yml@refs/heads/main for an rc by hand) (#557)
    if: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && github.repository == 'eduardogalbiati/craftorio' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # cosign keyless signature of SHA256SUMS (#557)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      # #557: one `sha256sum` line per package, from the files this job uploads (file names without
      # assets/); the same sums go in the release notes, before the generated ones
      - name: SHA256SUMS of the assets
        run: |
          cd assets
          test -n "$(ls -A)"
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          {
            echo "## SHA-256"
            echo
            echo "| Asset | SHA-256 |"
            echo "| --- | --- |"
            while read -r hash file; do echo "| \`${file}\` | \`${hash}\` |"; done < SHA256SUMS
            echo
            echo "Check a download against \`SHA256SUMS\` and its signature \`SHA256SUMS.sigstore.json\`: README \"Install\"."
          } > "$RUNNER_TEMP/sha256-notes.md"
      - uses: sigstore/cosign-installer@v3
      # #557: keyless signature through this job's OIDC token (no key to keep or leak); the bundle
      # binds SHA256SUMS to this repository's deploy.yml on main (cosign verify-blob, README "Install")
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
      # A vX.Y.Z tag: the stable release, latest. The packaged app reports package.json's version: say
      # so when the tag differs (bump package.json before the tag to match).
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          TAG="${{ github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "$TAG" ]; then
            echo "::warning::${TAG} is a build of package.json ${PKG}: the app reports ${PKG}. Bump package.json before tagging to match."
          fi
          gh release create "$TAG" assets/* \
            --verify-tag --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/sha256-notes.md" --latest
          echo "Release published: $TAG"
      - name: Publish release candidate
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          VERSION=$(node -p "require('./package.json').version")
          # N: the candidates (one rc tag per push) since the last stable tag plus this one, the app's
          # rule (packages/engine/domains/releases/releases.js recordCandidate), whatever the number of commits the push carries
          STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc.*' HEAD 2>/dev/null || true)
          if [ -n "$STABLE" ]; then PRIOR=$(git tag --list 'v*-rc.*' --merged HEAD --no-merged "$STABLE" | wc -l); else PRIOR=$(git tag --list 'v*-rc.*' --merged HEAD | wc -l); fi
          N=$((PRIOR + 1))
          # tag the rc here, so the next push counts it
          git tag "v${VERSION}-rc.${N}" HEAD
          RC="v${VERSION}-rc.${N}"
          git push origin "refs/tags/${RC}"
          gh release create "$RC" assets/* \
            --verify-tag --title "$RC" --generate-notes --notes-file "$RUNNER_TEMP/sha256-notes.md" --prerelease
          echo "Release candidate published: $RC"
