# Releases as "rc + stable" (#489, README "Release"):
# - a push to main (or a run by hand) builds the packaged app for Windows, macOS and Linux (one job
#   per OS and architecture), smoke-tests each package in simulation and publishes them together as
#   a PRERELEASE v<package.json version>-rc.N (N: the rcs of that version so far + 1), never latest;
# - pushing a vX.Y.Z tag promotes the rc of the same commit without a rebuild: its release is
#   renamed to the tag, marked latest and keeps its assets. A commit without an rc is refused.
# macOS builds are not signed nor notarized (README "Install").
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  statuses: read        # scripts/ci-plan.js: the ci/tested status CI left on the PR head
  pull-requests: read   # scripts/ci-plan.js: the PR merged as this commit

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Assets: MultiagentOrchestrator-<platform>-<arch>.<ext> (scripts/release-assets.js)
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}   # a tag promotes a built rc (job promote)
    strategy:
      fail-fast: true   # a failing OS stops the release: no release without all its downloads
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            assets: MultiagentOrchestrator-win32-x64.zip
          - os: macos-latest      # Apple Silicon
            platform: darwin
            arch: arm64
            assets: MultiagentOrchestrator-darwin-arm64.zip
          - os: macos-15-intel    # Intel: its smoke test runs natively
            platform: darwin
            arch: x64
            assets: MultiagentOrchestrator-darwin-x64.zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            assets: |
              MultiagentOrchestrator-linux-x64.AppImage
              MultiagentOrchestrator-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # a hung job must not eat the quota
    defaults:
      run:
        shell: bash   # Git Bash on Windows: the same scripts on every OS
    steps:
      - uses: actions/checkout@v7
      # The PR's CI already tested this code when the merge kept the tree CI tested (main unchanged since):
      # do not repeat `npm test`.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js tested "${{ github.sha }}" --merged
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Linux build tools (node-pty, AppImage, display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      # scripts/package.js builds the native sidecars (native/, #341) for this leg's target into resources/bin/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - run: npm test
        if: steps.plan.outputs.tested != 'true'
        env:
          MULTIAGENT_SIMULATION_ONLY: "1"   # automated checks never call real models
      # node-pty has no Linux prebuild: npm ci compiled it for Node; build it again for Electron's ABI
      - name: node-pty for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          export npm_config_runtime=electron
          export npm_config_target="$(node -p "require('electron/package.json').version")"
          export npm_config_disturl=https://electronjs.org/headers
          export npm_config_build_from_source=true
          npm rebuild node-pty
      - name: Package app (${{ matrix.platform }} ${{ matrix.arch }})
        run: npm run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Release assets
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE on the runner
        run: node scripts/release-assets.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      # The packaged app opens its window in simulation on a scratch workspace and quits by itself
      # (scripts/smoke-package.js); Linux runs the AppImage (its AppRun) on a virtual display
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        env:
          MULTIAGENT_SIMULATION_ONLY: "1"
        run: node scripts/smoke-package.js
      - name: Smoke test of the packaged app (AppImage, xvfb-run)
        if: runner.os == 'Linux'
        env:
          MULTIAGENT_SIMULATION_ONLY: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a node scripts/smoke-package.js MultiagentOrchestrator-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          VERSION=$(node -p "require('./package.json').version")
          # N: the candidates (one rc tag per push) since the last stable tag plus this one, the app's
          # rule (src/releases.js recordCandidate), whatever the number of commits the push carries
          STABLE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc.*' HEAD 2>/dev/null || true)
          if [ -n "$STABLE" ]; then PRIOR=$(git tag --list 'v*-rc.*' --merged HEAD --no-merged "$STABLE" | wc -l); else PRIOR=$(git tag --list 'v*-rc.*' --merged HEAD | wc -l); fi
          N=$((PRIOR + 1))
          # tag the rc here, so the next push counts it
          git tag "v${VERSION}-rc.${N}" HEAD
          RC="v${VERSION}-rc.${N}"
          git push origin "refs/tags/${RC}"
          gh release create "$RC" assets/* \
            --verify-tag --title "$RC" --generate-notes --prerelease
          echo "Release candidate published: $RC"

  # A vX.Y.Z tag on a commit with an rc: that release becomes the stable one, assets reused (no build)
  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Promote the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          RC=$(git ls-remote --tags origin 'refs/tags/v*-rc.*' | grep "^${SHA}" | grep -v '\^{}' \
            | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          if [ -z "$RC" ]; then
            echo "No release candidate (rc) on ${SHA}: merge into main first, then tag the rc's commit" >&2
            exit 1
          fi
          # no rebuild: the packaged app keeps package.json's version; say so when the tag differs
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "$TAG" ]; then
            echo "::warning::${TAG} promotes a build of package.json ${PKG}: the app reports ${PKG}. Bump package.json before the merge to match."
          fi
          gh release edit "$RC" --tag "$TAG" --title "$TAG" --prerelease=false --latest
          echo "Promoted $RC to $TAG"
