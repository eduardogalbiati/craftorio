name: CI

# Actions minutes are a monthly quota (private repo: Windows counts x2, macOS x10), so CI runs only
# what a change needs (scripts/ci-plan.js): PRs on ubuntu + windows, macOS when a platform-sensitive
# path changes or the PR has the `ci:macos` label (applies from the next push, or re-run it), weekly
# on main, and on manual runs. Docs-only PRs run no tests.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays: the macOS pass on main
  workflow_dispatch:

# A new push to a PR cancels the run of the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write   # `plan` and `test` record ci/tested on the PR head (scripts/ci-plan.js)

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-plan.js
          sparse-checkout-cone-mode: false
      # A new run (a push or a re-run of the same commit) first clears an older success, so preview
      # and deploy never skip tests on a commit whose latest CI run has not passed.
      - name: Mark the PR head as being tested
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js report "${{ github.event.pull_request.head.sha }}" "${{ github.sha }}" pending
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js os

  # `npm test` must pass on every OS the app or its tests run on: paths (8.3 names, symlinks),
  # git and shells differ. The preview build runs on Windows; this catches it before the merge.
  platform:
    name: test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25   # a hung job must not eat the quota
    defaults:
      run:
        shell: bash   # Git Bash on Windows: the same scripts on every OS
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # the tests do not open the UI
      MULTIAGENT_SIMULATION_ONLY: "1"      # automated checks never call real models
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # node-pty's install script is approved in package.json (allowScripts): prebuilt binaries on
      # Windows and macOS, a node-gyp build on Linux
      - run: npm ci
      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      # README tables and index.html's generated script/style lists match their sources (#152)
      - name: Generated files up to date
        run: node scripts/docs.js --check
      - name: Tests (unit + mock flow)
        run: npm test
      # scripts/screenshot.js (the test step's UI screenshots): every view opens in simulation and the
      # app quits by itself. Needs the Electron binary and a display: Windows only.
      - name: UI screenshots (every view, simulation)
        if: runner.os == 'Windows'
        env:
          MULTIAGENT_UI_TESTS: "1"
        run: node node_modules/electron/install.js && node --test test/screenshot.test.js
      # The Playwright + playwright-bdd E2E suite's critical journeys (#222): the real app with
      # _electron on a simulated demo workspace, real assertions; a failure keeps its trace and screenshot.
      - name: E2E smoke (Playwright, @smoke)
        if: runner.os == 'Windows'
        run: npm run test:e2e -- --grep "@smoke"
      - name: E2E results and failure traces
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .test-output/e2e/
          if-no-files-found: ignore
      - name: Production vulnerabilities
        if: runner.os == 'Linux'   # same lockfile everywhere: once is enough
        run: npm audit --omit=dev --audit-level=high

  # Stable check name for branch protection and the PR babysitter: green only when every planned OS
  # is (a docs-only PR plans none and is green without tests, so it can still merge).
  test:
    needs: [plan, platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: scripts/ci-plan.js
          sparse-checkout-cone-mode: false
      - name: All planned platforms passed
        id: verdict
        run: |
          echo "plan: ${{ needs.plan.result }} ${{ needs.plan.outputs.os }}, platform matrix: ${{ needs.platform.result }}"
          test "${{ needs.plan.result }}" = "success"
          if [ '${{ needs.plan.outputs.os }}' = '[]' ]; then echo "docs only: no tests needed"; exit 0; fi
          test "${{ needs.platform.result }}" = "success"
      # Checks of a pull_request run belong to GitHub's synthetic merge commit: preview.yml and
      # deploy.yml look for this status on the PR head instead, to skip the tests CI already ran.
      # Written whatever the verdict (the `plan` job marked it pending), so a failing re-run of the
      # same commit replaces an older success.
      - name: Record the result on the PR head
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.js report "${{ github.event.pull_request.head.sha }}" "${{ github.sha }}" "${{ steps.verdict.outcome == 'success' && 'success' || 'failure' }}"
