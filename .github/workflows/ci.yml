name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # os testes não abrem a UI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checagem de sintaxe
        run: for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      - name: Testes (unitários + fluxo mock)
        run: npm test
      - name: Vulnerabilidades em produção
        run: npm audit --omit=dev --audit-level=high
