# Test fixture: a failure gate. Approving ends the run as a success; rejecting ends it as failed
# (`goto: end` + `status: failed`), which must keep the run's worktree.
apiVersion: multiagent/v1
kind: Workflow
metadata:
  name: fixture-gate-end
inputs:
  repo_path: { type: string, required: true }
orchestrator:
  worktree:
    repo: "{{ inputs.repo_path }}"
    base: main
defaults:
  working_dir: "{{ worktree_dir }}"
agents:
  a: { provider: claude, model: m, session: ephemeral }
steps:
  - id: work
    agent: a
    prompt: "work in {{ worktree_dir }}"
  - id: work_failed
    type: human_approval
    message: "The work failed. Approve: accept it anyway. Reject: stop the run as failed."
    transitions:
      - when: "approved"
        goto: end
      - when: "rejected"
        goto: end
        status: failed
