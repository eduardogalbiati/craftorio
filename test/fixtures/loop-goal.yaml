# Test fixture: /goal + /loop with delegation and a human gate with choices.
# The mock returns ci_status in the sequence pending → failed → pending → success.
apiVersion: multiagent/v1
kind: Workflow
metadata:
  name: fixture-loop-goal
inputs:
  repo_path:
    type: string
    required: true
agents:
  pusher: { provider: claude, model: mock-model, session: persistent }
  dev:    { provider: claude, model: mock-model, session: persistent }
steps:
  - id: ci
    agent: pusher
    goal:
      description: "CI green on run {{ run_id }}"
      until: "output.ci_status == 'success'"
      on_exhausted: fail
    loop:
      interval: 1s
      max_duration: 5m
    prompt: "{% if delegate_result %}DELEGATE:{{ delegate_result.agent }}{% endif %} iteration={{ iteration }}"
    output_schema:
      type: object
      required: [ci_status]
      properties:
        ci_status: { type: string, enum: [pending, failed, success] }
    transitions:
      - when: "output.ci_status == 'success'"
        goto: decide
      - when: "output.ci_status == 'pending'"
        goto: ci
      - when: "output.ci_status == 'failed'"
        delegate: { agent: dev, prompt: "fix it" }
        goto: ci
  - id: decide
    type: human_approval
    message: "Choose"
    choices:
      - { id: proceed, label: "Proceed" }
      - { id: stop,    label: "Stop" }
    transitions:
      - when: "choice == 'proceed'"
        goto: end
      - when: "choice == 'stop'"
        goto: fail
